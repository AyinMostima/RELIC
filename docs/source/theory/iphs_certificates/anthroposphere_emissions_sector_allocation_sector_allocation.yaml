composition_management_map:
  functor_metadata: FunctorMetadata declares the exact canonical inventory, proxy, output, and diagnostic variables
  lifecycle: ScaleCouplingFunctor forward emits sector_emission_flux as a DERIVED UpdateItem, a derived quantity of the step that partition_outputs routes out of the commit; StateManager records it as a state diagnostic and never stores it as state, and it stays visible to later Functors of the same group call (SpeciesMapper); its SCM contract kind is diagnostic with no committed writer
  state_contract: sector_emission_flux uses REPLACE, DERIVED, per_second, per_timestep false, explicit units, and source_functor
dependency_interconnection_map:
  dependencies: get_dependencies returns an empty list because inputs arrive through governed state variables
  direct_functor_calls: not_applicable_no_direct_functor_calls
  state_flow: canonical inventory and proxy variables enter forward and sector_emission_flux leaves through its sole UpdateItem owner as a derived same-step quantity, not committed state
overflow_routing_map:
  missing_emissions: missing canonical species inputs raise KeyError
  missing_proxies: missing or shape-incompatible proxies raise an error
  negative_emissions: negative emission inputs raise ValueError
  nonfinite_emissions: NaN or infinite inputs raise ValueError
  invalid_proxy_support: a species-cell denominator with no sector support raises ValueError before any UpdateItem is created
  mass_closure_residual: the complete pointwise residual is emitted as diagnostics.sector_allocation.mass_residual
  discarded_residuals: the pointwise mass residual is emitted in full and is not discarded
conservation_map:
  conserved_quantity: emission mass by species and grid cell
  balance_expression: sum_s E_sector(s,k,x) = E_input(k,x)
  local_check: forward and check_conservation_laws compute current-payload residuals without cached ledgers
  output_balance: sector_emission_flux carries the complete non-negative sector/species mass flux
entropy_audit:
  status: descriptive_level_1_without_entropy_formulation
  reason: forward performs an algebraic allocation and evaluates no energy functional, entropy effort, mobility, or entropy production
equivalence_type: exact
