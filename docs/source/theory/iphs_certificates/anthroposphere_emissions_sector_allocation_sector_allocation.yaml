  anthropogenic_nh3_flux: NH3 inventory mass flux [kg m-2 s-1]
  anthropogenic_pm25_flux: PM25 inventory mass flux [kg m-2 s-1]
  population_density: population proxy field
  gdp_density: GDP proxy field
  road_density: road proxy field
  land_use_fractions: land-use class fraction field
  sector_emission_flux: fixed [sector, species, source_shape] mass-flux tensor [kg m-2 s-1]
