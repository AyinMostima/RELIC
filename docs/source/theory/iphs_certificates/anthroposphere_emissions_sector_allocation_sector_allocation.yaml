certificate_version: '1.0'
process_id: relic.scientific.anthroposphere.emissions.sector_allocation.SectorAllocation
module_name: sector_allocation
canonical_role: scale_coupling
iphs_level: 1
iphs_level_evidence:
  classification: IPHS-compatible descriptive algebraic scale-coupling certificate
  compatible_basis: Runtime exposes unit-bound flux inputs, one governed output, and executable pointwise species-mass conservation without claiming DEC or IPHS operators.
  level_2_limit: Runtime is an algebraic allocation with a mass audit, not a canonical IPHS wrapper, typed DEC chain map, or IPHS state-advance operator.
theory_document: docs\source\theory\anthroposphere_sector_allocation.md
theory_document_status: updated
legacy_formula: Historical runtime applied multiple dynamic sector, temporal, policy, temperature, and spatial formulas.
literature_formula: Emissions preprocessing splits already computed inventory mass fluxes using declared sector priors and spatial surrogates while preserving species totals.
iphs_formula: Level 1 compatibility records the executed allocation E_s,k,x = W_s,k,x E_k,x with W_s,k,x >= 0 and sum_s W_s,k,x = 1; no IPHS operator is claimed.
legacy_expression: Historical dynamic outputs and secondary process-law scaling are retained only as migration evidence, not executable runtime.
iphs_expression: The single runtime allocation satisfies sum_s E_s,k,x = E_k,x pointwise for each species and cell; no DEC morphism is asserted.
