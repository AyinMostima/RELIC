runtime_replacement_map:
  runtime_uses_iphs: false
  legacy_removed: false
  replacement_entrypoint: forward
  preserved_numerics: Declared sector and species priors are retained in one pointwise normalized allocation rule; historical Q10, policy, dt, default-source, shape-expansion, and dynamic-output paths are removed.
  no_legacy_mode: No alternate runtime mode, default emission source, dynamic output formula, or duplicate allocation path is exposed.
state_advancement_map:
  potential_basis: not_applicable_algebraic_flux_partition_without_hamiltonian_potential
  effort_variable: not_applicable_no_energy_or_entropy_effort
  state_advancer: E_sector = W_sector_species_proxy E_input
  runtime_usage: forward replaces the current sector-resolved rate map and emits the exact pointwise residual.
