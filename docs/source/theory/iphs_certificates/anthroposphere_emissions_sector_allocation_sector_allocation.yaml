input_output_map:
  inventory_to_sector: six canonical species fluxes are split pointwise over the fixed sector axis
  mass_closure: summing sector_emission_flux over sector exactly reconstructs each input species field
  proxy_role: proxies alter only sector shares and cannot alter total input mass
  temporal_ownership: SectorAllocation applies no Q10, policy, emission factor, or dt scaling
