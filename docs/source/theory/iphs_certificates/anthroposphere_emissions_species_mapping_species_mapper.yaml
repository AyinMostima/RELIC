operator_map:
  S_gas: forward applies sector-specific VOC and NOx split operators to fixed gas axes
  S_aer: forward applies sector-specific PM composition to the fixed aerosol axis
  star_MW_inv: build_hodge_contract positive molecular-weight inverse Hodge
  O_h: numeric conservation and inventory-basis diagnostics returned by forward
unit_map:
  sector_emission_flux: kg m-2 s-1
  mechanism_gas_molar_flux: mol m-2 s-1
  mechanism_aerosol_mass_flux: kg m-2 s-1
  diagnostics.species_mapping.total_input_mass_flux: kg m-2 s-1
  diagnostics.species_mapping.total_output_mass_flux: kg m-2 s-1
  diagnostics.species_mapping.inventory_equivalent_output_mass_flux: kg m-2 s-1
  diagnostics.species_mapping.inventory_basis_adjustment_flux: kg m-2 s-1
  diagnostics.species_mapping.relative_error: '1'
  diagnostics.species_mapping.canonical_iphs_runtime: '1'
input_output_map:
  inventory_to_mechanism: sector_emission_flux is projected by fixed CB05 gas and aerosol maps
  mass_to_molar: only the gas mass branch is converted by star_MW_inv
  diagnostics: numeric tensors expose true mass, NO2-equivalent mass, basis adjustment, and relative residual
interface_map:
  forward_signature: forward(self, state, time, dt)
  bridge_class: ScaleCouplingFunctor
  abstraction_contract: ScaleCoupling
  state_write_mode: physical ports are UpdateItem(REPLACE, per_timestep=False) values returned through the existing FunctorBase/StateManager path
  legacy_inputs:
  - sector_emission_flux
  iphs_inputs:
  - sector_emission_flux
  legacy_outputs:
  - mechanism_gas_molar_flux
  - mechanism_aerosol_mass_flux
  - diagnostics.species_mapping.total_input_mass_flux
  - diagnostics.species_mapping.total_output_mass_flux
  - diagnostics.species_mapping.inventory_equivalent_output_mass_flux
  - diagnostics.species_mapping.inventory_basis_adjustment_flux
  - diagnostics.species_mapping.relative_error
  - diagnostics.species_mapping.canonical_iphs_runtime
  iphs_outputs:
  - mechanism_gas_molar_flux
  - mechanism_aerosol_mass_flux
  - diagnostics.species_mapping.total_input_mass_flux
  - diagnostics.species_mapping.total_output_mass_flux
  - diagnostics.species_mapping.inventory_equivalent_output_mass_flux
  - diagnostics.species_mapping.inventory_basis_adjustment_flux
  - diagnostics.species_mapping.relative_error
  - diagnostics.species_mapping.canonical_iphs_runtime
runtime_replacement_map:
  runtime_uses_iphs: false
  legacy_removed: false
  replacement_entrypoint: forward
  preserved_numerics: ParameterManager-backed six-species VOC profiles, NOx nitrogen closure, and PM residual routing are evaluated by the only production chain-map path.
  no_legacy_mode: No alternate legacy or simplified runtime mode is exposed.
state_advancement_map:
  potential_basis: sector-resolved inventory mass-flux cochain u_sector
  effort_variable: fixed CB05 maps S_gas and S_aer plus molecular Hodge star_MW_inv
  state_advancer: F_gas,mol = star_MW_inv S_gas u_sector; F_aer,mass = S_aer u_sector
  runtime_usage: forward evaluates these fixed typed outputs and returns REPLACE UpdateItems.
