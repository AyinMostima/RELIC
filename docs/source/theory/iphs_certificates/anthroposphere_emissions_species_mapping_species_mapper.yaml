composition_management_map:
  functor_metadata: existing FunctorMetadata declares emissions and chemical_mechanism coupling interfaces
  structural_protocol: declared_forms, build_hodge_contract, build_hodge_terms, reversible_structure, dissipative_structure, ports
  ports:
  - species_mapping_gas_molar_flux
  - species_mapping_aerosol_mass_flux
dependency_interconnection_map:
  dependencies: sector_emission_flux is declared in FunctorMetadata; SectorAllocation produces it as a DERIVED output that is never committed, so SpeciesMapper reads it only when SectorAllocation runs earlier in the same group call (or as caller-supplied input state); get_dependencies declares sector_allocation as an optional dependency, which orders the allocator first whenever it is registered, whatever the registration order
  direct_functor_calls: none; SpeciesMapper consumes only the scheduler-provided tensor
  chain_maps:
  - sector-resolved inventory mass enters fixed S_gas and S_aer maps
  - gas molar flux leaves through species_mapping_gas_molar_flux
  - aerosol mass flux leaves through species_mapping_aerosol_mass_flux
overflow_routing_map:
  missing_species: missing or malformed sector_emission_flux fails fast
  negative_flux: negative or non-finite sector mass flux raises ValueError
  invalid_species: unknown molecular-weight lookup raises KeyError
  discarded_residuals: none; PM remainder is OTHER and NOx oxygen-basis mass is inventory_basis_adjustment_flux
conservation_map:
  conserved_quantity: species mass for direct species and VOC/PM splits; nitrogen element for NOx NO2-equivalent partition
  balance_expression: sum_i S_profile,ij = 1 for VOC and PM; NO and NO2 moles sum to the NO2-equivalent NOx mole flux
  local_check: check_conservation_laws independently reconstructs inventory-equivalent mass from the gas-molar and aerosol-mass UpdateItems per grid cell; forward also checks the numeric relative-error diagnostic against the ParameterManager tolerance
  port_balance: gas molar and aerosol mass leave on separate unit-consistent matter ports
entropy_audit:
  dissipative_operator: none; molecular-weight conversion is algebraic and is not claimed as dissipation
  sigma_expression: not applicable to this non-strict algebraic scale coupling
  validation_hook: build_hodge_contract validates the positive unit map without an entropy-production claim
equivalence_type: exact
