state_map:
  sector_emission_flux: fixed [power, transport, industry, buildings, agriculture] by [NOx, CO, SO2, VOC, NH3, PM25] mass-flux tensor [kg m-2 s-1]
  mechanism_gas_molar_flux: fixed [NO, NO2, CO, SO2, NH3, PAR, OLE, TOL, XYL, FORM, ALD2] gas flux tensor [mol m-2 s-1]
  mechanism_aerosol_mass_flux: fixed [BC, OC, NO3, SO4, NH4, OTHER] aerosol flux tensor [kg m-2 s-1]
  diagnostics.species_mapping.total_input_mass_flux: total sector/species input mass flux [kg m-2 s-1]
  diagnostics.species_mapping.total_output_mass_flux: reconstructed true gas plus aerosol output mass flux [kg m-2 s-1]
  diagnostics.species_mapping.inventory_equivalent_output_mass_flux: output converted to the inventory NO2-equivalent basis [kg m-2 s-1]
  diagnostics.species_mapping.inventory_basis_adjustment_flux: true output minus inventory-equivalent output [kg m-2 s-1]
  diagnostics.species_mapping.relative_error: inventory-equivalent conservation residual [1]
  diagnostics.species_mapping.canonical_iphs_runtime: marker for the single typed chain-map runtime [1]
