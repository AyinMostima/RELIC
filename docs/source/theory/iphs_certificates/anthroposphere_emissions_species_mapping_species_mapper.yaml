certificate_version: '1.0'
process_id: relic.scientific.anthroposphere.emissions.species_mapping.SpeciesMapper
module_name: species_mapping
canonical_role: scale_coupling
iphs_level: 3
iphs_level_evidence:
  classification: IPHS-structured scale coupling process certificate
  compatible_basis: Process declares composition-safe IPHS or DEC structure
  runtime_replacement: Production forward path uses the existing canonical wrapper or declaration contract; strict runtime replacement is not claimed at this certificate level.
  canonical_operator: Typed chain-map or morphism composition operator
  structural_contribution: Typed morphism or chain-map contribution is declared
  assembly_participation: Certificate participates in Phase 8 inventory and GraphIR structural audit
  level_3_limit: Typed form, Hodge, port, or related structure is declared, but no runtime-linked IPHSStructureSpec contribution and executable level 4 or 5 certificate binding is present.
theory_document: docs\source\theory\anthroposphere_emissions_mapping.md
theory_document_status: updated
legacy_formula: Earlier runtime paths returned dynamic nested dictionaries and silently selected one sector profile.
literature_formula: CMAQ/SMOKE-style emissions preprocessing applies sector-specific speciation before chemistry transport and keeps gas molar flux separate from aerosol mass flux.
iphs_formula: F_gas,mol = star_MW_inv S_gas F_sector; F_aer,mass = S_aer F_sector.
legacy_expression: Dynamic dictionary mapping with an implicit industry profile and mixed mass/molar payloads.
iphs_expression: Fixed typed chain maps consume sector_emission_flux and emit separate gas-molar and aerosol-mass matter ports.
input_variables:
- sector_emission_flux
output_variables:
- mechanism_gas_molar_flux
- mechanism_aerosol_mass_flux
- diagnostics.species_mapping.total_input_mass_flux
- diagnostics.species_mapping.total_output_mass_flux
- diagnostics.species_mapping.inventory_equivalent_output_mass_flux
- diagnostics.species_mapping.inventory_basis_adjustment_flux
- diagnostics.species_mapping.relative_error
- diagnostics.species_mapping.canonical_iphs_runtime
