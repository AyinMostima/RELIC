composition_management_map:
  functor_metadata: FunctorMetadata declares the exact 15-input and 20-output non-prognostic interface.
  structural_protocol: declared_forms, build_hodge_contract, build_hodge_terms, reversible_structure, dissipative_structure, and ports use existing DEC/IPHS owners.
  simulator_owner: RELICSimulator exclusively registers and executes subordinate management Functors; the coordinator has no module registry.
  physical_constant_ssot: seconds_per_day and seconds_per_hour come from the existing physical constants owner.
  ports:
  - management_coordination_control_port
dependency_interconnection_map:
  required: none_no_required_synchronous_functor_dependencies
  optional: none_no_optional_synchronous_functor_dependencies
  lagged:
  - irrigation_management
  - harvest_management
  - grazing_management
  - fire_management
  dependencies: Four lagged edges observe explicit previous accepted-step fluxes without creating a synchronous cycle.
  direct_functor_calls: none_no_direct_functor_calls
  chain_maps:
  - Canonical state inputs enter the priority projection.
  - Previous accepted-step management fluxes map to total observation ports.
  - Next-step controls leave through the management coordination control port.
overflow_routing_map:
  missing_inputs: Missing required state or lagged flux inputs fail fast; the coordinator never inserts hidden zero values.
  no_events: With no executed events, total observations preserve explicitly supplied previous accepted-step fluxes.
  resource_exhaustion: EventScheduler rejects or defers events under per-resource quota constraints.
  conservation_residual: diagnostics.coordinator_mass_balance_error exposes aboveground biomass removal excess.
  diagnostics_provenance: Twelve namespaced diagnostics are explicitly identified as ephemeral under current simulator routing.
  discarded_residuals: none_no_management_mass_or_resource_quota_residual_is_discarded
conservation_map:
  system_type: Open management observation/control boundary; no closed mass-reaction ownership is claimed.
  biomass_expression: R = relu(max(F_harvest,0) + max(F_grazing,0) - max(B_ag,0)/dt - tolerance) + relu(-F_harvest) + relu(-F_grazing).
  quota_expression: R_quota = max_r(relu(U_r-Q_r) + relu(-U_r)); each U_r and Q_r use the same resource-specific unit.
  open_routes: Irrigation and fertilizer controls are open inputs; harvest, grazing, and fire observations are open exports.
