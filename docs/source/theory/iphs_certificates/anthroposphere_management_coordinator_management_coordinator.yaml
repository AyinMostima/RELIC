certificate_version: '1.0'
process_id: relic.scientific.anthroposphere.management.coordinator.ManagementCoordinator
module_name: management_coordinator
canonical_role: scale_coupling
iphs_level: 3
iphs_level_evidence:
  classification: IPHS-structured non-strict scale-coupling certificate
  compatible_basis: Typed management priority, control, and resource-allocation cochain spaces are declared.
  runtime_replacement: The production forward path uses one explicit observation/control port map; strict runtime replacement is not claimed.
  canonical_operator: A positive diagonal management-priority Hodge map and one typed management port are declared.
  structural_contribution: declared_forms, build_hodge_contract, and ports contribute typed structure to existing audits.
  assembly_participation: The certificate participates in the Phase 8 inventory and GraphIR structural audit.
  level_3_limit: No independently validated Hamiltonian, effort, port-power, degeneracy, or strict GENERIC runtime evidence is present.
theory_document: docs\source\theory\anthroposphere_management_coordinator.md
theory_document_status: updated
legacy_formula: Management priorities, event scheduling, and per-resource quotas define an open observation/control coordinator.
literature_formula: Multi-objective farm management uses configurable priorities and resource constraints; retained coefficients are calibratable policy heuristics rather than universal laws.
iphs_formula: q_i = w_i(1+s_i); p_i = q_i/sum_j(q_j); H_m = diag(w_i/sum_j(w_j)); 0 <= U_r <= Q_r for each resource r.
legacy_expression: P_eff = P_base W_resource W_timing W_conflict.
iphs_expression: The non-strict priority projection and positive Hodge metric expose observations and next-step controls through the declared management port.
