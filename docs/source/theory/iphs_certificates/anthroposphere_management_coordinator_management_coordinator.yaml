state_map:
  management_priority_state: Five-component dimensionless priority observation cochain.
  management_control_projection: Three-component next-step management control projection.
  management_resource_allocation: Per-resource administrative allocation port; resources are never added before quota normalization.
  lagged_management_fluxes: irrigation_flux, harvest_flux, grazing_flux, and co2_emission are explicit previous accepted-step observations.
  public_outputs: Eight non-prognostic observations or controls are committed through StateManager.
  ephemeral_diagnostics: Twelve namespaced diagnostics are removed before current StateManager provenance tracking.
