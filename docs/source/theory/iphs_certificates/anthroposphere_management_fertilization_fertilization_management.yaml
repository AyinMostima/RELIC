composition_management_map:
  functor_metadata: FunctorMetadata declares the managed matter boundary interfaces, conservation quantities, and coupling target.
  structural_protocol: declared_forms and ports provide typed nitrogen and phosphorus boundary cochains without a duplicate runtime.
  state_contract: Existing StateManager consumes explicit REPLACE boundary flows and one ACCUMULATE phosphorus increment.
  ports:
  - fertilization_nitrogen_input_port
  - fertilization_phosphorus_input_port
dependency_interconnection_map:
  dependencies: day_of_year is supplied through the declared state or scheduler time coordinate
  direct_functor_calls: none; forward reads day_of_year and schedule state, calls only local event-scheduler helpers, and routes elemental N and P through declared StateManager ports
  chain_maps:
  - fertilizer_n_flux enters the existing nitrogen cycling management-input port
  - fertilizer_p_flux and available_phosphorus form one phosphorus boundary transaction
overflow_routing_map:
  unsupported_products: products without complete elemental composition routes fail fast
  atmospheric_losses: owned by downstream pedosphere reaction and transport Functors, not this boundary mapper
  diagnostic_residuals: exact nitrogen and phosphorus boundary residuals are returned as observations
  discarded_residuals: invalid schedules or incomplete product composition are rejected before commit, while nitrogen_boundary_residual and phosphorus_boundary_residual are returned explicitly
conservation_map:
  conserved_quantities: elemental nitrogen and elemental phosphorus across each managed boundary event
  nitrogen_balance_expression: Delta M_N_scheduled - fertilizer_n_flux * dt = residual_N
  phosphorus_balance_expression: Delta M_P_scheduled - fertilizer_p_flux * dt = residual_P
  phosphorus_state_expression: Delta available_phosphorus = fertilizer_p_flux * dt
  open_system_route: managed_application port from anthroposphere to pedosphere
entropy_audit:
  applicability: Not applicable to an externally prescribed managed matter input map.
  strict_claim: No dissipative operator, entropy production, Hamiltonian, or GENERIC degeneracy claim is made.
equivalence_type: port_equivalent
