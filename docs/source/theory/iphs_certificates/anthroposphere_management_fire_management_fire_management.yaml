  combustion_to_emissions: fuel combustion partitions into CO2, CO, fire-specific CH4, N2O, ash, and carbon-loss outputs
  wildfire_ignition: 'u ~ U(0, 1) from the FunctorSubstreamMixin substream (config seed, a non-negative integer below 2**63) ignites a wildfire occurrence when u < p = s (1 - M) (w / w_ref); the stream position is module extra state'
  diagnostics: event count, executing-step event support [s], one-sided atmospheric-carbon availability residual, and canonical runtime flag return through the existing Functor output path
