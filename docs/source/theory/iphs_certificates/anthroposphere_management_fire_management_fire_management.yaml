certificate_version: '1.0'
process_id: relic.scientific.anthroposphere.management.fire_management.FireManagement
module_name: fire_management
canonical_role: reaction
iphs_level: 3
iphs_level_evidence:
  classification: IPHS-structured reaction process certificate
  compatible_basis: Reaction process is expressed through conserved or open stoichiometric ledgers
  runtime_replacement: Production forward path uses the existing canonical wrapper or declaration contract; strict runtime replacement is not claimed at this certificate level.
  canonical_operator: N_h r_h reaction-network state advance
  structural_contribution: Cochain, operator, port, conservation, or ledger structure is declared for Gate 0 assembly audit
  assembly_participation: Certificate participates in Phase 8 inventory and GraphIR structural audit
  level_3_limit: Typed form, Hodge, port, or related structure is declared, but no runtime-linked IPHSStructureSpec contribution and executable level 4 or 5 certificate binding is present.
theory_document: docs\source\theory\anthroposphere_management_fire.md
theory_document_status: updated
legacy_formula: Fire effects were computed from biomass fuel, combustion completeness, combustion efficiency, moisture controls, and emission factors.
literature_formula: Biomass burning emissions are represented by fuel burned times species emission factors with moisture, combustion completeness, and suppression controls.
iphs_formula: x_dot = N_h r_h(x_h, theta) + G_h u_fire, with r_h := r_fire; H_fire = diag(w_i / sum_j w_j), w_i >= 0.
legacy_expression: C_combusted = B_fuel * CC * CE * (1 - M_factor); E_species = C_combusted / f_C * EF_species.
iphs_expression: The biomass burning equation defines entries of the standard reaction vector r_h inside the single fire IPHS combustion-port map.
