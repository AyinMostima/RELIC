state_map:
  fire_fuel_pool: available combustible biomass or fuel-load cochain [kg m^-2]
  fire_combustion_flux: combustion and atmospheric emission reaction flux [kg m^-2 s^-1]
  fire_ch4_emission: fire-specific atmospheric methane mass flux [kg CH4 m^-2 s^-1]
  fire_management_port: ignition, prescribed burning, wildfire, and suppression control port [1]
  diagnostics.fire_management.canonical_iphs_runtime: canonical IPHS runtime flag [1]
parameter_map:
  anthroposphere.management.temperature: Reference air temperature of the moisture-factor temperature effect and air temperature of the default fire schedule events [K]; not a default of the temperature input
  anthroposphere.management.clamp_min: Lower bound of the management response factors [dimensionless]
  anthroposphere.management.clamp_max: Upper bound of the management response factors [dimensionless]
  anthroposphere.management.fire.base_efficiency: Baseline efficiency scalar of fire management [dimensionless]
  anthroposphere.management.fire.combustion_completeness: Fraction of the fuel consumed by a fire [dimensionless]
  anthroposphere.management.fire.combustion_efficiency: Combustion efficiency of the fire [dimensionless]
  anthroposphere.management.fire.emission_factor_co2: CO2 emission factor per burned dry matter [g kg-1 DM]
  anthroposphere.management.fire.emission_factor_co: CO emission factor per burned dry matter [g kg-1 DM]
  anthroposphere.management.fire.emission_factor_ch4: CH4 emission factor per burned dry matter [g kg-1 DM]
  anthroposphere.management.fire.ash_fraction: Fraction of combusted biomass deposited as ash [dimensionless]
  anthroposphere.management.fire.biomass_carbon_fraction: Carbon fraction of dry biomass [dimensionless]
  anthroposphere.management.fire.fire_frequency: Mean annual fire frequency of the scheduler [year-1]
  anthroposphere.management.fire.fire_probability_scale: Scale factor for wildfire ignition probability [dimensionless]
  anthroposphere.management.fire.moisture_reduction_coefficient: Moisture reduction coefficient for fire spread calculations [dimensionless]
  anthroposphere.management.fire.moisture_temp_base_weight: Base weight for moisture temperature coupling [dimensionless]
  anthroposphere.management.fire.moisture_temp_scale_weight: Temperature scaling weight for moisture coupling [dimensionless]
  anthroposphere.management.fire.temperature_scale_range: Temperature normalization range for moisture scaling [K]
  anthroposphere.management.fire.wind_speed_threshold: Wind speed threshold affecting fire spread [m s-1]
  anthroposphere.management.fire.schedule_window_days: Window size in days for matching scheduled fire events [day]
  anthroposphere.management.fire.default_schedule.*: Default prescribed-fire and wildfire events (date, burned fraction, fuel moisture, wind speed, suppression effectiveness) [units per key]
  anthroposphere.management.fire.intensity_factor.*: Fire intensity multiplier per intensity class (low, moderate, high, extreme) [dimensionless]
  anthroposphere.management.fire.vegetation_properties.*: Fuel load factor, combustion completeness, aboveground and litter fractions and CO2, CO, CH4, N2O emission factors per vegetation type [units per key]
operator_map:
  N_h: stoichiometric map from fuel combustion to atmospheric species and ash outputs
  r_h: ParameterManager-backed combustion, emission-factor, ash, and carbon-loss rate tensor passed to advance_reaction_network
  H_fire: PSD combustion mobility built by build_hodge_contract
  G_h: fire_combustion_management_port ignition and suppression input map
  O_h: canonical runtime diagnostic output
state_advancement_map:
  potential_basis: G_fire(x_h)=0.5*x_h.T*H_fire*x_h for combustible fuel storage and open emission ports
  effort_variable: mu_fire=dG_fire/dx_h; combustion completeness, fuel moisture, and emission factors define r_h entries
  state_advancer: forward evaluates explicit x_dot=N_h r_h through advance_reaction_network in fire combustion output assembly
  runtime_usage: _assemble_fire_reaction_outputs calls advance_reaction_network with declared N_h and r_h for combustion, emissions, ash, and carbon loss
  explicit_stoichiometric_usage: _assemble_fire_reaction_outputs materializes stoichiometric_N and rates, then lowers x_dot=N_h r_h through advance_reaction_network.
  event_support: each calendar occurrence executes once; r_h rates are the event-integrated masses divided by the executing step dt (Delta_t_event = dt, reported as diagnostics.fire.event_support_seconds), so rate * dt returns the event mass for hourly, daily and multi-day steps
