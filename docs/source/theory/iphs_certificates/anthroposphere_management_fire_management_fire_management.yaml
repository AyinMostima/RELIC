composition_management_map:
  functor_metadata: existing FunctorMetadata declares biological process category and biosphere/atmosphere/pedosphere coupling
  structural_protocol: declared_forms, build_hodge_contract, build_hodge_terms, reversible_structure, dissipative_structure, ports
  physical_constant_ssot: seconds per day is resolved only through get_physical_constant
  ports:
  - fire_combustion_management_port
dependency_interconnection_map:
  dependencies: fuel, biomass, litter, moisture, temperature, schedule, and suppression controls are declared through metadata and state keys
  direct_functor_calls: none; forward reads declared fuel, biomass, litter, moisture, temperature, schedule, and suppression state and calls only local fire helpers
  chain_maps:
  - fuel pools enter N_h r_h
  - fire management controls enter G_h u_fire
  - atmospheric emission outputs leave through declared open matter fluxes
overflow_routing_map:
  atmospheric_losses: CO2, CO, fire_ch4_emission, and N2O are declared open atmospheric fluxes
  ash_partition: ash deposition is returned as a declared pedosphere output
  fuel_load_input: fuel_load is a canonical input-port adapter to the same fire combustion map
  discarded_residuals: burn-fraction bounds apply to dimensionless controls and leave unburned fuel unconsumed; combustion products are routed to gas, ash, combustion, and carbon_loss ports, and diagnostics.fire.carbon_availability_residual is explicit
conservation_map:
  ledger_type: open
  open_system_route: port
  closed_system_conservation_check: not_performed
  conserved_quantity: The identity stoichiometric map has no non-trivial closed C_h N_h = 0 certificate; fuel carbon leaves through the declared combustion port.
  balance_expression: epsilon_C = max(0, C_atmospheric - C_fuel_burned)
  local_check: diagnostics.fire.carbon_availability_residual reports only the one-sided atmospheric-carbon availability bound.
  port_balance: fire_combustion_management_port declares open combustion matter transfer
entropy_audit:
  dissipative_operator: H_fire is diagonal positive semidefinite for non-negative ParameterManager weights
  sigma_expression: sigma = z.T H_fire z >= 0
  validation_hook: build_hodge_contract(strict=True)
equivalence_type: exact
physical_constant_ssot:
  seconds_per_day: get_physical_constant("relic.physical.constants.time.seconds_per_day")
