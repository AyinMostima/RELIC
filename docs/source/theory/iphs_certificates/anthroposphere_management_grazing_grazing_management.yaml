composition_management_map:
  functor_metadata: existing FunctorMetadata declares biological process category and biosphere/pedosphere coupling
  structural_protocol: declared_forms, build_hodge_contract, build_hodge_terms, reversible_structure, dissipative_structure, ports
  physical_constant_ssot: seconds per day is resolved only through get_physical_constant
  ports:
  - grazing_biomass_return_port
dependency_interconnection_map:
  dependencies: biomass, forage quality, soil moisture, schedule, and stocking controls are declared through metadata and state keys
  direct_functor_calls: none; forward reads declared biomass, forage, soil, schedule, and stocking state and calls only local grazing helpers
  chain_maps:
  - aboveground biomass enters N_h r_h
  - stocking controls enter G_h u_grazing
  - dung C and fecal organic N leave through grazing_dung_boundary to litterfall_interface_mapper
  - urine N leaves separately through grazing_urine_boundary to the nitrogen cycling route
overflow_routing_map:
  retained_intake: retained animal product is represented by livestock carbon and nitrogen export ports
  biomass_limit: intake is constrained by max_utilization and by available biomass over the requested dt
  conservation_residual: check_conservation_laws computes normalized dry-matter, carbon, and nitrogen boundary residuals
  discarded_residuals: intake limiters define actual grazing_flux and leave unconsumed biomass in the source pool; actual dry matter, carbon, and nitrogen are exhausted through animal-retention or export, dung, and urine ports, and check_conservation_laws exposes all three boundary residuals
conservation_map:
  system_status: open livestock offtake and excreta return port
  metadata_laws:
  - grazing_matter_boundary
  conserved_quantity: grazed vegetation dry matter and explicitly partitioned carbon and nitrogen
  balance_expression: DeltaB + I_step = 0; C_in = C_dung + C_export; N_in = N_dung + N_urine + N_export
  local_check: check_conservation_laws validates UpdateItem semantics and returns the maximum normalized dry-matter, carbon, and nitrogen residual
  port_balance: grazing_biomass_return_port declares open livestock removal and excreta return
entropy_audit:
  dissipative_operator: H_grazing is diagonal positive semidefinite for non-negative ParameterManager weights
  sigma_expression: sigma = z.T H_grazing z >= 0
  validation_hook: build_hodge_contract(strict=True)
equivalence_type: exact
physical_constant_ssot:
  seconds_per_day: get_physical_constant("relic.physical.constants.time.seconds_per_day")
