input_output_map:
  intake_to_removal: biomass, forage quality, and the stocking rate of the active grazing event define r_h entries
  stocking_density: 'D is the stocking rate of the active grazing event (the herd whose livestock type and body weight the intake uses; DNDC grazing() keeps the animal heads on the grazing event); no state input supplies it'
  removal_to_return: removed biomass carbon and nitrogen partition into dung, urine, and managed livestock export boundaries
  state_update: integrated dry-matter intake is committed as a negative aboveground_biomass ACCUMULATE update
  diagnostics: grazing pressure and canonical runtime diagnostics are returned through the existing Functor output path
