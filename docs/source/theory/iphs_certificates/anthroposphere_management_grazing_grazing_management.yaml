certificate_version: '1.0'
process_id: relic.scientific.anthroposphere.management.grazing.GrazingManagement
module_name: grazing_management
canonical_role: reaction
iphs_level: 3
iphs_level_evidence:
  classification: IPHS-structured reaction process certificate
  compatible_basis: Reaction process is expressed through conserved or open stoichiometric ledgers
  runtime_replacement: Production forward path uses the existing canonical wrapper or declaration contract; strict runtime replacement is not claimed at this certificate level.
  canonical_operator: N_h r_h reaction-network state advance
  structural_contribution: Cochain, operator, port, conservation, or ledger structure is declared for Gate 0 assembly audit
  assembly_participation: Certificate participates in Phase 8 inventory and GraphIR structural audit
  level_3_limit: Typed form, Hodge, port, or related structure is declared, but no runtime-linked IPHSStructureSpec contribution and executable level 4 or 5 certificate binding is present.
theory_document: docs\source\theory\anthroposphere_management_grazing.md
theory_document_status: updated
legacy_formula: Grazing biomass removal, intake limitation, trampling, dung return, and urine return were computed without a StateManager biomass update or explicit livestock export ports.
literature_formula: Livestock grazing intake depends on body weight, stocking density, forage quality, and biomass availability; intake carbon and nitrogen are partitioned among excreta and managed livestock exports.
iphs_formula: x_dot = N_h r_h(x_h, theta) + G_h u_grazing, with r_h := r_grazing; H_grazing = diag(w_i / sum_j w_j), w_i >= 0.
legacy_expression: I = a W^b D Q (1 - exp(-k B)); N_return = I N_content (1 - N_retention).
iphs_expression: The intake and excreta equations define entries of the standard reaction vector r_h inside the single IPHS biomass-return port map.
