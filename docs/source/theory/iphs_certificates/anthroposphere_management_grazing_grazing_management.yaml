state_map:
  grazing_biomass_pool: StateManager-owned available grazable aboveground biomass [kg DM m^-2]
  grazing_return_flux: biomass removal, excreta return, and livestock export fluxes [kg m^-2 s^-1]
  dung_n_flux: fecal organic nitrogen return boundary consumed only by litterfall_interface_mapper
  urine_n_flux: separate urine mineral nitrogen boundary consumed only by the nitrogen cycling route
  grazing_stocking_port: stocking pressure management input [animals ha^-1]
  diagnostics.grazing_pressure: effective stocking density weighted by forage quality [animals ha^-1]
  diagnostics.grazing_management.canonical_iphs_runtime: canonical IPHS runtime flag [1]
parameter_map:
  anthroposphere.management.clamp_min: Lower bound of the management response factors [dimensionless]
  anthroposphere.management.clamp_max: Upper bound of the management response factors [dimensionless]
  anthroposphere.management.grazing.base_efficiency: Baseline efficiency scalar of grazing management [dimensionless]
  anthroposphere.management.grazing.digestibility_coefficient: Feed digestibility coefficient [dimensionless]
  anthroposphere.management.grazing.selectivity_factor: Grazing selectivity effect [dimensionless]
  anthroposphere.management.grazing.max_utilization: Maximum allowable fraction of aboveground biomass removed by grazing [dimensionless]
  anthroposphere.management.grazing.forage_carbon_fraction: Forage carbon mass fraction [dimensionless]
  anthroposphere.management.grazing.functional_response_scalar: Scalar k for intake functional response I = 1 - exp(-k * biomass_kg_ha) [ha kg-1]
  anthroposphere.management.grazing.n_retention: Nitrogen retention in animal [dimensionless]
  anthroposphere.management.grazing.dung_partition: Fraction of excreted nitrogen routed to dung [dimensionless]
  anthroposphere.management.grazing.urine_partition: Fraction of excreted nitrogen routed to urine [dimensionless]
  anthroposphere.management.grazing.trampling_factor: Vegetation damage from trampling [dimensionless]
  anthroposphere.management.grazing.trampling_moisture_threshold: Soil moisture threshold where trampling damage increases [dimensionless]
  anthroposphere.management.grazing.trampling_moisture_scale: Moisture scaling factor for trampling damage [dimensionless]
  anthroposphere.management.grazing.trampling_stocking_normalization: Stocking rate normalization for trampling response [animals ha-1]
  anthroposphere.management.grazing.livestock.*: Digestibility, intake rate, metabolism factor, N and P content and trampling impact per livestock type [units per key]
  anthroposphere.management.grazing.default_schedule.*: Default spring and winter grazing events (start date, duration, stocking rate, body weight, supplement rate) [units per key]
operator_map:
  N_h: non-strict open-port map from biomass removal to carbon, nitrogen, excreta, livestock export, and trampling channels
  r_h: ParameterManager-backed grazing intake, excreta return, livestock export, and trampling rate tensor passed to advance_reaction_network
  H_grazing: PSD removal-return mobility built by build_hodge_contract
  G_h: grazing_biomass_return_port stocking input map
  O_h: canonical runtime and biomass-balance diagnostics
state_advancement_map:
  potential_basis: G_grazing(x_h)=0.5*x_h.T*H_grazing*x_h for grazable biomass and return ports
  effort_variable: mu_grazing=dG_grazing/dx_h; stocking pressure, forage quality, and livestock traits define r_h entries
  state_advancer: forward evaluates explicit x_dot=N_h r_h through advance_reaction_network in grazing biomass-return output assembly
  runtime_usage: _assemble_grazing_reaction_outputs calls advance_reaction_network with declared N_h and r_h for intake, dung, urine, livestock export, and trampling ports
  explicit_stoichiometric_usage: _assemble_grazing_reaction_outputs materializes stoichiometric_N and rates, then lowers x_dot=N_h r_h through advance_reaction_network.
