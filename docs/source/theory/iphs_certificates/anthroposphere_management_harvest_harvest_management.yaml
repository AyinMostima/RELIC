state_map:
  harvest_biomass_pool: aboveground and belowground biomass cochains [kg DM m^-2]
  harvest_residue_flux: grain export, residue return, root turnover, and residue cover response [kg m^-2 s^-1]
  harvest_management_port: dimensionless harvest control effort
  diagnostics.harvest_management.free_energy: G_h(x) potential audit
  diagnostics.harvest_management.chemical_potential_norm: norm of mu_h effort
  diagnostics.harvest_management.canonical_iphs_runtime: canonical IPHS runtime flag [1]
parameter_map:
  anthroposphere.management.harvest.harvest_efficiency: Mechanical harvest efficiency [dimensionless]
  anthroposphere.management.harvest.default_harvest_index: Harvest index weight of the harvest partition Hodge contract [dimensionless]
  anthroposphere.management.harvest.schedule_window_days: Half-width of the calendar window around a scheduled harvest day [day]
  anthroposphere.management.harvest.minimum_event_interval_days: Minimum elapsed time after an accepted harvest before the next one [day]
  anthroposphere.management.harvest.default_schedule.*: Date [day], harvest index [dimensionless] and residue retention [dimensionless] of the default cereal harvest and forage cuts [units per key]
  anthroposphere.management.harvest.residue_retention: Fraction of residue left on field [dimensionless]
  anthroposphere.management.harvest.residue_removal_rate: Fraction of residue removed during harvest operations [dimensionless]
  anthroposphere.management.harvest.root_mortality_rate: Root mortality fraction triggered by harvest disturbance [dimensionless]
  anthroposphere.management.harvest.*_c_content: Carbon content of the harvested dry matter per crop type [kg C kg-1 DM]
  anthroposphere.management.harvest.*_cn_ratio: C:N ratio of the harvested material per crop type [kg C kg-1 N]
  validation.conservation.conservation_tolerance: General relative tolerance of the conservation checks [dimensionless]
operator_map:
  H_harvest: positive semidefinite diagnostic metric assembled by build_hodge_contract; it is not a GENERIC mobility or a dissipative pH resistance operator
  M_h: empirical non-negative partition weights M_h(u_h,theta); the symbol does not denote the GENERIC entropy-production operator
  G_h: open harvest_biomass_residue_port control and export map
  O_h: quadratic-potential, effort-norm, ledger-residual, and runtime diagnostics
state_advancement_map:
  potential_basis: Q_h(x_h)=0.5*x_h.T*H_harvest*x_h is a diagnostic quadratic quantity, not a Hamiltonian or thermodynamic potential claim
  effort_variable: q_h=dQ_h/dx_h=H_harvest*x_h is a diagnostic gradient, not a dPH or GENERIC conjugate effort claim
  state_advancer: the Level 3 typed open-port map partitions biomass into managed export and residue-return outputs; it is not asserted to equal (J-R)e_H or J e_E+M e_S
  runtime_usage: forward evaluates _canonical_iphs_harvest_partition for each scheduled event and _storage_potential for the potential audit; Level 4 or Level 5 thermodynamic closure is not claimed.
