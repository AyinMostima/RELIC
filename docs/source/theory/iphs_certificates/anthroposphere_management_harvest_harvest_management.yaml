composition_management_map:
  functor_metadata: existing FunctorMetadata declares biological process category and biosphere/pedosphere coupling
  structural_protocol: declared_forms, build_hodge_contract, build_hodge_terms, energy_terms, reversible_structure, dissipative_structure, ports
  ports:
  - harvest_biomass_residue_port
dependency_interconnection_map:
  dependencies: required and optional Functor dependency lists are empty; biomass, crop stage, grain moisture, residue cover, harvest schedule, and event controls are StateManager or external ports rather than scheduling edges
  direct_functor_calls: none; biomass, crop stage, moisture, residue, and schedule are state or boundary inputs and forward calls only local harvest helpers
  chain_maps:
  - aboveground biomass enters x_h and mu_h
  - harvest controls enter M_h(u_h,theta)
  - residue and root outputs leave through declared matter fluxes
overflow_routing_map:
  biomass_limit: control vector is clipped to [0,1] and biomass partition residual is reported by diagnostics.harvest.biomass_partition_residual
  event_overflow: scheduled events route export through harvest_biomass_residue_port
  conservation_residual: carbon and nitrogen open-ledger residuals are reported separately by diagnostics.harvest.carbon_ledger_residual and diagnostics.harvest.nitrogen_ledger_residual
  discarded_residuals: bounded controls feed the one canonical partition, material leaves through export, residue, and root ports, and biomass_partition_residual, carbon_ledger_residual, and nitrogen_ledger_residual are explicit outputs
conservation_map:
  conserved_quantity: managed dry matter with explicit carbon and nitrogen input/export/return ledgers
  balance_expression: B_above = B_removed + B_remaining + residual; C_input = C_export + C_residue + residual_C; N_input = N_export + N_residue + residual_N
  local_check: _check_conservation evaluates the biomass partition; carbon_ledger_residual and nitrogen_ledger_residual evaluate the two open matter ledgers
  port_balance: harvest_biomass_residue_port declares open managed export and residue return; no closed-system C*N=0 proof is claimed
entropy_audit:
  diagnostic_metric: H_harvest is diagonal positive semidefinite for non-negative ParameterManager weights
  strict_entropy_claim: none at Level 3; Q_h and q_h are diagnostic and do not prove dH/dt<=0 or dS/dt>=0
  validation_hook: build_hodge_contract(strict=True) validates only the typed metric contract
equivalence_type: port_equivalent
