certificate_version: '1.0'
process_id: relic.scientific.anthroposphere.management.harvest.HarvestManagement
module_name: harvest_management
canonical_role: port
iphs_level: 3
iphs_level_evidence:
  classification: IPHS-structured port process certificate
  compatible_basis: Process declares composition-safe IPHS or DEC structure
  runtime_replacement: Production forward path uses the existing canonical wrapper or declaration contract; strict runtime replacement is not claimed at this certificate level.
  canonical_operator: G_h u_h port route with explicit boundary or external exchange
  structural_contribution: Port flow, orientation, and managed boundary route are declared
  assembly_participation: Certificate participates in Phase 8 inventory and GraphIR structural audit
  level_3_limit: Typed form, Hodge, port, or related structure is declared, but no runtime-linked IPHSStructureSpec contribution and executable level 4 or 5 certificate binding is present.
theory_document: docs\source\theory\anthroposphere_management_harvest.md
theory_document_status: updated
legacy_formula: Harvest biomass removal, residue return, and root turnover were previously computed as independent harvest-index and residue-retention formulas.
literature_formula: Harvested biomass follows harvest-index partitioning, while crop residues and root turnover return carbon and nitrogen to managed soil pools.
iphs_formula: The current Level 3 implementation is a typed open-port partition map. The quadratic quantity Q_h=0.5*x_h.T*H_h*x_h is diagnostic only; no dissipative pH or GENERIC state equation is claimed.
legacy_expression: H_biomass = B_total * HI * efficiency; R_C = (B_total - H_biomass) * C_fraction * R_return.
iphs_expression: Harvest-index, residue-retention, and root-turnover closures are control coefficients inside the single IPHS harvest biomass-residue port state advancer.
