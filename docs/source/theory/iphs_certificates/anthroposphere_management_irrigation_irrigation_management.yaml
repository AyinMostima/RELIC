    source: ParameterManager YAML
  anthroposphere.management.irrigation.conservation_tolerance:
    source: ParameterManager YAML
  water_density:
    source: ParameterManager physical constants SSOT via get_physical_constant
composition_management_map:
  functor_metadata: existing FunctorMetadata declares interfaces, execution phase, and conservation semantics
  state_contract: existing simulator state update path is preserved
  validation_rule: phase8 scientific inventory and equivalence certificate checks
dependency_interconnection_map:
  dependencies: no direct Functor dependency; canonical inputs are supplied by StateManager or external composition adapters
  direct_functor_calls: none declared by certificate
overflow_routing_map:
  diagnostic_residuals: application loss is the declared difference between source abstraction and delivered irrigation; the water-balance residual is explicit
  discarded_residuals: source abstraction and delivered irrigation are both exported as abstraction_flux and irrigation_flux; their efficiency-adjusted mismatch is exported as diagnostics.irrigation.water_balance_residual, so the application-loss remainder is not discarded
conservation_map:
  conserved_quantities: mass
  balance_expression: irrigation_flux = abstraction_flux * application_efficiency; the open boundary loss is abstraction_flux - irrigation_flux
  runtime_checker: check_conservation_laws reads diagnostics.irrigation.water_balance_residual instead of applying a closed-system output sum
entropy_audit:
  operator_sign: rates, mobilities, or diagnostic maps are non-negative or checked by existing validation hooks where physically required
  sigma_expression: canonical entropy production is non-negative for dissipative subexpressions
equivalence_type: port_equivalent
