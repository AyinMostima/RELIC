certificate_version: '1.0'
process_id: relic.scientific.anthroposphere.management.irrigation.IrrigationManagement
module_name: IrrigationManagement
canonical_role: port
iphs_level: 2
iphs_level_evidence:
  classification: IPHS-wrapped port process certificate
  compatible_basis: Process declares composition-safe IPHS or DEC structure
  runtime_replacement: Production forward path uses the existing canonical wrapper or declaration contract; strict runtime replacement is not claimed at this certificate level.
  canonical_operator: G_h u_h port route with explicit boundary or external exchange
  level_2_limit: The canonical runtime wrapper is declared, but no executable typed-cochain or IPHS structural contribution is bound; strict level 4 or 5 evidence is not claimed.
theory_document: docs\source\theory\anthroposphere_management_irrigation.md
theory_document_status: updated
legacy_formula: I = (ET_c - P_eff - DeltaS) / E_irr
literature_formula: M_gross = M_net / eta; M_delivered = eta M_gross
iphs_formula: y = G_h u_h through the declared open management-water port map
legacy_expression: I = (ET_c - P_eff - DeltaS) / E_irr
iphs_expression: M_net = max((theta_fc-theta) Z_r rho_w - precipitation_flux dt, 0); M_gross = min(M_net/eta, F_max dt, M_quota); M_delivered = eta M_gross
