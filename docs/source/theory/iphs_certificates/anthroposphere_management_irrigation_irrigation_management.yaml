  - irrigation_remaining_quota
  - diagnostics.irrigation.applied_water
  - diagnostics.irrigation.effective_efficiency
  - diagnostics.irrigation.moisture_response
  - diagnostics.irrigation.water_balance_residual
runtime_replacement_map:
  runtime_uses_iphs: false
  legacy_removed: false
  replacement_entrypoint: forward
  preserved_numerics: ParameterManager-backed FAO-style root-zone deficit and application-efficiency calculations define the single production port response.
  no_legacy_mode: Forward is the only executable irrigation calculation; aliases, forcing defaults, and private second-formula helpers are absent.
state_advancement_map:
  potential_basis: declared RELIC state, port, or observation cochain basis
  effort_variable: ParameterManager-backed root-zone deficit and application-efficiency control
  state_advancer: y = G_h u_h through the declared open management-water port map
  runtime_usage: IrrigationManagement.forward evaluates one phenomenological port response; strict IPHS runtime structure is not claimed.
parameter_management_map:
  anthroposphere.management.irrigation.surface_efficiency:
    source: ParameterManager YAML
  anthroposphere.management.irrigation.sprinkler_efficiency:
    source: ParameterManager YAML
  anthroposphere.management.irrigation.drip_efficiency:
    source: ParameterManager YAML
  anthroposphere.management.irrigation.subsurface_efficiency:
    source: ParameterManager YAML
