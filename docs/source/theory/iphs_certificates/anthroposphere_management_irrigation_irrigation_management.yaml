state_map:
  soil_moisture: soil_moisture mapped to canonical Phase 8 cochain basis
  precipitation_flux: external precipitation mass-flux forcing mapped to the canonical water port
  land_use_type: external land-use composition code controlling the managed port
  irrigation_type: external irrigation-system code selecting ParameterManager efficiency
  field_capacity: external soil hydraulic property controlling root-zone deficit
  wilting_point: external soil hydraulic property controlling the irrigation trigger
  irrigation_remaining_quota: remaining source-water quota [mm], owned state; initial value from the scenario initial state
parameter_map:
  anthroposphere.management.irrigation.surface_efficiency: Surface-system application efficiency [dimensionless]
  anthroposphere.management.irrigation.sprinkler_efficiency: Sprinkler-system application efficiency [dimensionless]
  anthroposphere.management.irrigation.drip_efficiency: Drip-system application efficiency [dimensionless]
  anthroposphere.management.irrigation.subsurface_efficiency: Subsurface-system application efficiency [dimensionless]
  anthroposphere.management.irrigation.moisture_threshold: Irrigation trigger as a fraction of the plant-available water range [dimensionless]
  anthroposphere.management.irrigation.root_zone_depth: Effective root-zone depth [m]
  anthroposphere.management.irrigation.max_application_rate: Maximum water application rate [mm hr-1]
  anthroposphere.management.irrigation.conservation_tolerance: Water-port residual tolerance [kg m-2 s-1]
  water_density: physical constants SSOT via get_physical_constant
operator_map:
  G_h: declared port map
  H_h: positive port metric or conversion Hodge map
unit_map:
  irrigation_flux: kg m-2 s-1
  abstraction_flux: kg m-2 s-1
  irrigation_remaining_quota: mm
  diagnostics.irrigation.applied_water: mm
  diagnostics.irrigation.effective_efficiency: '1'
  diagnostics.irrigation.moisture_response: '1'
  diagnostics.irrigation.water_balance_residual: kg m-2 s-1
input_output_map:
  abstraction_flux: same interface variable preserved between legacy and IPHS runtime contracts
  irrigation_flux: same interface variable preserved between legacy and IPHS runtime contracts
  irrigation_remaining_quota: owned StateManager quota state, Q' = Q - A_used returned as REPLACE; a domain demand above Q is met at an equal percentage in every cell (WEAP21, Yates et al. 2005)
  diagnostics.irrigation.applied_water: delivered depth of the step (readers integrate)
  diagnostics.irrigation.effective_efficiency: explicit application-efficiency diagnostic
  diagnostics.irrigation.moisture_response: explicit soil-moisture response diagnostic
  diagnostics.irrigation.water_balance_residual: explicit delivered-versus-abstracted water residual
  soil_moisture: required canonical root-zone moisture input
  precipitation_flux: required canonical external precipitation mass flux
  land_use_type: required canonical land-use composition code
  irrigation_type: required canonical irrigation-system code
  field_capacity: required canonical soil hydraulic property
  wilting_point: required canonical soil hydraulic property
interface_map:
  forward_signature: forward(self, state, time, dt, **kwargs)
  bridge_class: TransportMechanismFunctor
  abstraction_contract: TransportMechanism
  state_write_mode: explicit UpdateItem REPLACE with per_timestep false and source_functor irrigation_management
