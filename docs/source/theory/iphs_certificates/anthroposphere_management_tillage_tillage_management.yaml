input_output_map:
  direct_disturbance: soil moisture and the intensity of the executing operation map once to soil_disturbance_rate and residue_incorporation_rate; zero without an operation
  carbon_export: carbon_loss_rate maps once to soil_co2_flux through the declared carbon-to-CO2 mass ratio
  decaying_structure: days_since_tillage maps to time_decay_factor, porosity_modifier, and roughness_modifier
  ownership_boundary: decomposition and infiltration process laws are not advanced or emitted by this Functor
  diagnostics: the mass-balance residual reports removal beyond available soil carbon
