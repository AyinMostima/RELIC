baseline_tests:
- test\anthroposphere\management\test_tillage_l1.py
- test\audit\land_use_modifier_output_contract.test.py
- test\audit\phase8_scientific_inventory.test.py
validation_tests:
- test\anthroposphere\management\test_tillage_l1.py
- test\audit\land_use_modifier_output_contract.test.py
- test\audit\phase8_scientific_inventory.test.py
state_map:
  soil_moisture: soil_moisture mapped to canonical Phase 8 cochain basis
  soil_temperature: soil temperature of the tilled layer [K], the Q10 driver of the tillage carbon flush
  soil_organic_carbon: soil organic carbon stock of the tilled layer [kg C m-2] exposed by the carbon flush (no default)
  day_of_year: day_of_year mapped to canonical Phase 8 cochain basis
  days_since_tillage: days_since_tillage mapped to canonical Phase 8 cochain basis
  residue_cover: residue cover fraction [1], optional, read only when an operation executes (incorporated cover -min(cover, R)); an operation without it raises
  soil_disturbance_rate: dimensionless direct tillage disturbance contribution
  residue_incorporation_rate: dimensionless residue-incorporation contribution
  carbon_loss_rate: operation-step tillage carbon flush F_C = C_soil f_0 f_p I D f_T / S_day [kg C m^-2 s^-1], the one tillage carbon flux, zero outside an operation step; post-tillage enhanced decomposition is not represented
  soil_co2_flux: tillage CO2 mass flux F_C M_CO2 / M_C [kg CO2 m^-2 s^-1]
parameter_map:
  anthroposphere.management.tillage.disturbance_factor: Base soil disturbance scaling for tillage operations [dimensionless]
  anthroposphere.management.tillage.residue_incorporation_rate: Fraction of surface residue incorporated by tillage [dimensionless]
  anthroposphere.management.tillage.effect_decay_rate: Tillage effect decay rate [day-1]
  anthroposphere.management.tillage.schedule_window_days: Half-width of the calendar window around a scheduled operation day [day]
  anthroposphere.management.tillage.minimum_operation_interval_days: Minimum elapsed time since the last operation before the next one [day]
  anthroposphere.management.tillage.default_schedule.*: Day of year [day] and soil-moisture upper limit [m3 m-3] of the four default operations [units per key]
  anthroposphere.management.tillage.porosity_change: Soil porosity change factor [dimensionless]
  anthroposphere.management.tillage.roughness_intensity_coefficient: Intensity response coefficient for tillage roughness modifier [dimensionless]
  anthroposphere.management.tillage.co2_pulse_base_fraction: Base fractional scaling for tillage induced CO2 pulse emissions [dimensionless]
  anthroposphere.management.tillage.co2_pulse_factor: CO2 emission pulse factor [dimensionless]
  anthroposphere.management.tillage.moisture_optimum: Optimal soil moisture for tillage disturbance response [m3 m-3]
  anthroposphere.management.tillage.moisture_sigma: Gaussian width for moisture response under tillage [m3 m-3]
  anthroposphere.management.tillage.moisture_effect_denominator: Soil moisture scaling denominator for tillage moisture effect [m3 m-3]
  anthroposphere.management.tillage.residue_moisture_offset: Offset term applied to moisture response in tillage residue incorporation [dimensionless]
  anthroposphere.management.tillage.*_intensity_factor: Intensity multiplier per tillage intensity class (none, low, moderate, high, very high) [dimensionless]
  anthroposphere.management.tillage.*_depth_factor: Depth multiplier per tillage depth class (shallow, medium, deep, very deep) [dimensionless]
  pedosphere.physical.q10_decomposition: Q10 of soil organic matter decomposition in the tillage carbon flush [dimensionless]
  validation.conservation.conservation_tolerance: General relative tolerance of the conservation checks [dimensionless]
physical_constant_ssot:
  seconds_per_day: Central time-constants facade backed by the physical constants SSOT
  standard_temperature: get_physical_constant("standard_temperature")
operator_map:
