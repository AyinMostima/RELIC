certificate_version: '1.0'
process_id: relic.scientific.anthroposphere.management.tillage.TillageManagement
module_name: TillageManagement
canonical_role: port
iphs_level: 2
iphs_level_evidence:
  classification: IPHS-wrapped port process certificate
  compatible_basis: Process declares composition-safe IPHS or DEC structure
  runtime_replacement: Production forward path uses the existing canonical wrapper or declaration contract; strict runtime replacement is not claimed at this certificate level.
  canonical_operator: G_h u_h port route with explicit boundary or external exchange
  level_2_limit: The canonical runtime wrapper is declared, but no executable typed-cochain or IPHS structural contribution is bound; strict level 4 or 5 evidence is not claimed.
theory_document: docs\source\theory\anthroposphere_management_tillage.md
theory_document_status: updated
legacy_formula: Tillage previously exposed generic decomposition and infiltration modifiers without a consuming owner contract.
literature_formula: D_tillage = k_disturbance I f_theta; R_inc = clamp(k_residue I (a_theta + f_moisture), 0, 1); F_C = C_soil f_0 f_p I D f_T / S_day in an operation step, 0 otherwise.
iphs_formula: y_dot = G_h u_h through the declared tillage disturbance, residue, porosity, roughness, and carbon-export ports.
legacy_expression: Removed generic modifier outputs had no executable downstream composition path.
iphs_expression: y_dot = G_h u_h with one canonical output per direct tillage contribution and no duplicated process-law output.
input_variables:
- soil_moisture
- soil_temperature
- soil_organic_carbon
- day_of_year
- days_since_tillage
- residue_cover
output_variables:
