input_output_map:
  air_temperature: canonical required temperature input
  atmospheric_pressure: canonical required pressure input; its alias air_pressure is not read and no standard atmosphere is substituted
  shortwave_down: canonical required solar global irradiance of the Trebs et al. (2009) J_NO2 relation
