state_map:
  air_temperature: air_temperature mapped to canonical Phase 8 cochain basis
  atmospheric_pressure: atmospheric_pressure p of the ideal-gas number density n = p / (k_B T)
  shortwave_down: shortwave_down solar global irradiance G of J_NO2 = (1 + alpha)(B1 G + B2 G^2) (Trebs et al. 2009) through the radiation input port
  cos_zenith: cos_zenith cos(chi) of the MCM ratio rho(chi) = J(O1D)/J(NO2) and of the direct-beam slant path of the spectral temperature factor, a required input
  no_mixing_ratio: no_mixing_ratio mapped to canonical Phase 8 cochain basis
  no2_mixing_ratio: no2_mixing_ratio mapped to canonical Phase 8 cochain basis
  o3_mixing_ratio: o3_mixing_ratio mapped to canonical Phase 8 cochain basis
  isoprene_mixing_ratio: isoprene_mixing_ratio mapped to canonical Phase 8 cochain basis when present
  co_mixing_ratio: co_mixing_ratio [CO] of the OH loss k_OH+CO [CO], a required input
  ch4_mixing_ratio: ch4_mixing_ratio [CH4] of the OH loss k_OH+CH4 [CH4], a required input
  specific_humidity: specific_humidity q of the water-vapour mole fraction x_w = (q/M_w) / (q/M_w + (1-q)/M_d) in the O(1D) + H2O fraction f, a required input
