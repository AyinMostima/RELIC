composition_management_map:
  functor_metadata: existing FunctorMetadata declares interfaces, execution phase, and conservation semantics
  state_contract: existing simulator state update path is preserved
  validation_rule: phase8 scientific inventory and equivalence certificate checks
dependency_interconnection_map:
  dependencies: 'atmospheric_radiation (optional same-step provider of shortwave_down and cos_zenith for the open mechanism; otherwise both are external forcing)'
  direct_functor_calls: none declared by certificate
overflow_routing_map:
  invalid_species_route: negative, NaN, or infinite mixing ratios fail before a state UpdateItem is emitted
  inadmissible_timestep_route: an explicit Euler candidate that would make a retained species negative fails before any UpdateItem; the reported current-state dt bound must be met directly or through simulator-managed substeps
  diagnostic_bounds: the steady-state OH diagnostic is P_OH / L_OH without lower or upper bounds or a loss floor; it drives the isoprene + OH sink of the prognostic isoprene state, and a non-positive OH loss frequency raises before any UpdateItem
  discarded_residuals: none because the production chemistry path performs no species-state clipping, flooring, or negative-residual disposal
conservation_map:
  conserved_quantities: local NO plus NO2 reaction-family identity only
  balance_expression: C_NOx N_h = 0 and UpdateItem(no_mixing_ratio).value + UpdateItem(no2_mixing_ratio).value = 0 for the gas-phase NOx interconversion family; check_conservation_laws reports the normalized residual and fails fast on malformed increments; total mass is not claimed because products and O2 are outside the reduced state
entropy_audit:
  operator_sign: Declared level 3 mobility is positive semidefinite in the structural hook; this is not a strict runtime thermodynamic proof.
  sigma_expression: Independent entropy-production closure has not been verified, so strict IPHS or GENERIC behavior is not claimed.
equivalence_type: exact
