certificate_version: '1.0'
process_id: relic.scientific.atmosphere.chemistry.ChemistryFunctor
module_name: ChemistryFunctor
canonical_role: field
iphs_level: 3
iphs_level_evidence:
  classification: IPHS-structured field process certificate
  compatible_basis: Process declares retained species cochains, an explicit reduced stoichiometric map, ParameterManager-backed reaction rates, and a radiation photolysis port
  runtime_replacement: Production forward evaluates the existing advance_reaction_network owner once with x_dot = N_h r_h, C_NOx N_h = 0, and an explicit boundary_export route; strict thermodynamic replacement is not claimed at this certificate level.
  canonical_operator: x_dot = N_h r_h for NO, NO2, O3, and conditional isoprene, with C_NOx = [1, 1, 0, 0]
  structural_contribution: Field state, operator, and audit maps are declared
  assembly_participation: Certificate participates in Phase 8 inventory and GraphIR structural audit
  level_3_limit: Typed form, Hodge, port, or related structure is declared, but no runtime-linked IPHSStructureSpec contribution and executable level 4 or 5 certificate binding is present.
theory_document: docs\source\theory\chemistry.md
theory_document_status: updated
legacy_formula: d[NO]/dt = J_NO2*[NO2] - k_NO_O3*[NO]*[O3]; d[NO2]/dt = k_NO_O3*[NO]*[O3] - J_NO2*[NO2]; d[O3]/dt = J_NO2*[NO2] - k_NO_O3*[NO]*[O3]; k(T) = k_298 * exp(Ea/R * (1/T_ref - 1/T)), T_ref = 298.15 K; J_NO2 = (1 + alpha) * (B1 * G + B2 * G^2) * R_NO2(T, theta), G = SW held at G_v = B1/(2|B2|) above (Trebs et al. 2009); J_O1D = (1 + alpha) * (B1 * G + B2 * G^2) * rho(theta) * R_O1D(T, theta), rho = (l1/l4) cos(theta)^(m1-m4) exp(-(n1-n4)/cos(theta)); R_X = 1 (mode none) or sum sigma_X phi_X F0 exp(-tau/cos(theta)) / same at T_ref (mode spectral_quantum_yield); [OH] = y f J_O1D [O3] / (k_OH_CO[CO] + k_OH_CH4[CH4] + k_OH_NO2[NO2] + k_OH_C5H8[C5H8]), f = k_H2O[H2O] / (k_H2O[H2O] + k_N2[N2] + k_O2[O2]); BVOC + OH -> products (k_BVOC_OH)
literature_formula: d[NO]/dt = J_NO2*[NO2] - k_NO_O3*[NO]*[O3]; d[NO2]/dt = k_NO_O3*[NO]*[O3] - J_NO2*[NO2]; d[O3]/dt = J_NO2*[NO2] - k_NO_O3*[NO]*[O3]; k(T) = k_298 * exp(Ea/R * (1/T_ref - 1/T)), T_ref = 298.15 K; J_NO2 = (1 + alpha) * (B1 * G + B2 * G^2) * R_NO2(T, theta), G = SW held at G_v = B1/(2|B2|) above (Trebs et al. 2009); J_O1D = (1 + alpha) * (B1 * G + B2 * G^2) * rho(theta) * R_O1D(T, theta), rho = (l1/l4) cos(theta)^(m1-m4) exp(-(n1-n4)/cos(theta)); R_X = 1 (mode none) or sum sigma_X phi_X F0 exp(-tau/cos(theta)) / same at T_ref (mode spectral_quantum_yield); [OH] = y f J_O1D [O3] / (k_OH_CO[CO] + k_OH_CH4[CH4] + k_OH_NO2[NO2] + k_OH_C5H8[C5H8]), f = k_H2O[H2O] / (k_H2O[H2O] + k_N2[N2] + k_O2[O2]); BVOC + OH -> products (k_BVOC_OH)
iphs_formula: x_dot = N_h r_h, with photolysis and kinetic rates as ParameterManager-backed reaction entries and C_NOx N_h = 0
legacy_expression: d[NO]/dt = J_NO2*[NO2] - k_NO_O3*[NO]*[O3]; d[NO2]/dt = k_NO_O3*[NO]*[O3] - J_NO2*[NO2]; d[O3]/dt = J_NO2*[NO2] - k_NO_O3*[NO]*[O3]; k(T) = k_298 * exp(Ea/R * (1/T_ref - 1/T)), T_ref = 298.15 K; J_NO2 = (1 + alpha) * (B1 * G + B2 * G^2) * R_NO2(T, theta), G = SW held at G_v = B1/(2|B2|) above (Trebs et al. 2009); J_O1D = (1 + alpha) * (B1 * G + B2 * G^2) * rho(theta) * R_O1D(T, theta), rho = (l1/l4) cos(theta)^(m1-m4) exp(-(n1-n4)/cos(theta)); R_X = 1 (mode none) or sum sigma_X phi_X F0 exp(-tau/cos(theta)) / same at T_ref (mode spectral_quantum_yield); [OH] = y f J_O1D [O3] / (k_OH_CO[CO] + k_OH_CH4[CH4] + k_OH_NO2[NO2] + k_OH_C5H8[C5H8]), f = k_H2O[H2O] / (k_H2O[H2O] + k_N2[N2] + k_O2[O2]); BVOC + OH -> products (k_BVOC_OH)
iphs_expression: x_dot = N_h r_h, with an explicit boundary_export route for unretained oxygen, radical, and oxidation-product species
