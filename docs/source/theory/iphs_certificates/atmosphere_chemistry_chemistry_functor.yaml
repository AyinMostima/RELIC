runtime_replacement_map:
  runtime_uses_iphs: false
  legacy_removed: false
  replacement_entrypoint: forward
  preserved_numerics: The single forward path evaluates ParameterManager-backed reduced chemistry through advance_reaction_network and emits its integrated species deltas plus namespaced observations.
  no_legacy_mode: true
  non_strict_reason: Level 3 declares IPHS structure hooks but does not claim a strict runtime-linked Hamiltonian or GENERIC state advance.
state_advancement_map:
  potential_basis: declared RELIC state, port, or observation cochain basis
  effort_variable: radiation and species fields used by the declared level 3 structural closure; no strict variational effort is claimed
  state_advancer: Delta x = dt N_h r_h with canonical per-step UpdateItem accumulation, admitted only when x + Delta x is non-negative for every retained species
  explicit_stoichiometric_usage: ChemistryFunctor.forward passes the four retained species, five named reactions, signed 4 by 5 N_h, ParameterManager-backed r_h, C_NOx, dt, and boundary_export route to advance_reaction_network exactly once.
  runtime_usage: ChemistryFunctor.forward evaluates one gas-phase reduced-kinetics path through advance_reaction_network, validates C_NOx N_h = 0, and rejects an explicit Euler candidate when dt exceeds the exact current-state positivity bound min(x_i / -f_i) over negative tendencies. The open boundary route contains unretained O/O2/OH and oxidation products. This is not a general stiff-stability, accuracy, Hamiltonian, entropy, or GENERIC proof. Dry deposition remains exclusively owned by DryDepositionAggregator, and no alternate chemistry formula branch is executable.
