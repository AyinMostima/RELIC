composition_management_map:
  functor_metadata: FunctorMetadata for this selection declares six inputs, five state outputs, eight diagnostics, no dependencies, and the nitrogen_atoms, oxygen_atoms, and internal_energy conservation laws
  state_contract: SCM contracts box_no_amount, box_no2_amount, box_o3_amount, box_o2_amount (mol), box_internal_energy (J), box_volume (m3 forcing) and the eight diagnostics.chemistry.box_* contracts type the GraphIR ports
  validation_rule: equivalence certificate checks with the process-bound runtime point audit, plus the closed-box unit and integration tests
dependency_interconnection_map:
  dependencies: no Functor dependencies; get_dependencies() returns an empty list and config dependencies must be empty for this selection
  direct_functor_calls: none declared by certificate
overflow_routing_map:
  invalid_species_route: non-finite or non-scalar inventories, internal energy, or volume, or inputs with different dtype/device, fail before emission; inventories and volume must be strictly positive, while internal energy must admit the declared thermodynamic inversion
  inadmissible_timestep_route: an actual tensor Euler candidate outside the closed-box thermodynamic domain fails before any UpdateItem or audit is published; meeting the nominal current-state depletion bound alone does not guarantee strictly positive rounded inventories, valid T(U,n), or A > 0
  affinity_domain_route: both initial and actual Euler-candidate thermodynamic points require finite positive A = -nu^T mu; the forward mass-action law and the declared positive semidefinite M_h are only used in the A > 0 domain
  discarded_residuals: none because no clipping, flooring, or residual disposal exists on this path
conservation_map:
  conserved_quantities: nitrogen atoms, oxygen atoms, and internal energy of the closed adiabatic rigid box
  balance_expression: C_N nu = 0 with C_N = (1, 1, 0, 0, 0), C_O nu = 0 with C_O = (1, 2, 3, 2, 0), and Delta U = dt (M_h e_E)_U = 0; check_conservation_laws returns the normalized residuals nitrogen_atoms, oxygen_atoms, and internal_energy which are exactly zero for the emitted increments
entropy_audit:
  operator_sign: M_h = (r T / A) nu nu^T is symmetric positive semidefinite because A > 0 is enforced and r >= 0 by mass action with positive inventories
  sigma_expression: sigma = e_S^T M_h e_S = A r / T >= 0, emitted as diagnostics.chemistry.box_entropy_production_rate, verified against an independent autograd oracle in the unit tests and by IPHSStructureSpec.validate(required_level=5) on every emitted step
equivalence_type: exact
