runtime_replacement_map:
  runtime_uses_iphs: true
  legacy_removed: true
  legacy_never_existed: true
  runtime_owner: relic.scientific.atmosphere.chemistry.ChemistryFunctor._forward_closed_constant_volume
  removed_legacy_symbols: []
  replacement_entrypoint: forward
  validation_test: test\integration\test_chemistry_integration.py
  preserved_numerics: The single forward path builds E and S from the same-step state, evaluates IPHSStructureSpec.canonical_drift once, verifies the Level 5 runtime point, and commits Delta x = dt x_dot; no alternative kinetic branch exists for this selection and no legacy implementation ever existed.
  no_legacy_mode: true
state_advancement_map:
  potential_basis: E = U and S(U, n, V) evaluated by standard_molar_properties, ideal_gas_mixture_properties, and temperature_from_internal_energy on the same autograd state graph
  effort_variable: e_E = grad(E) = (0, 0, 0, 0, 1) and e_S = grad(S) = (-mu / T, 1 / T) obtained by torch.autograd.grad inside canonical_drift
  state_advancer: Delta x = dt x_dot with x_dot = L_h e_E + M_h e_S = nu r; the actual tensor candidate x + Delta x must retain strictly positive species inventories, valid T(U,n) and ideal-mixture properties, and A > 0 before emission
  explicit_stoichiometric_usage: forward declares stoichiometric_N = nu reshaped to 5 by 1 with reaction_representation=absorbed in IPHSStructureSpec, and passes the same N, reaction rate, C_N, C_O, and affinity to advance_reaction_network with dt=None for the audits only.
  runtime_usage: ChemistryFunctor.forward evaluates one GENERIC absorbed-reaction path through canonical_drift, verifies M_h e_S = N r to reduction roundoff, validates the bound pre-step runtime point at required_level=5, and audits C_N nu = 0, C_O nu = 0, and A r >= 0; before publishing the audit or emitting five ACCUMULATE increments plus eight REPLACE diagnostics, the same pure thermodynamic-point owner checks the actual tensor Euler candidate for n_i > 0, valid T(U,n), and A > 0, without a second drift or state advance. Discrete entropy monotonicity, stiff-stability and accuracy are not certified.
