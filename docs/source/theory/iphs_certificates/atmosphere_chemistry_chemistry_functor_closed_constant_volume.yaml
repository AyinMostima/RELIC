operator_map:
  L_h: zero Poisson operator declared through poisson_operator=zero_field; the Jacobi identity holds on the canonical zero-field basis verified by IPHSStructureSpec.validate
  M_h: (r T / A) nu nu^T, symmetric positive semidefinite for A > 0 and r >= 0, with a zero energy row and column so that M_h e_E = 0
  G_h: none, closed box without ports
  N: nu = (-1, +1, -1, +1, 0) reshaped to 5 by 1; reaction_representation=absorbed, so N r is not added a second time
