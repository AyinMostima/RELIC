certificate_version: '1.0'
process_id: relic.scientific.atmosphere.chemistry.ChemistryFunctor
constructor_selection:
  physical_boundary: closed_constant_volume
module_name: ChemistryFunctor
canonical_role: field
formulation: generic
iphs_level: 5
iphs_level_evidence:
  classification: Strict GENERIC closed constant-volume reaction box certificate bound to the physical_boundary=closed_constant_volume constructor selection
  compatible_basis: State x = (n_NO, n_NO2, n_O3, n_O2, U) in mol and J with a fixed volume V in m3; E = U and S = sum_i n_i (s_i(T) - R ln(p_i / p0)) are built from the same-step state through the existing NASA7, mixture, and temperature-inversion primitives
  runtime_replacement: forward evaluates IPHSStructureSpec.canonical_drift with poisson_operator=zero_field and reaction_representation=absorbed, L_h = 0 and M_h = (r T / A) nu nu^T, commits Delta x = dt x_dot exactly once, and runs IPHSStructureSpec.validate(required_level=5) on the same bound potentials every emitted step
  canonical_operator: x_dot = L_h e_E + M_h e_S = nu r with nu = (-1, +1, -1, +1, 0), M_h e_E = 0, sigma = e_S^T M_h e_S = A r / T >= 0
  structural_contribution: Closed-box forms, energy and entropy terms, and the state-dependent dissipative structure are declared through the existing PhysicalField hooks for this selection
  assembly_participation: The selection is registered through NodeRegistry.register_functor_instance with an explicit node_type_id and config_contract; GraphIR compile_graph(strict=True) and GraphExecutor execute it
  storage_functional:
    runtime_owner: relic.scientific.atmosphere.chemistry.ChemistryFunctor._evaluate_closed_constant_volume_box
    value_key: energy
    state_keys:
    - box_no_amount
    - box_no2_amount
    - box_o3_amount
    - box_o2_amount
    - box_internal_energy
    units: J
    theory_anchor: chemistry:closed_constant_volume_box
    validation_test: test\unit\test_chemistry_functor.py
  effort_definition:
    runtime_owner: relic.computation.operators.iphs.IPHSStructureSpec.canonical_drift
    value_key: energy_effort
    derivative_of: storage_functional
    method: autograd
    validation_test: test\unit\test_chemistry_functor.py
  dissipation_audit:
    runtime_owner: relic.computation.operators.iphs.IPHSStructureSpec.validate
    operator_owner: relic.scientific.atmosphere.chemistry.ChemistryFunctor._evaluate_closed_constant_volume_box
    operator_kind: mobility_M
    value_key: entropy_production
    balance_key: closed_box_entropy_rate
    inequality: dS_dt>=port_entropy_flow
    tolerance_parameter_key: validation.iphs.runtime_point_tolerance
    validation_test: test\unit\test_chemistry_functor.py
  port_power_audit:
    runtime_owner: relic.computation.operators.iphs.IPHSStructureSpec.canonical_drift
    balance_key: closed_box_port_power
    sign_convention: into_system
    tolerance_parameter_key: validation.iphs.runtime_point_tolerance
    validation_test: test\unit\test_chemistry_functor.py
  energy_entropy_pair:
    energy_owner: relic.scientific.atmosphere.chemistry.ChemistryFunctor._evaluate_closed_constant_volume_box
    entropy_owner: relic.scientific.atmosphere.chemistry.ChemistryFunctor.ideal_gas_mixture_properties
    energy_key: energy
    entropy_key: entropy
    validation_test: test\unit\test_chemistry_functor.py
  generic_degeneracy:
    structure_owner: relic.computation.operators.iphs.IPHSStructureSpec.validate
    j_entropy_residual_key: J_entropy_gradient_residual
    m_energy_residual_key: M_energy_gradient_residual
    reversible_operator_state_dependence: zero_field
    jacobi_identity_basis: canonical_zero_field
    tolerance_parameter_key: validation.iphs.runtime_point_tolerance
    validation_test: test\unit\test_chemistry_functor.py
  entropy_production:
    runtime_owner: relic.computation.operators.iphs.IPHSStructureSpec.validate
    value_key: entropy_production
    lower_bound: 0.0
    tolerance_parameter_key: validation.iphs.runtime_point_tolerance
    validation_test: test\unit\test_chemistry_functor.py
  level_5_scope: Level 5 holds for the executed runtime point of each emitted closed-box step; the process-bound witness (governed FunctorBase call, committed state outputs, accepted step) must accompany this certificate when validated, otherwise it remains descriptive and process-unbound
theory_document: docs\source\theory\chemistry.md
theory_document_status: updated
legacy_formula: dn/dt = nu r, r = k(T) N_A n_NO n_O3 / (c_v V), k(T) = k_298 * exp(Ea/R * (1/T_ref - 1/T)), T_ref = 298.15 K; dU/dt = 0 (closed, adiabatic, rigid)
literature_formula: A = -nu^T mu; mu_i = h_i(T) - T s_i(T) + R T ln(p_i / p0); sigma = A r / T >= 0; x_dot = L_h e_E + M_h e_S with L_h = 0 and M_h = (r T / A) nu nu^T (Grmela and Ottinger 1997; Mielke 2011; Kondepudi and Prigogine 1998)
iphs_formula: x_dot = L_h e_E + M_h e_S, L_h = 0 (zero_field), M_h = (r T / A) nu nu^T, absorbed reaction with M_h e_S = N r checked against the declared N r, M_h e_E = 0
legacy_expression: dn/dt = nu r, r = k(T) N_A n_NO n_O3 / (c_v V), k(T) = k_298 * exp(Ea/R * (1/T_ref - 1/T)), T_ref = 298.15 K; dU/dt = 0 (closed, adiabatic, rigid)
iphs_expression: x_dot = L_h e_E + M_h e_S, L_h = 0 (zero_field), M_h = (r T / A) nu nu^T, absorbed reaction with M_h e_S = N r checked against the declared N r, M_h e_E = 0
