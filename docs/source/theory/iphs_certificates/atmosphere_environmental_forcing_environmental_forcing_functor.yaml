composition_management_map:
  functor_metadata: existing FunctorMetadata declares interfaces, execution phase, and conservation semantics
  state_contract: forward emits only vapor_pressure_deficit through the existing StateManager update path; external inputs are never echoed
  physical_constant_ssot: Celsius-to-Kelvin offset is resolved only through get_physical_constant
  unit_conversion_ssot: kPa-to-Pa conversion uses the existing UnitConverter.kpa_to_pa path
  validation_rule: phase8 scientific inventory and equivalence certificate checks
dependency_interconnection_map:
  dependencies: external forcing adapter supplies required air_temperature and relative_humidity through StateManager
  direct_functor_calls: none declared by certificate
overflow_routing_map:
  diagnostic_residuals: validated RH in [0,1] makes the VPD lower-bound operation inactive except for floating-point roundoff; invalid inputs and non-finite computed Pa outputs fail fast without clipping or replacement
  discarded_residuals: valid relative humidity makes saturation vapor pressure times one minus RH non-negative; invalid RH and non-finite VPD are rejected before update, and this observation advances no storage
conservation_map:
  conserved_quantities: none; VPD is a derived open-port observation and advances no mass or energy storage
  balance_expression: output is an instantaneous observation independent of dt
entropy_audit:
  operator_sign: VPD is non-negative over the validated RH domain
  sigma_expression: no entropy-production claim is made for this non-strict observation map
