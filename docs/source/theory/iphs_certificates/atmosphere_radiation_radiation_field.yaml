legacy_formula: R(x,y,t) field interpolation and evolution; nabla R = (partial R/partial x, partial R/partial y)
literature_formula: R(x,y,t) field interpolation and evolution; nabla R = (partial R/partial x, partial R/partial y)
iphs_formula: R_dot = M_h e_R + G_h u_R with M_h = diag(R_max - R_min) >= 0 and boundary forcing routed through radiation_field_boundary_port
legacy_expression: R(x,y,t) field interpolation and evolution; nabla R = (partial R/partial x, partial R/partial y)
