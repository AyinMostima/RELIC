runtime_replacement_map:
  runtime_uses_iphs: false
  legacy_removed: false
  replacement_entrypoint: forward
  preserved_numerics: ParameterManager-backed radiative coefficients, Beer-Lambert canopy transfer, and incident Brutsaert radiation retain their existing calculation; the single corrected greybody surface balance includes absorbed incident and reflected outgoing longwave without a legacy mode.
  no_legacy_mode: Production forward rejects undeclared canopy models, missing or nonfinite state cochains, model failures, nonpositive dt, and conditional diagnostic modes; it exposes no alias, proxy two-stream branch, default-state, emergency Beer-Lambert, or zero-absorption fallback. All declared namespaced diagnostics are returned on every execution.
state_advancement_map:
  potential_basis: typed open radiative-boundary flux cochain
  effort_variable: not declared because no stored-energy functional or conjugate effort is available
  state_advancer: The existing simulator and StateManager own state advancement; forward evaluates the declared radiative boundary flux without a second state-update path.
  runtime_usage: RadiationFunctor.forward evaluates the production radiation balance and optional canopy operator through the level-2 wrapper only.
