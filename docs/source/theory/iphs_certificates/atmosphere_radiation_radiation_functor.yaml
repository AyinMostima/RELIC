composition_management_map:
  functor_metadata: existing FunctorMetadata declares interfaces, execution phase, and conservation semantics
  state_contract: existing simulator state update path is preserved
  validation_rule: phase8 scientific inventory and equivalence certificate checks
dependency_interconnection_map:
  dependencies: declared through existing metadata or no external dependency
  direct_functor_calls: none declared by certificate
overflow_routing_map:
  diagnostic_residuals: diagnostics.radiation.shortwave_clipping_residual and diagnostics.radiation.emissivity_clipping_residual are unconditionally exposed
  discarded_residuals: none for declared shortwave and emissivity clipping residuals
conservation_map:
  conserved_quantities: energy
  balance_expression: net_radiation = shortwave_net + longwave_net; PPFD is a read-only observation derived from shortwave_down and is not an additional energy source
entropy_audit:
  entropy_claim: not_applicable_no_entropy_production_without_a_thermodynamic_force_or_constitutive_law
  reason: An instantaneous radiative flux does not define entropy production without a thermodynamic force and constitutive law
equivalence_type: exact
