certificate_version: '1.0'
process_id: relic.scientific.atmosphere.radiation.RadiationFunctor
module_name: RadiationFunctor
canonical_role: field
iphs_level: 2
iphs_level_evidence:
  classification: IPHS-wrapped open-boundary field process certificate
  compatible_basis: Process exposes typed radiation-flux cochains and an explicit open energy-balance route without claiming a stored-energy state
  runtime_replacement: Production forward path uses the existing canonical wrapper or declaration contract; strict runtime replacement is not claimed at this certificate level.
  canonical_operator: Typed boundary-flux wrapper with R_net = SW_net + LW_net and no unverified H, J, M, G, entropy, or power-port operator
  level_2_limit: RadiationFunctor computes instantaneous boundary fluxes and has no independently validated storage functional or conjugate effort-flow pair; level 3 through 5 are not claimed.
theory_document: docs\source\theory\radiation.md
theory_document_status: updated
legacy_formula: R_net = SW_net + LW_net; SW_net = (1-alpha) * SW_down; LW_net = epsilon*LW_down - epsilon*sigma*T_sfc^4; SW_down = SW_pot * tau * max(0,cos(theta)) * f_cloud; LW_down = epsilon_atm * sigma * T_air^4; epsilon_atm = C1 * (e_a/T_air)^(C2)
literature_formula: R_net = SW_net + LW_net; PPFD = SW_down*f_PAR*c_PPFD; k_T = SW_down/SW_ext,h; Erbs f_dif = 1-0.09k_T for k_T<=0.22, fourth-order polynomial for 0.22<k_T<=0.80, and 0.165 above 0.80
iphs_formula: Level-2 typed boundary wrapper over R_net = SW_net + LW_net; no Hamiltonian storage, Onsager dissipation, or conjugate power port is asserted
legacy_expression: R_net = SW_net + LW_net; SW_net = (1-alpha) * SW_down; LW_net = epsilon*LW_down - epsilon*sigma*T_sfc^4; SW_down = SW_pot * tau * max(0,cos(theta)) * f_cloud; LW_down = epsilon_atm * sigma * T_air^4; epsilon_atm = C1 * (e_a/T_air)^(C2)
iphs_expression: R_net = (1-alpha) SW_down + epsilon_sfc LW_down - epsilon_sfc sigma T_sfc^4; PPFD = SW_down f_PAR c_PPFD; retained values are open boundary fluxes and observations
