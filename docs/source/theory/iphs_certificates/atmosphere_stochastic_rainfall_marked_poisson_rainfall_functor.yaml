  - diagnostics.stochastic_rainfall.event_count_increment
  - diagnostics.stochastic_rainfall.depth_increment
  - diagnostics.stochastic_rainfall.compensator_count
  - diagnostics.stochastic_rainfall.compensator_depth
runtime_replacement_map:
  runtime_uses_iphs: false
  legacy_removed: false
  replacement_entrypoint: forward -> relic.stochastic.gillespie.GillespieSSA.sample
  preserved_numerics: The single forward path samples the arrivals of the step with the direct SSA and the marks from the same substream and emits the exact increments; no alternative event branch exists.
  no_legacy_mode: No selectable legacy runtime branch is exposed; the Functor was introduced directly on the canonical SSA owner.
  non_strict_reason: Level 2 declares the canonical marked-jump runtime wrapper; no IPHS structure, Hamiltonian, entropy, or fluctuation-dissipation claim is made for external forcing events.
state_advancement_map:
  potential_basis: prognostic count and depth states on the declared cell basis; no storage functional is claimed
  effort_variable: none; arrivals follow a constant hazard and marks an exponential law, not a variational effort
  state_advancer: Delta N = k from one GillespieSSA.sample call with final_time = dt in days and Delta H = alpha sum_{i<=k} E_i from the Functor-owned generator
  runtime_usage: MarkedPoissonRainfallFunctor.forward validates both states and the step, converts dt to days, samples the arrivals per cell with the direct SSA, draws the exponential marks in cell order, increments the substream draw count, and emits two ACCUMULATE increments plus four REPLACE diagnostics; a rejected step leaves the substream position unchanged.
parameter_management_map:
  stochastic.weather.rainfall.event_rate:
    source: ParameterManager YAML
  stochastic.weather.rainfall.mean_depth:
    source: ParameterManager YAML
composition_management_map:
  functor_metadata: existing FunctorMetadata declares two state inputs, two state outputs, four diagnostics, no dependencies, and no conservation law
  state_contract: SCM contracts stochastic_rainfall_event_count (1, state) and stochastic_rainfall_depth (mm, state) and the four diagnostics.stochastic_rainfall.* contracts type the GraphIR ports
  validation_rule: stochastic_sdae_check with the marked_jump execution binding, phase8 scientific inventory, and equivalence certificate checks
  public_entrypoints: relic.stochastic.workflows.build_bound_marked_jump_graph / execute_bound_marked_jump serve POST /stochastic/gillespie and the CLI command stochastic gillespie; both fail closed for unbound process names, arbitrary reaction declarations, and per-run parameter overrides
dependency_interconnection_map:
  dependencies: no Functor dependencies; get_dependencies() returns an empty list
  direct_functor_calls: none; only the canonical GillespieSSA owner is invoked
overflow_routing_map:
  invalid_state_route: missing, non-tensor, non-floating, non-finite, fractional, or negative count states fail before any draw or UpdateItem
  inadmissible_timestep_route: a non-positive or non-finite step fails before any draw; a step whose expected arrivals exceed the admissible SSA cap fails before sampling
  arrival_cap_route: a cell that reaches the per-step arrival cap rejects the step instead of truncating the count
  substream_route: the event substream advances only when a step is emitted; rollback restores the module extra state
  discarded_residuals: no residual is discarded; every rejected input or step fails before a draw or an UpdateItem is emitted
conservation_map:
  conserved_quantities: none; the count and depth are external forcing states entering through the open port route
  balance_expression: E[Delta N] = lambda dt and E[Delta H] = lambda alpha dt for the emitted step; Var[Delta N] = lambda dt and Var[Delta H] = 2 lambda alpha^2 dt
entropy_audit:
  operator_sign: lambda > 0 and alpha > 0 by ParameterManager bounds; every arrival adds a nonnegative depth
  sigma_expression: no entropy-production or fluctuation-dissipation claim is made; the events are an external forcing closure
stochastic_sdae_map:
  runtime_owner: relic.stochastic.gillespie.GillespieSSA
  declares_stochastic_terms: false
  requires_noise_covariance: false
  declares_fdt_noise: false
  requires_conservative_noise_flux: false
  requires_descriptor_constraint: false
  requires_jump_reset: true
  execution_binding:
    functor_class: relic.scientific.atmosphere.stochastic_rainfall.MarkedPoissonRainfallFunctor
    forward_owner: relic.scientific.atmosphere.stochastic_rainfall.MarkedPoissonRainfallFunctor.forward
    solver_owner: relic.stochastic.gillespie.GillespieSSA
    rng_state_scope: functor_extra_state
    validation_test: test\unit\atmosphere\test_stochastic_rainfall.py
jump_reset_map:
  rainfall_arrival:
    reset_map:
    - - 1.0
    conservation_matrix:
    - - 1.0
    ledger_behavior: open
    open_system_route: port
    open_ledger_change:
    - - 1.0
    open_ledger_units: '1'
    propensity_keys:
    - stochastic.weather.rainfall.event_rate
    state_vars:
    - stochastic_rainfall_event_count
    - stochastic_rainfall_depth
    mark_space: exponential depth mark z >= 0 [mm] with mean stochastic.weather.rainfall.mean_depth
    event_clock: direct_ssa_fixed_step
stochastic_reproducibility_map:
  random_seed: 7
  noise_type: marked_poisson
  solver_method: direct_ssa
  uses_ensemble: false
  jump_propensities:
  - stochastic.weather.rainfall.event_rate
  checkpoint_owner: relic.core.simulator.checkpoint
  rng_state_owner: relic.core.simulator.checkpoint
  rng_substream: stochastic_rainfall
  restart_policy: restore_and_replay
  time_step_mode: fixed
equivalence_type: exact
