  transport.numerical.cfl_diffusion_max: {source: ParameterManager YAML}
composition_management_map:
  functor_metadata: existing FunctorMetadata declares interfaces, execution phase, and conservation semantics
  state_contract: existing simulator state update path is preserved
  physical_constant_ssot: gravity, reference temperature, von Karman constant, air specific heat, and the psychrometric Tetens constants resolve only through get_physical_constant; the monin-obukhov air density is compute_moist_air_density(T, p, RH*e_s(T)), never a fixed STP value
  validation_rule: phase8 scientific inventory and equivalence certificate checks
dependency_interconnection_map:
  dependencies: optional same-step producer atmospheric_turbulence (sensible_heat_flux); without it the monin-obukhov scheme needs sensible_heat_flux as forcing; atmospheric_pressure and relative_humidity are forcing inputs of the monin-obukhov scheme
  direct_functor_calls: none declared by certificate
overflow_routing_map:
  diagnostic_residuals: existing diagnostics and conservation checks route clipping or residual terms
  discarded_residuals: tracer change is emitted through tracer_concentration relative to the caller's cells, the finite-volume ledger residual through diagnostics.conservation_error, outward face exchange through diagnostics.boundary_flux_cochain, and post-bound stability and eddy diffusivity through their diagnostics; no real cell is projected and no clipping or flux-tolerance filter alters the returned increment
conservation_map:
  conserved_quantities: mass
  balance_expression: Delta M - dt*integral(S)dV + dt*sum_f(j_out,f*A_f) = 0 evaluated by the canonical finite-volume operator on the returned increment; unsupported face laws are rejected before any state change
entropy_audit:
  operator_sign: rates, mobilities, or diagnostic maps are non-negative or checked by existing validation hooks where physically required
  sigma_expression: canonical entropy production is non-negative for dissipative subexpressions
equivalence_type: port_equivalent
