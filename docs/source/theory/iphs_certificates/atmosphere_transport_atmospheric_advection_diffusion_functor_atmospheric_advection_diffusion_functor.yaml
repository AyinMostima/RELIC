state_map:
  tracer_concentration: tracer_concentration mapped to canonical Phase 8 cochain basis
  wind_u: wind_u mapped to canonical Phase 8 cochain basis
  wind_v: wind_v mapped to canonical Phase 8 cochain basis
  wind_w: wind_w mapped to canonical Phase 8 cochain basis
  temperature: temperature mapped to canonical Phase 8 cochain basis (monin-obukhov scheme only; no default, a missing value raises)
  sensible_heat_flux: surface upward sensible heat flux H [W m-2] written by atmospheric_turbulence or supplied as forcing, read by the monin-obukhov scheme only; no default
  atmospheric_pressure: atmospheric pressure p [Pa] of the moist-air density rho(T, p, RH*e_s(T)) in the Obukhov length, read by the monin-obukhov scheme only; no default
  relative_humidity: relative humidity RH [1] of the vapour pressure e = RH*e_s(T) in the moist-air density, read by the monin-obukhov scheme only; no default
  source_term: optional volumetric tracer source S [kg m-3 s-1] of the port atmosphere_tracer_source_port; absent means the closed no-source case S = 0, no ParameterManager default
parameter_map:
  atmosphere.grid.dx: Grid spacing in the x direction [m]
  atmosphere.grid.dy: Grid spacing in the y direction [m]
  atmosphere.grid.dz: Grid spacing in the vertical direction [m]
  atmosphere.boundary_layer.boundary_layer_height: Atmospheric boundary layer height [m]
  atmosphere.turbulence.eddy_diffusivity_max: Maximum eddy diffusivity [m2 s-1]
  atmosphere.turbulence.transport_neutral_diffusivity_fraction: Neutral fraction K0 / K_max of the transport eddy-diffusivity closure [dimensionless]
  atmosphere.turbulence.transport_unstable_enhancement_coefficient: Coefficient a of K = K0 (1 + a s / (1 + s)) for unstable stratification [dimensionless]
  atmosphere.turbulence.transport_stable_suppression_coefficient: Coefficient b of K = K0 / (1 + b s) for stable stratification [dimensionless]
  atmosphere.turbulence.transport_stability_limit: Symmetric bound of the stability index of the transport closure [dimensionless]
  atmosphere.turbulence.minimum_friction_velocity: Minimum friction velocity [m s-1]
  atmosphere.stability.potential_temperature_gradient: Potential-temperature gradient [K m-1]
  atmosphere.molecular_diffusion.molecular_diffusivity: Molecular diffusivity of the scalar in air [m2 s-1]
  transport.numerical.cfl_advection_max: Largest accepted advective Courant number [dimensionless]
  transport.numerical.cfl_diffusion_max: Largest accepted diffusion number (von Neumann) [dimensionless]
physical_constant_ssot:
  gravity_acceleration: get_physical_constant("gravity_acceleration")
  reference_temperature: get_physical_constant("reference_temperature")
  von_karman_constant: get_physical_constant("von_karman_constant")
  air_specific_heat_cp: get_physical_constant("air_specific_heat_cp")
  psychrometric_tetens_constants: get_physical_constant("relic.physical.constants.psychrometrics.tetens_base_pressure", "tetens_coefficient_a", "tetens_coefficient_b") and get_physical_constant("celsius_to_kelvin") for e_s of the moist-air density
operator_map:
  D_h: declared atmospheric tracer divergence map
  star_K: ParameterManager-backed molecular plus eddy diffusivity Hodge map
  q_h: declared advective plus diffusive tracer flux cochain
  G_h: boundary and source port map
unit_map:
  tracer_concentration: kg m-3
  diagnostics.atmospheric_advection_diffusion.cfl_number: dimensionless
  diagnostics.stability_number: dimensionless
  diagnostics.advection_rate: kg m-3 s-1
  diagnostics.diffusion_rate: kg m-3 s-1
  diagnostics.eddy_diffusivity: m2 s-1
  diagnostics.stability_parameter: dimensionless
  diagnostics.conservation_error: dimensionless
  diagnostics.boundary_flux_cochain: kg m-2 s-1
  atmospheric_pressure: Pa
  relative_humidity: '1'
  source_term: kg m-3 s-1
input_output_map:
  atmospheric_pressure: moist-air density input of the monin-obukhov Obukhov length; replaces the fixed STP air density
  diagnostics.advection_rate: same interface variable preserved between legacy and IPHS runtime contracts
  diagnostics.atmospheric_advection_diffusion.cfl_number: cell-centred Courant sum max(dt * sum_k |u_k| / dx_k) of the pre-step limit check, renamed from diagnostics.cfl_number, which is the finite-volume outward-face Courant sum of the generic transport Functors
  diagnostics.conservation_error: same interface variable preserved between legacy and IPHS runtime contracts
  diagnostics.boundary_flux_cochain: optional packed outward face flux ledger returned by the canonical operator when exterior faces exist
  diagnostics.diffusion_rate: same interface variable preserved between legacy and IPHS runtime contracts
  diagnostics.eddy_diffusivity: same interface variable preserved between legacy and IPHS runtime contracts
  diagnostics.stability_number: same interface variable preserved between legacy and IPHS runtime contracts
  diagnostics.stability_parameter: same interface variable preserved between legacy and IPHS runtime contracts
  relative_humidity: vapour pressure input e = RH*e_s(T) of the moist-air density of the monin-obukhov scheme
  sensible_heat_flux: canonical surface upward sensible heat flux of atmospheric_turbulence; replaces the removed reader-side name surface_heat_flux and its 20 W m-2 state default
  source_term: optional volumetric source port input, declared; replaces the removed background tendency atmosphere.transport.source_term_default
  temperature: same interface variable preserved between legacy and IPHS runtime contracts
  tracer_concentration: same interface variable preserved between legacy and IPHS runtime contracts
  wind_u: same interface variable preserved between legacy and IPHS runtime contracts
  wind_v: same interface variable preserved between legacy and IPHS runtime contracts
