certificate_version: '1.0'
process_id: relic.scientific.atmosphere.transport.dry_deposition_aggregator.DryDepositionAggregator
module_name: DryDepositionAggregator
canonical_role: transport
iphs_level: 3
iphs_level_evidence:
  classification: IPHS-structured transport process certificate
  compatible_basis: Process declares DEC cochains, a positive dry-deposition Hodge mobility, and an open surface export port
  runtime_replacement: Production forward path uses the existing canonical wrapper or declaration contract; strict runtime replacement is not claimed at this certificate level.
  canonical_operator: x_dot = -D_h q_h + G_h u_h with q_h = star_dep C_h
  structural_contribution: Cochain, Hodge, flux, and port structures are declared for assembly audit
  assembly_participation: Certificate participates in Phase 8 inventory and GraphIR structural audit
  level_3_limit: Typed form, Hodge, port, or related structure is declared, but no runtime-linked IPHSStructureSpec contribution and executable level 4 or 5 certificate binding is present.
theory_document: docs\source\theory\atmosphere_dry_deposition_aggregator.md
theory_document_status: updated
legacy_formula: r_eff,s = r_b,s + r_c,s; v_d,s = 1 / (r_a + r_eff,s); Delta C_s = max(-C_s, -v_d,s C_s Delta t / h_pbl)
literature_formula: r_eff,s = r_b,s + r_c,s; v_d,s = 1 / (r_a + r_eff,s); Delta C_s = max(-C_s, -v_d,s C_s Delta t / h_pbl)
iphs_formula: x_dot = -D_h q_h + G_h u_h, q_h = star_dep C_h, y_h = G_h^T e_h
legacy_expression: r_eff,s = r_b,s + r_c,s; v_d,s = 1 / (r_a + r_eff,s); Delta C_s = max(-C_s, -v_d,s C_s Delta t / h_pbl)
iphs_expression: x_dot = -D_h q_h + G_h u_h, q_h = star_dep C_h, y_h = G_h^T e_h
