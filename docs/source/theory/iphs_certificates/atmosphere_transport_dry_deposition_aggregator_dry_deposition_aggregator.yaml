state_map:
  no_mixing_ratio: atmospheric NO state read as a mixing ratio and written as a timestep-integrated sink increment [mol mol-1]
  no2_mixing_ratio: atmospheric NO2 state read as a mixing ratio and written as a timestep-integrated sink increment [mol mol-1]
  o3_mixing_ratio: atmospheric O3 state read as a mixing ratio and written as a timestep-integrated sink increment [mol mol-1]
  so2_mixing_ratio: atmospheric SO2 state read as a mixing ratio and written as a timestep-integrated sink increment [mol mol-1]
  pbl_height: pbl_height mapped to canonical Phase 8 cochain basis
  aerodynamic_resistance: aerodynamic resistance supplied by atmospheric_turbulence, or by external forcing under surface_layer_source = external_forcing [s m-1]
  diagnostics.dry_deposition.total_mixing_ratio_increment: sum of species increments for monitoring [mol mol-1]
  diagnostics.dry_deposition.total_limiter_residual: summed difference between unconstrained and submitted increments [mol mol-1]
  diagnostics.dry_deposition.normalized_mass_balance_residual: per-species submitted increment minus unconstrained increment and limiter residual [mol mol-1]
  diagnostics.dry_deposition.enabled: explicit activation flag [1]
parameter_map:
  atmosphere.dry_deposition.enabled: Activation switch of the dry deposition aggregator [dimensionless]
  atmosphere.dry_deposition.species_list: Ordered canonical deposited species [dimensionless]
  atmosphere.dry_deposition.species.no.effective_non_aerodynamic_resistance: Effective resistance r_b + r_c of NO [s m-1]
  atmosphere.dry_deposition.species.no2.effective_non_aerodynamic_resistance: Effective resistance r_b + r_c of NO2 [s m-1]
  atmosphere.dry_deposition.species.o3.effective_non_aerodynamic_resistance: Effective resistance r_b + r_c of O3 [s m-1]
  atmosphere.dry_deposition.species.so2.effective_non_aerodynamic_resistance: Effective resistance r_b + r_c of SO2 [s m-1]
  atmosphere.dry_deposition.reference_height: Reference height of the deposition velocity [m]
  atmosphere.dry_deposition.structural_reference_deposition_velocity: Reference deposition velocity of the static Hodge contract [m s-1]
operator_map:
  D_h: existing divergence/transport operator
  q_h: declared flux cochain
  G_h: boundary/source port map
unit_map:
  no_mixing_ratio: mol mol-1
  no2_mixing_ratio: mol mol-1
  o3_mixing_ratio: mol mol-1
  so2_mixing_ratio: mol mol-1
  pbl_height: m
  aerodynamic_resistance: s m-1
  diagnostics.dry_deposition.total_mixing_ratio_increment: mol mol-1
  diagnostics.dry_deposition.total_limiter_residual: mol mol-1
  diagnostics.dry_deposition.normalized_mass_balance_residual: mol mol-1
  diagnostics.dry_deposition.enabled: '1'
input_output_map:
  no_mixing_ratio: input atmospheric state receives the explicit timestep-integrated dry-deposition sink increment
  no2_mixing_ratio: input atmospheric state receives the explicit timestep-integrated dry-deposition sink increment
  o3_mixing_ratio: input atmospheric state receives the explicit timestep-integrated dry-deposition sink increment
  so2_mixing_ratio: input atmospheric state receives the explicit timestep-integrated dry-deposition sink increment
  diagnostics.dry_deposition.total_mixing_ratio_increment: numeric sum of submitted species increments
  diagnostics.dry_deposition.total_limiter_residual: explicit route for the increment removed by numerical rate and availability limits
  diagnostics.dry_deposition.normalized_mass_balance_residual: per-species normalized open-boundary residual checked without cancellation across species
  diagnostics.dry_deposition.enabled: explicit activation diagnostic with no disabled-state writer
  pbl_height: same interface variable preserved between legacy and IPHS runtime contracts
  aerodynamic_resistance: same interface variable preserved between runtime and structural contracts
