    source: ParameterManager YAML
composition_management_map:
  functor_metadata: existing FunctorMetadata declares interfaces, execution phase, and conservation semantics
  state_contract: existing simulator state update path is preserved
  validation_rule: phase8 scientific inventory and equivalence certificate checks
dependency_interconnection_map:
  dependencies: atmospheric_turbulence by default; none under surface_layer_source = external_forcing, where aerodynamic_resistance is State:ExternalForcing and the law is unchanged
  direct_functor_calls: none declared by certificate
overflow_routing_map:
  diagnostic_residuals: diagnostics.dry_deposition.total_limiter_residual explicitly reports the difference between unconstrained and submitted increments
  normalized_balance: diagnostics.dry_deposition.normalized_mass_balance_residual reports the per-species submitted-minus-potential-minus-limiter identity
  discarded_residuals: none; disabled runtime returns no state writer, enabled=0, and an explicit zero balance residual
conservation_map:
  conserved_quantities: per-species normalized molar burden under well-mixed PBL and constant air molar density assumptions
  balance_expression: P_s = v_d,s C_s Delta t / h_pbl; E_s = min(P_s,C_s); L_s = P_s-E_s; Delta C_s = -E_s; R_s = Delta C_s + P_s - L_s = 0
  local_check: process-specific hook returns max(abs(R_s)) without cancellation across species; total_limiter_residual is not treated as a violation
  open_system_route: boundary_export; no physical surface molar or mass flux is claimed without air molar density
entropy_audit:
  operator_sign: rates, mobilities, or diagnostic maps are non-negative or checked by existing validation hooks where physically required
  sigma_expression: canonical entropy production is non-negative for dissipative subexpressions
  validation_hook: process-specific normalized per-species mass-balance residual plus existing Hodge and dissipative-structure checks
equivalence_type: port_equivalent
