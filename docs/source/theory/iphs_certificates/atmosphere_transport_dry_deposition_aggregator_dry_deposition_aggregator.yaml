  - diagnostics.dry_deposition.total_limiter_residual
  - diagnostics.dry_deposition.normalized_mass_balance_residual
  - diagnostics.dry_deposition.enabled
  iphs_outputs:
  - no_mixing_ratio
  - no2_mixing_ratio
  - o3_mixing_ratio
  - so2_mixing_ratio
  - diagnostics.dry_deposition.total_mixing_ratio_increment
