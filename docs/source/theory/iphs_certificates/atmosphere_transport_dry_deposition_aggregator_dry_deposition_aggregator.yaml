runtime_replacement_map:
  runtime_uses_iphs: false
  legacy_removed: false
  replacement_entrypoint: forward
  preserved_numerics: Existing ParameterManager-backed calculations define canonical IPHS operator coefficients, rates, ports, or observations.
  no_legacy_mode: true
state_advancement_map:
  potential_basis: declared RELIC state, port, or observation cochain basis
  effort_variable: ParameterManager-backed thermodynamic effort, driver, or diagnostic input used by the module
  state_advancer: Delta C_s = max(-C_s, -C_s Delta t / ((r_a + r_eff,s) h_pbl)) with explicit boundary_export routing
  runtime_usage: DryDepositionAggregator.forward evaluates one normalized mixing-ratio sink and returns timestep-integrated UpdateItems; no strict surface mass-flux proof is claimed.
parameter_management_map:
  atmosphere.dry_deposition.enabled:
    source: ParameterManager YAML
  atmosphere.dry_deposition.species_list:
    source: ParameterManager YAML
  atmosphere.dry_deposition.species.no.effective_non_aerodynamic_resistance:
    source: ParameterManager YAML
  atmosphere.dry_deposition.species.no2.effective_non_aerodynamic_resistance:
    source: ParameterManager YAML
