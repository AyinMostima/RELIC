runtime_replacement_map:
  runtime_uses_iphs: false
  legacy_removed: false
  replacement_entrypoint: forward
  preserved_numerics: ParameterManager-backed MOST diffusivity, explicit stability saturation residual, and species top-boundary forcings define the single reduced K-theory closure.
  no_legacy_mode: true
state_advancement_map:
  potential_basis: declared RELIC state, port, or observation cochain basis
  effort_variable: ParameterManager-backed thermodynamic effort, driver, or diagnostic input used by the module
  state_advancer: x_dot = -D_h q_h + G_h u_h with declared vertical turbulent flux q_h and boundary exchange port
  runtime_usage: EddyDiffusionBLMFunctor.forward evaluates only zeta_eff=clip(zeta_raw,-min(l_p,l_u),min(l_p,l_s)) and DeltaC=dt*K/h^2*(C_background-C); no selectable diagnostic, dilution-only, fallback, or second process law remains.
