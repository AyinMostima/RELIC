certificate_version: '1.0'
process_id: relic.scientific.atmosphere.transport.eddy_diffusion_blm.EddyDiffusionBLMFunctor
module_name: EddyDiffusionBLMFunctor
canonical_role: transport
iphs_level: 3
iphs_level_evidence:
  classification: IPHS-structured transport process certificate
  compatible_basis: Process declares DEC concentration, gradient, and flux cochains plus a positive eddy-diffusivity Hodge mobility
  runtime_replacement: Production forward path uses the existing canonical wrapper or declaration contract; strict runtime replacement is not claimed at this certificate level.
  canonical_operator: x_dot = -D_h q_h + G_h u_h with q_h = -star_K D_h^T e_h
  structural_contribution: Cochain, Hodge, flux, and port structures are declared for assembly audit
  assembly_participation: Certificate participates in Phase 8 inventory and GraphIR structural audit
  level_3_limit: Typed form, Hodge, port, or related structure is declared, but no runtime-linked IPHSStructureSpec contribution and executable level 4 or 5 certificate binding is present.
theory_document: docs\source\theory\atmosphere_eddy_diffusion_blm.md
theory_document_status: updated
legacy_formula: $\frac{\partial C}{\partial t} = \frac{\partial}{\partial z}\left[K(z,L) \frac{\partial C}{\partial z}\right] - \frac{C}{h} + S$\nwhere $K = \frac{\kappa u_* z}{\phi_h(z/L)}$ with MOST stability corrections
literature_formula: $q=-K\,\partial C/\partial z$ with reduced one-box closure $\dot C=K h^{-2}(C_{bg}-C)$, $\zeta_{eff}=clip(\zeta_{raw},-\min(l_p,l_u),\min(l_p,l_s))$, and $K=\kappa u_* (h/2)/\phi_h(\zeta_{eff})$
iphs_formula: x_dot = -D_h q_h + G_h u_h, q_h = -star_K D_h^T e_h, y_h = G_h^T e_h
legacy_expression: $\frac{\partial C}{\partial t} = \frac{\partial}{\partial z}\left[K(z,L) \frac{\partial C}{\partial z}\right] - \frac{C}{h} + S$\nwhere $K = \frac{\kappa u_* z}{\phi_h(z/L)}$ with MOST stability corrections
iphs_expression: x_dot = -D_h q_h + G_h u_h, q_h = -star_K D_h^T e_h, y_h = G_h^T e_h
