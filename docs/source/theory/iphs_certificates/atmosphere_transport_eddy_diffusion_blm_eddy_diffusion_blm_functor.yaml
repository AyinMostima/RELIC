composition_management_map:
  functor_metadata: existing FunctorMetadata declares interfaces, execution phase, and conservation semantics
  state_contract: existing simulator state update path is preserved
  validation_rule: phase8 scientific inventory and equivalence certificate checks
dependency_interconnection_map:
  dependencies: atmospheric_turbulence provides friction_velocity and monin_obukhov_length through canonical state ports by default; under surface_layer_source = external_forcing no provider is declared, both arrive as State:ExternalForcing, and the closure is unchanged
  direct_functor_calls: none declared by certificate
overflow_routing_map:
  diagnostic_residuals: diagnostics.eddy_diffusion.stability_parameter_clipping_residual records zeta_raw minus zeta_eff for the declared saturated reduced-box closure
  discarded_residuals: none; stability-parameter saturation and eddy-diffusivity clipping are both exposed as namespaced diagnostics
conservation_map:
  conserved_quantities: species mixing ratio with declared top-boundary exchange
  balance_expression: DeltaC_s = dt*K/h^2*(C_background_s-C_s), entirely routed through boundary_layer_exchange_port
entropy_audit:
  operator_sign: rates, mobilities, or diagnostic maps are non-negative or checked by existing validation hooks where physically required
  sigma_expression: canonical entropy production is non-negative for dissipative subexpressions
equivalence_type: port_equivalent
