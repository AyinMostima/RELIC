composition_management_map:
  functor_metadata: existing FunctorMetadata declares interfaces, execution phase, and conservation semantics
  state_contract: existing simulator state update path is preserved
  physical_constant_ssot: von Karman constant, the Boussinesq reference density relic.physical.constants.air.density_reference of the structural Hodge mobility only, the psychrometric Tetens constants and celsius_to_kelvin, air specific heat, and gravity are resolved only through get_physical_constant; the runtime air density is compute_moist_air_density(air_temperature, atmospheric_pressure, relative_humidity*e_s(air_temperature))
  validation_rule: phase8 scientific inventory and equivalence certificate checks
dependency_interconnection_map:
  dependencies: declared through existing metadata or no external dependency
  direct_functor_calls: none declared by certificate
overflow_routing_map:
  diagnostic_residuals: the runtime momentum_boundary checker audits tau = rho_air * u_star^2 with the moist-air density of the input state without creating a duplicate diagnostic output
  discarded_residuals: sensible_heat_flux and momentum_flux are explicit surface-boundary ports; tau equals rho_air times u_star squared is audited by check_conservation_laws, and invalid inputs are rejected before calculation
conservation_map:
  conserved_quantities: open surface momentum exchange port with a constitutive runtime audit; sensible heat remains an explicit boundary output and no closed local storage claim is made
  balance_expression: momentum_boundary audits momentum_flux = rho_air(air_temperature, atmospheric_pressure, relative_humidity) * friction_velocity^2; the sensible-heat reservoir balance remains assigned to coupled surface-energy ledgers
entropy_audit:
  operator_sign: rates, mobilities, or diagnostic maps are non-negative or checked by existing validation hooks where physically required
  sigma_expression: canonical entropy production is non-negative for dissipative subexpressions
equivalence_type: port_equivalent
