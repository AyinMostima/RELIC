certificate_version: '1.0'
process_id: relic.scientific.atmosphere.turbulence.TurbulenceFunctor
module_name: TurbulenceFunctor
canonical_role: transport
iphs_level: 3
iphs_level_evidence:
  classification: IPHS-structured transport process certificate
  compatible_basis: Process declares DEC wind-speed, momentum-gradient, and momentum-flux cochains plus a positive turbulent mobility
  runtime_replacement: Production forward path uses the existing canonical wrapper or declaration contract; strict runtime replacement is not claimed at this certificate level.
  canonical_operator: x_dot = -D_h q_h + G_h u_h with q_h = -star_tau D_h^T e_h
  structural_contribution: Cochain, Hodge, flux, and port structures are declared for assembly audit
  assembly_participation: Certificate participates in Phase 8 inventory and GraphIR structural audit
  level_3_limit: Typed form, Hodge, port, or related structure is declared, but no runtime-linked IPHSStructureSpec contribution and executable level 4 or 5 certificate binding is present.
theory_document: docs\source\theory\turbulence.md
theory_document_status: updated
legacy_formula: u* = k*U/[ln((z-d)/z0m) - psim(z/L)]; L = -u*^3*rho*T/(k*g*H); psim_stable = -5*z/L; psim_unstable = 2*ln((1+x)/2) + ln((1+x^2)/2) - 2*atan(x) + pi/2; x = (1-16*z/L)^(1/4); ra = [ln((z-d)/z0m) - psim]*[ln((z-d)/z0h) - psih]/(k^2*u*)
literature_formula: fm = ln((z-d)/z0m) - psim((z-d)/L) + psim(z0m/L); fh = ln((z-d)/z0h) - psih((z-d)/L) + psih(z0h/L); u* = k*U/fm; theta* = k*(Ts-Ta)/fh; H = rho*cp*u*theta*; L = -rho*cp*T*u*^3/(k*g*H); rah = fh/(k*u*); tau = rho*u*^2; rho = (p - (1-eps)*RH*e_s(Ta))/(R_d*Ta)
iphs_formula: x_dot = -D_h q_h + G_h u_h, q_h = -star_tau D_h^T e_h, y_h = G_h^T e_h
legacy_expression: u* = k*U/[ln((z-d)/z0m) - psim(z/L)]; L = -u*^3*rho*T/(k*g*H); psim_stable = -5*z/L; psim_unstable = 2*ln((1+x)/2) + ln((1+x^2)/2) - 2*atan(x) + pi/2; x = (1-16*z/L)^(1/4); ra = [ln((z-d)/z0m) - psim]*[ln((z-d)/z0h) - psih]/(k^2*u*)
iphs_expression: x_dot = -D_h q_h + G_h u_h, q_h = -star_tau D_h^T e_h, y_h = G_h^T e_h
