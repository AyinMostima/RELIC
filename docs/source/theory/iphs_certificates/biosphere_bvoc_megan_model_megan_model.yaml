runtime_replacement_map:
  runtime_uses_iphs: false
  legacy_removed: false
  replacement_entrypoint: forward
  preserved_numerics: RELIC's reduced instantaneous MEGAN-family response numerics are preserved while public mass rates are converted to canonical molar species ports; this is not numerical equivalence to the complete MEGAN2.1 canopy model.
  scientific_scope: Operational evidence covers only the reduced dry-leaf-mass closure rho_f = LAI * k_f. Full PFT-specific LMA/SLW transforms, ground-area emission-factor construction, 24/240-hour histories, canopy integration, complete leaf-age and soil-moisture factors, and a canopy/history-consistent CO2 response remain [N]. RELIC carries no 24 h or 240 h leaf-temperature history, so T_opt = 313 + 0.6 (T240 - T_s) and E_opt = C_eo exp(0.05 (T24 - T_s)) exp(0.05 (T240 - T_s)) (Guenther et al. 2012 Eqs. 9-10) are fixed at the standard history T24 = T240 = T_s = 297 K, so E_opt = C_eo of the Table 4 row and T_opt = 313 K.
  lumped_ovoc_mixture: The lumped OVOC class is methanol, acetone and acetaldehyde (Guenther et al. 2012 Table 1 places acetaldehyde in the bidirectional VOC class). Each activity factor is the emission-weighted mixture gamma_X = sum_j w_j gamma_X,j of the component factors, with w_j the Table 6 global emission shares (99.6, 43.7 and 20.7 Tg yr-1) and every coefficient of component j from its own Table 4 row (Methanol, Acetone, Bidirectional VOC); no lumped beta, LDF, C_T1 or C_eo exists. E_OVOC multiplies the mixed light and temperature factors instead of mixing the component products sum_j w_j gamma_P,j gamma_T,j; the neglected covariance term changes E_OVOC in darkness by +12.7% at 0 degC, +5.0% at 20 degC and -10.3% at 40 degC, and over 0 to 40 degC by at most 0.65% for PPFD >= 500 and at most 0.2% for PPFD 750-2000 umol m-2 s-1 (0.22% at 2500).
  identifiability_limit: Flux-only observations constrain emission_potential * foliar_density_factor; these parameters are not separately identifiable without independent leaf-mass evidence.
  no_legacy_mode: No selectable compatibility runtime branch is exposed; this fact does not constitute strict Phase 8 completion.
state_advancement_map:
  potential_basis: reduced dry-leaf-mass emission potentials mapped by rho_f = LAI * k_f to open atmospheric molar species ports plus a separate carbon-mass boundary port
  effort_variable: no independently validated thermodynamic effort is claimed at level 2
  state_advancer: x_dot = N_h r_h with explicit molar species and carbon-mass maps
  runtime_usage: MEGANModel.forward calls advance_reaction_network twice with dimension-consistent stoichiometric_N and rates before emitting canonical outputs.
  explicit_stoichiometric_usage: One N_h maps enabled molar species to their molar total; a separate N_h maps the g C boundary export.
