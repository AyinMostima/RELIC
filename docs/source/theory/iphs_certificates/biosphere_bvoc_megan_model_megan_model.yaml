certificate_version: '1.0'
process_id: relic.scientific.biosphere.bvoc.megan_model.MEGANModel
module_name: MEGANModel
canonical_role: reaction
iphs_level: 2
iphs_level_evidence:
  classification: IPHS-wrapped reaction process certificate
  compatible_basis: The RELIC reduced instantaneous dry-leaf-mass closure is expressed through open stoichiometric ledgers; equivalence to the complete MEGAN2.1 canopy algorithm is not claimed.
  runtime_replacement: Production forward path uses the existing canonical wrapper or declaration contract; strict runtime replacement is not claimed at this certificate level.
  canonical_operator: N_h r_h reaction-network state advance
  level_2_limit: The canonical runtime wrapper is declared, but no executable typed-cochain or IPHS structural contribution is bound; strict level 4 or 5 evidence is not claimed.
theory_document: docs\source\theory\bvoc_emissions.md
theory_document_status: updated
legacy_formula: E_i = epsilon_i gamma_T,i gamma_P,i rho_f / seconds_per_hour
literature_formula: gamma_T,i = (1 - LDF_i) exp(beta_i (T - T_s)) + LDF_i E_opt,i C_T2 exp(C_T1,i x) / (C_T2 - C_T1,i (1 - exp(C_T2 x))), x = (1/T_opt - 1/T)/R (Guenther et al. 2012 Eq. 7 with Eqs. 8 and 11; beta_i, LDF_i, C_T1,i and C_eo,i from one Table 4 row per class; LDF = 1 for isoprene; the lumped OVOC class takes sum_j w_j gamma_T,j over its methanol, acetone and acetaldehyde rows with the Table 6 emission shares w_j); gamma_P,i = (1 - LDF_i) + LDF_i gamma_P_LDF with gamma_P_LDF = alpha CL PPFD / sqrt(1 + alpha^2 PPFD^2), LDF = 1 for isoprene, the Table 4 LDF for monoterpenes (representative Other Monoterpenes value) and sesquiterpenes, and the Table 6 emission-weighted mixture sum_j w_j gamma_P,j of the methanol, acetone and bidirectional VOC (acetaldehyde) rows for the lumped OVOC class; gamma_CO2 = ISmax - ISmax Ci^h / ((Cstar)^h + Ci^h)
iphs_formula: x_dot = N_h r_h with separate molar species and carbon-mass open-port maps
legacy_expression: E_i = epsilon_i gamma_T,i gamma_P,i rho_f / seconds_per_hour
iphs_expression: x_dot = N_h r_h; A_available = max(A_n, A_min); R_floor = A_available - A_n; F_i = E_i k_ug_to_g / MW_i; F_C = convert(sum_i(F_i MW_i f_C,i), g C m-2 s-1, kg C m-2 s-1)
