composition_management_map:
  functor_metadata: existing FunctorMetadata declares interfaces, execution phase, and conservation semantics
  state_contract: all retained outputs use explicit UpdateItem(REPLACE, per_timestep=false)
  validation_rule: phase8 scientific inventory and equivalence certificate checks
dependency_interconnection_map:
  dependencies: atmospheric_radiation is required for PPFD; farquhar_photosynthesis is additionally required for photosynthesis or hybrid pathways; stress dependencies are conditional and explicit
  direct_functor_calls: none; radiation, photosynthesis, and optional stress dependencies are scheduler and StateManager ports and no upstream Functor instance is invoked
overflow_routing_map:
  diagnostic_residuals: diagnostics.bvoc.megan.photosynthesis_carbon_floor_residual retains A_available minus A_n for photosynthesis and hybrid pathways
  discarded_residuals: none; the carbon floor is evaluated once per forward call, its complete residual is emitted, and standard-pathway execution does not claim the diagnostic
conservation_map:
  conserved_quantities:
  - carbon_boundary
  open_system_route: port
  balance_expression: R_C = F_C,alloc - convert(sum over enabled i of F_i MW_i f_C,i, g C m-2 s-1 to kg C m-2 s-1); carbon_boundary = ||R_C||_inf. The reduced closure remains open and does not resolve stored versus current photosynthate sources.
  local_check: check_conservation_laws iterates only the instance enabled_compounds, requires finite matching molar species and allocation tensors, reuses the existing UnitConverter plus ParameterManager-backed molecular weights and carbon fractions, and reports the infinity norm of the mapping residual.
entropy_audit:
  operator_sign: empirical nonnegative open-port rates are domain checked; no dissipative operator is claimed
  sigma_expression: no independently validated entropy-production functional is claimed at level 2
equivalence_type: thermodynamic_embedding
