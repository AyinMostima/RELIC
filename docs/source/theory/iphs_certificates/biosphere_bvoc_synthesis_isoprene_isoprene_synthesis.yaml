parameter_map:
  biosphere.bvoc.mep.v_max_dxs: Maximum velocity of DXS enzyme [umol m-2 s-1]
  biosphere.bvoc.mep.k_g3p: Michaelis constant for G3P substrate [umol m-3]
  biosphere.bvoc.mep.k_pyruvate: Michaelis constant for pyruvate substrate [umol m-3]
  biosphere.bvoc.mep.q10_dxs: Temperature sensitivity factor for DXS enzyme [dimensionless]
  biosphere.bvoc.mep.atp_per_dmapp: ATP molecules required per DMAPP produced [dimensionless]
  biosphere.bvoc.mep.nadph_per_dmapp: NADPH molecules required per DMAPP produced [dimensionless]
  biosphere.bvoc.isoprene_synthase.v_max: Maximum velocity of isoprene synthase [umol m-2 s-1]
  biosphere.bvoc.isoprene_synthase.k_dmapp: Michaelis constant for DMAPP substrate [umol m-3]
  biosphere.bvoc.isoprene_synthase.k_co2_inhibition: Ambient CO2 inhibition proxy constant [umol mol-1]
  biosphere.bvoc.isoprene_synthase.q10: Temperature sensitivity factor for isoprene synthase [dimensionless]
  biosphere.bvoc.isoprene_synthase.enable_co2_inhibition: Flag enabling CO2 inhibition feedback [dimensionless]
  relic.physical.constants.molecular_weights.isoprene: Molecular weight of isoprene [g mol-1]
  biosphere.bvoc.carbon_fraction.isoprene: Carbon mass fraction for isoprene (C5H8) used in conservation diagnostics [dimensionless]
  biosphere.bvoc.isoprene_synthase.f_g3p: Fraction of photosynthetic G3P allocated to isoprene synthesis [dimensionless]
  biosphere.bvoc.isoprene_synthase.f_pyruvate: Fraction of photosynthetic pyruvate allocated to isoprene synthesis [dimensionless]
  biosphere.bvoc.isoprene_synthase.g3p_flux_to_concentration: Scaling factor converting G3P flux to concentration [s m-1]
  biosphere.bvoc.isoprene_synthase.pyruvate_flux_to_concentration: Scaling factor converting pyruvate flux to concentration [s m-1]
  biosphere.bvoc.isoprene_synthase.dmapp_flux_to_concentration: Scaling factor converting DMAPP flux to concentration [s m-1]
  biosphere.bvoc.isoprene_synthase.atp_per_electron_transport: ATP produced per unit electron transport flux [dimensionless]
  biosphere.bvoc.isoprene_synthase.nadph_per_electron_transport: NADPH produced per unit electron transport flux [dimensionless]
  relic.physical.constants.temperature.reference_temperature: Q10 reference temperature (25 degC) from the physical-constant SSOT [K]
  validation.numerical.coupling_max: Upper bound of the MEP energy-limitation factor [dimensionless]
  biosphere.photosynthesis.canopy_light_extinction: Beer-Lambert extinction coefficient shared with canopy photosynthesis [dimensionless]
  validation.numerical.epsilon: Denominator floor of the DXS kinetics [dimensionless]
  validation.numerical.epsilon_energy: Denominator floor of the ATP and NADPH demand ratios [dimensionless]
  isoprene_mw: relic.physical.constants.molecular_weights.isoprene via get_physical_constant
