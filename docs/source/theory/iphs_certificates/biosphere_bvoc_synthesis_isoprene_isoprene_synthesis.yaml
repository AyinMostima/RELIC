certificate_version: '1.0'
process_id: relic.scientific.biosphere.bvoc.synthesis.isoprene.IsopreneSynthesis
module_name: IsopreneSynthesis
canonical_role: reaction
iphs_level: 2
iphs_level_evidence:
  classification: IPHS-wrapped reaction process certificate
  compatible_basis: Reaction process is expressed through conserved or open stoichiometric ledgers
  runtime_replacement: Production forward path uses the existing canonical wrapper or declaration contract; strict runtime replacement is not claimed at this certificate level.
  canonical_operator: N_h r_h reaction-network state advance
  level_2_limit: The canonical runtime wrapper is declared, but no executable typed-cochain or IPHS structural contribution is bound; strict level 4 or 5 evidence is not claimed.
theory_document: docs\source\theory\bvoc_emissions.md
theory_document_status: updated
legacy_formula: "MEP Pathway: G3P + Pyruvate --DXS--> DXP --DXR--> MEP ---> DMAPP\n            Isoprene Synthesis: DMAPP --IS--> Isoprene\n            J_DXS = V_max_DXS * [G3P]*[Pyr] / ((K_G3P + [G3P]) * (K_Pyr + [Pyr]))\n            J_IS(T_air) = V_max_IS(T_air) * [DMAPP] / (K_DMAPP + [DMAPP]) * K_CO2/(K_CO2 + C_a)\n            A_ATP = J_DMAPP * nu_ATP; A_NADPH = J_DMAPP * nu_NADPH\n            T_air and C_a are explicit grid-cell proxies because no unique leaf-temperature or intercellular-CO2 state owner exists."
literature_formula: "MEP Pathway: G3P + Pyruvate --DXS--> DXP --DXR--> MEP ---> DMAPP\n            Isoprene Synthesis: DMAPP --IS--> Isoprene\n            J_DXS = V_max_DXS * [G3P]*[Pyr] / ((K_G3P + [G3P]) * (K_Pyr + [Pyr]))\n            J_IS(T_air) = V_max_IS(T_air) * [DMAPP] / (K_DMAPP + [DMAPP]) * K_CO2/(K_CO2 + C_a)\n            A_ATP = J_DMAPP * nu_ATP; A_NADPH = J_DMAPP * nu_NADPH\n            The exact proxy and kinetic closure is ParameterManager-backed and is not claimed as a universal leaf-scale law."
iphs_formula: x_dot = N_h r_h with ParameterManager-backed process rates r_h and declared stoichiometric/output map N_h
legacy_expression: "J_DXS = V_max_DXS [G3P][Pyr] / ((K_G3P + [G3P])(K_Pyr + [Pyr])); J_IS = V_max_IS(T_air) [DMAPP] / (K_DMAPP + [DMAPP]) K_CO2/(K_CO2 + C_a); L_eff = (1 - exp(-k LAI)) / k; F_ground = F_leaf L_eff"
iphs_expression: x_dot = N_h r_h with ParameterManager-backed process rates r_h and declared stoichiometric/output map N_h
