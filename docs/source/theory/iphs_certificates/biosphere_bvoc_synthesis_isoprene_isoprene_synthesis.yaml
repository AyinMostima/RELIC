composition_management_map:
  functor_metadata: existing FunctorMetadata declares interfaces, execution phase, and conservation semantics
  state_contract: existing simulator state update path is preserved
  validation_rule: phase8 scientific inventory and equivalence certificate checks
dependency_interconnection_map:
  dependencies:
  - air_temperature
  - gross_photosynthesis
  - electron_transport_rate
  - atmospheric_co2_ppm
  - leaf_area_index
  direct_functor_calls: none declared by certificate
overflow_routing_map:
  diagnostic_residuals: bounded response factors are reported explicitly; allocated carbon is routed through bvoc_carbon_allocation_flux
  discarded_residuals: isoprene carbon leaves through isoprene_emission and the corresponding boundary carbon is exported through bvoc_carbon_allocation_flux; bounded response factors are emitted as diagnostics and the carbon-boundary identity is audited
conservation_map:
  conserved_quantities:
  - carbon_boundary
  balance_expression: r_C = F_C,alloc - convert(F_iso * MW_iso * f_C, g C m-2 s-1, kg C m-2 s-1); carbon_boundary = ||r_C||_inf. The process remains open and no closed local or global carbon-stock balance is claimed.
  local_check: check_conservation_laws requires the canonical isoprene_emission and bvoc_carbon_allocation_flux outputs, validates finite matching tensors, and reports the infinity norm of their stoichiometric mapping residual.
  open_system_route: port
entropy_audit:
  operator_sign: rates, mobilities, or diagnostic maps are non-negative or checked by existing validation hooks where physically required
  sigma_expression: canonical entropy production is non-negative for dissipative subexpressions
equivalence_type: thermodynamic_embedding
