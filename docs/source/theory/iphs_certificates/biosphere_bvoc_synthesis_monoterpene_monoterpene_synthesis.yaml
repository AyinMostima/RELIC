  diagnostics.bvoc.monoterpene.degradation_rate: storage-pool degradation diagnostic
  diagnostics.bvoc.monoterpene.emission_rate_mass: mass-basis emission diagnostic, not an alternative atmosphere port
  diagnostics.bvoc.monoterpene.emission_rate_molar: species-resolved molar diagnostic emitted by the canonical IPHS runtime
  gross_photosynthesis: same interface variable preserved between legacy and IPHS runtime contracts
  monoterpene_pool_concentration: same interface variable preserved between legacy and IPHS runtime contracts
  diagnostics.bvoc.monoterpene.pool_tendency: bounded pool tendency produced by the canonical reaction runtime
  diagnostics.bvoc.monoterpene.pool_delta: exact per-step pool increment diagnostic
  diagnostics.bvoc.monoterpene.pool_boundary_residual_rate: explicit signed routing of the bounded-update residual
  diagnostics.bvoc.monoterpene.storage_change: carbon-mass storage tendency derived from the canonical pool tendency
  diagnostics.bvoc.monoterpene.synthesis_rate: storage-pool synthesis diagnostic
  monoterpenes_emission: same interface variable preserved between legacy and IPHS runtime contracts
  diagnostics.bvoc.monoterpene.pool_capacity_utilization: bounded-pool utilization diagnostic
  diagnostics.bvoc.monoterpene.temperature_emission_factor: temperature-dependent pool release diagnostic normalized at the physical-constant reference temperature
  diagnostics.bvoc.monoterpene.seasonal_factor: seasonal response diagnostic
