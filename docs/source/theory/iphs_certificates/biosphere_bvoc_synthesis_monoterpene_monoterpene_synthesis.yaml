composition_management_map:
  functor_metadata: existing FunctorMetadata declares interfaces, execution phase, and conservation semantics
  state_contract: existing simulator state update path is preserved
  validation_rule: phase8 scientific inventory and equivalence certificate checks
dependency_interconnection_map:
  dependencies: farquhar_photosynthesis provides gross_photosynthesis; StateManager and the external forcing adapter provide the pool and air_temperature proxy
  direct_functor_calls: none declared by certificate
overflow_routing_map:
  diagnostic_residuals: diagnostics.bvoc.monoterpene.pool_boundary_residual_rate closes the local bounded update exactly and its carbon equivalent enters the process-specific carbon_boundary ledger
  discarded_residuals: the pool-boundary correction is exported exactly as diagnostics.bvoc.monoterpene.pool_boundary_residual_rate; bounded pool state, storage change, carbon allocation, degradation, and atmospheric emission are explicit outputs
conservation_map:
  conserved_quantities:
  - carbon_boundary
  balance_expression: R_C = F_C,alloc - F_C,emit - F_C,degradation + F_C,boundary - F_C,storage; carbon_boundary = ||R_C||_inf after the central UnitConverter maps every term to kg C m-2 s-1. The process remains open and no closed whole-plant carbon-stock balance is claimed.
  local_check: check_conservation_laws requires the canonical allocation, emission, degradation, storage-change, and pool-boundary outputs, validates finite matching tensors, and reports the infinity norm of their open storage-ledger residual.
  open_system_route: port
entropy_audit:
  operator_sign: empirical nonnegative rate constraints are validated where required; no thermodynamic mobility operator is declared
  sigma_expression: entropy production is not evaluated at level 2, and no strict IPHS or GENERIC entropy claim is made
equivalence_type: reaction_network
