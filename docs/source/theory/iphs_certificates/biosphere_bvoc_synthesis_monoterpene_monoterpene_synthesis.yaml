state_map:
  air_temperature: Grid-cell emitting-foliage temperature proxy supplied through the canonical external forcing state
  gross_photosynthesis: gross_photosynthesis mapped to canonical Phase 8 cochain basis
  monoterpene_pool_concentration: StateManager-owned storage cochain used as the unique pool state
parameter_map:
  biosphere.bvoc.monoterpene.v_max_mts: Maximum rate in the calibratable monoterpene synthesis response [umol m-2 s-1]
  biosphere.bvoc.monoterpene.k_gpp: Allocated photosynthetic-carbon half-saturation scale in the calibratable synthesis response [umol m-2 s-1]
  biosphere.bvoc.monoterpene.q10_synthase: Q10 coefficient for the calibratable synthesis response [dimensionless]
  biosphere.bvoc.monoterpene.pool.capacity: Maximum monoterpene storage pool capacity [umol m-2]
  biosphere.bvoc.monoterpene.pool_initial: Initial monoterpene pool concentration [umol m-2]
  biosphere.bvoc.monoterpene.pool.k_degradation: First-order degradation rate constant [s-1]
  biosphere.bvoc.monoterpene.pool.k_emit_25: Emission rate constant at 25 degC (298.15 K) reference [s-1]
  biosphere.bvoc.monoterpene.pool.beta_emission: Temperature sensitivity coefficient for emission [K-1]
  biosphere.bvoc.photosynthetic_coupling.f_carbon_monoterpenes: Fraction of GPP allocated to monoterpene synthesis [dimensionless]
  biosphere.bvoc.molecular_weights.monoterpenes: Average molecular weight of monoterpenes (C10H16) [g mol-1]
  biosphere.bvoc.carbon_fraction.monoterpenes: Carbon mass fraction of monoterpenes (stoichiometric fraction of compound mass that is carbon) [dimensionless]
  biosphere.bvoc.monoterpene.enable_seasonal_variation: Enable seasonal variation in synthesis rates [dimensionless]
  biosphere.bvoc.monoterpene.seasonal.amplitude: Amplitude of seasonal modulation (peak deviation from unity) [dimensionless]
  biosphere.bvoc.monoterpene.seasonal.minimum_factor: Minimum clamp applied to seasonal modulation factor [dimensionless]
  biosphere.bvoc.monoterpene.seasonal.peak_day: Day-of-year when seasonal peak occurs (Northern Hemisphere default) [day]
