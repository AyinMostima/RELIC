runtime_replacement_map:
  runtime_uses_iphs: false
  legacy_removed: false
  replacement_entrypoint: forward
  preserved_numerics: Existing ParameterManager-backed calculations define canonical IPHS operator coefficients, rates, ports, or observations.
  no_legacy_mode: No selectable legacy runtime branch is exposed for Phase 8 completion.
state_advancement_map:
  potential_basis: declared RELIC state, port, or observation cochain basis
  effort_variable: air temperature, gross photosynthesis, and pool concentration are empirical drivers; no thermodynamic effort is claimed
  state_advancer: the bounded pool ledger is evaluated once, and its rate and port cochains are evaluated as x_dot = N_h r_h by advance_reaction_network with an explicit identity N_h
  runtime_usage: MonoterpeneSynthesis.forward evaluates one bounded storage ledger, exposes its residual, and wraps the resulting rate and port cochains through the existing reaction-network runtime.
  explicit_stoichiometric_usage: the identity N_h wrapper covers emission, synthesis, positive plant-carbon allocation, degradation, pool-tendency, storage-carbon, and boundary-residual cochains; this is level-2 wrapping rather than strict stoichiometric closure.
