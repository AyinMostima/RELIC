certificate_version: '1.0'
process_id: relic.scientific.biosphere.bvoc.synthesis.monoterpene.MonoterpeneSynthesis
module_name: MonoterpeneSynthesis
canonical_role: reaction
iphs_level: 2
iphs_level_evidence:
  classification: IPHS-wrapped reaction process certificate
  compatible_basis: Reaction process is expressed through conserved or open stoichiometric ledgers
  runtime_replacement: Production forward path uses the existing canonical wrapper or declaration contract; strict runtime replacement is not claimed at this certificate level.
  canonical_operator: N_h r_h reaction-network state advance
  level_2_limit: The canonical runtime wrapper is declared, but no executable typed-cochain or IPHS structural contribution is bound; strict level 4 or 5 evidence is not claimed.
theory_document: docs\source\theory\bvoc_emissions.md
theory_document_status: updated
legacy_formula: >-
  dP/dt = J_syn - J_emit - J_deg + J_boundary, with
  F_alloc = f_carbon f_seasonal GPP,
  J_syn = V_max(T) F_alloc / (K_GPP + F_alloc) (1 - P/P_max),
  J_emit = k_25 exp(beta (T - T_25)) P, and
  F_C,alloc = convert(J_syn 10^-6 MW_mono f_C, g C m-2 s-1,
  kg C m-2 s-1), and
  f_seasonal = 1 + A sin(2 pi t/year - phase_offset).
literature_formula: >-
  Stored-pool studies support separating synthesis from release and a strong
  temperature response of release. The exact GPP saturation, Q10 synthesis,
  capacity limiter, and degradation coefficients are calibratable
  ParameterManager-backed phenomenological choices, not a universal source law.
iphs_formula: x_dot = N_h r_h with ParameterManager-backed process rates r_h and declared stoichiometric/output map N_h
legacy_expression: >-
  The bounded stored-pool tendency is evaluated once from the phenomenological
  synthesis, emission, degradation, and boundary-residual rates.
iphs_expression: x_dot = N_h r_h with ParameterManager-backed process rates r_h and declared stoichiometric/output map N_h
