state_map:
  temperature: required canopy temperature input in K
  leaf_area_index: required finite nonnegative canonical RELIC leaf area index in m2 leaf m-2 ground
  ppfd: optional photon-flux input in umol photons m-2 s-1
  soil_moisture: optional dimensionless soil-moisture stress driver
  water_stress_factor: optional dimensionless water-stress factor
  temperature_stress_factor: optional dimensionless temperature-stress factor
