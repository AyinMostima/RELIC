parameter_map:
  biosphere.bvoc.default.sesquiterpenes: Base sesquiterpene emission factor at the MEGAN standard temperature T_s [ug g-1 DW h-1]
  biosphere.bvoc.megan.beta_sesquiterpenes: Temperature coefficient beta of the delegated Eq. (11) term [K-1]
  biosphere.bvoc.molecular_weights.sesquiterpenes: Molecular weight of sesquiterpenes (C15H24) [g mol-1]
  biosphere.bvoc.carbon_fraction.sesquiterpenes: Carbon mass fraction of representative C15H24 sesquiterpenes [dimensionless]
  biosphere.bvoc.foliar_density_factor: Effective dry-leaf mass per unit canonical RELIC LAI leaf area [g DW m-2]
  biosphere.bvoc.t_standard: MEGAN standard temperature T_s of the delegated Eq. (11) term [K]
  biosphere.bvoc.megan.alpha_light: PPFD response slope alpha of the delegated Eq. (4) light activity [m2 s umol-1]
  biosphere.bvoc.megan.cl_light: Light scaling coefficient C_L of the delegated Eq. (4) light activity [dimensionless]
  biosphere.bvoc.megan.ldf_sesquiterpenes: Sesquiterpene light-dependent fraction LDF of the delegated Eq. (3) and Eq. (7) blends [dimensionless]
  biosphere.bvoc.megan.eopt_sesquiterpenes: Optimum activity E_opt (Table 4 C_eo) of the delegated Eq. (8) temperature activity [dimensionless]
  biosphere.bvoc.megan.ct1_sesquiterpenes: Activation energy C_T1 of the delegated Eq. (8) temperature activity [J mol-1]
  biosphere.bvoc.megan.topt: Class-independent optimum temperature T_opt of the delegated Eq. (8) temperature activity [K]
  biosphere.bvoc.megan.ct2: Class-independent deactivation energy C_T2 of the delegated Eq. (8) temperature activity [J mol-1]
  relic.physical.constants.universal.gas_constant: Molar gas constant R of the delegated Eq. (8) temperature activity [J mol-1 K-1]
