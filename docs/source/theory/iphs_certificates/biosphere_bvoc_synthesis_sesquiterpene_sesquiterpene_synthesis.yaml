composition_management_map:
  functor_metadata: existing FunctorMetadata declares interfaces, execution phase, and conservation semantics
  state_contract: existing simulator state update path is preserved
  physical_constant_ssot: seconds_per_hour is resolved only through get_physical_constant
  unit_conversion_owner: the existing UnitConverter owns the umol m-2 s-1 to mol m-2 s-1 and g C m-2 s-1 to kg C m-2 s-1 conversions
  response_owner: BVOCResponseIntegrator composes the megan_model module-level laws (Guenther et al. 2012 Eqs. 3, 4, 7, 8 and 11) and is the sole runtime reader of beta_sesquiterpenes, t_standard, alpha_light, cl_light, ldf_sesquiterpenes, eopt_sesquiterpenes, ct1_sesquiterpenes, topt, ct2 and the physical-constant gas constant; the synthesis Functor does not cache a duplicate coefficient
  validation_rule: phase8 scientific inventory and equivalence certificate checks
dependency_interconnection_map:
  dependencies:
  - water_stress_factor
  - thermal_stress
  - nutrient_stress_factor
  direct_functor_calls: none_no_direct_functor_calls
overflow_routing_map:
  diagnostic_residuals: no storage clipping or overflow is performed by this open flux process
  discarded_residuals: none; no floor or clamp is applied, an illegal emission factor raises, and the output is routed to the atmospheric port
conservation_map:
  conserved_quantities:
  - carbon_boundary
  open_system_route: port
  balance_expression: R_C = F_C,alloc - convert(F_SQT MW_SQT f_C, g C m-2 s-1 to kg C m-2 s-1); carbon_boundary = ||R_C||_inf. This is an open species-to-carbon map and not a closed local stock claim.
  local_check: check_conservation_laws requires finite floating tensors with identical shapes, reuses the existing UnitConverter and ParameterManager-backed molecular weight and carbon fraction, and reports the infinity norm of the mapping residual.
entropy_audit:
  operator_sign: rates, mobilities, or diagnostic maps are non-negative or checked by existing validation hooks where physically required
  sigma_expression: canonical entropy production is non-negative for dissipative subexpressions
equivalence_type: reaction_network
physical_constant_ssot:
  seconds_per_hour: get_physical_constant("seconds_per_hour")
