runtime_replacement_map:
  runtime_uses_iphs: false
  legacy_removed: false
  replacement_entrypoint: forward
  preserved_numerics: Existing ParameterManager-backed calculations define canonical IPHS operator coefficients, rates, ports, or observations.
  no_legacy_mode: Scientific inputs come only from the state dictionary (no environment argument exists) and outputs are dictionary-only, while compatibility_mode and alternate scalar/tensor paths are absent.
state_advancement_map:
  potential_basis: declared RELIC state, port, or observation cochain basis
  effort_variable: ParameterManager-backed thermodynamic effort, driver, or diagnostic input used by the module
  state_advancer: x_dot = N_h r_h with explicit stoichiometric_N and rates evaluated by advance_reaction_network
  runtime_usage: SesquiterpeneSynthesis.forward validates the declared state ports, evaluates one MEGAN-family empirical response rate, maps the mass-normalized rate through required LAI and ParameterManager-backed k_f, converts it through the existing UnitConverter, derives the positive no-storage plant-carbon allocation proxy, calls advance_reaction_network with explicit stoichiometric_N and rates, and emits the canonical molar and carbon ports plus namespaced diagnostics.
  explicit_stoichiometric_usage: SesquiterpeneSynthesis.forward materializes stoichiometric_N and rates, then lowers x_dot = N_h r_h through advance_reaction_network with open_system_route=port.
