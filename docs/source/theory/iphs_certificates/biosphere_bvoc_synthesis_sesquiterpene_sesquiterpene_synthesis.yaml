iphs_level: 2
iphs_level_evidence:
  classification: IPHS-wrapped reaction process certificate
  compatible_basis: Reaction process is expressed through conserved or open stoichiometric ledgers
  runtime_replacement: Production forward path uses the existing canonical wrapper or declaration contract; strict runtime replacement is not claimed at this certificate level.
  canonical_operator: N_h r_h reaction-network state advance
  level_2_limit: The canonical runtime wrapper is declared, but no executable typed-cochain or IPHS structural contribution is bound; strict level 4 or 5 evidence is not claimed.
theory_document: docs\source\theory\bvoc_emissions.md
theory_document_status: updated
legacy_formula: >-
  gamma_T = (1 - LDF_SQT) exp(beta_SQT (T - T_s)) + LDF_SQT E_opt C_T2 exp(C_T1 x)
  / (C_T2 - C_T1 (1 - exp(C_T2 x))), x = (1/T_opt - 1/T) / R;
  gamma_L = (1 - LDF_SQT) + LDF_SQT alpha C_L PPFD / sqrt(1 + alpha^2 PPFD^2);
  gamma_stress = min(supplied stress factors in [0, 1]);
  E_leaf = EF gamma_T gamma_L gamma_stress;
  E_area = E_leaf LAI k_f / seconds_per_hour;
  F_SQT = convert(E_area / MW_SQT, umol m-2 s-1, mol m-2 s-1);
  F_C,alloc = convert(F_SQT MW_SQT f_C, g C m-2 s-1,
  kg C m-2 s-1).
literature_formula: >-
  The light factor is Guenther et al. (2012) Eq. (3) with the Table 4
  sesquiterpene light-dependent fraction and the Eq. (4) light-dependent
  activity; the temperature factor is the Eq. (7) blend of the Eq. (11) exponential
  about the MEGAN standard temperature T_s and the Eq. (8) light-dependent response,
  with the Table 4 Other Sesquiterpenes row; stress is the most limiting supplied
  factor. The RELIC
  reduced closure converts a dry-leaf-mass-normalized factor through LAI k_f;
  it is not the canonical MEGAN2.1 vegetation-type, ground-area emission-factor
  formulation. Stored-emitter literature requires synthesis and release to
  remain distinct when storage is represented; this no-storage closure reports
  emitted compound carbon only as an explicit allocation proxy.
iphs_formula: x_dot = N_h r_h with ParameterManager-backed process rates r_h and declared stoichiometric/output map N_h
legacy_expression: >-
  The reduced empirical closure evaluates one nonnegative leaf-mass emission
  factor, maps canonical RELIC leaf area to effective dry-leaf mass with LAI
  times k_f, converts the result to the canonical molar atmosphere port, and
  exposes the corresponding emitted-compound carbon as a positive allocation
  proxy. It owns no storage pool and claims neither canonical MEGAN2.1
  equivalence nor synthesis-release equivalence for stored emitters.
iphs_expression: x_dot = N_h r_h with ParameterManager-backed process rates r_h and declared stoichiometric/output map N_h
