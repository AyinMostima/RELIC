composition_management_map:
  functor_metadata: existing FunctorMetadata declares interfaces, execution phase, and conservation semantics
  state_contract: existing simulator StateManager balances the three SCM-declared carbon.total growth-rate inputs against the three integrated biomass updates
  validation_rule: phase8 scientific inventory and equivalence certificate checks
dependency_interconnection_map:
  dependencies: autotrophic_respiration always; water_stress when environmental control is enabled; the compile-time selected phenology owner when phenology control is enabled; the selected BVOC owner when bvoc_carbon_allocation_flux is enabled
  direct_functor_calls: none; forward consumes only simulator state produced by dependency scheduling
overflow_routing_map:
  diagnostic_residuals: diagnostics.biomass_allocation.carbon_balance_residual reports NPP minus the selected BVOC debit and exact sum of organ allocation fluxes
  invalid_state_route: missing or non-finite required inputs, negative NPP or BVOC debit, BVOC debit above NPP without an explicit reserve, unselected BVOC state, invalid phase codes, and non-positive dt fail before state advance
  discarded_residuals: NPP and the optional BVOC debit are routed to leaf, stem, and root growth and biomass updates; the exact remainder is exported as diagnostics.biomass_allocation.carbon_balance_residual and a non-closing ledger is rejected
conservation_map:
  conserved_quantities: carbon_partition open boundary ledger; no closed plant or ecosystem carbon stock is claimed
  balance_expression: carbon_partition audits net_primary_productivity - bvoc_carbon_allocation_flux - growth_rate_leaf - growth_rate_stem - growth_rate_root = 0 when a BVOC owner is selected; the BVOC term is structurally absent otherwise
  step_balance_expression: delta(leaf_biomass_c + wood_biomass_c + root_biomass_c) - (growth_rate_leaf + growth_rate_stem + growth_rate_root)*dt = 0
  open_system_routes: net_primary_productivity is partitioned locally between the selected BVOC debit and organ growth; only the three organ growth ports enter carbon.total, avoiding double counting of NPP and BVOC
entropy_audit:
  operator_sign: NPP and normalized allocation fractions are non-negative; no mobility operator is claimed
  sigma_expression: no strict entropy-production or GENERIC degeneracy claim is made at level 2
equivalence_type: reaction_network
