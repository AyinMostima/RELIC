runtime_replacement_map:
  runtime_uses_iphs: false
  legacy_removed: false
  replacement_entrypoint: forward
  preserved_numerics: Existing ParameterManager-backed calculations define canonical IPHS operator coefficients, rates, ports, or observations.
  no_legacy_mode: No selectable legacy runtime branch is exposed for Phase 8 completion.
state_advancement_map:
  potential_basis: declared RELIC state, port, or observation cochain basis
  effort_variable: empirical NPP boundary flux and allocation controls; no Hamiltonian effort is claimed at level 2
  state_advancer: x_dot = N_h r_h with a three-channel identity N_h and r_h = [f_leaf*(NPP-F_BVOC,C), f_stem*(NPP-F_BVOC,C), f_root*(NPP-F_BVOC,C)]
  runtime_usage: BiomassAllocation.forward resolves the graph-selected BVOC debit, normalizes organ fractions, evaluates all three rates once through advance_reaction_network, and emits the integrated state_delta as per-step ACCUMULATE updates.
  explicit_stoichiometric_usage: The identity N_h wrapper is explicit level-2 runtime structure and is not strict stoichiometric, Hamiltonian, or GENERIC evidence.
