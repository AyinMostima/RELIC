state_map:
  net_primary_productivity: required post-respiration carbon input from AutotrophicRespiration
  bvoc_carbon_allocation_flux: conditional non-negative carbon debit required only when a compile-time BVOC owner is selected; values above NPP require an explicit reserve model and fail here
  air_temperature: conditional finite environmental driver in K
  water_stress_factor: conditional bounded environmental control in the interval [0,1]
  leaf_area_index: conditional non-negative phenology state used to redistribute allocation
  phenology_phase: conditional integer phase observation used to redistribute allocation
  leaf_biomass_c: conditional non-negative canonical plant carbon stock for allometric control and per-step ACCUMULATE output
  wood_biomass_c: conditional non-negative canonical plant carbon stock for allometric control and per-step ACCUMULATE output
  root_biomass_c: conditional non-negative canonical plant carbon stock for allometric control and per-step ACCUMULATE output
parameter_map:
  allocation_fractions: biosphere.growth.allocation f_leaf_base, f_stem_base, and f_root_base from ParameterManager
  environmental_controls: root allocation temperature and water-stress coefficients from ParameterManager
  phenology_controls: phase codes, phase modifiers, LAI thresholds, and emergency fractions from ParameterManager
  allometry_controls: exponents, blend weight, biomass floor, and ratio bound from ParameterManager
  numerical_controls: allocation bounds, normalization epsilon, zero tolerance, and conservation tolerance from ParameterManager
  pft_controls: optional f_leaf, f_stem and f_root allocation triple of the configured pft_name, read from the biosphere.pft.*.allocation keys (template over the 15 PFTs of the parameter database) in ParameterManager, the one source of the triple; an unknown PFT (none of the three keys) raises KeyError naming the known PFTs, and an incomplete triple raises KeyError
operator_map:
  N_h: explicit three-channel identity wrapper for leaf, wood, and root allocation rates
  r_h: vector [f_leaf*(NPP-F_BVOC,C), f_stem*(NPP-F_BVOC,C), f_root*(NPP-F_BVOC,C)] evaluated once by the production forward path
  boundary_route: net_primary_productivity and the graph-selected bvoc_carbon_allocation_flux close the local partition; growth_rate_leaf, growth_rate_stem, and growth_rate_root are the only carbon.total input boundaries for the tracked structural stocks
unit_map:
  net_primary_productivity: kg C m-2 s-1
  bvoc_carbon_allocation_flux: kg C m-2 s-1
  air_temperature: K
  water_stress_factor: '1'
  leaf_area_index: m2 m-2
  phenology_phase: '1'
  leaf_biomass_c: kg C m-2
  wood_biomass_c: kg C m-2
  root_biomass_c: kg C m-2
  growth_rate_leaf: kg C m-2 s-1
  growth_rate_stem: kg C m-2 s-1
  growth_rate_root: kg C m-2 s-1
  diagnostics.biomass_allocation.total_growth_rate: kg C m-2 s-1
  diagnostics.biomass_allocation.allocation_fraction_leaf: '1'
  diagnostics.biomass_allocation.allocation_fraction_stem: '1'
  diagnostics.biomass_allocation.allocation_fraction_root: '1'
  diagnostics.biomass_allocation.allocation_sum: '1'
  diagnostics.biomass_allocation.environmental_modifier: '1'
  diagnostics.biomass_allocation.phenology_modifier: '1'
  diagnostics.biomass_allocation.carbon_balance_residual: kg C m-2 s-1
input_output_map:
  net_primary_productivity: required upstream carbon budget is allocated without a second respiration deduction
  bvoc_carbon_allocation_flux: conditional selected-owner plant-carbon debit subtracted before organ allocation without echoing or accumulating a second state
  air_temperature: conditional environmental driver that redistributes organ fractions
  water_stress_factor: conditional water control that redistributes organ fractions
  leaf_area_index: conditional phenology state that redistributes organ fractions
  phenology_phase: conditional phenology observation that redistributes organ fractions
  leaf_biomass_c: canonical per-step leaf carbon ACCUMULATE output and optional allometry input
  wood_biomass_c: canonical per-step wood carbon ACCUMULATE output and optional allometry input
  root_biomass_c: canonical per-step root carbon ACCUMULATE output and optional allometry input
  growth_rate_leaf: canonical leaf allocation flux and explicit carbon.total input boundary
  growth_rate_stem: canonical wood allocation flux and explicit carbon.total input boundary
  growth_rate_root: canonical root allocation flux and explicit carbon.total input boundary
  diagnostics.biomass_allocation.total_growth_rate: exact sum of the three organ fluxes
  diagnostics.biomass_allocation.allocation_fraction_leaf: normalized leaf fraction observation
  diagnostics.biomass_allocation.allocation_fraction_stem: normalized stem fraction observation
  diagnostics.biomass_allocation.allocation_fraction_root: normalized root fraction observation
  diagnostics.biomass_allocation.allocation_sum: exact normalized fraction sum
  diagnostics.biomass_allocation.environmental_modifier: environmental-control observation only
  diagnostics.biomass_allocation.phenology_modifier: phenology-control observation only
  diagnostics.biomass_allocation.carbon_balance_residual: NPP minus the three allocated organ fluxes
