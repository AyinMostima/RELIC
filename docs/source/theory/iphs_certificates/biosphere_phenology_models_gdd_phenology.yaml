input_output_map:
  phenology_observations: canonical K temperatures and StateManager temporal inputs deterministically map to updated GDD state, LAI, phase, growth, and senescence-factor observations
  carbon_turnover: vegetation carbon pools map to integrated pool increments and litter carbon boundary exports
  nitrogen_turnover: vegetation nitrogen pools map to integrated pool increments, retranslocation, and litter nitrogen boundary exports
interface_map:
  forward_signature: forward(self, state, time, dt, **kwargs)
  bridge_class: BiologicalProcessFunctor
  abstraction_contract: BiologicalProcess
  state_write_mode: integrated C and N pool increments use ACCUMULATE with per_timestep true; GDD temporal full states, rates, and observations use REPLACE with declared units
  legacy_inputs: *canonical_inputs
  iphs_inputs: *canonical_inputs
  legacy_outputs: *canonical_outputs
  iphs_outputs: *canonical_outputs
runtime_replacement_map:
  runtime_uses_iphs: false
  legacy_removed: false
  replacement_entrypoint: forward
  preserved_numerics: Existing ParameterManager-backed calculations define canonical IPHS operator coefficients, rates, ports, or observations.
  no_legacy_mode: No selectable legacy runtime branch is exposed for Phase 8 completion.
state_advancement_map:
  potential_basis: declared RELIC state, port, or observation cochain basis
  effort_variable: ParameterManager-backed thermodynamic effort, driver, or diagnostic input used by the module
  state_advancer: x_dot = N_h r_h with explicit stoichiometric_N and rates evaluated by advance_reaction_network
  runtime_usage: GDDPhenology inherits PhenologyBase.forward, which calls advance_reaction_network with declared stoichiometric_N and rates before emitting canonical phenology outputs.
  explicit_stoichiometric_usage: PhenologyBase.forward materializes stoichiometric_N and rates for GDDPhenology outputs, then lowers x_dot=N_h r_h through advance_reaction_network.
parameter_management_map: *canonical_parameter_sources
composition_management_map:
  functor_metadata: existing FunctorMetadata declares interfaces, execution phase, and conservation semantics
  state_contract: existing simulator state update path is preserved
  validation_rule: phase8 scientific inventory and equivalence certificate checks
dependency_interconnection_map:
  dependencies: calendar and canonical K temperature forcing, GDD temporal states, and vegetation C/N pools are StateManager ports; PFT coefficients are ParameterManager-bound; direct Functor dependencies are empty and downstream consumers connect through graph/SCM ports
  direct_functor_calls: none; temperature, calendar, GDD temporal state, and vegetation pools are StateManager ports and no producer Functor is invoked
overflow_routing_map:
  diagnostic_residuals: existing diagnostics and conservation checks route clipping or residual terms
  discarded_residuals: bounded LAI, senescence, and growth-factor projections have no elemental ledger effect; carbon and nitrogen turnover emits the two explicit PhenologyBase balance residuals and rejects nonclosure
conservation_map:
  conserved_quantities: carbon|nitrogen on the extended vegetation plus litter-boundary ledger
  balance_expression: delta C_veg + dt F_C_litter = 0; delta N_veg + delta N_plant + dt F_N_litter = 0
  open_system_route: litter carbon and nitrogen are explicit boundary_export ports
entropy_audit:
  operator_sign: rates, mobilities, or diagnostic maps are non-negative or checked by existing validation hooks where physically required
  sigma_expression: canonical entropy production is non-negative for dissipative subexpressions
equivalence_type: thermodynamic_embedding
