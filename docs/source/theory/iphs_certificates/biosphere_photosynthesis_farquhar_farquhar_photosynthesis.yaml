state_map:
  air_temperature: required atmospheric temperature forcing in K
  atmospheric_co2_ppm: required atmospheric CO2 mole-fraction forcing in umol mol-1
  ppfd: required photon flux from atmospheric_radiation, or from external forcing under environment_source = external_forcing, in umol photons m-2 s-1
  vapor_pressure_deficit: required atmospheric demand from environmental_forcing, or from external forcing under environment_source = external_forcing, in Pa
  vcmax_scaling: optional C3/C4 capacity control
  vpmax_scaling: optional C4 PEP capacity control
  jmax_scaling: optional electron-transport capacity control
  water_stress_factor: optional water limitation control in the unit interval
  temperature_stress_factor: optional damage control outside enzyme temperature response in the unit interval
  ozone_stress_factor: optional C3 ozone limitation control in the unit interval
  leaf_area_index: required canopy state of the Beer-Lambert scaling L_eff = (1 - exp(-k LAI)) / k [m2 m-2]; no default
  actual_vapor_pressure: actual vapour pressure e_a, read only with temporal_support daylight_gauss (D_k = max(e0(T_k) - e_a, 0) at the daylight samples)
  air_temperature_max: daily maximum air temperature, read only with temporal_support daylight_gauss (diurnal course T_k of the samples)
  air_temperature_min: daily minimum air temperature, read only with temporal_support daylight_gauss (diurnal course T_k of the samples)
  latitude: latitude of the cell, read only with temporal_support daylight_gauss (daylight geometry of the samples)
  day_of_year: day of year, read only with temporal_support daylight_gauss (daylight geometry of the samples)
parameter_map:
  biochemical_parameters: Full C3 and C4 kinetics resolve through the declared biosphere ParameterManager keys.
  optional_controls: an absent stress factor or capacity scaling is the multiplicative identity 1 (no limitation, no scaling); no ParameterManager default is read.
  numerical_guardrails: Finite-domain limits and VPD/PPFD response scales resolve through validation.numerical keys.
  physical_constants: Gas constant, reference temperature, and carbon molar mass resolve through get_physical_constant from the physical constants SSOT.
  pft_overrides: Optional biosphere.pft.<pft_name>.photosynthesis keys may replace declared base parameters before execution.
operator_map:
  N_h: declared stoichiometric or output incidence map for this reaction process
  r_h: ParameterManager-backed process-rate vector evaluated by the production forward path
unit_map:
  gross_photosynthesis: umol CO2 m-2 s-1
  net_photosynthesis: umol CO2 m-2 s-1
  gross_primary_productivity: kg C m-2 s-1
  electron_transport_rate: umol e- m-2 s-1
  diagnostics.photosynthesis.dark_respiration: umol CO2 m-2 s-1
  diagnostics.photosynthesis.transport_limited: umol CO2 m-2 s-1
  diagnostics.photosynthesis.jmax_actual: umol e- m-2 s-1
  diagnostics.photosynthesis.limitation_factor: dimensionless
  diagnostics.photosynthesis.pathway_type: dimensionless
  actual_vapor_pressure: Pa
  air_temperature_max: K
  air_temperature_min: K
  latitude: degrees_north
  day_of_year: '1'
  net_photosynthesis_daylight_samples: umol CO2 m-2 s-1
input_output_map:
  air_temperature: required finite K forcing consumed without alias or parameter default
  atmospheric_co2_ppm: required finite umol mol-1 forcing used as the current effective Ci driver
  ppfd: required photon flux produced by atmospheric_radiation or supplied as external forcing
  vapor_pressure_deficit: required Pa forcing produced by environmental_forcing or supplied as external forcing
  optional_controls: absent scaling and stress-factor inputs are the identity 1; leaf_area_index is required
  gross_photosynthesis: gross molar assimilation is exposed as an instantaneous replacement port
  net_photosynthesis: net molar assimilation equals gross assimilation minus dark respiration
  gross_primary_productivity: gross assimilation is converted to kg C m-2 s-1 with the carbon molar mass SSOT
  electron_transport_rate: retained public port is consumed by mechanistic isoprene synthesis
  diagnostics: secondary biochemical observations are emitted only under diagnostics.photosynthesis
  net_photosynthesis_daylight_samples: net assimilation at the daylight Gauss samples, written only with temporal_support daylight_gauss
