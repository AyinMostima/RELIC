runtime_replacement_map:
  runtime_uses_iphs: false
  legacy_removed: false
  replacement_entrypoint: forward
  preserved_numerics: ParameterManager-backed C3/C4 kinetics execute through one eager PyTorch forward path.
  no_legacy_mode: No input alias, compiled fallback, simplified formula branch, or selectable legacy runtime is exposed.
state_advancement_map:
  potential_basis: open gross-assimilation, net-assimilation, and dark-respiration output ports
  effort_variable: atmospheric CO2, PPFD, VPD, temperature, and optional control drivers; no thermodynamic effort proof is claimed
  state_advancer: x_dot = N_h r_h uses an identity-like output incidence and advance_reaction_network with open_system_route=port
  runtime_usage: FarquharPhotosynthesis.forward calls advance_reaction_network with declared stoichiometric_N and rates before emitting canonical outputs.
  explicit_stoichiometric_usage: FarquharPhotosynthesis.forward materializes stoichiometric_N and rates, then lowers x_dot=N_h r_h through advance_reaction_network.
