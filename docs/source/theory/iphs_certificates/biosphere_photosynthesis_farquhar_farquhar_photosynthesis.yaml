composition_management_map:
  functor_metadata: FunctorMetadata declares the exact eleven-input and nine-output interface.
  state_contract: All outputs use explicit REPLACE UpdateItems and StateManager owns mutation.
  physical_constant_ssot: Gas constant, reference temperature, and carbon molar mass resolve only through get_physical_constant.
  validation_rule: Phase 8 inventory, output-contract scan, L1/L2/L3 tests, and the real simulator benchmark validate the contract.
dependency_interconnection_map:
  dependencies: By default environmental_forcing must produce vapor_pressure_deficit and atmospheric_radiation must produce ppfd before Farquhar execution. Under environment_source = external_forcing neither provider is declared, both inputs are State:ExternalForcing, and the law is unchanged.
  canonical_graph: external forcing -> {environmental_forcing, atmospheric_radiation} -> farquhar_photosynthesis; with environment_source = external_forcing, external forcing -> farquhar_photosynthesis
  direct_functor_calls: none; execution is mediated by the existing simulator dependency graph.
overflow_routing_map:
  biochemical_bounds: Non-negative gross limitation rates define the open uptake port; no prognostic reservoir mass is clipped.
  invalid_inputs: Missing, non-finite, or out-of-domain required forcings fail before rate evaluation.
  discarded_residuals: none; the module advances no local reservoir and emits no hidden source or sink.
conservation_map:
  conserved_quantities: open carbon exchange; no closed local energy or carbon reservoir is claimed
  metadata_laws:
  - carbon_boundary
  balance_expression: net_photosynthesis = gross_photosynthesis - diagnostics.photosynthesis.dark_respiration; GPP_kgC = gross_photosynthesis * M_C * 1e-9
  local_check: check_conservation_laws requires floating finite shape-, dtype-, and device-matched ports and returns the maximum normalized residual across the molar assimilation identity and canonical carbon-mass mapping
  open_system_route: gross uptake and respiration are explicit atmosphere-biosphere ports
entropy_audit:
  operator_sign: Gross uptake rates are non-negative and all emitted values are finite.
  sigma_expression: No independent entropy-production or GENERIC degeneracy proof is claimed at level 2.
equivalence_type: thermodynamic_embedding
