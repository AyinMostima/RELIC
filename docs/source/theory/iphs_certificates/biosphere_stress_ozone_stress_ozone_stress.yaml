runtime_replacement_map:
  runtime_uses_iphs: false
  legacy_removed: false
  replacement_entrypoint: forward
  preserved_numerics: Existing stomatal-flux response is retained only as ParameterManager-backed r_h coefficients inside the canonical reaction-network runtime.
  no_legacy_mode: No selectable legacy runtime branch is exposed.
state_advancement_map:
  potential_basis: ozone uptake, detoxification, excess flux, antioxidant-pool tendency, and damage tendency cochain rows.
  effort_variable: ozone exposure effort [O3] / [O3]_threshold.
  state_advancer: x_dot = N_h r_h with r_h = [F_O3, detoxification_flux, excess_ozone_flux].
  explicit_stoichiometric_usage: OzoneStress.forward declares stoichiometric_N=... and rates=... in advance_reaction_network.
  runtime_usage: OzoneStress.forward calls advance_reaction_network and maps species_rate rows to public outputs and diagnostics.
parameter_management_map:
  biosphere.stress.ozone.ozone_threshold:
    source: ParameterManager YAML
  biosphere.stress.ozone.flux_threshold:
    source: ParameterManager YAML
  biosphere.stress.ozone.ozone_uptake_rate:
    source: ParameterManager YAML
  relic.physical.constants.conversions.h2o_o3_diffusivity_ratio:
    source: ParameterManager physical constants SSOT via get_physical_constant
  biosphere.stress.ozone.ozone_detox_capacity:
    source: ParameterManager YAML
  biosphere.stress.ozone.antioxidant_capacity:
    source: ParameterManager YAML
  biosphere.stress.ozone.max_flux_ratio:
    source: ParameterManager YAML
  biosphere.stress.global.factor_min:
    source: ParameterManager YAML
  biosphere.stress.global.factor_max:
    source: ParameterManager YAML
composition_management_map:
  functor_metadata: FunctorMetadata declares input/output variables, execution phase, dependencies, and references.
  state_contract: Existing simulator state update path is preserved.
  validation_rule: Phase 8 scientific inventory and equivalence certificate checks validate the reaction-network certificate.
dependency_interconnection_map:
  dependencies:
  - atmospheric_chemistry
  direct_functor_calls: none_no_direct_functor_calls
overflow_routing_map:
  clipping_residuals: stress-factor saturation remains visible through diagnostics.ozone_stress.excess_ozone_flux and damage_tendency.
  open_system_route: port
  discarded_residuals: none_no_flux_residual_is_discarded_because_uptake_is_partitioned_exactly_into_detoxification_and_excess_rows
conservation_map:
  conserved_quantities: none; the atmospheric O3 mole fraction is forcing and no leaf ozone stock is advanced, so no closed ozone ledger exists; the network partitions the uptake rate F = D + X into REPLACE rate outputs
  open_system_route: port
  balance_expression: 'Rate partition only: F = D + X row-wise (D = min(F, C_detox), X = max(F - D, 0)); atmospheric ozone uptake is an open port input and no stock budget is claimed.'
entropy_audit:
  sigma_expression: sigma_O3 = detoxification_flux * max(F_O3 / C_detox, 0) >= 0.
  runtime_output: diagnostics.ozone_stress.entropy_production
  generic_degeneracy_status: not_claimed_for_level5
equivalence_type: reaction_network
