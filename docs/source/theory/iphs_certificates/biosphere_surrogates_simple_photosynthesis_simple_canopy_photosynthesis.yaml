theory_document: docs\source\theory\surrogates.md
theory_document_status: updated
legacy_formula: GPP = G_max * (PPFD/(PPFD+K_PPFD)) * exp(-((T-T_opt)/T_width)^2) * f_w * LAI; Reco = R_base * Q10^((T-T_ref)/10) * LAI; NEE = Reco - GPP
literature_formula: Rectangular-hyperbola PPFD response and fixed-Q10 empirical respiration response, with positive-to-atmosphere NEE = Reco - GPP
iphs_formula: y_h = N_h r_h with r_h = [GPP, Reco] and N_h rows [1,0], [0,1], [-1,1]
legacy_expression: GPP and Reco empirical rates with the canonical positive-to-atmosphere NEE orientation
iphs_expression: y_h = N_h r_h with ParameterManager-backed rates and an explicit open carbon port
