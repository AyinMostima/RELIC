composition_management_map:
  functor_metadata: existing FunctorMetadata declares hydrosphere transport role and soil/energy/photosynthesis coupling interfaces
  structural_protocol: declared_forms, required_parameters, build_hodge_terms, dissipative_structure, ports
  state_contract: existing TransportMechanismFunctor and StateManager UpdateItem path
  physical_constant_ssot: molecular, thermodynamic, psychrometric, temperature-conversion, turbulence, and time constants are resolved only through get_physical_constant
  ports:
  - penman_monteith_vapor_flux
  - penman_monteith_latent_heat_flux
dependency_interconnection_map:
  dependencies: lagged soil moisture providers can supply water stress; meteorological forcing enters by the declared state keys only (no environment keyword channel)
  direct_functor_calls: none; meteorology and optional lagged water-stress or aerodynamic state enter through graph ports
  chain_maps:
  - relative_humidity or vapor_pressure_deficit enters the vapor-pressure effort
  - aerodynamic_resistance can be supplied by turbulence coupling through existing state graph
  - evapotranspiration_flux and latent_heat_flux leave through existing state graph
overflow_routing_map:
  nonnegative_et_projection: negative raw ET is routed to negative_et_projection_residual
  available_energy_identity: Rn - G - available_energy is emitted as available_energy_residual; it is a construction identity, not a complete surface-energy closure
  canopy_storage_projection: negative canopy storage projection is emitted as canopy_storage_residual
  discarded_residuals: negative ET, canopy-storage projection, and available-energy identity are exposed respectively as negative_et_projection_residual, canopy_storage_residual, and available_energy_residual
conservation_map:
  conserved_quantity: latent_heat_boundary open constitutive ledger; no closed soil-water or complete surface-energy balance is claimed
  balance_expression: latent_heat_boundary audits L_E = lambda q_v for the outward evapotranspiration and latent-heat ports
  local_check: FunctorMetadata.conservation_laws includes latent_heat_boundary with fail-fast tensor evidence
  port_balance: vapor flux and latent heat flux carry outgoing matter and energy; reservoir closure remains assigned to coupled soil, canopy, atmosphere, sensible-heat, and storage ledgers
entropy_audit:
  dissipative_operator: star_ET and M_h are symmetric positive semidefinite for positive conductance and lambda
  sigma_expression: sigma = X_v.T star_ET X_v / T >= 0
  validation_hook: build_hodge_contract(strict=True) and dissipative_structure eigenvalue checks
equivalence_type: port_equivalent
physical_constant_ssot:
  water_molecular_weight: get_physical_constant("water_molecular_weight")
  air_molecular_weight: get_physical_constant("air_molecular_weight")
  universal_gas_constant: get_physical_constant("gas_constant")
  latent_heat_vaporization: get_physical_constant("latent_heat_vaporization")
  air_specific_heat_cp: get_physical_constant("air_specific_heat_cp")
  von_karman_constant: get_physical_constant("von_karman_constant")
  tetens_base_pressure: get_physical_constant("relic.physical.constants.psychrometrics.tetens_base_pressure")
  tetens_coefficient_a: get_physical_constant("relic.physical.constants.psychrometrics.tetens_coefficient_a")
  tetens_coefficient_b: get_physical_constant("relic.physical.constants.psychrometrics.tetens_coefficient_b")
