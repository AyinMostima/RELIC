module_name: penman_monteith_et
canonical_role: transport
iphs_level: 3
iphs_level_evidence:
  classification: IPHS-structured transport process certificate
  compatible_basis: Process declares composition-safe IPHS or DEC structure
  runtime_replacement: Production forward path uses the existing canonical wrapper or declaration contract; strict runtime replacement is not claimed at this certificate level.
  canonical_operator: DEC/IPHS transport operator with conservative flux routing
  structural_contribution: Cochain, Hodge, flux, and port structures are declared for assembly audit
  assembly_participation: Certificate participates in Phase 8 inventory and GraphIR structural audit
  level_3_limit: Typed form, Hodge, port, or related structure is declared, but no runtime-linked IPHSStructureSpec contribution and executable level 4 or 5 certificate binding is present.
theory_document: docs\source\theory\hydrosphere_penman_monteith.md
theory_document_status: updated
legacy_formula: Penman-Monteith evapotranspiration combines available energy, vapor pressure deficit, aerodynamic conductance, and canopy conductance to produce water vapor flux and latent heat flux.
literature_formula: ET = [Delta(Rn - G) + rho_a cp VPD ga] / [lambda(Delta + gamma(1 + ga/gc))], following Penman, Monteith, and FAO-56.
iphs_formula: q_v = star_ET X_v with X_v = VPD and star_ET = diag(g_eff / lambda) >= 0; latent heat port L_E = lambda q_v.
legacy_expression: ET = [Delta(Rn-G) + rho_a cp VPD ga] / [lambda(Delta + gamma(1 + ga/gc))], then ET is projected to nonnegative flux and optional canopy interception partitions ET.
iphs_expression: q_v = star_ET X_v plus energy port L_E = lambda q_v; projection residuals are routed as diagnostics without hidden sinks.
