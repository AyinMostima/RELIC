input_output_map:
  net_radiation: same radiative driver is used by legacy and IPHS expressions
  soil_heat_flux: explicitly selected signed state input or process-specific fraction enters Rn-G; no missing-input fallback or new state writer
  vapor_pressure_deficit: same humidity gradient drives vapor transport; RH is converted to VPD when supplied
  canopy_resistance_source: required constructor configuration without default; state reads surface_resistance, else r_s = 1 / canopy_conductance (both absent raises); fao56_reference_surface uses r_s = hydrosphere.physical.reference_surface_resistance and declares neither state input
  surface_resistance: same canopy resistance r_s enters both forms (canopy_resistance_source state)
  canopy_conductance: same canopy conductance enters both forms as r_s = 1 / g_c when surface_resistance is absent (canopy_resistance_source state)
  aerodynamic_resistance: same external resistance is preferred over internal closure when supplied
  precipitation_flux: same precipitation input feeds the interception store when canopy interception is enabled
  leaf_area_index: same LAI scales the interception capacity when canopy interception is enabled
  evapotranspiration_flux: same vapor mass flux is emitted through an explicit UpdateItem(REPLACE) with canonical unit and writer provenance
  latent_heat_flux: same ET flux multiplied by lambda is emitted through an explicit UpdateItem(REPLACE) with canonical unit and writer provenance
  canopy_storage: same interception storage update is emitted through an explicit UpdateItem(REPLACE) with canonical unit and writer provenance
