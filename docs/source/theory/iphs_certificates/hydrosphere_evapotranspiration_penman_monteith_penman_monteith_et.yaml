state_map:
  net_radiation: net radiation Rn [W m-2]
  soil_heat_flux: signed surface G, positive into soil; required only with soil_heat_flux_source state [W m-2]
  air_temperature: air temperature T [K]
  wind_speed: wind speed u [m s-1]
  atmospheric_pressure: surface atmospheric pressure P [Pa]
  relative_humidity: relative humidity RH [dimensionless]
  vapor_pressure_deficit: vapor pressure deficit VPD [Pa]
  surface_resistance: canopy (surface) resistance r_s, read only with canopy_resistance_source state [s m-1]
  canopy_conductance: canopy conductance g_c, r_s = 1 / g_c when surface_resistance is absent; read only with canopy_resistance_source state [m s-1]
  aerodynamic_resistance: aerodynamic resistance r_a [s m-1]
  precipitation_flux: precipitation water flux P, read only with canopy interception enabled [kg m-2 s-1]
  leaf_area_index: leaf area index LAI, read only with canopy interception enabled [m2 m-2]
  evapotranspiration_flux: water vapor mass flux q_v [kg m-2 s-1]
  latent_heat_flux: latent heat flux lambda q_v [W m-2]
  canopy_storage: interception storage [mm]
  diagnostics.evapotranspiration: read-only aerodynamic, psychrometric, and residual diagnostics
  air_temperature_max: daily maximum air temperature, read with temporal_support daily (FAO-56 Eq. 12 e_s) and daylight_gauss (diurnal course T_k)
  air_temperature_min: daily minimum air temperature, read with temporal_support daily (FAO-56 Eq. 12 e_s) and daylight_gauss (diurnal course T_k)
  actual_vapor_pressure: actual vapour pressure e_a, read only with temporal_support daylight_gauss
  canopy_conductance_daylight_samples: per-sample canopy conductance g_c,k, read only with temporal_support daylight_gauss
  shortwave_net: daily net shortwave S_n redistributed over the daylight samples, read only with temporal_support daylight_gauss
  latitude: latitude of the cell, read only with temporal_support daylight_gauss
  day_of_year: day of year, read only with temporal_support daylight_gauss
parameter_map:
  hydrosphere.evapotranspiration.soil_heat_flux_source: explicit process fraction or required signed state G [dimensionless]
  hydrosphere.evapotranspiration.roughness_length: momentum roughness length z0m [m]
  hydrosphere.evapotranspiration.displacement_height: zero plane displacement d [m]
  hydrosphere.evapotranspiration.minimum_conductance: lower bound applied to the canopy_conductance state g_c before r_s = 1 / g_c [m s-1]
  hydrosphere.evapotranspiration.reference_height: meteorological reference height z [m]
  hydrosphere.evapotranspiration.enable_canopy_interception: interception storage switch [dimensionless]
  hydrosphere.evapotranspiration.interception_capacity_per_LAI: canopy storage capacity per LAI [mm]
  hydrosphere.evapotranspiration.canopy_evaporation_efficiency: wet-canopy evaporation multiplier [dimensionless]
  hydrosphere.evapotranspiration.hodge_reference_aerodynamic_conductance: reference aerodynamic conductance g_a of the static Hodge contract; never substituted for a runtime state [m s-1]
  hydrosphere.physical.soil_heat_flux_ratio_daytime: hourly soil heat flux fraction G/Rn for Rn > 0, FAO-56 Eq. 45 [dimensionless]
  hydrosphere.physical.soil_heat_flux_ratio_nighttime: hourly soil heat flux fraction G/Rn for Rn <= 0, FAO-56 Eq. 46 [dimensionless]
  hydrosphere.physical.soil_heat_flux_hourly_max_step: longest step of the FAO-56 hourly G fractions; a longer step raises [s]
  hydrosphere.physical.reference_surface_resistance: FAO-56 reference grass surface resistance r_s,ref, the canopy resistance of canopy_resistance_source fao56_reference_surface and of the reference ET diagnostic [s m-1]
  hydrosphere.physical.heat_to_momentum_roughness_ratio: z0h/z0m roughness ratio [dimensionless]
  hydrosphere.physical.maximum_lai_factor: upper representative LAI for the interception capacity check [m2 m-2]
  hydrosphere.physical.moderate_lai_factor: representative LAI scaling the interception capacity [m2 m-2]
  hydrosphere.physical.atmospheric_pressure_min: minimum valid atmospheric pressure [Pa]
  hydrosphere.physical.atmospheric_pressure_max: maximum valid atmospheric pressure [Pa]
  hydrosphere.numerical.temperature_bounds: valid hydrosphere temperature bounds [K]
  hydrosphere.numerical.net_radiation_bounds: valid net radiation bounds [W m-2]
  hydrosphere.numerical.minimum_wind_speed_offset: wind-speed validation offset [m s-1]
  hydrosphere.numerical.aerodynamic_conductance_bounds: aerodynamic conductance bounds [m s-1]
  hydrosphere.numerical.evapotranspiration_flux_clamp_min: nonnegative ET projection lower bound [kg m-2 s-1]
  hydrosphere.numerical.minimum_wind_speed: minimum wind speed in log profile [m s-1]
  hydrosphere.numerical.canopy_storage_bounds: canopy storage capacity bounds [mm]
  hydrosphere.numerical.mass_conservation_tolerance_mm: canopy water balance tolerance [mm]
  hydrosphere.numerical.critical_mass_balance_error_threshold: critical canopy balance error [mm]
  hydrosphere.numerical.minimum_drainage_flux: precipitation-rate threshold of the interception efficiency diagnostic, converted to a per-step depth by the liquid-water-equivalent rule [kg m-2 s-1]
  validation.numerical.clamp_min_zero: shared zero lower bound for residual projections
operator_map:
  star_ET: build_hodge_contract and build_hodge_terms HodgeStarSpec for vapor transport mobility
  psychrometrics: Tetens saturation vapor pressure, saturation slope, and psychrometric constant
  aerodynamic_closure: logarithmic wind profile or externally supplied aerodynamic resistance
  moist_air_density: rho_a = (p - (1 - epsilon) e_a) / (R_d T) from compute_moist_air_density (Holton and Hakim 2012 Eqs. 2.63-2.64; FAO-56 Annex 3) in the aerodynamic term of the actual and the reference ET
  soil_heat_flux: 'Explicit source: state consumes finite signed surface G; fraction uses G = c_day Rn if Rn > 0, else G = c_night Rn (FAO-56 Eqs. 45-46). Both retain soil_heat_flux_hourly_max_step and feed one PM law.'
  canopy_resistance: declared canopy_resistance_source; state uses surface_resistance or 1 / canopy_conductance, fao56_reference_surface uses the FAO-56 reference grass r_s; no implicit default
  canopy_partition: optional Rutter/Gash-style interception storage partition
  projection: nonnegative ET and canopy storage residual routing
