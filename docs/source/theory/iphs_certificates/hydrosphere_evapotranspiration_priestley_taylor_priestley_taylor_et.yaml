composition_management_map:
  functor_metadata: existing FunctorMetadata declares hydrosphere transport role and soil/energy coupling interfaces
  structural_protocol: declared_forms, required_parameters, build_hodge_terms, dissipative_structure, ports
  state_contract: existing TransportMechanismFunctor and StateManager UpdateItem path
  physical_constant_ssot: thermodynamic and psychrometric constants use get_physical_constant; canonical full keys in HodgeStarSpec are structural bindings, not ordinary parameters
  unit_conversion_owner: UnitConverter converts vapor_pressure_deficit from Pa to kPa for the dynamic alpha response
  ports:
  - priestley_taylor_equilibrium_flux
  - priestley_taylor_latent_heat_flux
dependency_interconnection_map:
  dependencies: no required upstream functor; radiative and atmospheric forcing enter by state keys
  direct_functor_calls: none; radiation and atmospheric forcing are state ports and no upstream Functor instance is invoked
  chain_maps:
  - net_radiation enters available_energy through existing state graph
  - evapotranspiration_flux and latent_heat_flux leave through existing state graph
overflow_routing_map:
  nonnegative_et_projection: negative raw ET is routed to negative_et_projection_residual
  available_energy_closure: Rn - G - available_energy is emitted as available_energy_residual
  discarded_residuals: negative ET projection and available-energy closure are explicit negative_et_projection_residual and available_energy_residual outputs
conservation_map:
  conserved_quantity: paired water-energy port conversion; no complete local water or surface-energy closure is claimed
  balance_expression: q_eq = ET and L_E = lambda q_eq, with lambda the latent heat of each cell's phase (vaporization; sublimation below 273.15 K under the ice option)
  local_check: process-specific hook returns the maximum dimensionless relative residual between emitted L_E and lambda q_eq using the same per-cell lambda as forward; the generic mixed-unit output sum is not used
  port_balance: equilibrium ET and latent heat ports carry the same outgoing evaporative transfer in different units
  open_system_route: matter and energy leave through the declared Priestley-Taylor equilibrium and latent-heat ports
entropy_audit:
  dissipative_operator: star_PT and M_h are symmetric positive semidefinite for positive alpha, Delta/(Delta+gamma), and lambda
  sigma_expression: sigma = A.T star_PT A / T >= 0
  validation_hook: build_hodge_contract(strict=True), dissipative_structure eigenvalue checks, and the paired-port L_E = lambda q_eq conversion hook
equivalence_type: port_equivalent
physical_constant_ssot:
  latent_heat_vaporization: 'get_physical_constant("latent_heat_vaporization")'
  air_specific_heat_cp: 'get_physical_constant("air_specific_heat_cp")'
  molecular_weight_ratio: 'get_physical_constant("water_molecular_weight") / get_physical_constant("air_molecular_weight")'
  tetens_and_temperature_constants: get_physical_constant with canonical relic.physical.constants full keys
  ice_option_constants: 'read only when sub_freezing_phase is ice: psychrometrics.tetens_ice_coefficient_a, psychrometrics.tetens_ice_coefficient_b, water.latent_heat_vaporization_intercept and water.latent_heat_fusion (L_s is their sum of the last two)'
  hodge_structural_binding: canonical physical-constant full keys are retained only as material-source provenance in HodgeStarSpec.parameter_keys
  vpd_unit_conversion: UnitConverter.convert(vapor_pressure_deficit, Pa, kPa)
