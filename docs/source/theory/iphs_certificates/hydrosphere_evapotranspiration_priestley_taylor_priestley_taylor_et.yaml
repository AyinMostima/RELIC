state_map:
  net_radiation: net radiation Rn [W m-2]
  air_temperature: air temperature T [K]
  atmospheric_pressure: surface atmospheric pressure P [Pa]
  soil_heat_flux: signed soil-surface G [W m-2], required only for the explicit state source
  evapotranspiration_flux: energy-limited water vapor mass flux q_eq [kg m-2 s-1]
  latent_heat_flux: latent heat flux lambda q_eq [W m-2]
  diagnostics.evapotranspiration: read-only psychrometric, alpha, energy, and residual diagnostics
  soil_moisture: volumetric soil water of the dynamic alpha, read only when dynamic_alpha_inputs declares it
  vapor_pressure_deficit: vapour pressure deficit of the dynamic alpha, read only when dynamic_alpha_inputs declares it
parameter_map:
  hydrosphere.soil_moisture.porosity: saturated water content theta_s (soil porosity) of theta_fc = f_fc theta_s [m3 m-3]
  hydrosphere.soil_moisture.residual_water_content: residual water content theta_r of theta_wp = f_wp theta_r [m3 m-3]
  hydrosphere.physical.field_capacity_fraction: field capacity fraction [dimensionless]
  hydrosphere.physical.wilting_point_fraction: wilting point fraction [dimensionless]
  hydrosphere.physical.vpd_alpha_baseline: VPD alpha baseline [dimensionless]
  hydrosphere.physical.vpd_alpha_sensitivity: VPD alpha sensitivity [kPa-1]
  hydrosphere.physical.vpd_alpha_threshold: VPD alpha threshold [kPa]
  hydrosphere.physical.atmospheric_pressure_min: minimum valid atmospheric pressure [Pa]
  hydrosphere.physical.atmospheric_pressure_max: maximum valid atmospheric pressure [Pa]
  hydrosphere.evapotranspiration.alpha_pt: Priestley-Taylor alpha coefficient [dimensionless]
  hydrosphere.evapotranspiration.soil_heat_fraction: soil heat flux fraction G/Rn [dimensionless]
  hydrosphere.evapotranspiration.soil_heat_flux_source: explicit fraction or state selection, with no missing-state fallback
  hydrosphere.evapotranspiration.sub_freezing_phase: phase of saturation vapor pressure and latent heat below 273.15 K, liquid (default) or ice; runtime psychrometric terms only, the static Hodge contract stays the liquid reference-state contract [dimensionless]
  hydrosphere.evapotranspiration.enable_dynamic_alpha: dynamic alpha switch [dimensionless]
  hydrosphere.evapotranspiration.alpha_min: minimum alpha [dimensionless]
  hydrosphere.evapotranspiration.alpha_max: maximum alpha [dimensionless]
  hydrosphere.evapotranspiration.stress_threshold: soil moisture stress threshold [dimensionless]
  hydrosphere.evapotranspiration.hodge_reference_atmospheric_pressure: reference atmospheric pressure of the static Hodge contract [Pa]
  hydrosphere.numerical.temperature_bounds: valid hydrosphere temperature bounds [K]
  hydrosphere.numerical.net_radiation_validation_offset: net radiation validation offset [W m-2]
  hydrosphere.numerical.evapotranspiration_flux_clamp_min: nonnegative ET projection lower bound [kg m-2 s-1]
  hydrosphere.numerical.minimum_drainage_flux: minimum flux threshold for diagnostic ratios [kg m-2 s-1]
  validation.numerical.clamp_min_zero: shared zero lower bound for residual projections
  validation.numerical.clamp_max_one: shared unit-interval upper bound for the VPD alpha response
  hydrosphere.evapotranspiration.hodge_reference_air_temperature: reference air temperature of the static Hodge contract [K]
operator_map:
  star_PT: build_hodge_contract and build_hodge_terms HodgeStarSpec for energy-limited ET mobility
  psychrometrics: Tetens saturation vapor pressure, saturation slope, and psychrometric constant; below 273.15 K the ice option evaluates slope and psychrometric constant over ice (Murray 1967 coefficients, latent heat of sublimation)
  alpha_closure: fixed or dynamic Priestley-Taylor alpha coefficient
  energy_partition: G = soil_heat_fraction * Rn for the fraction source or G = state soil_heat_flux for the state source; both use A = Rn - G and one ET expression
  projection: nonnegative ET residual routing
