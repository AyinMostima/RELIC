theory_document: docs\source\theory\hydrosphere_priestley_taylor.md
theory_document_status: updated
legacy_formula: Priestley-Taylor evapotranspiration computes an energy-limited equilibrium water vapor flux from available energy, psychrometric slope, and alpha.
literature_formula: ET = alpha * (Delta / (Delta + gamma)) * (Rn - G) / lambda, following Priestley and Taylor (1972).
iphs_formula: q_eq = star_PT A with A = Rn - G and star_PT = diag(alpha * Delta / ((Delta + gamma) * lambda)) >= 0; latent heat port L_E = lambda q_eq.
legacy_expression: ET = alpha * (Delta/(Delta+gamma)) * available_energy / lambda, then ET is projected to nonnegative flux.
iphs_expression: q_eq = star_PT A plus energy port L_E = lambda q_eq; nonnegative projection and energy residuals are routed as diagnostics.
