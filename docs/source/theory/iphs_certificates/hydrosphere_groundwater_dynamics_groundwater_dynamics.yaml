runtime_replacement_map:
  runtime_uses_iphs: false
  legacy_removed: false
  replacement_entrypoint: forward
  preserved_numerics: The existing exponential porosity storage and water-table solver realize the canonical IPHS field update.
  no_legacy_mode: No runtime flag exposes a separate pre-Phase 8 groundwater branch.
state_advancement_map:
  potential_basis: groundwater storage and head cochain x_gw
  effort_variable: state effort e_z = star_Sy z_h and conjugate port effort y_h = G_h.T e_z = -z_h
  state_advancer: S_dot = F_drain + F_lat - F_pump - F_cap - F_base
  runtime_usage: forward evaluates baseflow from the accepted start-of-step state, applies all five signed boundary terms to one storage and water-table update, maps mass flux to head rate through G_h, and emits namespaced conservation and non-strict IPHS audit diagnostics.
