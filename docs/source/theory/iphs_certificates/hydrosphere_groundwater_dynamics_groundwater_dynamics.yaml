input_output_map:
  groundwater_storage: same storage state is read and replaced by both legacy and IPHS forms
  water_table_depth: same depth state is read and replaced by both legacy and IPHS forms
  drainage_flux: recharge enters the storage balance once as a canonical mass flux
  capillary_rise_flux: the upstream capillary flux is debited once from groundwater storage
  lateral_inflow: lateral inflow enters once as a canonical mass flux
  groundwater_pumping: pumping leaves once as a canonical mass flux
  baseflow_flux: start-of-step recession leaves storage and is emitted as an explicit REPLACE mass flux
