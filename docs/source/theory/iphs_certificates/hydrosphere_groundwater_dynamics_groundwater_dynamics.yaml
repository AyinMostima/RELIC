certificate_version: '1.0'
process_id: relic.scientific.hydrosphere.groundwater.dynamics.GroundwaterDynamics
module_name: groundwater_dynamics
canonical_role: field
iphs_level: 3
iphs_level_evidence:
  classification: IPHS-structured field process certificate
  compatible_basis: Process declares composition-safe IPHS or DEC structure
  runtime_replacement: Production forward path uses the existing canonical wrapper or declaration contract; strict runtime replacement is not claimed at this certificate level.
  canonical_operator: Structured field update through IPHS-compatible operators
  structural_contribution: Field state, operator, and audit maps are declared
  assembly_participation: Certificate participates in Phase 8 inventory and GraphIR structural audit
  level_3_limit: Typed form, Hodge, port, or related structure is declared, but no runtime-linked IPHSStructureSpec contribution and executable level 4 or 5 certificate binding is present.
theory_document: docs\source\theory\hydrosphere_groundwater_dynamics.md
theory_document_status: updated
legacy_formula: Groundwater storage and water-table depth are updated from explicit drainage, lateral, pumping, capillary, and baseflow ports through an exponential porosity-depth relation.
literature_formula: Water-table storage follows integration of a depth-dependent porosity profile and baseflow follows storage-depth recession concepts used in distributed hydrologic models.
iphs_formula: S_dot = F_drain + F_lat - F_pump - F_cap - F_base; S(z) = integral n0 exp(-z/p) dz; star_Sy = diag(rho_w * S_y) >= 0.
legacy_expression: S_new = storage_profile(z_new) + bias, z_new from exponential porosity integral and net groundwater input.
iphs_expression: S_dot = F_drain + F_lat - F_pump - F_cap - F_base; H_h = 0.5 * z_h.T star_Sy z_h; e_z = star_Sy z_h; G_h = -inverse(star_Sy); y_h = G_h.T e_z = -z_h; sigma = z_h.T (star_Sy / tau_gw) z_h >= 0; dH/dt = -sigma + y_h.T u_h + P_residual.
