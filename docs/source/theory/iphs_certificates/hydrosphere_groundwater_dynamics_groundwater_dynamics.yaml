composition_management_map:
  functor_metadata: existing FunctorMetadata declares hydrosphere field role and soil/runoff/capillary coupling interfaces
  structural_protocol: declared_forms, required_parameters, build_hodge_terms, dissipative_structure, ports
  state_contract: existing PhysicalFieldFunctor and StateManager UpdateItem path
  physical_constant_ssot: liquid water density is resolved only through get_physical_constant
  ports:
  - groundwater_recharge_flux
  - groundwater_lateral_inflow_flux
  - groundwater_pumping_flux
  - groundwater_capillary_rise_flux
  - groundwater_baseflow_flux
dependency_interconnection_map:
  dependencies: optional bucket_soil_moisture, richards_soil_moisture, vertical_percolation_transport, and capillary_rise_transport providers
  direct_functor_calls: none; drainage, capillary rise, and optional soil-water providers interconnect through declared state or dependency graph alternatives
  full_state_selection: groundwater_storage writers groundwater_dynamics and subsurface_runoff are mutually exclusive graph alternatives; exactly one may be registered
  chain_maps:
  - drainage_flux enters groundwater storage through the existing state graph
  - capillary_rise_flux is produced once upstream, credited to soil, and debited from groundwater
  - baseflow_flux leaves through the groundwater boundary port
overflow_routing_map:
  storage_balance: storage_increment - net_input is emitted as storage_balance_residual
  storage_roundoff: Higham gamma_8 times the storage ledger scale is emitted as storage_balance_roundoff_bound; the raw residual remains available
  water_table_bounds: water table lower and bedrock bound projection residuals are emitted as water_table_bounds_residual
  storage_negative_projection: max(-new_storage, 0) is emitted as groundwater_storage_negative_residual
  discarded_residuals: storage_balance_residual, storage_balance_roundoff_bound, water_table_bounds_residual, and groundwater_storage_negative_residual explicitly retain every ledger or bound projection term
conservation_map:
  conserved_quantity: water mass
  balance_expression: Delta S = 1000 * dt / rho_w * (F_drain + F_lat - F_pump - F_cap - F_base) plus routed storage_balance_residual
  local_check: FunctorMetadata declares mass and a process-specific hook returns max(abs(storage_balance_residual) - storage_balance_roundoff_bound, 0) in mm for the signed five-port open control volume; the generic mixed output sum is not used
  port_balance: recharge and lateral ports enter while pumping, capillary, and baseflow ports leave
entropy_audit:
  dissipative_operator: star_Sy and M_h are symmetric positive semidefinite for positive rho_w and specific yield
  storage_functional: H_h(z_h) = 0.5 * z_h.T star_Sy z_h
  effort_definition: e_z = star_Sy z_h; G_h = -inverse(star_Sy); y_h = G_h.T e_z = -z_h
  sigma_expression: sigma = z_h.T (star_Sy / tau_gw) z_h >= 0
  dH_balance: dH/dt = -sigma + y_h.T u_h + P_residual, with all terms in kg m-1 s-1
  validation_hook: build_hodge_contract(strict=True), dissipative_structure eigenvalue checks, energy_terms, entropy_terms, the five-port storage residual hook, and diagnostics.groundwater non-strict structured audit outputs
equivalence_type: port_equivalent
physical_constant_ssot:
  water_density: get_physical_constant("water_density")
