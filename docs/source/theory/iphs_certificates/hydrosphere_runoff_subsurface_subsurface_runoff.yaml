  runtime_uses_iphs: false
  legacy_removed: false
  replacement_entrypoint: forward
  preserved_numerics: One production path evaluates the configured baseflow closure, threshold interflow, finite-volume outflow limiter, and open-boundary storage ledger.
  no_legacy_mode: No runtime flag, input alias, default state, or fallback formula exposes a second subsurface-runoff path.
state_advancement_map:
  potential_basis: subsurface storage cochain S_h
  effort_variable: hydraulic gradient g_h with transmissivity mobility star_T
  state_advancer: S1 = S0 + R*dt - Q_total*dt; Q_total includes the capacity-overflow component
  runtime_usage: forward limits regular integrated outlet water by available storage, routes capacity overflow into the canonical outlet, and emits every clipping or limiter residual explicitly.
