module_name: subsurface_runoff
canonical_role: transport
iphs_level: 3
iphs_level_evidence:
  classification: IPHS-structured transport process certificate
  compatible_basis: Process declares composition-safe IPHS or DEC structure
  runtime_replacement: Production forward path uses the existing canonical wrapper or declaration contract; strict runtime replacement is not claimed at this certificate level.
  canonical_operator: DEC/IPHS transport operator with conservative flux routing
  structural_contribution: Cochain, Hodge, flux, and port structures are declared for assembly audit
  assembly_participation: Certificate participates in Phase 8 inventory and GraphIR structural audit
  level_3_limit: Typed form, Hodge, port, or related structure is declared, but no runtime-linked IPHSStructureSpec contribution and executable level 4 or 5 certificate binding is present.
theory_document: docs\source\theory\hydrosphere_subsurface_runoff.md
theory_document_status: updated
legacy_formula: Literature and baseline material retain the exponential-recession, linear-reservoir, point-scale TOPMODEL-style, and threshold-interflow equations for equivalence review.
literature_formula: Lateral subsurface discharge follows a storage-discharge recession law with an optional catchment-mean TOPMODEL closure Q_b = 1000*T0*exp(-lambda)*exp(-S_def/m)*f_theta (Beven and Kirkby, 1979) and a moisture-gated interflow drainage Q_i = k_i*c_i*max(0,theta-theta_t)^n*S of the same store.
iphs_formula: S_dot = I_drain - D_h q_total; q_total = star_T g_h + q_interflow + q_capacity; star_T >= 0.
legacy_expression: Q_candidate = Q_base(S, theta; T0 exp(-lambda)) + Q_interflow(theta, S), retained only as certificate evidence for the single production closure.
iphs_expression: S1 = S0 + R*dt - Q_total*dt; Q_total = Q_actual + O_capacity/dt; Q_actual*dt = min(Q_candidate*dt, S_available).
