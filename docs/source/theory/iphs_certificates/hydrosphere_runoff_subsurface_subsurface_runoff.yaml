  drainage_flux: required incoming drainage boundary flux from soil-water modules [kg m-2 s-1]
  groundwater_storage: groundwater storage S [mm]
  subsurface_runoff_flux: lateral subsurface matter port flow q_h [kg m-2 s-1]
  diagnostics.subsurface_runoff.baseflow_flux: read-only baseflow component [kg m-2 s-1]
  diagnostics.subsurface_runoff.interflow_flux: read-only interflow component [kg m-2 s-1]
  diagnostics.subsurface_runoff.storage_fraction: read-only normalized storage [dimensionless]
  diagnostics.subsurface_runoff.water_table_depth: clipped water-table observation [m]
  diagnostics.subsurface_runoff.recession_time_constant_days: recession-time observation [d]
  diagnostics.subsurface_runoff.drainage_rate_mm_s: converted inlet depth rate [mm s-1]
  diagnostics.subsurface_runoff.total_runoff_rate_mm_s: actual outlet depth rate [mm s-1]
  diagnostics.subsurface_runoff.storage_capacity_overflow: observed portion of subsurface_runoff_flux caused by the capacity projection [mm per time step]
  diagnostics.subsurface_runoff.outflow_limiter_residual: rejected candidate outflow observation [mm per time step]
  diagnostics.subsurface_runoff.water_table_depth_clipping_residual: diagnostic depth clipping residual [m]
  diagnostics.subsurface_runoff.water_balance_residual: open control-volume balance residual [mm per time step]
