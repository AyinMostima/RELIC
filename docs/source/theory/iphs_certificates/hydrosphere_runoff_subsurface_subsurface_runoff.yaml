composition_management_map:
  functor_metadata: existing FunctorMetadata declares hydrosphere transport role and runoff coupling interfaces
  structural_protocol: declared_forms, required_parameters, build_hodge_terms, dissipative_structure, ports
  state_contract: existing TransportMechanismFunctor and StateManager UpdateItem path
  physical_constant_ssot:
  - get_physical_constant(water_density)
  - get_physical_constant(seconds_per_day)
  ports:
  - subsurface_runoff_boundary_flux
dependency_interconnection_map:
  dependencies: get_dependencies declares BucketSoilMoisture, RichardsSoilMoisture, and VerticalPercolationTransport as optional compile-time alternative drainage providers; an external adapter may instead provide the complete canonical state
  direct_functor_calls: none; optional soil-water or percolation providers supply state and the module calls no provider instance
  chain_maps:
  - drainage_flux from the selected soil-water or percolation closure to groundwater_storage
  - subsurface_runoff_flux to routing, channel, or pedosphere coupling through existing state graph
overflow_routing_map:
  storage_capacity_projection: max(S_unbounded - S_max, 0) is included in subsurface_runoff_flux and observed as diagnostics.subsurface_runoff.storage_capacity_overflow
  storage_depletion: max(Q_candidate * dt - S_available, 0) is emitted as diagnostics.subsurface_runoff.outflow_limiter_residual; only Q_actual crosses the matter port
  water_table_bounds: diagnostic depth lower and upper clipping residuals are summed into water_table_depth_clipping_residual
  balance_observation: diagnostics.subsurface_runoff.water_balance_residual records the complete open-ledger residual
  discarded_residuals: storage overflow enters subsurface_runoff_flux and is also observed, outflow limiting and water-table clipping have explicit residual outputs, and water_balance_residual records closure
conservation_map:
  conserved_quantity: water mass
  balance_expression: S1 = S0 + R*dt - Q_total*dt, where Q_total includes O_capacity/dt
  local_check: metadata declares mass and check_conservation_laws returns the maximum absolute diagnostics.subsurface_runoff.water_balance_residual for the explicit open control volume
  port_balance: drainage_flux is the inlet and subsurface_runoff_boundary_flux is the unique export; its capacity-overflow component is explicitly observed
entropy_audit:
  dissipative_operator: star_T = M_h = diag(rho_w*T0*exp(-lambda)) [kg m-2 s-1] is symmetric positive semidefinite for positive rho_w, transmissivity and exp(-lambda)
  sigma_expression: sigma = X_h.T star_T X_h >= 0
  validation_hook: build_hodge_contract(strict=True) and dissipative_structure eigenvalue checks
equivalence_type: port_equivalent
