runtime_replacement_map:
  runtime_uses_iphs: false
  legacy_removed: false
  replacement_entrypoint: forward
  preserved_numerics: The existing SCS/Horton/saturation closures realize the canonical surface port flow.
  no_legacy_mode: No runtime flag exposes a separate pre-Phase 8 surface runoff branch.
state_advancement_map:
  potential_basis: surface water source cochain u_surf
  effort_variable: routing gradient X_surf [m-1] acted on by positive structural mobility star_surf
  state_advancer: m_dot = G_surf u_surf; u_surf = min(P, max(0, rho_w * Q))
  runtime_usage: forward applies the canonical surface runoff port flow and routes nonnegative projection residuals.
