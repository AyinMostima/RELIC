references:
- Horton, R.E. (1933). The role of infiltration in the hydrologic cycle. Transactions, American Geophysical Union, 14, 446-460.
- Dunne, T. and Black, R.D. (1970). Partial area contributions to storm runoff. Water Resources Research, 6, 1296-1311.
- 'SCS (1972). National Engineering Handbook, Section 4: Hydrology.'
- 'USDA NRCS (2021). National Engineering Handbook, Part 650, Chapter 2: Estimating Runoff Volume and Peak Discharge.'
- Chow, V.T., Maidment, D.R., and Mays, L.W. (1988). Applied Hydrology. McGraw-Hill.
