- test\audit\phase8_scientific_inventory.test.py
state_map:
  precipitation_flux: boundary precipitation mass flux P, read only with surface_water_input_source precipitation_flux [kg m-2 s-1]
  rain_flux: rain reaching the ground from the snowpack partition, read only with surface_water_input_source rain_flux_plus_snow_melt_flux [kg m-2 s-1]
  snow_melt_flux: snowmelt release of the snowpack, read with rain_flux only under surface_water_input_source rain_flux_plus_snow_melt_flux [kg m-2 s-1]
  soil_moisture: scalar surface moisture or vertical antecedent profile whose uppermost layer is theta[0] [m3 m-3]
  surface_runoff_flux: overland matter port flow u_surf [kg m-2 s-1]
  infiltration_flux: precipitation minus surface runoff [kg m-2 s-1]
  diagnostics.surface_runoff.scs_retention: effective moisture-adjusted S used by the SCS equation [mm]
  diagnostics.surface_runoff.initial_abstraction: effective Ia=lambda_a*S used by the SCS equation [mm]
  diagnostics.surface_runoff.*: read-only partition, unit-conversion, and residual observations
parameter_map:
  hydrosphere.transport.surface_water_diffusivity: D_surf mobility scale [m2 s-1]
  hydrosphere.runoff.curve_number: SCS curve number [dimensionless]
  hydrosphere.runoff.initial_abstraction_ratio: initial abstraction ratio lambda [dimensionless]
  hydrosphere.runoff.infiltration_capacity: Horton infiltration capacity Ic [mm h-1]
  hydrosphere.runoff.saturated_area_threshold: saturation excess threshold [m3 m-3]
  hydrosphere.runoff.runoff_method: configured runoff closure
  hydrosphere.runoff.runoff_combination_method: max or sum combination rule
  hydrosphere.runoff.surface_water_input_source: declared surface water input (precipitation_flux or rain_flux_plus_snow_melt_flux); instance config overrides the YAML value
  hydrosphere.runoff.antecedent_moisture_factor: SCS antecedent moisture multiplier
  hydrosphere.runoff.scs_storage_minimum: minimum SCS storage [mm]
  hydrosphere.runoff.moisture_adjustment_factor: soil-moisture adjustment factor
  hydrosphere.runoff.infiltration_moisture_reduction_factor: Horton capacity reduction factor
  hydrosphere.physical.scs_numerator_constant: SCS retention numerator [mm]
  hydrosphere.physical.scs_offset_constant: SCS retention offset [mm]
  hydrosphere.numerical.minimum_flux_threshold: runoff coefficient threshold [kg m-2 s-1]
physical_constant_ssot:
  water_density: get_physical_constant("water_density") [kg m-3]
  seconds_per_hour: get_physical_constant("seconds_per_hour") [s]
operator_map:
  G_surf: surface_runoff_boundary_flux port incidence
  G_infiltration: soil_infiltration_boundary carries canonical infiltration_flux to the selected soil-water process
  star_surf: build_hodge_contract maps routing gradient X_surf [m-1] through rho_w*D_surf [kg m-1 s-1] to mass flux [kg m-2 s-1]
  runoff_closure: _compute_scs_runoff, _compute_hortonian_runoff, _compute_saturation_runoff, or _compute_combined_runoff
  unit_conversion: UnitConverter mass flux and depth-rate conversions
unit_map:
