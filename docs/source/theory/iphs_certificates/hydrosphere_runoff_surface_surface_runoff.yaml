  infiltration_flux: kg m-2 s-1
  diagnostics.surface_runoff.runoff_coefficient: dimensionless
  diagnostics.surface_runoff.precipitation_rate_mm_h: mm h-1
  diagnostics.surface_runoff.runoff_rate_mm_h: mm h-1
  diagnostics.surface_runoff.scs_retention: mm
  diagnostics.surface_runoff.initial_abstraction: mm
