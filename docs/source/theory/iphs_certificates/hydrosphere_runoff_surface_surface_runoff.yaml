composition_management_map:
  functor_metadata: existing FunctorMetadata declares hydrosphere transport role and routing interfaces
  structural_protocol: declared_forms, required_parameters, build_hodge_terms, dissipative_structure, ports
  state_contract: existing TransportMechanismFunctor and StateManager UpdateItem path
  ports:
  - surface_runoff_boundary_flux
  - soil_infiltration_boundary
dependency_interconnection_map:
  dependencies: get_dependencies creates no reverse edge to a soil-state writer; the selected downstream soil process owns the optional surface_runoff edge, and external StateManager soil_moisture is valid; with surface_water_input_source rain_flux_plus_snow_melt_flux the SCM owner of rain_flux and snow_melt_flux (snow_pack) is a required dependency, so the snowpack partition runs first in the same step
  excluded_alternative: bucket_soil_moisture is not a dependency because it is the mutually exclusive surface_runoff_flux closure
  direct_functor_calls: none; precipitation and soil state enter through ports and the selected downstream soil process is graph-connected
  chain_maps:
  - precipitation boundary cochain to surface_runoff_boundary_flux port
  - infiltration_flux through the typed surface_soil_water_interface port to the selected soil-water process
  - surface_runoff_flux to channel routing or surface water coupling through existing state graph
overflow_routing_map:
  nonnegative_projection: max(-F_raw, 0) is emitted as diagnostics.surface_runoff.runoff_nonnegative_residual
  precipitation_limit: max(F_positive - precipitation, 0) is emitted as diagnostics.surface_runoff.precipitation_limit_residual
  infiltration_balance: infiltration_flux = precipitation - surface_runoff_flux
  discarded_residuals: nonnegative and precipitation-limit projections are explicit residual diagnostics, while infiltration_flux equals precipitation minus accepted runoff and water_balance_residual records closure
conservation_map:
  conserved_quantity: water mass
  balance_expression: P_in = surface_runoff_flux + infiltration_flux, with P_in = precipitation_flux or rain_flux + snow_melt_flux per the declared surface_water_input_source (never both)
  local_check: check_conservation_laws returns the maximum absolute diagnostics.surface_runoff.water_balance_residual for the explicit open-port partition
  graph_ledger: diagnostics.surface_runoff.water_balance_residual = precipitation - surface_runoff_flux - infiltration_flux
  open_system_route: surface_runoff_boundary_flux exports runoff and infiltration_flux enters the soil graph
entropy_audit:
  dissipative_operator: star_surf and M_h are symmetric positive semidefinite for positive rho_w and D_surf
  sigma_expression: sigma = X_surf.T star_surf X_surf >= 0
  validation_hook: passive Hodge and dissipative_structure eigenvalue checks; strict IPHS thermodynamic closure is not claimed
equivalence_type: port_equivalent
