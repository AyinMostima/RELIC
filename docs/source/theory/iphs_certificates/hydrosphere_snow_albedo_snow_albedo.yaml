composition_management_map:
  functor_metadata: "existing FunctorMetadata declares PhysicalField role and radiation/energy coupling interfaces"
  structural_protocol: "declared_forms, required_parameters, build_hodge_terms, dissipative_structure, ports"
  state_contract: "existing PhysicalFieldFunctor and StateManager UpdateItem path"
  physical_constant_ssot: "seconds per day is resolved only through get_physical_constant"
  ports:
    - "snow_albedo_radiation_port"
dependency_interconnection_map:
  dependencies: "lagged dependency on snow_pack; every forcing input and the scheme-owned age state (snow_nondimensional_age for bats, snow_surface_age for age_based) are required state keys: a missing one raises and no state default is substituted"
  direct_functor_calls: "none; snow_pack is a lagged state dependency and no SnowPack instance is called"
  chain_maps:
    - "snow_depth and snowfall enter the snow-present and fresh-snow reset masks"
    - "surface_albedo and the scheme-owned age state (snow_nondimensional_age for bats, snow_surface_age for age_based) leave through existing state graph"
overflow_routing_map:
  albedo_clipping: "alpha bound projection residual is routed to diagnostics.snow_albedo.albedo_clipping_residual"
  shortwave_partition: "absorbed shortwave fraction 1 - alpha_s is routed to diagnostics.snow_albedo.snow_absorbed_shortwave_fraction"
  radiation_port_power: "P_rad = I_sw * (1 - alpha_s) is routed to diagnostics.snow_albedo.snow_albedo_radiation_port_power when the port effort is present"
  snow_age_tendency: "the active age tendency is routed to diagnostics.snow_albedo.snow_nondimensional_age_tendency [s-1] for bats or diagnostics.snow_albedo.snow_age_tendency [day s-1] for age_based"
  discarded_residuals: "albedo_clipping_residual is explicit, absorbed shortwave and radiation-port power are routed diagnostics, and snow-age tendency is retained"
conservation_map:
  conserved_quantity: "surface shortwave energy diagnostic partition"
  balance_expression: "I_abs = (1 - alpha_s) I_sw, I_ref = alpha_s I_sw, and P_rad = I_sw * (1 - alpha_s)"
  local_check: "FunctorMetadata.conservation_laws includes energy; SnowAlbedo.check_conservation_laws returns r_E = max|alpha_s + a_sw - 1| as the partition closure residual"
  port_balance: "snow_albedo_radiation_port carries incoming shortwave effort and absorbed fraction flow"
entropy_audit:
  dissipative_operator: "star_alpha and M_h are symmetric positive semidefinite for 0 <= alpha_s <= 1"
  sigma_expression: "sigma = I_sw.T star_alpha I_sw / T_surface >= 0 for I_sw >= 0 and T_surface > 0; sigma_age = (d a_s/dt)^2 >= 0 is emitted as a diagnostic tendency audit for the scheme-owned age state"
  validation_hook: "build_hodge_contract(strict=True) and dissipative_structure eigenvalue checks"
equivalence_type: "diagnostic"
physical_constant_ssot:
  seconds_per_day: 'get_physical_constant("seconds_per_day")'

