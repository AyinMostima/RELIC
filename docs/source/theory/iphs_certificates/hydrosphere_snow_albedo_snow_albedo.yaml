references:
  - "Dickinson, R.E., Henderson-Sellers, A., Kennedy, P.J. (1993). Biosphere-Atmosphere Transfer Scheme (BATS) Version 1e as Coupled to the NCAR Community Climate Model."
  - "Warren, S.G. (1982). Optical properties of snow. Reviews of Geophysics and Space Physics, 20, 67-89."
  - "Wiscombe, W.J. and Warren, S.G. (1980). A model for the spectral albedo of snow. Journal of the Atmospheric Sciences, 37, 2712-2733."
  - "Molotch, N.P. and Bales, R.C. (2006). SNTHERM model validation using laboratory experiments. Journal of Geophysical Research, 111, D23105."
