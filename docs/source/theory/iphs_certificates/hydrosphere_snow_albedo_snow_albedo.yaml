certificate_version: "1.0"
process_id: "relic.scientific.hydrosphere.snow.albedo.SnowAlbedo"
module_name: "snow_albedo"
canonical_role: "observation"
iphs_level: 1
iphs_level_evidence:
  classification: "IPHS-compatible diagnostic or observation certificate"
  compatible_basis: "Read-only observation or diagnostic contract with declared Hodge, radiation port power audit, and no independent water or energy storage ownership"
theory_document: "docs\\source\\theory\\hydrosphere_snow_albedo.md"
theory_document_status: "updated"
legacy_formula: "SnowAlbedo computes dynamic surface albedo from snow age, snow temperature, solar zenith angle, snow depth, and fresh snowfall reset rules."
literature_formula: "BATS snow albedo evolves snow surface age with temperature, melt/refreeze, and dust terms, then computes broadband albedo from visible and near-infrared components; age-based mode uses alpha = alpha_old + (alpha_fresh - alpha_old) exp(-age/tau)."
iphs_formula: "alpha_s is a typed diagnostic 0-cochain, absorbed shortwave fraction is q_rad = star_alpha I_sw with star_alpha = diag(1 - alpha_s) >= 0, and port power is P_rad = I_sw * (1 - alpha_s)."
legacy_expression: "alpha_s = clamp(Phi_age(age,T,theta_z), alpha_min, alpha_max), with no-snow bare-ground continuation alpha_old * bare_ground_albedo_factor."
iphs_expression: "q_rad = star_alpha I_sw, P_rad = I_sw * (1 - alpha_s), and d age_s/dt = (age_s_next - age_s_start) / dt; clipping, no-snow projection, port-power, and age-tendency residuals are routed through diagnostics.snow_albedo."
input_variables:
  - "snowfall"
  - "snow_surface_temperature"
  - "air_temperature"
  - "solar_zenith_angle"
  - "snow_depth"
  - "shortwave_down"
output_variables:
