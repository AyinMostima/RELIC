runtime_replacement_map:
  runtime_uses_iphs: false
  legacy_removed: false
  replacement_entrypoint: forward
  preserved_numerics: The existing temperature-index SWE update realizes the canonical IPHS snowpack field balance.
  no_legacy_mode: No runtime flag exposes a separate pre-Phase 8 SnowPack branch.
state_advancement_map:
  potential_basis: snow water equivalent state cochain SWE_h
  effort_variable: accumulation and melt matter ports with SWE metric star_SWE
  state_advancer: dSWE_dt = accumulation - melt - sublimation
  runtime_usage: forward applies the canonical SWE field balance and routes melt, sublimation, and nonnegative projection residuals.
  time_integration: sequential starting-inventory melt then sublimation caps, followed by snowfall addition and nonnegative SWE replacement; no second time multiplication
  sub_flow_accuracy: FunctorMetadata.sub_flow_accuracy ORDER_1 conservatively for the complete update; fixed-input inactive-cap affine branches are exact to roundoff, while T11 demonstrates first-order replenishment error and a non-semigroup exported-flux partition at depletion
  splitting_boundary: the existing S1 same-fast-group snowpack-to-bucket flux-coupling refusal remains; ORDER_1 is not global EXACT, second-order Strang or strict IPHS certification
parameter_management_map:
  hydrosphere.snow.degree_day_factor:
    source: ParameterManager YAML
  hydrosphere.snow.temperature_threshold_warm:
    source: ParameterManager YAML
  hydrosphere.snow.rain_snow_temperature_threshold:
    source: ParameterManager YAML
  hydrosphere.snow.snow_density:
    source: ParameterManager YAML
composition_management_map:
  functor_metadata: existing FunctorMetadata declares PhysicalField role and snow albedo, runoff, and energy coupling interfaces
  structural_protocol: declared_forms, required_parameters, build_hodge_terms, dissipative_structure, ports
  state_contract: existing PhysicalFieldFunctor and StateManager UpdateItem path
  physical_constant_ssot: seconds per day and liquid water density are resolved only through get_physical_constant; the Hodge water-density key is structural provenance, not runtime ParameterManager access
  ports:
  - snowpack_accumulation_port
  - snowpack_melt_release_port
dependency_interconnection_map:
  dependencies: no required upstream functor; precipitation, temperature, SWE, and sublimation enter by state keys
  direct_functor_calls: none; precipitation, temperature, SWE, and sublimation enter through state ports and no upstream Functor instance is invoked
  chain_maps:
  - snowfall output feeds SnowAlbedo fresh-snow reset through existing state graph
  - snow_melt_flux and rain_flux feed runoff or hydrologic routing through existing state graph
  - snow_depth feeds SnowAlbedo and surface energy diagnostics through existing state graph
overflow_routing_map:
  melt_capacity: raw degree-day melt exceeding available SWE is routed to diagnostics.snow_pack.melt_capacity_residual_mm_s
  sublimation_capacity: raw sublimation exceeding post-melt SWE is routed to diagnostics.snow_pack.sublimation_capacity_residual_mm_s
  storage_projection: negative SWE projection is routed to diagnostics.snow_pack.swe_nonnegative_projection_residual_mm
  discarded_residuals: melt_capacity_residual_mm_s, sublimation_capacity_residual_mm_s, and swe_nonnegative_projection_residual_mm explicitly retain every storage or capacity projection
conservation_map:
  conserved_quantity: snowpack water mass
  balance_expression: SWE_new - SWE_old = (P_snow - M - E_sub) dt after explicit capacity residual routing
  local_check: FunctorMetadata.conservation_laws includes mass
  port_balance: accumulation and melt release ports carry incoming and outgoing water mass fluxes
entropy_audit:
  dissipative_operator: star_SWE and M_h are symmetric positive semidefinite for rho_w > 0
  sigma_expression: sigma = m_dot.T star_SWE m_dot >= 0
  validation_hook: build_hodge_contract(strict=True) and dissipative_structure eigenvalue checks
equivalence_type: thermodynamic_embedding
physical_constant_ssot:
  seconds_per_day: 'get_physical_constant("seconds_per_day")'
  water_density: 'get_physical_constant("water_density")'
  hodge_structural_binding: relic.physical.constants.water.density_liquid is retained only in HodgeStarSpec.parameter_keys because that central contract requires a non-empty structural source tuple
