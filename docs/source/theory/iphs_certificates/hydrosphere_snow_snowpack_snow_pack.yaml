  snow_water_equivalent: snow water equivalent storage SWE [mm]
  sublimation_flux: snow sublimation mass flux [kg m-2 s-1]
  snow_depth: bulk-density snow depth estimate [m]
  snow_melt_flux: meltwater release mass flux [kg m-2 s-1]
  rain_flux: rainfall mass flux after phase partition [kg m-2 s-1]
  snowfall: snowfall mass flux after phase partition [kg m-2 s-1]
  diagnostics.snow_pack: read-only mass partition, storage, and residual diagnostics
parameter_map:
  hydrosphere.snow.degree_day_factor: degree-day melt factor DDF [mm K-1 day-1]
  hydrosphere.snow.temperature_threshold_warm: melt threshold temperature T_melt [K]
  hydrosphere.snow.rain_snow_temperature_threshold: rain-snow partition temperature [K]
  hydrosphere.snow.snow_density: bulk snow density rho_snow [kg m-3]
operator_map:
