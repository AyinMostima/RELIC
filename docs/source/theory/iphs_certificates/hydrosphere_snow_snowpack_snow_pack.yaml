certificate_version: '1.0'
process_id: relic.scientific.hydrosphere.snow.snowpack.SnowPack
module_name: snow_pack
canonical_role: field
iphs_level: 3
iphs_level_evidence:
  classification: IPHS-structured field process certificate
  compatible_basis: Process declares composition-safe IPHS or DEC structure
  runtime_replacement: Production forward path uses the existing canonical wrapper or declaration contract; strict runtime replacement is not claimed at this certificate level.
  canonical_operator: Structured field update through IPHS-compatible operators
  structural_contribution: Field state, operator, and audit maps are declared
  assembly_participation: Certificate participates in Phase 8 inventory and GraphIR structural audit
  level_3_limit: Typed form, Hodge, port, or related structure is declared, but no runtime-linked IPHSStructureSpec contribution and executable level 4 or 5 certificate binding is present.
theory_document: docs\source\theory\hydrosphere_snowpack.md
theory_document_status: updated
legacy_formula: SnowPack partitions precipitation into snowfall and rain, computes degree-day melt, subtracts sublimation, and updates snow water equivalent and snow depth.
literature_formula: dSWE/dt = P_snow - M - E_sub with M = DDF max(0, T_air - T_melt) / seconds_per_day, following Anderson (1976) and Hock (2003).
iphs_formula: SWE is a typed storage 0-cochain and dSWE/dt = star_SWE (P_snow - M - E_sub), with star_SWE = diag(1000 / rho_w) >= 0.
legacy_expression: SWE_new = max(0, SWE_old + (P_snow - M - E_sub) dt); snow_depth = SWE_mm / 1000 * rho_w / rho_snow.
iphs_expression: dSWE/dt = star_SWE m_dot plus accumulation and melt matter ports; melt, sublimation, and nonnegative storage projection residuals are routed to diagnostics.snow_pack.
input_variables:
- precipitation_flux
- air_temperature
- snow_water_equivalent
- sublimation_flux
output_variables:
- snow_water_equivalent
- snow_depth
- snow_melt_flux
- rain_flux
- snowfall
- diagnostics.snow_pack
parameter_keys:
