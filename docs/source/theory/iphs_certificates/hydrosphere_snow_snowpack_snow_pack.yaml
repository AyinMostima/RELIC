- snowpack_melt_release_port
references:
- Anderson, E.A. (1976). A point energy and mass balance model of a snow cover. NOAA Technical Report NWS 19.
- Hock, R. (2003). Temperature index melt modeling in mountain areas. Journal of Hydrology, 282, 104-115.
