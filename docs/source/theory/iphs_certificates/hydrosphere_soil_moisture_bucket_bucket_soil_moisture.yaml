state_map:
  soil_moisture: volumetric soil water content theta [m3 m-3]
  precipitation_flux: incoming precipitation matter flux P, read only with water_input_source precipitation_flux [kg m-2 s-1]
  rain_flux: rain reaching the ground from the snowpack partition, read only with water_input_source rain_flux_plus_snow_melt_flux [kg m-2 s-1]
  snow_melt_flux: snowmelt release of the snowpack, read with rain_flux only under water_input_source rain_flux_plus_snow_melt_flux [kg m-2 s-1]
  evapotranspiration_flux: outgoing evapotranspiration matter flux ET [kg m-2 s-1]
  surface_runoff_flux: saturation-excess runoff matter flux Q [kg m-2 s-1]
  drainage_flux: deep drainage matter flux D [kg m-2 s-1]
  diagnostics.soil_moisture_bucket: read-only residual and water-stress diagnostics
parameter_map:
  hydrosphere.soil_moisture.soil_depth: effective bucket depth Z [m]
  hydrosphere.soil_moisture.field_capacity: field capacity theta_fc [m3 m-3]
  hydrosphere.soil_moisture.wilting_point: wilting point theta_wp [m3 m-3]
  hydrosphere.soil_moisture.porosity: saturation theta_sat [m3 m-3]
  hydrosphere.soil_moisture.saturated_hydraulic_conductivity: saturated hydraulic conductivity K_sat [m s-1]
  hydrosphere.soil_moisture.drainage_factor: free-drainage factor f_d of K_eff = f_d K_sat [dimensionless]
  hydrosphere.soil_moisture.drainage_exponent: drainage power-law exponent b [dimensionless]
  hydrosphere.soil_moisture.water_input_source: declared water input (precipitation_flux or rain_flux_plus_snow_melt_flux); instance config overrides the YAML value
operator_map:
  B_h: bucket storage balance incidence for P, ET, Q, and D
  star_K: build_hodge_contract and build_hodge_terms HodgeStarSpec
  runoff_closure: saturation-excess projection above theta_sat
  drainage_closure: K_sat * f_drainage * (theta / theta_sat)^b limited by water above field capacity
  unit_conversion: mass flux divided by rho_w and storage conversion theta * Z * rho_w
  time_integration: sequential held-input P-ET, saturation-excess runoff, explicit power-law drainage and bounded replacement of the integrated soil_moisture state; no second time multiplication
  sub_flow_accuracy: FunctorMetadata.sub_flow_accuracy ORDER_1 on smooth inactive-limit branches; the unforced witness is theta_dot = -k theta^b with k = K_sat f_D / (Z theta_sat^b), advanced by explicit Euler; T11 validates the independent analytic solution and records the coarse drainage-cap plateau
  splitting_boundary: the existing S1 same-fast-group snowpack-to-bucket flux-coupling refusal is unchanged; ORDER_1 is neither an EXACT declaration nor second-order Strang certification
unit_map:
  soil_moisture: m3 m-3
  precipitation_flux: kg m-2 s-1
  rain_flux: kg m-2 s-1
  snow_melt_flux: kg m-2 s-1
  evapotranspiration_flux: kg m-2 s-1
  surface_runoff_flux: kg m-2 s-1
  drainage_flux: kg m-2 s-1
  diagnostics.soil_moisture_bucket.soil_moisture_change_rate: m3 m-3 s-1
  diagnostics.soil_moisture_bucket.soil_water_storage: kg m-2
  diagnostics.soil_moisture_bucket.clipped_mass_residual: kg m-2 s-1
  diagnostics.soil_moisture_bucket.drainage_limiter_residual: m s-1
input_output_map:
  soil_moisture: same theta state is read and replaced by both legacy and IPHS forms
  precipitation_flux: same incoming boundary flux drives storage gain under water_input_source precipitation_flux
  rain_flux: with snow_melt_flux, the incoming boundary flux P = rain_flux + snow_melt_flux under water_input_source rain_flux_plus_snow_melt_flux
  snow_melt_flux: with rain_flux, the incoming boundary flux P = rain_flux + snow_melt_flux under water_input_source rain_flux_plus_snow_melt_flux
  evapotranspiration_flux: same outgoing boundary flux is limited by water above wilting point
  surface_runoff_flux: same saturation-excess output is emitted through UpdateItem(REPLACE)
  drainage_flux: same corrected drainage output is emitted through UpdateItem(REPLACE)
