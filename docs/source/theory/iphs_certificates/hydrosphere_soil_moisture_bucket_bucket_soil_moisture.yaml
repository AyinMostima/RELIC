composition_management_map:
  functor_metadata: existing FunctorMetadata declares hydrosphere transport role and ET/runoff/groundwater coupling interfaces
  structural_protocol: declared_forms, required_parameters, build_hodge_terms, dissipative_structure, ports
  state_contract: existing TransportMechanismFunctor and StateManager UpdateItem path
  ports:
  - bucket_evapotranspiration_flux
  - bucket_surface_runoff_flux
  - bucket_drainage_flux
dependency_interconnection_map:
  dependencies: no required or optional dependency; Penman-Monteith and Priestley-Taylor ET providers are declared lagged alternatives, while external StateManager forcing remains valid; with water_input_source rain_flux_plus_snow_melt_flux the SCM owner of rain_flux and snow_melt_flux (snow_pack) is a lagged provider, so the committed snowpack outflow is consumed and, when the snowpack runs in a slower execution group, held between its calls as an acknowledged zero-order hold
  direct_functor_calls: none; precipitation and evapotranspiration are state ports and ET providers are lagged alternatives rather than invoked instances
  chain_maps:
  - precipitation_flux boundary input to soil_moisture storage
  - evapotranspiration_flux, surface_runoff_flux, and drainage_flux leave through existing state graph
overflow_routing_map:
  saturation_projection: theta above saturation is routed to surface_runoff_flux
  wilting_projection: lower-bound storage projection is reflected in clipped_mass_residual
  drainage_limit: potential drainage minus corrected drainage is emitted as drainage_limiter_residual
  discarded_residuals: saturation excess is routed to surface_runoff_flux, lower-bound projection is retained in clipped_mass_residual, and drainage_limiter_residual records potential minus accepted drainage
conservation_map:
  conserved_quantity: water mass
  balance_expression: Delta theta * Z * rho_w / dt = P - ET - Q - D - clipped_mass_residual, with P = precipitation_flux or rain_flux + snow_melt_flux per the declared water_input_source (never both)
  local_check: check_conservation_laws reads only diagnostics.soil_moisture_bucket.clipped_mass_residual
  port_balance: bucket ET, runoff, and drainage ports carry outgoing matter
entropy_audit:
  dissipative_operator: star_K and M_h are symmetric positive semidefinite for positive rho_w and K_sat
  sigma_expression: sigma = X_h.T star_K X_h >= 0
  validation_hook: build_hodge_contract(strict=True) and dissipative_structure eigenvalue checks
equivalence_type: port_equivalent
