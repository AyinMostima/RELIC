runtime_replacement_map:
  runtime_uses_iphs: false
  legacy_removed: false
  replacement_entrypoint: forward
  preserved_numerics: The existing mass-conservative bucket water balance realizes the canonical IPHS storage-port equation.
  no_legacy_mode: No runtime flag exposes a separate pre-Phase 8 bucket branch.
state_advancement_map:
  potential_basis: bucket soil water storage cochain theta_h
  effort_variable: infiltration, ET, runoff, and drainage matter ports with storage capacity rho_w Z
  state_advancer: theta_dot = (P - ET - Q - D) / (rho_w * Z)
  runtime_usage: forward applies the canonical bucket storage-port balance and routes overflow or clipping residuals.
