certificate_version: '1.0'
process_id: relic.scientific.hydrosphere.soil_moisture.bucket.BucketSoilMoisture
module_name: bucket_soil_moisture
canonical_role: transport
iphs_level: 3
iphs_level_evidence:
  classification: IPHS-structured transport process certificate
  compatible_basis: Process declares composition-safe IPHS or DEC structure
  runtime_replacement: Production forward path uses the existing canonical wrapper or declaration contract; strict runtime replacement is not claimed at this certificate level.
  canonical_operator: DEC/IPHS transport operator with conservative flux routing
  structural_contribution: Cochain, Hodge, flux, and port structures are declared for assembly audit
  assembly_participation: Certificate participates in Phase 8 inventory and GraphIR structural audit
  level_3_limit: Typed form, Hodge, port, or related structure is declared, but no runtime-linked IPHSStructureSpec contribution and executable level 4 or 5 certificate binding is present.
theory_document: docs\source\theory\hydrosphere_bucket.md
theory_document_status: updated
legacy_formula: The bucket model updates volumetric soil moisture from precipitation minus evapotranspiration, saturation-excess runoff, and drainage.
literature_formula: Single-layer bucket hydrology conserves water storage through P - ET - Q - D and uses empirical runoff and drainage closures bounded by wilting point and saturation.
iphs_formula: theta_dot = (P - ET - Q - D) / (rho_w * Z); q = star_K g_h; star_K = diag(rho_w * K_sat) >= 0.
legacy_expression: theta_new = clamp(theta + (P - ET - Q - D) * dt / (rho_w * Z), theta_wp, theta_sat), with flux correction for mass closure.
iphs_expression: theta_dot = (P - ET - Q - D) / (rho_w * Z); sigma = X_h.T star_K X_h >= 0.
input_variables:
- soil_moisture
- precipitation_flux
- evapotranspiration_flux
- rain_flux
- snow_melt_flux
output_variables:
- soil_moisture
- surface_runoff_flux
