composition_management_map:
  functor_metadata: existing FunctorMetadata declares hydrosphere transport role and ET/runoff/groundwater coupling interfaces
  structural_protocol: declared_forms, required_parameters, build_hodge_terms, dissipative_structure, ports
  state_contract: existing TransportMechanismFunctor and StateManager UpdateItem path
  physical_constant_ssot: water density and gravity are resolved only through get_physical_constant
  ports:
  - soil_infiltration_boundary
  - soil_evapotranspiration_boundary
  - soil_capillary_boundary
  - richards_drainage_flux
dependency_interconnection_map:
  dependencies: surface runoff, mutually exclusive ET producers, and capillary rise transport are same-step optional dependencies; external StateManager surface inputs remain valid, while capillary input requires explicit lower-boundary selection
  direct_functor_calls: none_no_direct_functor_calls
  chain_maps:
  - infiltration_flux enters the surface boundary through the existing state graph
  - evapotranspiration_flux leaves the surface boundary through the existing state graph
  - capillary_rise_flux enters the selected lower boundary through the existing state graph
  - drainage_flux leaves lower boundary through the existing state graph
overflow_routing_map:
  moisture_bounds: canonical moisture projection residual is emitted as moisture_clipping_residual
  mass_error: relative open-boundary water-ledger residual is emitted as mass_conservation_error
  invalid_flux_step: source-sink flux failures fail fast instead of substituting zero flux
  discarded_residuals: none for the canonical state-driven runtime
conservation_map:
  conserved_quantity: water mass
  balance_expression: dM/dt = infiltration_flux - evapotranspiration_flux + capillary_rise_flux - drainage_flux, with capillary_rise_flux active only for the selected lower-boundary mode
  local_check: metadata declares mass and check_conservation_laws returns the maximum absolute process-specific dimensionless residual integrating storage tendency and adaptive-substep time-mean boundary ports; the nonlinear residual is additionally bounded by epsilon_mass times stored water depth divided by profile depth, while the override bypasses generic mixed-unit aggregation
  port_balance: Richards infiltration, evapotranspiration, capillary-rise, and drainage ports carry all declared boundary matter fluxes
  sign_convention: z and internal water flux are positive downward; free drainage has dh/dz = 0 and q_bottom = K_bottom, while upward capillary supply maps to q_bottom = -F_capillary / rho_w
entropy_audit:
  dissipative_operator: star_K and M_h are symmetric positive semidefinite for positive rho_w and K_s
  sigma_expression: sigma = X_h.T star_K X_h >= 0
  validation_hook: build_hodge_contract(strict=True) and dissipative_structure eigenvalue checks
equivalence_type: port_equivalent
