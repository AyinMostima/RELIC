input_output_map:
  soil_moisture: same theta profile drives retention, conductivity, and state replacement
  infiltration_flux: non-negative surface mass input enters the vertical balance
  evapotranspiration_flux: non-negative surface mass export leaves the vertical balance
  capillary_rise_flux: selected non-negative upward mass input is mapped to the downward-positive lower flux q_bottom = -F_capillary / rho_w
  drainage_flux: adaptive-substep time-mean lower boundary matter flux is emitted through explicit UpdateItem(REPLACE, per_timestep=False)
  diagnostics.soil_moisture_richards.water_flux_profile: adaptive-substep time-mean interface flux profile is emitted through explicit UpdateItem(REPLACE, per_timestep=False)
  soil_matric_potential: full-profile matric pressure is emitted through explicit UpdateItem(REPLACE, per_timestep=False) in Pa
  diagnostics.soil_moisture_richards.relative_moisture: instantaneous normalized wetness observation, not a plant water-stress response
