runtime_replacement_map:
  runtime_uses_iphs: false
  legacy_removed: false
  replacement_entrypoint: forward
  preserved_numerics: The production runtime uses one canonical mixed-form residual with either mass-conservative modified Picard or exact-Jacobian Newton linearization.
  no_legacy_mode: The ParameterManager solver strategy does not select a second process law; Newton linear and Armijo failures are fail-fast and never fall back to Picard.
state_advancement_map:
  potential_basis: vertical soil moisture cochain theta_h
  effort_variable: hydraulic head gradient d h - g_z with conductivity mobility star_K
  state_advancer: theta_dot = -D_z q_z + s_z; q_z = star_K (d h - g_z)
  runtime_usage: forward applies the canonical mixed-form Richards residual, bounds the inner residual tolerance by the water ledger, and routes mass-balance and solver diagnostics.
