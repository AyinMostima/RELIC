  level_3_limit: Typed form, Hodge, port, or related structure is declared, but no runtime-linked IPHSStructureSpec contribution and executable level 4 or 5 certificate binding is present.
theory_document: docs\source\theory\hydrosphere_richards.md
theory_document_status: updated
legacy_formula: Richards soil moisture is computed from mixed-form Richards flow with van Genuchten-Mualem hydraulic functions.
literature_formula: Unsaturated vertical water flow follows continuity and Darcy flux q = -K(theta)(dh/dz - 1), with retention and conductivity from van Genuchten-Mualem laws.
iphs_formula: theta_dot = -D_z q_z + s_z; q_z = star_K (d h - g_z); star_K = diag(rho_w * K_s) >= 0.
legacy_expression: dtheta/dt = d/dz[K(theta)(dh/dz - 1)] - S(theta), discretized by the canonical mixed-form solver.
iphs_expression: theta_dot = -D_z q_z + s_z; q_z = star_K (d h - g_z); sigma = X_h.T star_K X_h >= 0.
