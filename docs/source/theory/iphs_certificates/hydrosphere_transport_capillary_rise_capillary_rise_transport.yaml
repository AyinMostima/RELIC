  - diagnostics.capillary_rise.saturation_constraint_residual
runtime_replacement_map:
  runtime_uses_iphs: false
  legacy_removed: false
  replacement_entrypoint: _compute_iphs_capillary_rise_update
  preserved_numerics: The existing Gardner-Eagleson flux law is the canonical port-flow calculation.
  no_legacy_mode: No runtime flag exposes a separate pre-Phase 8 capillary branch.
state_advancement_map:
  potential_basis: capillary source port cochain u_cap
  effort_variable: water_table_boundary_head [m] on the port; star_cap is the volumetric-to-mass conversion Hodge and is not a head-to-flux mobility
  state_advancer: structural port incidence only; no local storage state is advanced; u_cap = rho_w * max(0, min(Ks, B*a/Z^b))
  runtime_usage: _compute_iphs_capillary_rise_update evaluates the canonical capillary port flow and routes clipping residuals.
