composition_management_map:
  functor_metadata: existing FunctorMetadata declares transport role and hydrosphere coupling interfaces
  structural_protocol: declared_forms, required_parameters, build_hodge_terms, dissipative_structure, ports
  state_contract: existing TransportMechanismFunctor and StateManager UpdateItem path
  ports:
  - capillary_groundwater_boundary_flux producer endpoint uses out_of_system for capillary_rise_flux [kg m-2 s-1]
dependency_interconnection_map:
  dependencies: get_dependencies declares lagged groundwater_dynamics so the accepted start-of-step water-table state drives the current transfer without a same-step dependency cycle
  direct_functor_calls: none; lagged groundwater state drives the boundary flow and no GroundwaterDynamics instance is called
  chain_maps:
  - water_table_depth boundary cochain to capillary_groundwater_boundary_flux effort
  - capillary_rise_flux producer flow to the reciprocal Richards into_system soil-boundary endpoint through existing state graph
  required_input_policy: water_table_depth must be supplied by the canonical state port; groundwater_depth aliases, kwargs, and parameter defaults are rejected
overflow_routing_map:
  conductivity_limit: rho_w * max(B*a/Z^b - Ks, 0) is emitted as diagnostics.capillary_rise.conductivity_clipping_residual
  positivity_projection: rho_w * max(-min(B*a/Z^b, Ks), 0) is emitted as negative_flux_projection_residual
  saturation_limit: diagnostic q(z) profile difference is emitted as diagnostics.capillary_rise.saturation_constraint_residual and does not modify the canonical boundary flow
  inactive_depth: Z <= 0 or Z > Zmax closes the capillary port and emits zero flux by domain definition
  discarded_residuals: conductivity_clipping_residual, negative_flux_projection_residual, and saturation_constraint_residual explicitly retain all projections, while invalid required state is rejected
conservation_map:
  conserved_quantity: water mass
  balance_expression: capillary_rise_flux is the sole upward open-boundary input; raw positive candidate equals retained boundary flux plus conductivity clipping residual
  local_check: process-specific mass hook validates F_candidate = F_capillary + R_K - R_negative in kg m-2 s-1; it does not apply the generic closed-system output sum
  port_balance: producer endpoint is out_of_system and the Richards soil endpoint is into_system; no groundwater storage debit is claimed until its canonical owner consumes the same flux
physical_constant_ssot:
  water_density: get_physical_constant("water_density") from relic physical constants YAML [kg m-3]
entropy_audit:
  dissipative_operator: star_cap and M_h equal diag(rho_w) and are symmetric positive definite for positive rho_w
  sigma_expression: sigma = u_vol.T star_cap u_vol >= 0 with u_vol the volumetric flux cochain [m s-1]
  validation_hook: build_hodge_contract(strict=True), dissipative_structure eigenvalue checks, and the process-specific open-port limiter mass ledger
equivalence_type: port_equivalent
