  runtime_uses_iphs: false
  legacy_removed: false
  replacement_entrypoint: forward
  preserved_numerics: The reduced-order field-capacity law with selected hydraulic conductivity is the sole canonical drainage calculation.
  no_legacy_mode: No runtime flag exposes a pre-Phase 8 formula, lateral split, state-advance branch, or zero-output mode.
state_advancement_map:
  potential_basis: read-only soil_moisture cochain theta_h
  effort_variable: downward hydraulic gradient g_h with positive mobility star_K
  state_advancer: none in this Functor; q_h is exported through the bottom-drainage boundary port
  runtime_usage: forward evaluates the canonical reduced-order boundary flux without advancing shared soil-water storage.
