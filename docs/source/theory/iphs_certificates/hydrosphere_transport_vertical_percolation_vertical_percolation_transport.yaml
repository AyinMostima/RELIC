certificate_version: '1.0'
process_id: relic.scientific.hydrosphere.transport.vertical_percolation.VerticalPercolationTransport
module_name: vertical_percolation_transport
canonical_role: transport
iphs_level: 3
iphs_level_evidence:
  classification: IPHS-structured transport process certificate
  compatible_basis: Process declares composition-safe IPHS or DEC structure
  runtime_replacement: Production forward path uses the existing canonical wrapper or declaration contract; strict runtime replacement is not claimed at this certificate level.
  canonical_operator: DEC/IPHS transport operator with conservative flux routing
  structural_contribution: Cochain, Hodge, flux, and port structures are declared for assembly audit
  assembly_participation: Certificate participates in Phase 8 inventory and GraphIR structural audit
  level_3_limit: Typed form, Hodge, port, or related structure is declared, but no runtime-linked IPHSStructureSpec contribution and executable level 4 or 5 certificate binding is present.
theory_document: docs\source\theory\hydrosphere_vertical_percolation.md
theory_document_status: updated
legacy_formula: F_drain = max(0, theta - theta_fc) * (K/Ks) * rho_w * dz / tau_drain.
literature_formula: Darcy-Buckingham transport with van Genuchten-Mualem hydraulic conductivity; the field-capacity time-constant law is an explicitly reduced-order boundary closure, not an exact Richards solver.
iphs_formula: q_h = star_K g_h; star_K = diag(rho_w * Ks) >= 0; the empirical storage-depth rate is exported through the drainage boundary port.
legacy_expression: F_drain = max(0, theta - theta_fc) * (K/Ks) * rho_w * dz / tau_drain.
iphs_expression: theta_dot = -D_h q_h + s_h; q_h = star_K g_h; sigma = g_h.T star_K g_h >= 0.
input_variables:
- soil_moisture
- soil_temperature
output_variables:
