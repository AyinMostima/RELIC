composition_management_map:
  functor_metadata: existing FunctorMetadata declares hydrosphere transport role and coupling interfaces
  structural_protocol: declared_forms, required_parameters, build_hodge_terms, dissipative_structure, ports
  state_contract: existing TransportMechanismFunctor and StateManager UpdateItem path
  ports:
  - vertical_drainage_boundary_flux
dependency_interconnection_map:
  dependencies: get_dependencies returns no process dependency; soil_moisture and soil_temperature are canonical StateManager inputs, while Bucket and Richards are alternative drainage closures
  direct_functor_calls: none; soil moisture and temperature are canonical required StateManager inputs and alternative drainage closures are graph-selected
  chain_maps:
  - soil_moisture storage cochain to the vertical drainage constitutive relation
  - drainage_flux boundary port to the selected soil-water and downstream subsurface-runoff graph
  required_input_policy: soil_moisture and soil_temperature are canonical required non-empty floating Tensors; aliases, scalar coercion, defaults, integer tensors, and non-finite values are rejected
overflow_routing_map:
  conductivity_domain: effective saturation is evaluated within the validated residual-to-saturation input domain
  drainage_projection: max(theta - theta_fc, 0) defines the physical no-drainage domain below field capacity
  boundary_ledger: diagnostics.vertical_percolation.water_balance_residual equals computed minus exported drainage flux
  storage_bounds: not applicable because this Functor never advances or clips soil-water storage
  discarded_residuals: below-field-capacity zero drainage is the declared constitutive domain, invalid state is rejected, and water_balance_residual equals computed minus exported drainage
conservation_map:
  conserved_quantity: water mass
  metadata_laws:
  - vertical_drainage_boundary
  balance_expression: F_computed - F_exported = 0 for this open bottom-drainage boundary
  local_check: check_conservation_laws independently recomputes constitutive drainage, compares it with the exported drainage and finite namespaced diagnostic, and reports the maximum residual or diagnostic mismatch
  storage_owner: the selected soil-water closure owns prognostic storage; this Functor owns only the open boundary ledger
  open_system_route: drainage_flux boundary port
physical_constant_ssot:
  water_density: get_physical_constant("water_density") from relic physical constants YAML [kg m-3]
  reference_temperature: get_physical_constant("reference_temperature") from relic physical constants YAML [K]
entropy_audit:
  dissipative_operator: star_K and M_h are symmetric positive semidefinite for positive rho_w and Ks
  sigma_expression: sigma = g_h.T star_K g_h >= 0
  validation_hook: build_hodge_contract(strict=True) and dissipative_structure eigenvalue checks
equivalence_type: port_equivalent
