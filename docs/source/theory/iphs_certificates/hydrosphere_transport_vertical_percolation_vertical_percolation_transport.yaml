- van Genuchten, M.T. (1980). A closed-form equation for predicting hydraulic conductivity. Soil Sci. Soc. Am. J., 44, 892-898.
- Mualem, Y. (1976). A new model for predicting hydraulic conductivity. Water Resources Research, 12, 513-522.
