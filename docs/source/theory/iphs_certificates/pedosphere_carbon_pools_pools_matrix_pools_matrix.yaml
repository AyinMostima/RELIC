composition_management_map:
  functor_metadata: existing FunctorMetadata declares interfaces, execution phase, and conservation semantics
  state_contract: existing simulator StateManager and SCM candidate-writer contracts apply this model's pool increments only when it is the selected variant
  validation_rule: phase8 scientific inventory and equivalence certificate checks
dependency_interconnection_map:
  dependencies: none; the environmental modifier, pool stocks, and boundary inputs enter through declared ports
  model_selection: mutually exclusive with FirstOrderDecomposition and MicrobialEnzymeDecomposition
  direct_functor_calls: none; pool stocks, modifiers, and boundary inputs are ports and alternative decomposition owners are mutually exclusive graph choices
overflow_routing_map:
  diagnostic_residuals: the exact open carbon ledger is emitted as namespaced residual diagnostics
  invalid_state_route: missing, non-tensor, non-finite, negative, shape-inconsistent, or overdraw-producing inputs fail before state advance
  clipping_policy: no carbon stock, flux, or residual is clipped or silently discarded
  discarded_residuals: invalid, negative, shape-inconsistent, non-finite, or overdraw-producing states are rejected, and carbon_balance_residual plus relative_residual are explicit outputs; no carbon flux is clipped
conservation_map:
  conserved_quantities: carbon|mass
  balance_expression: sum_i(Delta C_i) + R_hetero*dt - sum_i(I_i)*dt = 0
  transfer_constraint: for every source pool, 0 <= T_ji and sum_j(T_ji) <= 1; the remainder is heterotrophic respiration
  open_system_routes: five boundary input ports supply carbon and heterotrophic_respiration is the atmosphere-facing export
entropy_audit:
  operator_sign: turnover rates, environmental modifiers, transfer fractions, stocks, and boundary inputs are non-negative or fail validation
  sigma_expression: no strict entropy-production or GENERIC degeneracy claim is made at level 2
equivalence_type: thermodynamic_embedding
physical_constant_ssot:
  seconds_per_year: get_physical_constant("seconds_per_year") for turnover-time reporting only
