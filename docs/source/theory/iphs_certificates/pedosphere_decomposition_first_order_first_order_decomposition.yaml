composition_management_map:
  functor_metadata: existing FunctorMetadata declares the two mapper-owned litter inputs, the Mineralization-facing gross rate, execution phase, and conservation semantics
  state_contract: existing simulator StateManager and SCM candidate-writer contracts apply this model's pool increments only when it is the selected variant
  litter_mapping: LitterfallInterfaceMapper is the sole fresh-litter partition owner and writes the two required target ports
  environmental_drivers: soil_temperature and soil_moisture are declared forcing interfaces rather than material composition ports
  validation_rule: phase8 scientific inventory and equivalence certificate checks
dependency_interconnection_map:
  dependencies: graph configuration orders this process after litterfall_interface_mapper when phenology litterfall is selected
  downstream_interconnection: carbon_decomposition_rate is the required carbon-rate input of Mineralization
  model_selection: mutually exclusive with PoolsMatrix and MicrobialEnzymeDecomposition
  direct_functor_calls: none; litter inputs and downstream mineralization connect through graph ports and no peer process instance is invoked
overflow_routing_map:
  diagnostic_residuals: the exact carbon ledger is recomputed from the supplied UpdateItem payloads; dimensionless response bounds do not discard carbon
  invalid_state_route: missing required inputs, non-finite drivers, out-of-range temperature, negative pools, and invalid transfer sums fail before state advance
  discarded_residuals: temperature and moisture bounds define dimensionless rate coefficients only, untransferred carbon is explicit heterotrophic_respiration, overdraw is rejected, and check_conservation_laws recomputes the complete carbon ledger
conservation_map:
  conserved_quantities: carbon|mass
  balance_expression: sum_i(Delta C_i) + R_hetero*dt - (I_metabolic + I_structural)*dt = 0
  transfer_constraint: for each source pool, 0 <= T_ji and sum_j(T_ji) <= 1; the remainder is heterotrophic respiration
  open_system_routes: metabolic_litter_input and structural_litter_input are boundary sources and heterotrophic_respiration is the atmosphere-facing export
entropy_audit:
  operator_sign: empirical decay and transfer rates are non-negative or bounded by ParameterManager-backed controls
  sigma_expression: no strict entropy-production or GENERIC degeneracy claim is made at level 2
equivalence_type: thermodynamic_embedding
physical_constant_ssot:
  seconds_per_year: get_physical_constant("seconds_per_year")
  reference_temperature: get_physical_constant("reference_temperature")
  gas_constant: get_physical_constant("gas_constant")
