composition_management_map:
  functor_metadata: existing FunctorMetadata declares interfaces, execution phase, and conservation semantics
  state_contract: explicit UpdateItem values route four stock increments through StateManager only when this closure is selected
  validation_rule: phase8 scientific inventory and equivalence certificate checks
dependency_interconnection_map:
  dependencies: none; all six required drivers and stocks enter through declared state ports
  model_selection: mutually exclusive with PoolsMatrix and FirstOrderDecomposition
  direct_functor_calls: none; all stocks and drivers enter through state ports and alternative decomposition owners are mutually exclusive
overflow_routing_map:
  diagnostic_residuals: diagnostics.microbial_enzyme.carbon_balance_residual exposes the exact per-step ledger
  invalid_state_route: missing, non-tensor, non-finite, negative, out-of-range, overdraw-producing, or invalid-dt inputs fail before state advance
  clipping_policy: no stock, flux, or carbon residual is clipped or silently discarded
  discarded_residuals: Vmax, Km, moisture, and temperature bounds define kinetic coefficients rather than stock disposal, invalid or overdraw steps are rejected, and diagnostics.microbial_enzyme.carbon_balance_residual is explicit
conservation_map:
  conserved_quantities: carbon|mass
  balance_expression: Delta C_met + Delta C_str + Delta C_som + Delta MIC + R_microbial*dt = 0
  reaction_constraint: C_h N_h = 0 with C_h=[1,1,1,1,1]
  open_system_routes: heterotrophic_respiration is the atmosphere-facing carbon port
entropy_audit:
  operator_sign: stocks, kinetic coefficients, uptake rates, turnover rates, and respiration are non-negative or fail validation
  sigma_expression: no strict entropy-production or GENERIC degeneracy claim is made at level 2
equivalence_type: reaction_network
physical_constant_ssot:
  celsius_to_kelvin: get_physical_constant("celsius_to_kelvin")
  q10_interval: get_physical_constant("relic.physical.constants.temperature.q10_interval")
  reference_temperature: get_physical_constant("reference_temperature")
  gas_constant: get_physical_constant("gas_constant")
