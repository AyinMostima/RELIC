  historical_aliases_removed: fast/slow/passive SOM basis fallback, ParameterManager state defaults, unnamespaced diagnostics, dynamic enzyme output names, identity reaction map, biomass clipping, and mutable forward statistics
runtime_replacement_map:
  runtime_uses_iphs: false
  legacy_removed: false
  replacement_entrypoint: forward
  preserved_numerics: Existing ParameterManager-backed calculations define canonical IPHS operator coefficients, rates, ports, or observations.
  no_legacy_mode: No selectable legacy runtime branch is exposed for Phase 8 completion.
state_advancement_map:
  potential_basis: three substrate stocks, microbial biomass, and the atmosphere-facing respiration port
  effort_variable: empirical temperature, moisture, and substrate controls; no Hamiltonian effort is claimed
  state_advancer: x_dot = N_h r_h with the explicit five-row four-column carbon incidence map
  runtime_usage: MicrobialEnzymeDecomposition.forward evaluates three reverse Michaelis-Menten uptake rates and one microbial-turnover rate exactly once through advance_reaction_network.
  explicit_stoichiometric_usage: C_h=[1,1,1,1,1] validates C_h N_h=0 before the StateManager-ready increments and respiration flux are emitted.
