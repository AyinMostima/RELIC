dependency_interconnection_map:
  dependencies: pedosphere_methane_scale is a required scheduler dependency that supplies methane_gating_weight
  direct_functor_calls: none declared by certificate
overflow_routing_map:
  diagnostic_residuals: no substrate, input, or branch-rate clipping remains in the production runtime
  discarded_residuals: constitutive lower bounds define non-negative source rates rather than removing an existing pool; both branch rates are diagnostics and their blend is exported identically as ch4_production_rate and ch4_storage_tendency_prod
conservation_map:
  conserved_quantities: mass
  balance_expression: ch4_storage_tendency_prod - ch4_production_rate = 0 on the CH4-C basis; only ch4_production_rate is a carbon.total boundary input
  internal_interconnection: ch4_storage_tendency_prod has no element tag or accumulation domain and is realized only by pedosphere_methane_budget
  open_system_route: ch4_production_rate is the single positive methane-carbon production boundary port; an explicit upstream donor-carbon withdrawal is outside this process certificate
entropy_audit:
  operator_sign: rates, mobilities, or diagnostic maps are non-negative or checked by existing validation hooks where physically required
  sigma_expression: canonical entropy production is non-negative for dissipative subexpressions
