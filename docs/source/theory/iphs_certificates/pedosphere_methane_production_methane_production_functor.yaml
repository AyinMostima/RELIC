certificate_version: '1.0'
process_id: relic.scientific.pedosphere.methane.production.MethaneProductionFunctor
module_name: MethaneProductionFunctor
canonical_role: reaction
iphs_level: 2
iphs_level_evidence:
  classification: IPHS-wrapped reaction process certificate
  compatible_basis: Reaction process is expressed through conserved or open stoichiometric ledgers
  runtime_replacement: Production forward path uses the existing canonical wrapper or declaration contract; strict runtime replacement is not claimed at this certificate level.
  canonical_operator: N_h r_h reaction-network state advance
  level_2_limit: The canonical runtime wrapper is declared, but no executable typed-cochain or IPHS structural contribution is bound; strict level 4 or 5 evidence is not claimed.
theory_document: docs\source\theory\wetland_methane.md
theory_document_status: updated
legacy_formula: Prior RELIC production used a Gaussian pH response, a non-iMAPLE temperature shape, public branch-rate aliases, and input defaults.
literature_formula: P_iMAPLE = Rh r f_ST f_pH f_wet (Yue et al. (2024) Eq. 34) with f_ST from Yue et al. (2024) Eqs. 35-38 (Zhu et al. (2014) Eqs. 3-5 with the temperature-dependent Q10 of Yue et al. (2024) Eq. 39, Q10 = clip(r_b Q_b^((Ts - T_base)/10), 1.7, 16), r_b = 3.0, Q_b = 1.33, T_base = 25 C; the clip is the observed range of Zhu et al. (2014) applied in the released iMAPLE code), f_pH from Zhu et al. (2014) Eq. 6, and f_wet the continuous inundation fraction; no closure factor multiplies Eq. 34. The calibrated branch Rh r f_T f_Eh A (the same Zhu et al. (2014) peak f_T, and the DNDC95 microbial activity index A in [0, 1]) and the blend weight are RELIC conventions with DNDC-type temperature and redox controls, not the DNDC substrate-kinetic model (Fumoto et al. 2008; van Bodegom and Scholten 2001), which is not implemented; its redox factor f_Eh is the piecewise-linear form of Zhu et al. (2014) Sect. 2.2.1 after Zhang et al. (2002).
iphs_formula: x_dot = N_h r_h with ParameterManager-backed process rates r_h and declared stoichiometric/output map N_h
legacy_expression: P = (1 - w) * Rh * r * f_T(Ts) * f_pH(pH) * f_wet + w * Rh * r * f_T(Ts) * f_Eh(Eh) * A
iphs_expression: x_dot = N_h r_h with ParameterManager-backed process rates r_h and declared stoichiometric/output map N_h
