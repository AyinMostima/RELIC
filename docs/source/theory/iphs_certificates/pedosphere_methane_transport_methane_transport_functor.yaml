composition_management_map:
  functor_metadata: exact four-input and five-output interface with TransportMechanismFunctor lifecycle
  state_contract: signed internal transport ports are not counted as global carbon boundaries; budget outputs own the carbon ledger
  validation_rule: phase8 scientific inventory and equivalence certificate checks
dependency_interconnection_map:
  dependencies: configuration_bound_scheduler_dependencies_or_empty
  direct_functor_calls: none_no_direct_functor_calls
  downstream_consumer: pedosphere_methane_budget
overflow_routing_map:
  diagnostic_residuals: the three pathway rates and their signed aggregate request are explicit; realized transport limiting is delegated to diagnostics.methane_budget.transport_limiter_residual
  delegated_route: diagnostics.methane_budget.transport_limiter_residual records transport denied by the shared budget limiter
  discarded_residuals: no_local_residual_is_discarded; the raw signed transport request and equal-opposite storage tendency are emitted in full, while the budget owner records any denied request
conservation_map:
  conserved_quantities: methane carbon across the internal request and tendency pair
  balance_expression: ch4_transport_loss_rate + ch4_storage_tendency_trans = 0
  global_ledger_owner: MethaneBudgetCoupler owns realized ch4_atmospheric_flux and ch4_soil_storage closure
  open_system_route: methane_transport_request interconnection
entropy_audit:
  operator_sign: effective diffusivity is finite and non-negative; the signed concentration-driven request may reverse direction
  sigma_expression: no independent entropy-production or port-power proof is claimed at level 3
equivalence_type: port_equivalent
