certificate_version: '1.0'
process_id: relic.scientific.pedosphere.nutrient_cycling.denitrification.DenitrificationProcess
module_name: denitrification_process
canonical_role: reaction
iphs_level: 2
iphs_level_evidence:
  classification: IPHS-wrapped reaction process certificate
  compatible_basis: Reaction process is expressed through conserved or open stoichiometric ledgers
  runtime_replacement: Production forward path uses the existing canonical wrapper or declaration contract; strict runtime replacement is not claimed at this certificate level.
  canonical_operator: N_h r_h reaction-network state advance
  level_2_limit: The canonical runtime wrapper is declared, but no executable typed-cochain or IPHS structural contribution is bound; strict level 4 or 5 evidence is not claimed.
theory_document: docs\source\theory\denitrification.md
theory_document_status: updated
legacy_formula: R_den = Vmax * NO3 / (Km + NO3) * f_T * f_anaerobic * f_C * f_pH with direct pool deltas.
literature_formula: Anaerobic nitrate reduction with Michaelis-Menten substrate limitation, carbon limitation, Q10 temperature response, a water-filled pore space anaerobic factor (DAYCENT basis, Del Grosso et al. 2000), pH response, and N2O:N2 product partitioning.
iphs_formula: x_dot = N_h r_h(x_h, theta); x_h = [NO3, N2O, N2]^T.
legacy_expression: dNO3 = -R_den dt; dN2O = R_den f_N2O dt; dN2 = R_den(1 - f_N2O)dt.
iphs_expression: x_dot = N_h r_h; N_h = [[-1,-1],[1,0],[0,1]]; r_h = [r_N2O, r_N2]^T.
input_variables:
- no3_nitrogen
- labile_carbon
- water_filled_pore_space
- soil_temperature
- soil_ph
output_variables:
