  validation.conservation.strict_conservation: Switch that makes a conservation violation raise [dimensionless]
operator_map:
  N_h: explicit stoichiometric matrix in advance_reaction_network
  r_h: denitrification rate split into N2O and N2 reaction channels
  substrate_limiter: min(R_den, NO3 / dt) applied before N_h r_h
  time_integration: one explicit Euler step x(t + dt) = x(t) + N_h r_h(x(t)) dt per governed call with the soil drivers held at their call-start values; simulator sub-steps repeat the step
  sub_flow_accuracy: FunctorMetadata.sub_flow_accuracy ORDER_1 (Hairer, Norsett and Wanner 1993, Sect. II.3) while the donor limit is inactive, R_den dt < NO3, i.e. Vmax f_T f_anoxic f_C f_pH dt < Km_NO3 + NO3; binding on the two coarse grids of CR-A-04 T11 exhausts the numerical pool and yields equal final donor error, while smaller inactive-limit steps recover first order (a finite-step characterization, not loss of asymptotic convergence); the clipped N2O fraction only partitions the released nitrogen
