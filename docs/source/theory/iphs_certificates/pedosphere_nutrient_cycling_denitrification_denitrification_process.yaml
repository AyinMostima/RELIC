runtime_replacement_map:
  runtime_uses_iphs: false
  legacy_removed: false
  replacement_entrypoint: forward
  preserved_numerics: Environmental response functions define r_h; production pool deltas are computed through advance_reaction_network.
  no_legacy_mode: No runtime flag exposes a separate pre-Phase 8 denitrification state-advance branch.
state_advancement_map:
  potential_basis: nitrogen species cochain x_h = [NO3, N2O, N2]^T
  effort_variable: this required certificate slot records reaction-rate tensor r_h from ParameterManager-backed anaerobic kinetics; r_h is a rate vector and no thermodynamic effort is asserted
  state_advancer: x_dot = N_h r_h with explicit N_h and r_h evaluated by advance_reaction_network
  runtime_usage: DenitrificationProcess.forward calls advance_reaction_network before emitting NO3, N2O, and N2 outputs.
  explicit_stoichiometric_usage: DenitrificationProcess.forward materializes stoichiometric_N and rates, then lowers x_dot=N_h r_h through advance_reaction_network.
