composition_management_map:
  functor_metadata: existing FunctorMetadata declares nitrogen conservation and gas-emission interfaces
  structural_protocol: explicit N_h r_h reaction state advance
  state_contract: existing simulator state update path consumes emitted deltas and flux outputs
  ports:
  - anaerobic_respiration
  - gas_emissions
dependency_interconnection_map:
  dependencies: get_dependencies declares nitrification only; labile_carbon is a state cochain supplied by the single carbon decomposition closure selected by the compiled graph
  mutually_exclusive_closures: first_order_decomposition and microbial_enzyme_decomposition are alternative carbon closures and are never simultaneous dependencies
  direct_functor_calls: none; nitrification is scheduler-declared and labile carbon arrives from the graph-selected carbon closure
  chain_maps:
  - no3_nitrogen state cochain to denitrification reaction network
  - labile_carbon state cochain from the graph-selected carbon closure to the kinetic coefficient
  - N2O and N2 outputs to gas_emissions interface
overflow_routing_map:
  substrate_limiter: NO3 / dt limiter prevents overconsumption
  conservation_residual: Functor-local nitrogen conservation check sees dNO3 + dN2O + dN2
  discarded_residuals: potential rate is limited by nitrate availability per dt so unconsumed nitrate remains in state, accepted nitrogen is partitioned exactly to NO3, N2O, and N2, and check_conservation_laws exposes closure
conservation_map:
  conserved_quantity: nitrogen
  balance_expression: dNO3 + dN2O + dN2 = 0 for the local reaction network
  local_check: _enforce_forward_conservation on the internal per-step deltas; the public check_conservation_laws recomputes dNO3 + (F_N2O + F_N2) * dt from the returned UpdateItems using diagnostics.denitrification.step_seconds and raises on missing outputs
entropy_audit:
  rate_domain: reaction channels are non-negative after substrate limitation
  strict_entropy_claim: none at Level 2; non-negative rates alone do not prove affinity-rate entropy production
  validation_hook: reaction_network_check and unit tests validate stoichiometric state advance and nitrogen closure, not a GENERIC entropy inequality
equivalence_type: reaction_network
physical_constant_ssot:
  q10_interval: get_physical_constant("relic.physical.constants.temperature.q10_interval")
