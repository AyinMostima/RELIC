composition_management_map:
  functor_metadata: existing FunctorMetadata declares interfaces, execution phase, and conservation semantics
  state_contract: existing simulator state update path is preserved
  validation_rule: phase8 scientific inventory and equivalence certificate checks
dependency_interconnection_map:
  dependencies: carbon_decomposition_rate and organic_nitrogen_input are required canonical ports; all eight metadata inputs are required state tensors
  current_owner_rule: first_order_decomposition and pools_matrix are mutually exclusive formal writers of carbon_decomposition_rate; graph construction selects exactly one
  organic_boundary_owner_rule: litterfall_interface_mapper is the sole writer of organic_nitrogen_input for selected plant litter and fecal organic N routes
  alternative_owner_rule: a microbial_enzyme_decomposition graph cannot include Mineralization until that alternative closure declares the same canonical carbon rate
  direct_functor_calls: none; carbon_decomposition_rate and organic_nitrogen_input are canonical ports from graph-selected owners
overflow_routing_map:
  availability_limits: gross mineralization is bounded by organic N, immobilization by NH4, and microbial death by microbial N over the current dt before r_h assembly
  invalid_carbon_route: missing, non-finite, or negative carbon_decomposition_rate fails before state advance
  invalid_organic_route: missing, non-finite, negative, or non-broadcastable organic_nitrogen_input fails before state advance
  carbon_route: upstream carbon decomposition is already settled; this N-only process emits no carbon state, respiration, or overflow port
  discarded_residuals: gross mineralization, immobilization, and death are capped by available organic nitrogen, ammonium, and microbial nitrogen so unconsumed substrate remains in state; invalid inputs reject and the nitrogen ledger includes the organic boundary input
conservation_map:
  conserved_quantities: nitrogen|mass
  balance_expression: Delta N_org + Delta N_NH4 + Delta N_microbial = organic_nitrogen_input * dt
  conservation_matrix: C_h = [1, 1, 1] and C_h N_h = 0 is validated by advance_reaction_network
  system_route: closed three-pool reaction ledger plus explicit organic-material nitrogen boundary port G_h u_organic
entropy_audit:
  operator_sign: rates, mobilities, or diagnostic maps are non-negative or checked by existing validation hooks where physically required
  sigma_expression: no strict entropy-production or GENERIC degeneracy claim is made at level 2
equivalence_type: thermodynamic_embedding
physical_constant_ssot:
  reference_temperature: get_physical_constant("t_ref")
  seconds_per_year: get_physical_constant("seconds_per_year")
