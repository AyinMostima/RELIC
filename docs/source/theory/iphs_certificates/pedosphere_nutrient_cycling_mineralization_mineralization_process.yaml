certificate_version: '1.0'
process_id: relic.scientific.pedosphere.nutrient_cycling.mineralization.MineralizationProcess
module_name: MineralizationProcess
canonical_role: reaction
iphs_level: 2
iphs_level_evidence:
  classification: IPHS-wrapped reaction process certificate
  compatible_basis: Reaction process is expressed through conserved or open stoichiometric ledgers
  runtime_replacement: Production forward path uses the existing canonical wrapper or declaration contract; strict runtime replacement is not claimed at this certificate level.
  canonical_operator: N_h r_h reaction-network state advance
  level_2_limit: The canonical runtime wrapper is declared, but no executable typed-cochain or IPHS structural contribution is bound; strict level 4 or 5 evidence is not claimed.
theory_document: docs\source\theory\mineralization.md
theory_document_status: updated
legacy_formula: R_net = k_min N_org f_env - max((CUE DEC / CN_mic - DEC / CN_substrate) / eta_N, 0)
literature_formula: R_net = min(k_min N_org f_env, N_org / dt) - min(CUE DEC / (CN_mic eta_N), N_NH4 / dt)
iphs_formula: x_dot = N_h r_h + G_h u_organic with closed internal reactions and one explicit organic-material nitrogen boundary port
legacy_expression: The retired runtime required an unowned organic_carbon input and evaluated a second DEC/CN_substrate nitrogen-release term.
iphs_expression: x_dot = N_h r_h + G_h u_litter; C_h N_h = 0 and sum(Delta N) = u_litter dt
