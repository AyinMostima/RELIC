runtime_replacement_map:
  runtime_uses_iphs: false
  legacy_removed: false
  replacement_entrypoint: forward
  preserved_numerics: ParameterManager-backed gross mineralization, carbon-driven mineral-N demand, current-step donor bounds, and microbial turnover define the canonical reaction rates.
  no_legacy_mode: No selectable legacy runtime branch is exposed for Phase 8 completion.
state_advancement_map:
  potential_basis: declared RELIC state, port, or observation cochain basis
  effort_variable: Empirical environmental and stoichiometric drivers; no strict thermodynamic effort is claimed at level 2.
  state_advancer: x_dot = N_h r_h + G_h u_organic; advance_reaction_network owns the closed reaction term and the explicit port supplies the boundary term
  runtime_usage: MineralizationProcess.forward validates C_h N_h = 0 through advance_reaction_network, then adds organic_nitrogen_input dt once to organic_nitrogen.
  explicit_stoichiometric_usage: MineralizationProcess.forward materializes stoichiometric_N and rates for N_h r_h and keeps G_h u_litter as the declared open port.
