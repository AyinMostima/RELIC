composition_management_map:
  functor_metadata: existing FunctorMetadata declares nitrogen conservation and soil chemistry/gas-emission interfaces
  structural_protocol: explicit N_h r_h reaction state advance
  state_contract: existing simulator state update path consumes emitted deltas and flux outputs
  ports:
  - soil_chemistry
  - gas_emissions
dependency_interconnection_map:
  dependencies: get_dependencies declares mineralization
  direct_functor_calls: none; mineralization is scheduler-declared and ammonium state arrives through the state graph
  chain_maps:
  - nh4_nitrogen state cochain to nitrification reaction network
  - N2O output to gas_emissions interface
overflow_routing_map:
  substrate_limiter: NH4 / dt limiter prevents overconsumption
  diagnostic_residuals:
  - diagnostics.nitrification.substrate_limiter_residual
  conservation_residual: Functor-local nitrogen conservation check sees dNH4 + dNO3 + dN2O
  discarded_residuals: potential rate is limited by ammonium availability per dt so unconsumed ammonium remains in state, accepted nitrogen is partitioned exactly to NH4, NO3, and N2O, and check_conservation_laws exposes closure
conservation_map:
  conserved_quantity: nitrogen
  balance_expression: dNH4 + dNO3 + dN2O = 0 for the local reaction network
  local_check: _enforce_forward_conservation on the internal per-step deltas; the public check_conservation_laws recomputes dNH4 + dNO3 + F_N2O * dt from the returned UpdateItems using diagnostics.nitrification.step_seconds and raises on missing outputs
entropy_audit:
  rate_domain: reaction channels are non-negative after substrate limitation
  strict_entropy_claim: none at Level 2; non-negative rates alone do not prove affinity-rate entropy production
  validation_hook: reaction_network_check and unit tests validate stoichiometric state advance and nitrogen closure, not a GENERIC entropy inequality
equivalence_type: reaction_network
