certificate_version: '1.0'
process_id: relic.scientific.pedosphere.nutrient_cycling.nitrification.NitrificationProcess
module_name: nitrification_process
canonical_role: reaction
iphs_level: 2
iphs_level_evidence:
  classification: IPHS-wrapped reaction process certificate
  compatible_basis: Reaction process is expressed through conserved or open stoichiometric ledgers
  runtime_replacement: Production forward path uses the existing canonical wrapper or declaration contract; strict runtime replacement is not claimed at this certificate level.
  canonical_operator: N_h r_h reaction-network state advance
  level_2_limit: The canonical runtime wrapper is declared, but no executable typed-cochain or IPHS structural contribution is bound; strict level 4 or 5 evidence is not claimed.
theory_document: docs\source\theory\nitrification.md
theory_document_status: updated
legacy_formula: R_nit = Vmax * NH4 / (Km + NH4) * f_T * f_O2 * f_pH with direct pool deltas.
literature_formula: Michaelis-Menten ammonia oxidation with Q10, water-filled pore space oxygen (Linn and Doran 1984), and pH modifiers; N2O is a fixed fraction of nitrified nitrogen.
iphs_formula: x_dot = N_h r_h(x_h, theta); x_h = [NH4, NO3, N2O]^T.
legacy_expression: dNH4 = -R_nit dt; dNO3 = R_nit(1 - f_N2O)dt; dN2O = R_nit f_N2O dt.
iphs_expression: x_dot = N_h r_h; N_h = [[-1,-1],[1,0],[0,1]]; r_h = [r_NO3, r_N2O]^T.
input_variables:
- nh4_nitrogen
- soil_temperature
- water_filled_pore_space
- soil_ph
output_variables:
- nh4_nitrogen
- no3_nitrogen
- nitrification_flux
- n2o_flux
- diagnostics.temperature_response
- diagnostics.oxygen_factor
- diagnostics.ph_factor
- diagnostics.nitrification.step_seconds
- diagnostics.nitrification.substrate_limiter_residual
parameter_keys:
