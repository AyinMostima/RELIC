- test\audit\phase8_scientific_inventory.test.py
- test\core\splitting_sub_flow_order.test.py
state_map:
  nh4_nitrogen: state cochain x_h[0]
  no3_nitrogen: state cochain x_h[1]
  n2o_flux: open gas-output component x_h[2]
  nitrification_flux: total NH4 oxidation rate
parameter_map:
  pedosphere.nitrification.vmax_nitrification: Maximum nitrification rate [g N m-2 s-1]
  pedosphere.nitrification.km_nh4: Half-saturation for NH4 [g N m-2]
  pedosphere.physical.wfps_nitrification_optimum: Water-filled pore space above which oxygen limits nitrification [dimensionless]
  pedosphere.nitrification.minimum_oxygen_factor: Floor of the oxygen response factor f_O2 [dimensionless]
  pedosphere.nitrification.extreme_temperature_factor: Activity factor outside the temperature range [dimensionless]
  pedosphere.nitrification.temperature_minimum: Lower temperature limit of nitrification [K]
  pedosphere.nitrification.temperature_maximum: Upper temperature limit of nitrification [K]
  pedosphere.nitrification.ph_minimum_factor: Minimum pH response factor [dimensionless]
  pedosphere.nitrification.min_rate_threshold: Lower bound of the temperature factor f_T [dimensionless]
  pedosphere.nitrification.max_rate_factor: Upper bound of the temperature factor f_T [dimensionless]
  pedosphere.nitrification.n2o_factor: Fraction of nitrified N converted to N2O [dimensionless]
  pedosphere.physical.q10_nitrification: Q10 of nitrification [dimensionless]
  pedosphere.physical.reference_temperature: Reference temperature of the Q10 response [K]
  pedosphere.physical.ph_optimum_nitrification: Optimum pH of nitrification [dimensionless]
  pedosphere.physical.ph_response_width: Width of the Gaussian pH response [dimensionless]
  pedosphere.numerical.unity_multiplier: Unit multiplier of the rate normalization [dimensionless]
  pedosphere.numerical.epsilon: Denominator floor of the nitrification statistics [dimensionless]
  validation.conservation.conservation_tolerance: General relative tolerance of the conservation checks [dimensionless]
  validation.conservation.strict_conservation: Switch that makes a conservation violation raise [dimensionless]
operator_map:
  N_h: explicit stoichiometric matrix in advance_reaction_network
  r_h: Michaelis-Menten nitrification rate split into NO3 and N2O reaction channels
  substrate_limiter: min(R_nit, NH4 / dt) applied before N_h r_h
  time_integration: one explicit Euler step x(t + dt) = x(t) + N_h r_h(x(t)) dt per governed call with the soil drivers held at their call-start values; simulator sub-steps repeat the step
  sub_flow_accuracy: FunctorMetadata.sub_flow_accuracy ORDER_1 (Hairer, Norsett and Wanner 1993, Sect. II.3) while the donor limit is inactive, R_nit dt < NH4, i.e. Vmax f_T f_O2 f_pH dt < Km + NH4; binding on the two coarse grids of CR-A-04 T11 exhausts the numerical pool and yields equal final donor error, while smaller inactive-limit steps recover first order (a finite-step characterization, not a loss of asymptotic convergence)
unit_map:
  nh4_nitrogen: g N m-2
  no3_nitrogen: g N m-2
  nitrification_flux: g N m-2 s-1
  n2o_flux: g N m-2 s-1
  diagnostics.nitrification.step_seconds: s
  diagnostics.nitrification.substrate_limiter_residual: g N m-2 s-1
input_output_map:
  nh4_nitrogen: read as NH4 pool and advanced by N_h r_h
  no3_nitrogen: written as NO3 product delta from N_h r_h
  n2o_flux: written as open gas product rate from N_h r_h
  diagnostics.nitrification.substrate_limiter_residual: unmet nitrification demand R_nit - min(R_nit, NH4 / dt); a demand, not nitrogen
