runtime_replacement_map:
  runtime_uses_iphs: false
  legacy_removed: false
  replacement_entrypoint: forward
  preserved_numerics: Environmental response functions define r_h; production pool deltas are computed through advance_reaction_network.
  no_legacy_mode: No runtime flag exposes a separate pre-Phase 8 nitrification state-advance branch.
state_advancement_map:
  potential_basis: nitrogen species cochain x_h = [NH4, NO3, N2O]^T
  effort_variable: this required certificate slot records reaction-rate tensor r_h from ParameterManager-backed kinetics; r_h is a rate vector and no thermodynamic effort is asserted
  state_advancer: x_dot = N_h r_h with explicit N_h and r_h evaluated by advance_reaction_network
  runtime_usage: NitrificationProcess.forward calls advance_reaction_network before emitting NH4, NO3, and N2O outputs.
  explicit_stoichiometric_usage: NitrificationProcess.forward materializes stoichiometric_N and rates, then lowers x_dot=N_h r_h through advance_reaction_network.
