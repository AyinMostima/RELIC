  pedosphere.nutrient_cycling.min_no3_pool: Minimum nitrate pool enforced for numerical stability [g N m-2]
  pedosphere.transport.nitrate_distribution_coefficient: Nitrate sorption distribution coefficient K_d [L kg-1]
  pedosphere.nutrient_cycling.hodge_reference_soil_depth: Reference soil depth of the static leaching Hodge contract [m]
  pedosphere.numerical.max_flux_fraction: Maximum leaching fraction per time step [dimensionless]
  validation.conservation.conservation_tolerance: General relative tolerance of the conservation checks [dimensionless]
  validation.conservation.strict_conservation: Switch that makes a conservation violation raise [dimensionless]
