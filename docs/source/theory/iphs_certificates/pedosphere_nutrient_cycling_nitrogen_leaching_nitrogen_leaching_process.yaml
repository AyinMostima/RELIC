  state_contract: existing simulator state update path is preserved
  validation_rule: phase8 scientific inventory and equivalence certificate checks
dependency_interconnection_map:
  dependencies: nitrification
  direct_functor_calls: none declared by certificate
overflow_routing_map:
  diagnostic_residuals: none; flux limiting leaves unexported nitrate in no3_nitrogen
  discarded_residuals: every executed export is emitted as nitrogen_leaching_flux and the identical step amount is subtracted from no3_nitrogen; limiting leaves unexported nitrate in the source pool and forward conservation is enforced
conservation_map:
  conserved_quantities: nitrogen|mass
  balance_expression: delta_NO3 + nitrogen_leaching_flux * dt = 0
  local_check: _enforce_forward_conservation on the internal per-step deltas; the public check_conservation_laws recomputes delta_NO3 + F_leach * dt from the returned UpdateItems using diagnostics.nitrogen_leaching.step_seconds and raises on missing outputs
entropy_audit:
