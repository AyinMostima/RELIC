certificate_version: '1.0'
process_id: relic.scientific.pedosphere.nutrient_cycling.nitrogen_leaching.NitrogenLeachingProcess
module_name: NitrogenLeachingProcess
canonical_role: transport
iphs_level: 3
iphs_level_evidence:
  classification: IPHS-structured transport process certificate
  compatible_basis: Process declares DEC cochains, a positive Hodge mobility, and an open nitrate drainage port
  runtime_replacement: Production forward path uses the existing canonical wrapper or declaration contract; strict runtime replacement is not claimed at this certificate level.
  canonical_operator: x_dot = -D_h q_h + G_h u_h with q_h = star_Q C_NO3
  structural_contribution: Cochain, Hodge, flux, and port structures are declared for assembly audit
  assembly_participation: Certificate participates in Phase 8 inventory and GraphIR structural audit
  level_3_limit: Typed form, Hodge, port, or related structure is declared, but no runtime-linked IPHSStructureSpec contribution and executable level 4 or 5 certificate binding is present.
theory_document: docs\source\theory\nitrogen_leaching.md
theory_document_status: updated
legacy_formula: F_N = Q_drain * C_NO3 * mobile_fraction
literature_formula: F_N = (F_water / rho_w) * (N_NO3 / (theta z_soil)) / (1 + rho_b K_d / theta)
iphs_formula: x_dot = -D_h q_h + G_h u_h, q_h = min(star_Q C_NO3, N_NO3 / tau_leach, f_max N_NO3 / dt), y_h = G_h^T e_h
legacy_expression: F_N = Q_drain * C_NO3 * mobile_fraction
iphs_expression: x_dot = -D_h q_h + G_h u_h, q_h = star_Q C_NO3, y_h = G_h^T e_h
