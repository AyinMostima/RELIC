input_output_map:
  drainage_flux: required canonical hydrological boundary input; no aliases or default
  nitrogen_leaching_flux: retained canonical outward nitrate export rate
  no3_nitrogen: retained canonical per-step nitrate pool increment
  nitrate_concentration: renamed to diagnostics.nitrogen_leaching.nitrate_concentration
  mobile_fraction: renamed to diagnostics.nitrogen_leaching.mobile_fraction
  soil_water_volume: renamed to diagnostics.nitrogen_leaching.soil_water_volume
  diagnostics.nitrogen_leaching.soil_water_volume: soil water volume per unit ground area, theta z_soil, a volume per area (m3 m-2) reported as the equivalent depth in m
  leaching_water_flux: removed duplicate input echo
  leaching_efficiency: removed ambiguous rate-ratio output
  water_use_efficiency: removed dimensionally misleading duplicate diagnostic
