runtime_replacement_map:
  runtime_uses_iphs: false
  legacy_removed: false
  replacement_entrypoint: forward
  preserved_numerics: Existing ParameterManager-backed calculations define canonical IPHS operator coefficients, rates, ports, or observations.
  no_legacy_mode: No selectable legacy runtime branch is exposed for Phase 8 completion.
state_advancement_map:
  potential_basis: ammonium and nitrate dependency increments in g N m-2
  effort_variable: already evaluated child-process increments supplied by the dependency graph
  state_advancer: d_dot = N_h r_h is evaluated only as a diagnostic projection; the aggregate fertilizer and selected-urine boundary supplies the sole StateManager increment
  runtime_usage: NitrogenCycling.forward calls advance_reaction_network with explicit N_h and r_h under diagnostic_residual routing, never re-emits child state or flux outputs, and emits only the aggregate external NH4 increment.
  explicit_stoichiometric_usage: NitrogenCycling.forward materializes the two-row mineral-N diagnostic incidence map and evaluates N_h r_h through advance_reaction_network.
parameter_management_map:
  relic.physical.constants.conversions.kg_to_g:
    source: ParameterManager-backed relic physical constants SSOT via get_physical_constant and UnifiedParameterManager.get
composition_management_map:
  functor_metadata: existing FunctorMetadata declares interfaces, execution phase, and conservation semantics
  state_contract: child updates commit directly through StateManager; all shared pool writers use SCM-authorized UpdateItem ACCUMULATE per_timestep and the coordinator emits only the aggregate fertilizer and selected-urine increment
  validation_rule: phase8 scientific inventory and equivalence certificate checks
dependency_interconnection_map:
  dependencies: mineralization, nitrification, denitrification, nitrogen_leaching, root_nutrient_uptake; optional graph-selected grazing_management boundary
  dependency_owner: existing Functor dependency graph and scheduler
  dependency_payload: subprocess_outputs mapping supplied by the composition stage
  direct_functor_calls: none; all stage dependencies are scheduler-owned and their payloads arrive through subprocess_outputs, with no dependency instance invoked
overflow_routing_map:
  diagnostic_residuals: dependency projection is routed with open_system_route=diagnostic_residual and cannot mutate state
  open_port: fertilizer and dependency-selected urine inputs are routed once to nh4_nitrogen through StateManager
  discarded_residuals: dependency projection is observation-only, fertilizer and selected urine inputs enter ammonium once through StateManager, and the diagnostic-residual route cannot mutate state
conservation_map:
  conserved_quantities: nitrogen
  balance_expression: closed child ledgers are validated by their IPHS reaction operators; leaching, uptake, fertilizer, and selected urine are explicit open matter ports; the diagnostic N_h r_h projection never mutates state; the urine route is a non-strict instantaneous urea-to-NH4 aggregation
entropy_audit:
  operator_sign: rates, mobilities, or diagnostic maps are non-negative or checked by existing validation hooks where physically required
  sigma_expression: canonical entropy production is non-negative for dissipative subexpressions
equivalence_type: thermodynamic_embedding
