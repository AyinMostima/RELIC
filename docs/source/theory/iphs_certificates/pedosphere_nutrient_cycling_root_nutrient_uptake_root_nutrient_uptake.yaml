parameter_map:
  pedosphere.nutrient_cycling.vmax_n: Maximum N uptake rate [mol m-2 s-1]
  pedosphere.nutrient_cycling.vmax_p: Maximum P uptake rate [mol m-2 s-1]
  pedosphere.nutrient_cycling.km_n: Michaelis constant for N [mol m-3]
  pedosphere.nutrient_cycling.km_p: Michaelis constant for P [mol m-3]
  pedosphere.nutrient_cycling.max_storage_n: Maximum plant N storage [mol m-2]
  pedosphere.nutrient_cycling.max_storage_p: Maximum plant P storage [mol m-2]
  pedosphere.nutrient_cycling.root_decay_coeff: Root distribution decay [m-1]
  pedosphere.nutrient_cycling.q10_value: Temperature Q10 coefficient [dimensionless]
  pedosphere.nutrient_cycling.reference_temperature: Q10 reference temperature [K]
  pedosphere.nutrient_cycling.demand_regulation_enabled: Switch of the plant-demand limit on nutrient uptake [dimensionless]
  pedosphere.nutrient_cycling.water_stress_enabled: Switch of the water-stress effect on nutrient uptake [dimensionless]
  pedosphere.numerical.temperature_clamp_min: Lower bound of the soil temperature in the uptake response [K]
  pedosphere.numerical.temperature_clamp_max: Upper bound of the soil temperature in the uptake response [K]
  validation.conservation.strict_conservation: Switch that makes a conservation violation raise [dimensionless]
