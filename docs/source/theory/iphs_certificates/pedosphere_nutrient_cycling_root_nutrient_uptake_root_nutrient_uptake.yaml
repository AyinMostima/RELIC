runtime_replacement_map:
  runtime_uses_iphs: false
  legacy_removed: false
  replacement_entrypoint: forward
  preserved_numerics: Existing ParameterManager-backed calculations define canonical IPHS operator coefficients, rates, ports, or observations.
  no_legacy_mode: No selectable legacy runtime branch is exposed for Phase 8 completion.
state_advancement_map:
  potential_basis: declared RELIC state, port, or observation cochain basis
  effort_variable: ParameterManager-backed thermodynamic effort, driver, or diagnostic input used by the module
  state_advancer: x_dot = N_h r_h with explicit stoichiometric_N and rates evaluated by advance_reaction_network
  runtime_usage: RootNutrientUptake.forward calls advance_reaction_network with declared stoichiometric_N and rates before emitting canonical outputs.
  explicit_stoichiometric_usage: RootNutrientUptake.forward materializes nitrate, ammonium, and phosphate transfer columns and validates equivalent-mole N plus mass-basis P ledgers before lowering x_dot=N_h r_h through advance_reaction_network.
  layered_donor_increments: donor pools declared with a layer axis receive per-layer increments Delta_pool(z) = -M U(z) dt whose layer sum equals the areal N_h r_h dt transfer; plant_n_storage and plant_p_storage receive the areal increment, so StateManager shapes match the declared pool shapes
