  functor_metadata: existing FunctorMetadata declares interfaces, execution phase, and conservation semantics
  state_contract: existing simulator state update path is preserved
  validation_rule: phase8 scientific inventory and equivalence certificate checks
dependency_interconnection_map:
  dependencies: declared through existing metadata or no external dependency
  direct_functor_calls: none declared by certificate
overflow_routing_map:
  diagnostic_residuals: no nutrient-transfer residual is discarded; N and P uptake are pool- and capacity-bounded before state advancement
  discarded_residuals: pool and storage-capacity limiting leaves unconsumed nutrient in the soil pools and unmet demand untransferred; every executed transfer has matched soil-pool and plant-storage updates with strict conservation
conservation_map:
  conserved_quantities: nitrogen|phosphorus
  balance_expression: (sum_z Delta no3_nitrogen(z) + sum_z Delta nh4_nitrogen(z)) / M_N + Delta plant_n_storage = 0 in mol N m-2; sum_z Delta available_phosphorus(z) + Delta plant_p_storage = 0 in g P m-2 (the layer sums reduce to the pool increments for scalar pools)
physical_constant_ssot:
