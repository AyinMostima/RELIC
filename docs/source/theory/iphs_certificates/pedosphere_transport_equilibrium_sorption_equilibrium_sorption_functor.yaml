certificate_version: '1.0'
process_id: relic.scientific.pedosphere.transport.equilibrium_sorption.EquilibriumSorptionFunctor
module_name: EquilibriumSorptionFunctor
canonical_role: field
iphs_level: 2
iphs_level_evidence:
  classification: IPHS-wrapped index-1 descriptor DAE certificate (equilibrium Freundlich sorption with dissolved decay, hybrid semantic descriptor_dae)
  compatible_basis: One prognostic cochain equilibrium_total_solute_mass [kg m-3] and two algebraic cochains equilibrium_dissolved_concentration [kg m-3] and equilibrium_sorbed_concentration [kg kg-1] on the cell basis, tied by the mass partition and the Freundlich isotherm
  runtime_replacement: forward verifies the consistent input triple, solves the scalar implicit constraint of the step with the existing BracketedBisectionSolver (implicit parameter gradients), and emits the differential increment plus the re-solved algebraic states; no legacy branch, no separate DAE manager.
  canonical_operator: dy/dt = -lambda theta C; 0 = theta C + rho_b K_f C^n - y; S = K_f C^n; implicit step theta C' + rho_b K_f C'^n + dt lambda theta C' = y
  level_2_limit: The canonical DAE runtime wrapper is declared and executed with consistent initialization, constraint residual, and convergence reporting, but no Hamiltonian, entropy, or IPHS structure is claimed for the sorption partition; strict level 3 to 5 evidence is not applicable.
theory_document: docs\source\theory\pedosphere_equilibrium_sorption.md
theory_document_status: updated
legacy_formula: dy/dt = -lambda theta C, y = theta C + rho_b S, S = K_f C^n
literature_formula: Freundlich equilibrium sorption with retardation (Jury and Horton 2004; Mayes et al. 2012) and first-order dissolved-phase degradation; semi-explicit index-1 DAE with algebraic elimination (Hairer and Wanner 1996)
iphs_formula: E x_dot = f(x), g(x) = 0 with x = (y, C, S), E = diag(1, 0, 0), g = (theta C + rho_b S - y, S - K_f C^n); g_z invertible (index 1)
legacy_expression: y' = y - dt lambda theta C', C' from theta C' + rho_b K_f C'^n + dt lambda theta C' = y, S' = K_f C'^n
iphs_expression: consistent initial triple verified within the relative tolerance; C' bracketed on [0, y/theta]; constraint residual and solver iterations reported; non-convergence fails the step
input_variables:
- equilibrium_total_solute_mass
- equilibrium_dissolved_concentration
- equilibrium_sorbed_concentration
- soil_moisture
- bulk_density
output_variables:
- equilibrium_total_solute_mass
- equilibrium_dissolved_concentration
- equilibrium_sorbed_concentration
- diagnostics.equilibrium_sorption.constraint_residual
- diagnostics.equilibrium_sorption.degradation_flux
- diagnostics.equilibrium_sorption.solver_iterations
parameter_keys:
- pedosphere.transport.equilibrium_sorption_freundlich_coefficient
- pedosphere.transport.equilibrium_sorption_freundlich_exponent
- pedosphere.transport.equilibrium_sorption_dissolved_decay_rate
- pedosphere.transport.equilibrium_sorption_consistency_tolerance
- computation.solvers.bracketed_bisection.atol
- computation.solvers.bracketed_bisection.rtol
- computation.solvers.bracketed_bisection.max_iterations
composition_ports: []
references:
- Jury, W.A. & Horton, R. (2004). Soil Physics, 6th ed., Wiley, ch. 7
- Mayes, M.A., Heal, K.R., Brandt, C.C., Phillips, J.R. & Jardine, P.M. (2012). Relation between soil order and sorption of dissolved organic carbon in temperate subsoils. Soil Sci. Soc. Am. J. 76, 199-206
- Hairer, E. & Wanner, G. (1996). Solving Ordinary Differential Equations II, Springer, ch. VI
- Burden, R.L. & Faires, J.D. (2010). Numerical Analysis (bracketed bisection)
baseline_tests:
- test\unit\pedosphere\test_equilibrium_sorption.py
- test\audit\phase8_scientific_inventory.test.py
validation_tests:
- test\unit\pedosphere\test_equilibrium_sorption.py
- test\integration\test_equilibrium_sorption_dae_integration.py
- test\unit\validation\framework\rules\stochastic_sdae_structure.test.py
- test\audit\phase8_scientific_inventory.test.py
state_map:
  equilibrium_total_solute_mass: differential state y = theta C + rho_b S [kg m-3]; input state and accumulated increment
  equilibrium_dissolved_concentration: algebraic state C [kg m-3]; input state and full-state replacement each step
  equilibrium_sorbed_concentration: algebraic state S = K_f C^n [kg kg-1]; input state and full-state replacement each step
  soil_moisture: volumetric liquid soil water content theta [m3 m-3], the prognostic soil_moisture state, read and never written
  bulk_density: dry bulk density rho_b [kg m-3] read as forcing (bulk_density contract)
  diagnostics.equilibrium_sorption.constraint_residual: "abs(theta C' + rho_b S' - y') after the step [kg m-3]"
  diagnostics.equilibrium_sorption.degradation_flux: lambda theta C' [kg m-3 s-1]
  diagnostics.equilibrium_sorption.solver_iterations: bisection iterations of the step [1]
parameter_map:
  pedosphere.transport.equilibrium_sorption_freundlich_coefficient: Freundlich coefficient K_f [m3 kg-1]
  pedosphere.transport.equilibrium_sorption_freundlich_exponent: Freundlich exponent n [dimensionless]
  pedosphere.transport.equilibrium_sorption_dissolved_decay_rate: Dissolved-phase decay rate lambda [s-1]
  pedosphere.transport.equilibrium_sorption_consistency_tolerance: Relative consistency tolerance [dimensionless]
  computation.solvers.bracketed_bisection.atol: Absolute interval tolerance of the bisection root solve [dimensionless]
  computation.solvers.bracketed_bisection.rtol: Relative interval tolerance of the bisection root solve [dimensionless]
  computation.solvers.bracketed_bisection.max_iterations: Maximum bracket contractions of the bisection root solve [dimensionless]
operator_map:
  constraint: g(y, C) = theta C + rho_b K_f C^n - y with g_C = theta + rho_b K_f n C^(n-1) > 0 (index 1)
  elimination: scalar monotone equation F(C') = theta C' + rho_b K_f C'^n + dt lambda theta C' - y solved on the exact bracket [0, y/theta] by the existing BracketedBisectionSolver
  differential_update: implicit Euler y' = y - dt lambda theta C'
  restart_projection: the stored (y, C, S) triple is re-verified for consistency at every step, so a restored checkpoint is re-projected by the same check before advancing
unit_map:
  equilibrium_total_solute_mass: kg m-3
  equilibrium_dissolved_concentration: kg m-3
  equilibrium_sorbed_concentration: kg kg-1
  soil_moisture: m3 m-3
  diagnostics.equilibrium_sorption.constraint_residual: kg m-3
  diagnostics.equilibrium_sorption.degradation_flux: kg m-3 s-1
  diagnostics.equilibrium_sorption.solver_iterations: '1'
input_output_map:
  equilibrium_total_solute_mass: canonical state input and UpdateItem ACCUMULATE increment, per_timestep true
  equilibrium_dissolved_concentration: canonical algebraic input and UpdateItem REPLACE full state
  equilibrium_sorbed_concentration: canonical algebraic input and UpdateItem REPLACE full state
  soil_moisture: state input read from the state; never written
  diagnostics.equilibrium_sorption.constraint_residual: canonical REPLACE observation of the descriptor residual route
  diagnostics.equilibrium_sorption.degradation_flux: canonical REPLACE observation of the implicit sink
  diagnostics.equilibrium_sorption.solver_iterations: canonical REPLACE observation of the solve effort
