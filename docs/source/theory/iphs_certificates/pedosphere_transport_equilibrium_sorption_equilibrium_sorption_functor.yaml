runtime_replacement_map:
  runtime_uses_iphs: false
  legacy_removed: false
  replacement_entrypoint: forward -> relic.computation.solvers.nonlinear.BracketedBisectionSolver.solve
  preserved_numerics: The single forward path verifies consistency, solves the scalar constraint of the step on its exact bracket, and emits the implicit increment and the re-solved algebraic states; no alternative branch or projection exists.
  no_legacy_mode: No selectable legacy runtime branch is exposed; the Functor was introduced directly on the canonical root-solver owner.
  non_strict_reason: Level 2 declares the canonical DAE runtime wrapper; no IPHS structure, Hamiltonian, or entropy claim is made for the sorption partition.
state_advancement_map:
  potential_basis: differential total mass y on the cell basis with the algebraic pair (C, S) on the constraint manifold; no storage functional is claimed
  effort_variable: none; the partition and isotherm are algebraic constraints, not variational efforts
  state_advancer: y' = y - dt lambda theta C' with C' from the bracketed solve of the implicit constraint and S' = K_f C'^n
  runtime_usage: EquilibriumSorptionFunctor.forward validates states and water content, rejects inconsistent triples, solves the scalar constraint with BracketedBisectionSolver, raises on non-convergence, emits one ACCUMULATE increment, two REPLACE algebraic states, and three REPLACE diagnostics, and reports the total-mass ledger residual through check_conservation_laws.
parameter_management_map:
  pedosphere.transport.equilibrium_sorption_freundlich_coefficient:
    source: ParameterManager YAML
  pedosphere.transport.equilibrium_sorption_freundlich_exponent:
    source: ParameterManager YAML
  pedosphere.transport.equilibrium_sorption_dissolved_decay_rate:
    source: ParameterManager YAML
  pedosphere.transport.equilibrium_sorption_consistency_tolerance:
    source: ParameterManager YAML
  computation.solvers.bracketed_bisection.atol:
    source: ParameterManager YAML
  computation.solvers.bracketed_bisection.rtol:
    source: ParameterManager YAML
  computation.solvers.bracketed_bisection.max_iterations:
    source: ParameterManager YAML
composition_management_map:
  functor_metadata: existing FunctorMetadata declares three state inputs, one forcing input, three state outputs, three diagnostics, no dependencies, and the mass conservation law
  state_contract: SCM contracts equilibrium_total_solute_mass (kg m-3), equilibrium_dissolved_concentration (kg m-3), equilibrium_sorbed_concentration (kg kg-1), and the three diagnostics.equilibrium_sorption.* contracts type the GraphIR ports
  validation_rule: stochastic_sdae_check with the descriptor_dae execution binding (descriptor_constraints with the linear partition operator A_h = [[-1, theta, rho_b]], descriptor_restart with algebraic_state_keys and projection_on_restore true), phase8 scientific inventory, and equivalence certificate checks
  constraint_binding: execution_bindings.descriptor_dae names this class, its forward, the state triple, algebraic_state_scope state_manager, and the unit test as executed evidence
dependency_interconnection_map:
  dependencies: no Functor dependencies; get_dependencies() returns an empty list
  direct_functor_calls: none; only the canonical BracketedBisectionSolver owner is invoked
overflow_routing_map:
  invalid_state_route: missing, non-tensor, non-floating, non-finite, negative, or shape-mismatched states and water content outside (0, 1] fail before any solve or UpdateItem
  inconsistent_initialization_route: an input triple violating the partition or isotherm beyond the relative tolerance fails before any solve; nothing is projected silently
  solver_failure_route: a non-converged bracketed solve raises with status, iterations, and residual norm; no partial state is emitted
  discarded_residuals: no residual is discarded; the constraint residual and solver iterations are emitted every step
conservation_map:
  conserved_quantity: mass
  balance_expression: y' - y + dt lambda theta C' = 0 (degradation is the only sink; the partition constraint holds at the end of the step within the solver tolerance)
  local_check: check_conservation_laws reports abs(Delta y + dt degradation_flux) in kg m-3
  functor_law: FunctorMetadata.conservation_laws includes mass
entropy_audit:
  operator_sign: lambda >= 0 removes dissolved mass; K_f > 0 and n > 0 keep g_C > 0 so the index-1 elimination is well posed
  sigma_expression: no entropy-production claim is made; the partition is an equilibrium constraint and the decay an empirical sink
equivalence_type: exact
