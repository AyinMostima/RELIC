runtime_replacement_map:
  runtime_uses_iphs: false
  legacy_removed: false
  replacement_entrypoint: forward
  preserved_numerics: Existing ParameterManager-backed calculations define canonical IPHS operator coefficients, rates, ports, or observations.
  no_legacy_mode: No selectable legacy runtime branch is exposed for Phase 8 completion.
state_advancement_map:
  potential_basis: CO2 and N2O layer concentrations are declared as primal 0-cochains on pedosphere_soil_gas_diffusion
  effort_variable: e_h = delta H_h / delta c_h = c_h for stacked CO2 and N2O concentration cochains
  state_advancer: delta C_raw,i = -(J_i+1/2 - J_i-1/2) dt/dz with F_surface,out = -J_top and J_bottom = 0; delta C_accepted,i = max(-C_i, delta C_raw,i)
  runtime_usage: GasDiffusion1D.forward computes ParameterManager-backed effective diffusivity once, advances each exact-grid concentration through one conservative finite-volume divergence, and returns explicit UpdateItems plus signed species-specific clipping routes.
