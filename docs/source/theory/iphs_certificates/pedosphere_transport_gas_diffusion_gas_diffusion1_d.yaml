composition_management_map:
  functor_metadata: existing FunctorMetadata declares interfaces, execution phase, and conservation semantics
  state_contract: concentration states use StateManager ACCUMULATE updates and flux ports use REPLACE
  physical_constant_ssot: reference temperature, Celsius offset, seconds per hour, gas constant, standard pressure, standard temperature, and molar masses are read or derived only from relic physical constants
  validation_rule: phase8 scientific inventory and equivalence certificate checks
dependency_interconnection_map:
  dependencies: declared through existing metadata or no external dependency
  direct_functor_calls: none; gas, moisture, temperature, and boundary state enter via declared ports and no producer instance is called
overflow_routing_map:
  diagnostic_residuals: carbon and nitrogen clipping adjustments are routed separately to diagnostics.gas_diffusion.co2_clipping_residual and diagnostics.gas_diffusion.n2o_clipping_residual; port-power closure residuals use diagnostics.gas_diffusion.port_power_residual
  discarded_residuals: carbon-dioxide and nitrous-oxide clipping adjustments are separate co2_clipping_residual and n2o_clipping_residual outputs, and port-power nonclosure is port_power_residual
conservation_map:
  conserved_quantities: mass
  balance_expression: for each species sum_i(delta C_accepted,i * dz) + F_surface,out * dt - sum_i(R_clip,i * dz) = 0 under the declared no-flow bottom boundary, where R_clip = delta C_accepted - delta C_raw
  top_boundary_switch: pedosphere.transport.atmospheric_exchange=false closes the soil-atmosphere boundary for both the Fickian and the DNDC surface expressions (F_surface,out = 0, J_top = 0), so the species ledger reduces to sum_i(delta C_accepted,i * dz) - sum_i(R_clip,i * dz) = 0
entropy_audit:
  operator_sign: star_K is diagonal and non-negative because effective diffusivities are clamped by ParameterManager-backed numerical bounds and Hodge validation checks PSD
  sigma_expression: sigma_h = X_h.T star_K X_h >= 0 is emitted at runtime as diagnostics.gas_diffusion.dissipation_rate
equivalence_type: port_equivalent
