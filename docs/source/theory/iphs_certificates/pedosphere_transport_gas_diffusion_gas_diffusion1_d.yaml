legacy_formula: J = -Deff partialC/partialz; Deff = f(thetaa, phi, T)
literature_formula: Jz = -Deff partialC/partialz; F_surface,out = -Jz(0)
iphs_formula: c_dot = -D_h q_h + G_h u_h, q_h = -star_K D_h^T e_h, e_h = delta H_h / delta c_h
