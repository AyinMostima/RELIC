composition_management_map:
  functor_metadata: existing FunctorMetadata declares transport abstraction, variables, units, references, and conservation laws
  structural_protocol: declared_forms, required_parameters, build_hodge_terms, dissipative_structure, ports
  state_contract: explicit soil_moisture UpdateItem uses REPLACE and per_timestep=false through StateManager
  compiler_gate: existing compile_graph, validate_graph, and ValidationRegistry assertions
  ports:
  - surface_water_flux_boundary
  - bottom_drainage_boundary
dependency_interconnection_map:
  dependencies: get_dependencies declares surface_runoff and the two mutually exclusive ET closures as lagged alternatives; canonical boundary ports may instead be supplied by the external StateManager adapter
  lagged_dependencies:
  - surface_runoff
  - penman_monteith_et
  - priestley_taylor_et
  coupling_interfaces:
  - pedosphere.hydrology
  - pedosphere.biology
  chain_maps:
  - cellwise soil_moisture profile to the absolute soil_moisture full state
  - canonical boundary mass fluxes through water_density to the volumetric surface port
  direct_functor_calls: none_no_direct_functor_calls
overflow_routing_map:
  saturation_bounds: theta_raw - clamp(theta_raw, wilting_point, porosity) is emitted as diagnostics.soil_water_transport.clipping_residual
  conservation_residual: diagnostics.soil_water_transport.water_balance_residual receives the absolute column balance residual in m
  boundary_flux_residual: surface and drainage fluxes are represented by declared matter ports
  unsupported_configuration: non-1D grids, unsupported hydraulic closures, nonpositive time steps, and non-finite numerical states or ledgers are rejected before state advancement
  discarded_residuals: none_no_discarded_residuals
conservation_map:
  conserved_quantity: water
  balance_expression: sum(theta_new - theta_old) dz = (q_surface - q_bottom) dt + residual
  local_check: _check_water_conservation returns diagnostics.soil_water_transport.water_balance_residual and check_conservation_laws binds the FunctorBase guard to that open-column ledger
  functor_law: FunctorMetadata.conservation_laws includes mass and water
entropy_audit:
  dissipative_operator: star_K and M_h are symmetric positive semidefinite
  sigma_expression: sigma = X_h.T star_K X_h >= 0
  validation_hook: build_hodge_contract(strict=True) and dissipative_structure eigenvalue checks
equivalence_type: port_equivalent
