composition_management_map:
  functor_metadata: existing FunctorMetadata declares interfaces, execution phase, and conservation semantics
  state_contract: all retained outputs use explicit REPLACE UpdateItems; concentration states and integrated residuals are per-step, while boundary fluxes are instantaneous
  physical_constant_ssot:
    liter_to_cubic_meter: get_physical_constant("relic.physical.constants.conversions.liter_to_cubic_meter")
    reference_temperature: get_physical_constant("reference_temperature")
  validation_rule: phase8 scientific inventory and equivalence certificate checks
dependency_interconnection_map:
  dependencies: hydrological, thermal, and boundary inputs are resolved from StateManager through declared canonical ports; no Functor instance is called directly
  direct_functor_calls: none; hydrological, thermal, concentration, and boundary inputs are StateManager ports
overflow_routing_map:
  diagnostic_residuals: NO3 and DOC finite-volume mass residuals are returned through namespaced diagnostic ports
  boundary_routes: surface concentrations define explicit top inputs and bottom leaching fluxes define explicit exports
  invalid_states: missing, non-finite, negative, shape-incompatible, or unsupported upward-flow states fail fast; no clamp or hidden zero is applied
  discarded_residuals: nitrate and dissolved-organic-carbon finite-volume residuals are explicit diagnostics, top inputs and bottom leaching are explicit boundary routes, and non-finite, negative, or unsupported upward-flow states are rejected without clipping
conservation_map:
  conserved_quantities: nitrogen|carbon|mass
  balance_expression: $M^{n+1}-M^n-F_{top}\Delta t+F_{bottom}\Delta t=0$ independently for NO3-N and DOC-C
entropy_audit:
  operator_sign: star_D is structurally diagonal and non-negative because molecular diffusivity, dispersivity, water content, porosity, and temperature are validated before use; no runtime clipping supplies positivity
  sigma_expression: the structural audit exposes $\sigma_h=X_h^T star_D X_h\geq0$ for diffusion-dispersion only; advection and matter ports prevent a strict thermodynamic claim
equivalence_type: port_equivalent
