runtime_replacement_map:
  runtime_uses_iphs: false
  legacy_removed: false
  replacement_entrypoint: forward -> exact exponential two-region update
  preserved_numerics: The single forward path evaluates the closed-form solution of the linear exchange for the step and emits the exact increments; no alternative kinetic branch exists.
  no_legacy_mode: No selectable legacy runtime branch is exposed; the Functor was introduced directly with the exact update.
  non_strict_reason: Level 3 declares J, R, H, and the memory realization; the runtime-point IPHSStructureSpec witness (level 4) is not bound.
state_advancement_map:
  potential_basis: theta-weighted storage x = (theta_m c_m, theta_im c_im) with H = 0.5 (theta_m c_m^2 + theta_im c_im^2)
  effort_variable: e = dH/dx = (c_m, c_im)
  state_advancer: x_dot = -R e realized exactly per step by d(t+dt) = d(t) exp(-kappa dt) with the theta-weighted total held fixed
  runtime_usage: TwoRegionMassTransferFunctor.forward validates both states and the step, evaluates the exact exchange, emits two ACCUMULATE increments and three REPLACE diagnostics, and reports the theta-weighted ledger residual through check_conservation_laws.
parameter_management_map:
  pedosphere.transport.two_region_mass_transfer_coefficient:
    source: ParameterManager YAML
  pedosphere.transport.two_region_mobile_water_content:
    source: ParameterManager YAML
  pedosphere.transport.two_region_immobile_water_content:
    source: ParameterManager YAML
composition_management_map:
  functor_metadata: existing FunctorMetadata declares two state inputs, two state outputs, three diagnostics, no dependencies, and the mass conservation law
  state_contract: SCM contracts mobile_solute_concentration and immobile_solute_concentration (kg m-3, state) and the three diagnostics.two_region_exchange.* contracts type the GraphIR ports
  validation_rule: stochastic_sdae_check with the memory execution binding (memory_kernels, memory_restart with history_state_keys immobile_solute_concentration), phase8 scientific inventory, and equivalence certificate checks
  memory_binding: execution_bindings.memory names this class, its forward, the state pair, history_state_scope state_manager, and the unit test as executed evidence
dependency_interconnection_map:
  dependencies: no Functor dependencies; get_dependencies() returns an empty list
  direct_functor_calls: none; the exact exchange is evaluated inside forward without calling another Functor or solver
overflow_routing_map:
  invalid_state_route: missing, non-tensor, non-floating, non-finite, negative, or shape-mismatched states fail before any UpdateItem
  inadmissible_timestep_route: a non-positive or non-finite step fails before any UpdateItem
  memory_residual_route: diagnostics.two_region_exchange.memory_residual carries theta_m Delta c_m + theta_im Delta c_im of every step (zero to rounding for the exact update)
  discarded_residuals: no residual is discarded; the exact update needs no clipping
conservation_map:
  conserved_quantity: mass
  balance_expression: theta_m Delta c_m + theta_im Delta c_im = 0 for every step (closed two-region ledger)
  local_check: check_conservation_laws reports max |memory_residual| in kg m-3
  functor_law: FunctorMetadata.conservation_laws includes mass
entropy_audit:
  dissipative_operator: R = alpha [[1, -1], [-1, 1]] is symmetric positive semidefinite for alpha > 0
  storage_functional: H = 0.5 (theta_m c_m^2 + theta_im c_im^2)
  effort_definition: e = (c_m, c_im)
  sigma_expression: sigma = e^T R e = alpha (c_m - c_im)^2 >= 0
  dH_balance: dH/dt = -sigma; the instantaneous power delivered to the mobile state may be positive (energy return from the immobile memory) while the extended storage never increases
  units_and_scope: H is a theta-weighted concentration norm [kg2 m-6]; sigma is norm dissipation [kg2 m-6 s-1], not thermodynamic entropy production
  validation_hook: unit tests verify the exact solution, the semigroup property, the nonincreasing extended storage, the Volterra reconstruction of the hidden state, and the closed ledger; no strict runtime Hamiltonian or GENERIC evidence is claimed
equivalence_type: exact
