runtime_replacement_map:
  runtime_uses_iphs: false
  legacy_removed: false
  replacement_entrypoint: _compute_iphs_advection_diffusion_update
  preserved_numerics: The existing unified advection_diffusion operator realizes c_dot = -D_h(q_adv_h + q_diff_h) + G_h u_h with source_term as an open input contribution.
  no_legacy_mode: Production forward is the only executable formula path; mutable velocity and diffusivity setters are absent; missing or nonfinite canonical inputs, invalid timesteps, incomplete velocity dimensions, undeclared velocity aliases, missing conditional boundary states, and unsupported boundary methods fail fast.
state_advancement_map:
  potential_basis: tracer concentration cochain c_h
  effort_variable: combined transport flux q_h = q_adv_h + q_diff_h
  state_advancer: c_dot = -D_h(q_adv_h + q_diff_h) + G_h u_h with q_adv_h = i_v c_h and q_diff_h = -star_K d_h c_h
  runtime_usage: _compute_iphs_advection_diffusion_update returns the canonical integrated operator state, and forward emits its single delta through an explicit ACCUMULATE UpdateItem.
