composition_management_map:
  functor_metadata: existing FunctorMetadata declares transport role and state interface
  structural_protocol: AdvectionDiffusion declares its own typed forms, Hodge terms, J, M, and total boundary port without child Functors
  state_contract: existing FunctorBase wrap_update and StateManager path
  ports:
  - advection_diffusion_boundary_flux
dependency_interconnection_map:
  dependencies: velocity_field and conditional boundary state are scheduler-visible ports; no component Functors are owned
  direct_functor_calls: none; concentration, velocity, source, and conditional boundary state are ports and no component Functor is owned or invoked
  chain_maps:
  - tracer_concentration state cochain to tracer_concentration increment
  - canonical operator total face ledger to tracer_concentration_advection_diffusion_boundary_flux
overflow_routing_map:
  non_negative_projection: none; invalid initial or proposed negative states fail fast
  conservation_residual: diagnostics.conservation_error receives the source-aware mass residual only when tracking is enabled for the closed periodic route
  nonperiodic_boundary_route: tracer_concentration_advection_diffusion_boundary_flux retains the total outward-positive face ledger; exchange is not mislabeled as closed-domain conservation error
  missing_velocity_route: fail-fast because velocity_field is a required advective port
  discarded_residuals: negative candidates and missing velocity are rejected, total nonperiodic exchange remains in tracer_concentration_advection_diffusion_boundary_flux, and closed-periodic tracking emits source-aware conservation_error
conservation_map:
  conserved_quantity: mass
  balance_expression: Delta M - dt integral(S dV) + dt sum_f(j_out,f A_f) = 0; periodic closure has an empty boundary ledger
  local_check: existing operator conservation diagnostic is evaluated only for the periodic closed-domain route
  functor_law: FunctorMetadata.conservation_laws includes mass
entropy_audit:
  dissipative_operator: diffusion component M_h is PSD; conservative advection M_h is zero
  sigma_expression: sigma = X_h.T M_diff_h X_h >= 0
  validation_hook: component build_hodge_terms and dissipative_structure eigenvalue checks
equivalence_type: port_equivalent
