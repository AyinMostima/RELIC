theory_document_status: updated
legacy_formula: dc/dt = -div(v * c) + div(K * grad(c)) + S
literature_formula: Advection-diffusion in conservative form with q_adv = v c, q_diff = -K grad(c), and dc/dt = -div(q_adv + q_diff) + S.
iphs_formula: c_dot = -D_h(q_adv_h + q_diff_h) + G_h u_h; q_adv_h = i_v c_h; q_diff_h = -star_K d_h c_h.
