certificate_version: '1.0'
process_id: relic.scientific.transport.diffusion.FickianDiffusion
module_name: fickian_diffusion
canonical_role: transport
iphs_level: 3
iphs_level_evidence:
  classification: IPHS-structured transport process certificate
  compatible_basis: Process declares composition-safe IPHS or DEC structure
  runtime_replacement: Production forward path uses the existing canonical wrapper or declaration contract; strict runtime replacement is not claimed at this certificate level.
  canonical_operator: DEC/IPHS transport operator with conservative flux routing
  structural_contribution: Cochain, Hodge, flux, and port structures are declared for assembly audit
  assembly_participation: Certificate participates in Phase 8 inventory and GraphIR structural audit
  level_3_limit: Typed form, Hodge, port, or related structure is declared, but no runtime-linked IPHSStructureSpec contribution and executable level 4 or 5 certificate binding is present.
theory_document: docs\source\theory\transport_fickian_diffusion.md
theory_document_status: updated
legacy_formula: dc/dt = div(K * grad(c)) + S
literature_formula: Fickian diffusion in conservative form with flux J = -D grad(c) and storage tendency dc/dt = -div(J) + S.
iphs_formula: c_dot = -D_h q_h + G_h u_h; q_h = -star_K d_h c_h; star_K = star_K.T >= 0.
legacy_expression: dc/dt = div(K * grad(c)) + S
iphs_expression: c_dot = -D_h q_h + G_h u_h; q_h = -star_K X_h; X_h = d_h c_h; H_h = 0.5 * c_h.T c_h; sigma = X_h.T star_K X_h >= 0; dH/dt = -sigma + e_h.T G_h u_h - P_boundary.
input_variables:
- tracer_concentration
- source_term
- tracer_concentration_boundary_state
output_variables:
- tracer_concentration
- tracer_concentration_diffusive_boundary_flux
- diagnostics.diffusion_stability
- diagnostics.conservation_error
parameter_keys:
- transport.diffusion.diffusivity
- transport.diffusion.grid_spacing
- transport.diffusion.temperature_exponent
- transport.numerical.conservation_tolerance
- transport.numerical.enforce_non_negative
- transport.numerical.track_conservation
- transport.numerical.cfl_diffusion_max
- transport.numerical.default_boundary_type
- transport.numerical.implicit_midpoint_max_iter
- transport.numerical.implicit_midpoint_tolerance
composition_ports:
- diffusive_boundary_flux
references:
- Crank, J. (1975). The Mathematics of Diffusion. Oxford University Press.
- Bird, R.B., Stewart, W.E., and Lightfoot, E.N. (2007). Transport Phenomena. Wiley.
- LeVeque, R.J. (2007). Finite Difference Methods for Ordinary and Partial Differential Equations. SIAM.
- Hirani, A.N. (2003). Discrete Exterior Calculus.
baseline_tests:
