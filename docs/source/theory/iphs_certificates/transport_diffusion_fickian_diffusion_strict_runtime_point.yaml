certificate_version: '1.0'
process_id: relic.scientific.transport.diffusion.FickianDiffusion
constructor_selection:
  strict_runtime_point: true
  spatial_dims: 1
module_name: fickian_diffusion
canonical_role: transport
formulation: dissipative_ph
iphs_level: 4
iphs_level_evidence:
  classification: Strict dissipative port-Hamiltonian certificate for the closed one-dimensional finite-volume diffusion selection strict_runtime_point=true
  compatible_basis: State cochain c_h in kg m-3 on one unbatched one-dimensional cell basis; storage H_h = 0.5 c_h^T c_h, effort e_H = c_h, resistance R_h = d_h^T diag(K_f) d_h / dx^2 with harmonic face coefficients
  runtime_replacement: forward keeps the single OperatorFactory transport.diffusion production law and, for this selection, additionally evaluates IPHSStructureSpec.canonical_drift with J_h = 0 (zero_field) and R_h, verifies that (J_h - R_h) e_H reproduces the production finite-volume rate, and runs IPHSStructureSpec.validate(required_level=4) on the same bound storage every emitted step
  canonical_operator: c_dot = (J_h - R_h) e_H with J_h = 0, R_h = d_h^T diag(K_f) d_h / dx^2, e_H = dH_h/dc_h = c_h; dH_h/dt = -e_H^T R_h e_H = -sigma_0 <= 0
  structural_contribution: Cochain, Hodge, flux, and port structures are declared for assembly audit; the runtime point binds the global closed finite-volume resistance, not the local material diagonal
  assembly_participation: Certificate participates in Phase 8 inventory and GraphIR structural audit through the class-level level 3 certificate; this selection certificate binds the strict runtime point
  storage_functional:
    runtime_owner: relic.scientific.transport.diffusion.FickianDiffusion._closed_dph_runtime_point
    value_key: storage
    state_keys:
    - tracer_concentration
    units: kg2 m-6
    theory_anchor: transport_fickian_diffusion:level_4_dph_runtime_point
    validation_test: test\transport\test_diffusion_l1.py
  effort_definition:
    runtime_owner: relic.computation.operators.iphs.IPHSStructureSpec.canonical_drift
    value_key: energy_effort
    derivative_of: storage_functional
    method: autograd
    validation_test: test\transport\test_diffusion_l1.py
  dissipation_audit:
    runtime_owner: relic.computation.operators.iphs.IPHSStructureSpec.validate
    operator_owner: relic.scientific.transport.diffusion.FickianDiffusion._closed_dph_runtime_point
    operator_kind: resistance_R
    value_key: energy_dissipation
    balance_key: closed_port_energy_rate
    inequality: dH_dt<=port_power
    tolerance_parameter_key: validation.iphs.runtime_point_tolerance
    validation_test: test\transport\test_diffusion_l1.py
  port_power_audit:
    runtime_owner: relic.computation.operators.iphs.IPHSStructureSpec.canonical_drift
    balance_key: closed_boundary_port_power
    sign_convention: out_of_system
    tolerance_parameter_key: validation.iphs.runtime_point_tolerance
    validation_test: test\transport\test_diffusion_l1.py
  level_4_scope: Level 4 holds for the executed runtime point of each emitted step of the closed one-dimensional selection; the process-bound witness (governed FunctorBase call, committed tracer_concentration, accepted step) must accompany this certificate when validated, otherwise it remains descriptive. Dirichlet and extrapolated boundaries carry a matter port whose port-power linkage is not claimed.
theory_document: docs\source\theory\transport_fickian_diffusion.md
theory_document_status: updated
legacy_formula: dc/dt = div(K * grad(c)) + S
literature_formula: Fickian diffusion in conservative form with flux J = -D grad(c) and storage tendency dc/dt = -div(J) + S; closed finite-volume form dH/dt = -sum_f K_f (dc_f/dx)^2 <= 0 for H = 0.5 c.c (Crank 1975; Patankar 1980; van der Schaft and Jeltsema 2014)
iphs_formula: c_dot = (J_h - R_h) e_H; J_h = 0; R_h = d_h^T diag(K_f) d_h / dx^2; e_H = c_h; dH_h/dt = -e_H^T R_h e_H <= 0
legacy_expression: dc/dt = div(K * grad(c)) + S
iphs_expression: c_dot = (J_h - R_h) e_H; J_h = 0; R_h = d_h^T diag(K_f) d_h / dx^2; e_H = c_h; dH_h/dt = -e_H^T R_h e_H <= 0
