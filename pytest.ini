[pytest]
addopts = --import-mode=importlib --strict-config --strict-markers
testpaths = test
python_files = test_*.py *_test.py *.test.py *.spec.py
markers =
    unit: unit-level test marker
    integration: integration-level test marker
    system: system-level end-to-end test marker
    scientific: scientific validation marker
    invariant: invariant contract test marker
    benchmark: benchmark test marker
    audit_gate: repository audit gate marker
    slow: long-running test marker
    serial: test that must not run concurrently
    writes_artifacts: test that writes durable artifacts
    property: property-based test marker
    perf: performance regression test marker
    gpu: test that requires a GPU
    external_data: test that requires external datasets
