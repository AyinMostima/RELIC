# JSON Schema for RELIC SCM variable contract
$schema: "http://json-schema.org/draft-07/schema#"
title: "RELIC SCM Variable Contract"
type: object
required:
  - variable
  - kind
  - dimension
properties:
  variable:
    type: string
    description: "Fully qualified variable name (e.g., biosphere.leaf_carbon)"
  title:
    type: string
  kind:
    type: string
    enum: ["state", "diagnostic", "parameter", "flux", "forcing"]
  dimension:
    type: object
    properties:
      udunits:
        type: string
      cf_standard_name:
        type: ["string", "null"]
      cell_methods:
        type: ["string", "null"]
        description: "CF-1.8 section 7.3 cell_methods qualifying cf_standard_name (for example 'time: maximum')"
    required: ["udunits"]
  support:
    type: object
    additionalProperties: false
    required:
      - spatial_kind
      - area_basis
      - temporal_basis
      - vertical_basis
    properties:
      spatial_kind:
        type: [string, "null"]
        enum:
          - null
          - leaf
          - canopy
          - grid_cell
          - footprint
          - tower_height
          - vertical_column
      area_basis:
        type: [string, "null"]
        enum:
          - null
          - leaf_area
          - ground_area
          - grid_area
      temporal_basis:
        type: [string, "null"]
        enum:
          - null
          - instantaneous
          - interval_mean
          - interval_integral
      vertical_basis:
        type: [string, "null"]
        enum:
          - null
          - none
          - height_level
          - layer_integral
      shape:
        type: object
  layer_thickness_variable:
    type: ["string", "null"]
    minLength: 1
    description: "State variable [m] holding the thickness of the layer this variable describes; read pointwise to convert between volumetric content and areal amount"
  owner:
    type: ["string", "null"]
    description: "Unique functor with write permission"
  aliases:
    type: array
    items:
      type: string
  incrementable:
    type: boolean
  accumulates:
    type: ["string", "null"]
    description: "Conservation domain (e.g., carbon.total)"
  writers:
    type: object
    properties:
      increments:
        type: array
        items:
          type: object
          properties:
            name:
              type: string
            module:
              type: string
            provides:
              type: array
              items:
                type: string
            unit:
              type: string
      tendencies:
        type: array
        items:
          type: object
  flux_contract:
    type: object
    properties:
      allowed_in:
        type: array
        items:
          type: string
      allowed_out:
        type: array
        items:
          type: string
      budget_check:
        type: object
        properties:
          guardian:
            type: ["string", "null"]
          tolerance:
            type: object
            properties:
              atol:
                type: number
              rtol:
                type: number
  numerics:
    type: object
    properties:
      lower_bound:
        type: ["number", "null"]
      upper_bound:
        type: ["number", "null"]
      atol:
        type: number
      rtol:
        type: number
