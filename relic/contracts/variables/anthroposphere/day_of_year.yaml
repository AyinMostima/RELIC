  - "CF-1.8 calendar coordinates"
numerics:
  lower_bound: 1.0
  upper_bound: 366.0
  atol: 1.0e-12
  rtol: 1.0e-9
writers:
  increments: []
  tendencies: []
flux_contract:
  allowed_in: []
  allowed_out: []
  budget_check:
