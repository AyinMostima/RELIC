variable: irrigation_demand_flux
title: "Irrigation Demand Flux"
description: "Net irrigation requirement rate F_net = max(E - P, 0) of the ManagementCoordinator (FAO-24 net irrigation requirement; Allen et al. 1998, FAO-56 Eq. 85), from evapotranspiration_flux E and precipitation_flux P. P is taken as fully effective (P_e = P), a simplification that underestimates the FAO requirement (FAO effective-precipitation methods give P_e <= P). The gross application F_net / eta_a is computed only by IrrigationManagement."
