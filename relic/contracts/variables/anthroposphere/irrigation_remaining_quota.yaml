variable: irrigation_remaining_quota
title: "Irrigation Remaining Source-Water Quota"
description: "Remaining source-water allocation Q of the irrigated domain, a water depth summed over the irrigated cells in mm. IrrigationManagement reads it as a declared input and returns Q' = Q - A_used (A_used the abstracted depth of the step) as a REPLACE update; a domain demand above Q is met at the same percentage in every cell (WEAP21 equity rule). The initial quota is part of the scenario initial state; a quota reset is a state assignment."
