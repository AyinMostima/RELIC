variable: sector_emission_flux
title: "Sector-Resolved Anthropogenic Emission Flux"
description: "Sector split E_sector[s,k,x] = W[s,k,x] E_input[k,x] of the six canonical inventory mass fluxes anthropogenic_{nox,co,so2,voc,nh3,pm25}_flux over the fixed sector axis (power, transport, industry, buildings, agriculture) and species axis (NOx, CO, SO2, VOC, NH3, PM25), with sum_s E_sector = E_input in every cell. SectorAllocation returns it as UpdateItem(REPLACE, write_mode DERIVED, basis per_second, per_timestep False): a derived quantity of the step that partition_outputs routes out of the commit, so StateManager never stores it as state. It stays visible to the Functors that run later in the same group call (SpeciesMapper reads it there) and keeps its write provenance; a caller can also supply it as input state. The emission mass budget stays with the six inventory flux ports; the split is not a second budget term."
kind: diagnostic
dimension:
  udunits: "kg m-2 s-1"
  cf_standard_name: null
owner: "sector_allocation"
aliases: []
incrementable: false
accumulates: null
numerics:
  lower_bound: 0.0
  upper_bound: null
  atol: 1.0e-12
  rtol: 1.0e-9
writers:
