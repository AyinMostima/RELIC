      rtol: 1.0e-8
provenance:
  source_file: "relic/scientific/anthroposphere/emissions/sector_allocation.py"
  runtime_role: "derived_sector_species_mass_flux"
  runtime_writer: "sector_allocation"
  note: "Runtime channel verified: relic/scientific/anthroposphere/emissions/sector_allocation.py forward() returns write_mode StateWriteMode.DERIVED and check_conservation_laws() requires it; relic/core/state/types.py partition_outputs() routes DERIVED to the diagnostics channel; relic/core/simulator/execution_group.py _clean_updates_and_collect_diagnostics() keeps a declared DERIVED output visible to later Functors of the same group call; relic/core/state/manager.py records it as a state diagnostic and never commits it. The only committed-state writer declaration (tendencies sector_allocation, flux_contract allowed_in) was removed with the change of kind from flux to diagnostic."
