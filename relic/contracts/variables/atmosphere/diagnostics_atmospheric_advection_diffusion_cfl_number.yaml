provenance:
  source_file: "relic/scientific/atmosphere/transport/AtmosphericAdvectionDiffusionFunctor.py"
  runtime_role: "atmospheric_transport_cell_courant_observation"
  runtime_writer: "atmospheric_advection_diffusion"
  note: "Scalar torch.max of the diagnostics.cfl_calculator field (compute_cfl_number, relic/computation/operators/functional.py:931: C = sum_k |u_k| dt / dx_k), checked against transport.numerical.cfl_advection_max before the combined operator runs and written as a raw diagnostics.* output (partitioned out of state, ingested per step)."
