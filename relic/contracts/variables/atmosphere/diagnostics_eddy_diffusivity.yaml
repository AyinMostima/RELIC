variable: diagnostics.eddy_diffusivity
title: "Domain-Mean Atmospheric Tracer Eddy Diffusivity"
description: "Domain mean of the stability-dependent eddy diffusivity K_eddy of the atmospheric K-theory tracer closure (Stull 1988): K0 = f * K_max; K_eddy = K0 * (1 + a * s / (1 + s)) for unstable s = -zeta > 0, else K0 / (1 + b * zeta), where zeta is diagnostics.stability_parameter (z / L for monin-obukhov, the bulk Richardson number for richardson); capped at atmosphere.turbulence.eddy_diffusivity_max. The constant scheme skips the closure and returns K0. Excludes the molecular diffusivity added for transport. Non-negative magnitude with no direction. Written only by atmospheric_advection_diffusion as a read-only step diagnostic."
kind: diagnostic
dimension:
  udunits: "m2 s-1"
  cf_standard_name: null
support:
  spatial_kind: null
  area_basis: null
  temporal_basis: instantaneous
  vertical_basis: none
  shape:
    dimensions: []
owner: "atmospheric_advection_diffusion"
aliases: []
incrementable: false
accumulates: null
references:
  - "Stull, R.B. (1988). An Introduction to Boundary Layer Meteorology, Kluwer"
numerics:
  # K_eddy >= 0 for the non-negative YAML coefficients f, a, b; its cap is
  # the ParameterManager value eddy_diffusivity_max, not a declared bound.
  lower_bound: 0.0
  upper_bound: null
  atol: 1.0e-12
  rtol: 1.0e-9
writers:
