  note: "Written at AtmosphericAdvectionDiffusionFunctor.py:802,975 from _compute_atmospheric_stability (AtmosphericAdvectionDiffusionFunctor.py:997-1130). Shape is scheme dependent (scalar for constant, the temperature/sensible_heat_flux/atmospheric_pressure/relative_humidity broadcast for monin-obukhov, the tracer grid for richardson), so no tensor shape is declared. Heat-flux safeguard and length clamp: relic/scientific/atmosphere/most/stability_parameters.py:296-306. Runtime probe (default parameters, z = 500 m, supplied T = 298.15 K, p = 101325 Pa, RH = 0.5): monin-obukhov H = 0 gives zeta = -0.5, H = +50 W m-2 gives -10 and H = -50 W m-2 gives +10 (the transport_stability_limit clamp); richardson gives +10 for any H; constant gives 0."
