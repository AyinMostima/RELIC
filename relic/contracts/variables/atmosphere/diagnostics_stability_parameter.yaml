variable: diagnostics.stability_parameter
title: "Atmospheric Transport Stability Parameter"
description: "Stability parameter that drives the atmospheric K-theory tracer closure: zeta = z / L with z = boundary_layer_height / 2 and L the Obukhov length for stability_scheme monin-obukhov (Monin and Obukhov 1954), the bulk Richardson number for richardson (Stull 1988), and 0 for constant; clamped to +/- atmosphere.turbulence.transport_stability_limit. Dimensionless and signed: negative is unstable, positive is stable. For monin-obukhov an upward sensible heat flux (H > 0) gives zeta < 0 and a downward flux zeta > 0; a heat flux with |H| below atmosphere.most.h_min_safeguard, including H = 0, is replaced by +h_min_safeguard, so H = 0 is reported as unstable (zeta < 0), and the Obukhov-length clamp atmosphere.most.monin_obukhov_length_clamp_min/max (+/- 1000 m) keeps |zeta| >= z / 1000 m (0.5 at the default z = 500 m), so the scheme never returns 0. For richardson the sign follows only the prescribed atmosphere.stability.potential_temperature_gradient (positive gradient: stable). Only the constant scheme returns 0. Distinct from diagnostics.turbulence.stability_parameter of atmospheric_turbulence. Written only by atmospheric_advection_diffusion as a read-only step diagnostic."
