variable: large_scale_precipitation_flux
title: "Large-Scale Precipitation Mass Flux"
description: "Precipitation mass flux (liquid plus ice) at the surface produced by the resolved (grid-scale, stratiform) microphysics, a part of precipitation_flux. Supplied as forcing by external adapters (WRF RAINNC de-accumulated over each output interval, CESM PRECL); no RELIC Functor writes or reads it. CF v94 large_scale_precipitation_flux (kg m-2 s-1)."
kind: forcing
dimension:
  udunits: "kg m-2 s-1"
  cf_standard_name: "large_scale_precipitation_flux"
support:
  spatial_kind: grid_cell
  area_basis: ground_area
  temporal_basis: instantaneous
  vertical_basis: none
  shape:
    dimensions: [cell]
owner: null
aliases: []
incrementable: false
accumulates: null
references:
  - "CF Standard Name Table v94: large_scale_precipitation_flux (canonical units kg m-2 s-1)"
  - "Skamarock et al. (2019) A Description of the Advanced Research WRF Model Version 4, NCAR/TN-556+STR (RAINNC accumulated grid-scale precipitation)"
  - "CAM history field PRECL: large-scale (stable) precipitation rate, liquid plus ice"
# Sign convention: a downward mass flux onto the surface, >= 0.
numerics:
  lower_bound: 0.0
  upper_bound: null
  atol: 1.0e-12
  rtol: 1.0e-9
writers:
  increments: []
  tendencies:
    - name: "CESMAdapter"
      module: "relic.coupling.external.atmospheric_models.cesm_adapter"
      provides: ["large_scale_precipitation_flux"]
      unit: "kg m-2 s-1"
    - name: "WRFAdapter"
      module: "relic.coupling.external.atmospheric_models.wrf_adapter"
      provides: ["large_scale_precipitation_flux"]
      unit: "kg m-2 s-1"
flux_contract:
  allowed_in: []
  allowed_out: []
  budget_check:
    guardian: null
    tolerance:
      atol: 1.0e-10
      rtol: 1.0e-8
provenance:
  source_file: "external_forcing_adapter"
  runtime_role: "external_large_scale_precipitation_mass_flux_forcing"
  runtime_writer: null
  adapter_writers:
    - "CESMAdapter"
    - "WRFAdapter"
