variable: measurement_height
title: "Flux Measurement Height"
description: "Height above the surface of the flux measurement (tower receptor) used by the flux footprint [m]. It declares no cf_standard_name: the CF v94 name height fits, but one CF identity belongs to one RELIC variable, and height is held by layer_center_height, the vertical coordinate of the column; in CF the receptor height is a scalar height coordinate of the observed flux rather than a separate quantity."
