variable: o3_mixing_ratio
title: "Atmospheric O3 Mixing Ratio"
description: "Mole fraction of ozone in air [mol mol-1] (CF v94 mole_fraction_of_ozone_in_air, canonical unit 1), the atmospheric ozone state incremented by atmospheric_chemistry, eddy_diffusion_blm and dry_deposition_aggregator and read by ozone_stress for the stomatal ozone uptake F_O3 = g_s c eta (relic/scientific/biosphere/stress/ozone_stress.py). ozone_concentration, the former OzoneStress forcing name of the same quantity, is a contract alias of this variable. Support: one value per grid cell, the well-mixed box (boundary-layer) mole fraction of these writers, no vertical dimension; ozone_stress takes it as the leaf-surface value (the R_a -> 0 limit of Sitch et al. 2007). A forcing supplied to a daily (dt = 86400 s) graph is the daily mean, which the instantaneous ozone_stress law then reads (declared limitation, no history)."
kind: state
dimension:
  udunits: "mol mol-1"
  cf_standard_name: "mole_fraction_of_ozone_in_air"
support:
  spatial_kind: grid_cell
  area_basis: null
  temporal_basis: instantaneous
  vertical_basis: none
  shape:
    dimensions: [cell]
owner: null
aliases: ["ozone_concentration"]
incrementable: true
accumulates: null
numerics:
  lower_bound: 0.0
  upper_bound: null
  atol: 1.0e-15
  rtol: 1.0e-9
writers:
  increments:
    - name: "atmospheric_chemistry"
      module: "relic.scientific.atmosphere.chemistry"
      provides:
        - "o3_mixing_ratio"
      unit: "mol mol-1"
    - name: "eddy_diffusion_blm"
      module: "relic.scientific.atmosphere.transport.eddy_diffusion_blm"
      provides:
        - "o3_mixing_ratio"
      unit: "mol mol-1"
    - name: "dry_deposition_aggregator"
      module: "relic.scientific.atmosphere.transport.dry_deposition_aggregator"
      provides:
        - "o3_mixing_ratio"
      unit: "mol mol-1"
  tendencies: []
flux_contract:
  allowed_in: []
  allowed_out:
    - "atmospheric_chemistry"
    - "eddy_diffusion_blm"
    - "dry_deposition_aggregator"
  budget_check:
    guardian: null
    tolerance:
      atol: 1.0e-15
      rtol: 1.0e-9
provenance:
  source_file: "relic/contracts/variables/atmosphere/o3_mixing_ratio.yaml"
  runtime_role: "additive_atmospheric_o3_state_ledger"
  runtime_writer: null
