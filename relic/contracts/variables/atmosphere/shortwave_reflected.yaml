variable: shortwave_reflected
title: "Surface Upwelling (Reflected) Shortwave Radiation"
description: "Upwelling shortwave flux reflected at the surface, read by the radiation energy-balance audit r_SW = SW_down - SW_net - SW_reflected and r = SW_down + LW_down - R_net - SW_reflected - LW_up. No RELIC Functor writes it as a public port; it is supplied as forcing or observation (for example a flux-tower outgoing shortwave record). When it is absent the audit derives SW_reflected = alpha * SW_down from the declared optional input surface_albedo."
kind: forcing
dimension:
