variable: wind_v
title: "Northward Wind Component"
description: "Northward (y) wind component v of the atmospheric tracer advection. No RELIC Functor writes it; it is supplied as forcing. It is the advecting wind on the transport grid (the levels of the advection scheme), not the near-surface wind at the height 10 m (northward_wind, WRF V10, CMIP6 vas): the two differ in vertical support, so they are two variables, and the CF identity northward_wind is held by the contract variable northward_wind."
