      module: "relic.scientific.biosphere.phenology.models"
      provides: ["leaf_area_index"]
      unit: "m2 m-2"
    - name: "gsi_phenology"
      module: "relic.scientific.biosphere.phenology.models"
      provides: ["leaf_area_index"]
      unit: "m2 m-2"
    - name: "crop_phenology"
