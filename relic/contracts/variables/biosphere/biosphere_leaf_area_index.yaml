variable: leaf_area_index
title: "Biosphere Leaf Area Index"
description: "Leaf area per unit ground area written by the phenology models; CF v94 leaf_area_index (canonical unit 1; m2 m-2 is the same dimensionless ratio)."
kind: state
dimension:
