variable: diagnostics.photosynthesis.dark_respiration
title: "Leaf Dark Respiration Diagnostic"
description: "Leaf dark (mitochondrial) respiration R_d emitted by the farquhar_photosynthesis Functor and scaled from leaf to canopy by L_eff = (1 - exp(-k LAI)) / k. Leaf rate: R_d(T) = rd25 * Q10^((T - Tref)/10), with rd25 and rd_q10 from the parameter database and Tref the reference temperature; on the C3 path R_d(T) is then multiplied by water_stress_factor, while the C4 path applies no stress factor to it. Molar CO2 flux per unit ground area; positive values are CO2 release from the leaf, the opposite direction to assimilation. It closes the open leaf carbon boundary net_photosynthesis = gross_photosynthesis - R_d, which check_conservation_laws verifies together with the non-negativity of R_d (a negative value raises; it is not clamped). partition_outputs routes every diagnostics.* output to the diagnostics channel, so R_d is never committed to StateManager state and no bound or writer check applies to it at commit. This contract replaces the placeholder for the removed bare output dark_respiration, which no relic code writes or reads."
kind: diagnostic
dimension:
  udunits: "umol CO2 m-2 s-1"
  # The closest CF entry, surface_upward_mass_flux_of_carbon_dioxide_expressed_
  # as_carbon_due_to_plant_respiration_in_leaves, is a kg m-2 s-1 carbon mass
  # flux and is not unit-equivalent to this molar CO2 flux.
  cf_standard_name: null
support:
  spatial_kind: canopy
  area_basis: ground_area
  temporal_basis: instantaneous
  vertical_basis: none
  shape:
    dimensions: [cell]
owner: "farquhar_photosynthesis"
aliases: []
incrementable: false
accumulates: null
references:
  - "Farquhar, G.D., von Caemmerer, S. and Berry, J.A. (1980). A biochemical model of photosynthetic CO2 assimilation in leaves of C3 species. Planta 149, 78-90"
  - "Collatz, G.J., Ribas-Carbo, M. and Berry, J.A. (1992). Coupled photosynthesis-stomatal conductance model for leaves of C4 plants. Australian Journal of Plant Physiology 19, 519-538"
  - "Atkin, O.K., Bruhn, D., Hurry, V.M. and Tjoelker, M.G. (2005). The hot and the cold: unravelling the variable response of plant respiration to temperature. Functional Plant Biology 32, 87-105"
  - "de Pury, D.G.G. and Farquhar, G.D. (1997). Simple scaling of photosynthesis from leaves to canopies without the errors of big-leaf models. Plant, Cell and Environment 20, 537-557"
numerics:
  # R_d is a non-negative release magnitude: check_conservation_laws raises on
  # any negative value of this port and does not clamp it. No upper bound is
  # declared.
  lower_bound: 0.0
  upper_bound: null
  atol: 1.0e-12
  rtol: 1.0e-9
writers:
  increments: []
  tendencies:
    - name: "farquhar_photosynthesis"
      module: "relic.scientific.biosphere.photosynthesis.farquhar"
      provides: ["diagnostics.photosynthesis.dark_respiration"]
      unit: "umol CO2 m-2 s-1"
flux_contract:
  allowed_in: []
  allowed_out: []
  budget_check:
    guardian: null
    tolerance:
      atol: 1.0e-10
      rtol: 1.0e-8
provenance:
  source_file: "relic/scientific/biosphere/photosynthesis/farquhar.py"
  runtime_role: "canopy_leaf_dark_respiration_diagnostic"
  runtime_writer: "farquhar_photosynthesis"
  note: "Declared output at farquhar.py:249; R_d(T) from _temperature_response_rd (Q10 response, farquhar.py:1445-1463) at :1151 (C3) and :1316 (C4); multiplied by water_stress_factor on the C3 path only (:1185); net_photosynthesis = gross_photosynthesis - R_d at :1197 (C3) and :1365 (C4); canopy-scaled by L_eff at :1207 and :1375 (L_eff from _canopy_lai_scale, :559-570); passed through the identity row of _apply_iphs_photosynthesis_network (:822-858) and emitted by _finalize_output with UpdateMode.REPLACE and unit umol CO2 m-2 s-1 (:929, :940, :954-963). check_conservation_laws requires the port (:985-994), raises on negative values (:1020-1028) and checks net = gross - R_d (:1034). diagnostics.* outputs are classified as diagnostics by partition_outputs (relic/core/state/types.py) and ingested by _clean_updates_and_collect_diagnostics (relic/core/simulator/execution_group.py). No relic code reads it; the former bare name dark_respiration was removed as an output in commit 17c503d and is no longer written or read by any relic code."
