variable: net_photosynthesis_daylight_samples
title: "Net Photosynthesis at the Daylight Gauss Samples"
description: "Canopy net CO2 assimilation A [umol CO2 m-2 ground s-1] of farquhar_photosynthesis with temporal_support daylight_gauss at each daylight Gauss instant and at the night sample (A = -R_d(T_night) there). Its weighted mean is the 24-hour mean written to net_photosynthesis. Read by medlyn_stomatal_conductance with temporal_support daylight_gauss, so that the conductance of each instant uses the assimilation of the same instant (no pairing of a daily mean assimilation with instantaneous drivers). Trailing axis daylight_sample of length n + 1 (n = config daylight_gauss_nodes, 3 or 5): samples 0..n-1 are the Gauss-Legendre instants of the daylight period in time order (FAO-56 day length, Eq. 34), sample n is the night; the daily mean is sum_k W_k x_k with W_i = (N/24) w_i and W_night = 1 - N/24 (relic/scientific/atmosphere/daylight_quadrature.py; Goudriaan 1986)."
kind: diagnostic
dimension:
  udunits: "umol CO2 m-2 s-1"
  cf_standard_name: null
support:
  spatial_kind: canopy
  area_basis: ground_area
  temporal_basis: instantaneous
  vertical_basis: none
  shape:
    dimensions: [cell, daylight_sample]
owner: "farquhar_photosynthesis"
aliases: []
incrementable: false
accumulates: null
references:
