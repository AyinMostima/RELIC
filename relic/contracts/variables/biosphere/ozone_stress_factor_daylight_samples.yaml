variable: ozone_stress_factor_daylight_samples
title: "Ozone Stress Factor at the Daylight Gauss Samples"
description: "Instantaneous ozone stress control f_O3 [1] of ozone_stress with temporal_support daylight_gauss at each daylight Gauss instant and at the night sample, from the stomatal uptake of the same sample. Its weighted mean is the 24-hour mean written to ozone_stress_factor. Read by megan_bvoc_model with stress factor ozone and temporal_support daylight_gauss (the factor multiplies the emission of the same instant). Trailing axis daylight_sample of length n + 1 (n = config daylight_gauss_nodes, 3 or 5): samples 0..n-1 are the Gauss-Legendre instants of the daylight period in time order (FAO-56 day length, Eq. 34), sample n is the night; the daily mean is sum_k W_k x_k with W_i = (N/24) w_i and W_night = 1 - N/24 (relic/scientific/atmosphere/daylight_quadrature.py; Goudriaan 1986)."
kind: diagnostic
dimension:
  udunits: "dimensionless"
  cf_standard_name: null
support:
  spatial_kind: leaf
  area_basis: null
  temporal_basis: instantaneous
  vertical_basis: none
  shape:
