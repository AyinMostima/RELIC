  runtime_role: "daylight_gauss_leaf_conductance_samples"
  runtime_writer: "medlyn_stomatal_conductance"
  note: "Declared output of medlyn_stomatal_conductance only with config temporal_support daylight_gauss; UpdateItem(REPLACE, per_timestep=False) in mol m-2 s-1. Reader: ozone_stress (daylight_gauss)."
