variable: diagnostics.photosynthesis.transport_limited
title: "Electron-Transport-Limited Assimilation Diagnostic"
description: "Electron-transport (RuBP-regeneration) limited gross CO2 assimilation rate A_j emitted by the farquhar_photosynthesis Functor and scaled from leaf to canopy by L_eff = (1 - exp(-k LAI)) / k. C3 pathway: A_j = J (C_i - Gamma*) / (a1 (C_i + a2 Gamma*)), with a1 and a2 the parameters rubisco_kinetic_factor1 and rubisco_kinetic_factor2 (4 and 2 in Farquhar et al. 1980) and the ambient CO2 mole fraction used as C_i; C4 pathway: A_j = J / c4_electron_factor (Collatz et al. 1992). Molar CO2 uptake per unit ground area, positive into the leaf; clamped at zero, hence non-negative. It is the unstressed potential rate: stress and VPD factors act only on gross_photosynthesis after the minimum over the limiting rates. partition_outputs routes every diagnostics.* output to the diagnostics channel, so A_j is never committed to StateManager state and no bound or writer check applies to it at commit. This contract replaces the placeholder for the removed bare output transport_limited, which no relic code writes or reads."
kind: diagnostic
dimension:
  udunits: "umol CO2 m-2 s-1"
  cf_standard_name: null
support:
  spatial_kind: canopy
  area_basis: ground_area
  temporal_basis: instantaneous
  vertical_basis: none
  shape:
    dimensions: [cell]
owner: "farquhar_photosynthesis"
aliases: []
incrementable: false
accumulates: null
references:
  - "Farquhar, G.D., von Caemmerer, S. and Berry, J.A. (1980). A biochemical model of photosynthetic CO2 assimilation in leaves of C3 species. Planta 149, 78-90"
  - "Collatz, G.J., Ribas-Carbo, M. and Berry, J.A. (1992). Coupled photosynthesis-stomatal conductance model for leaves of C4 plants. Australian Journal of Plant Physiology 19, 519-538"
  - "de Pury, D.G.G. and Farquhar, G.D. (1997). Simple scaling of photosynthesis from leaves to canopies without the errors of big-leaf models. Plant, Cell and Environment 20, 537-557"
numerics:
  # A_j is clamped at zero (clamp_min_zero) and scaled by L_eff >= 0; no upper
  # bound is declared.
  lower_bound: 0.0
  upper_bound: null
  atol: 1.0e-12
  rtol: 1.0e-9
writers:
  increments: []
  tendencies:
    - name: "farquhar_photosynthesis"
      module: "relic.scientific.biosphere.photosynthesis.farquhar"
      provides: ["diagnostics.photosynthesis.transport_limited"]
      unit: "umol CO2 m-2 s-1"
flux_contract:
  allowed_in: []
  allowed_out: []
  budget_check:
    guardian: null
    tolerance:
      atol: 1.0e-10
      rtol: 1.0e-8
provenance:
  source_file: "relic/scientific/biosphere/photosynthesis/farquhar.py"
  runtime_role: "unstressed_electron_transport_limited_assimilation_diagnostic"
  runtime_writer: "farquhar_photosynthesis"
  note: "Declared output at farquhar.py:250; A_j from _light_limited_rate (C3, farquhar.py:1574-1605, called at :1171) or _light_limited_rate_c4 (C4, :1764-1800, called at :1332), both clamped at zero; canopy-scaled at :1209 and :1377 and emitted by _finalize_output with UpdateMode.REPLACE and unit umol CO2 m-2 s-1 (:930, :941, :954-963). diagnostics.* outputs are classified as diagnostics by partition_outputs (relic/core/state/types.py) and ingested by _clean_updates_and_collect_diagnostics (relic/core/simulator/execution_group.py). No relic code reads it; the former bare name transport_limited is no longer written by FarquharPhotosynthesis."
