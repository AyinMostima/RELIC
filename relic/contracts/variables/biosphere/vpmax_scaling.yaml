variable: vpmax_scaling
title: "C4 Vpmax Scaling Factor"
description: "Dimensionless multiplier on the temperature-adjusted C4 PEP carboxylation capacity: Vpmax_actual = Vpmax(T) * vpmax_scaling (farquhar_photosynthesis, C4 path only). Optional input: when absent the C4 path takes vcmax_scaling, whose own absence is the identity 1. No relic Functor writes it; it is supplied as forcing, like vcmax_scaling and jmax_scaling."
