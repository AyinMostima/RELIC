variable: canopy_conductance
title: "Canopy Conductance"
description: "Bulk canopy conductance g_c to water vapour transfer read by Penman-Monteith with canopy_resistance_source 'state', which uses r_s = 1 / g_c when surface_resistance is absent (Monteith 1965; Allen et al. 1998). Positive magnitude. Supply it externally (forcing or initial state) or select the one tendency provider medlyn_stomatal_conductance configured with canopy_conductance_upscaling 'effective_leaf_area_index', which writes g_c = g_s L_eff R T / P from its leaf conductance and the Beer-Lambert effective leaf area L_eff = (1 - exp(-k LAI)) / k of its representative-leaf inversion (de Pury and Farquhar 1997; Campbell and Norman 1998; Nobel 2009; existing UnitConverter conductance_mol_to_ms), and g_c = 0 where nonpositive_leaf_area 'no_canopy' declares no canopy."
kind: state
dimension:
  udunits: "m s-1"
  cf_standard_name: null
support:
  spatial_kind: canopy
  area_basis: ground_area
  temporal_basis: instantaneous
  vertical_basis: none
  shape:
    dimensions: [cell]
owner: null
aliases: []
incrementable: false
accumulates: null
numerics:
  lower_bound: 0.0
  upper_bound: null
  atol: 1.0e-12
  rtol: 1.0e-9
writers:
  increments: []
  tendencies:
    - name: "medlyn_stomatal_conductance"
      module: "relic.scientific.biosphere.photosynthesis.stomatal"
      provides: ["canopy_conductance"]
      unit: "m s-1"
flux_contract:
  allowed_in: []
  allowed_out: []
  budget_check:
    guardian: null
    tolerance:
      atol: 1.0e-10
      rtol: 1.0e-8
references:
  - "Monteith, J.L. (1965). Evaporation and environment. Symp. Soc. Exp. Biol. 19, 205-224"
  - "Allen, R.G. et al. (1998). Crop evapotranspiration. FAO Irrigation and Drainage Paper 56"
  - "Campbell, G.S. and Norman, J.M. (1998). An Introduction to Environmental Biophysics, 2nd ed. Springer (molar and velocity conductance, g_mol = g P / (R T))"
  - "Nobel, P.S. (2009). Physicochemical and Environmental Plant Physiology, 4th ed. Academic Press (conductance unit conversion g = g_m P / (R T))"
  - "Monteith, J.L. and Unsworth, M.H. (2013). Principles of Environmental Physics, 4th ed. Academic Press (big-leaf canopy conductance from leaf conductances)"
  - "de Pury, D.G.G. and Farquhar, G.D. (1997). Simple scaling of photosynthesis from leaves to canopies without the errors of big-leaf models. Plant Cell Environ. 20, 537-557 (effective leaf area)"
provenance:
  source_file: "relic/scientific/hydrosphere/evapotranspiration/penman_monteith.py"
  runtime_role: "external_canopy_conductance_input_or_exclusive_medlyn_provider"
  runtime_writer: ["medlyn_stomatal_conductance"]
  note: "The Medlyn provider writes this variable only when configured with canopy_conductance_upscaling; its default configuration writes the leaf stomatal_conductance alone. The provider issues a non-incrementable REPLACE update in the same step; Penman-Monteith reads it through a same-step link."
