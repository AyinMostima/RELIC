variable: capillary_rise_flux
title: "Capillary Rise Flux"
kind: flux
dimension:
  udunits: "kg m-2 s-1"
  cf_standard_name: null
# No support block on purpose. The frozen bounded-synthesis oracle
# NCS-PROFILE005-ORACLE-V1 (experiments/publication_profiles/
# ncs_model_synthesis/oracle_cases/bounded_oracle_v1.yaml, gate test
# test/unit/publication/test_run_g7_ncs_mvp.py) records infiltration_flux and
# capillary_rise_flux as the support gaps that reject its four
# soil_water_owner=richards selections. With both declared, the two
# et_owner=priestley_taylor selections compile strictly, but the one-cell
# soil_moisture cannot feed the layer profile that richards_soil_moisture
# requires, so they do not execute. Declare this support only together with a
# superseding oracle issued by its gate owner.
