variable: surface_resistance
title: "Canopy Surface Resistance"
description: "Bulk canopy (surface) resistance r_s to water vapour transfer read by Penman-Monteith with canopy_resistance_source 'state' (Monteith 1965; Allen et al. 1998). Positive magnitude; r_s = 1 / g_c with g_c the canopy_conductance. No relic Functor writes it: it is supplied as forcing."
kind: forcing
dimension:
  udunits: "s m-1"
  cf_standard_name: null
support:
  spatial_kind: canopy
  area_basis: ground_area
  temporal_basis: instantaneous
  vertical_basis: none
  shape:
    dimensions: [cell]
owner: null
aliases: []
incrementable: false
accumulates: null
numerics:
  lower_bound: 0.0
  upper_bound: null
  atol: 1.0e-12
  rtol: 1.0e-9
writers:
  increments: []
  tendencies: []
flux_contract:
  allowed_in: []
  allowed_out: []
  budget_check:
    guardian: null
    tolerance:
      atol: 1.0e-10
      rtol: 1.0e-8
references:
  - "Monteith, J.L. (1965). Evaporation and environment. Symp. Soc. Exp. Biol. 19, 205-224"
  - "Allen, R.G. et al. (1998). Crop evapotranspiration. FAO Irrigation and Drainage Paper 56"
provenance:
  source_file: "relic/scientific/hydrosphere/evapotranspiration/penman_monteith.py"
  runtime_role: "external_canopy_resistance_forcing"
