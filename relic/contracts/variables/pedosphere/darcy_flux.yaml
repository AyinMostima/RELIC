variable: darcy_flux
title: "Downward Darcy Water Flux per Layer"
description: "Downward Darcy water flux per soil layer in m s-1, the advective velocity of SoluteAdvectionDiffusion1D for NO3 and DOC. Required; exactly one value per layer, finite and non-negative (bottom leaching). No relic Functor writes it under this name (supplied as forcing): soil_water_transport emits signed interface fluxes as diagnostics.soil_water_transport.darcy_flux."
