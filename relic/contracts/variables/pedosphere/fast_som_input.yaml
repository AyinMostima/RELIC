variable: fast_som_input
title: "Fast SOM Pool Carbon Input"
description: "External carbon input rate into the fast soil organic matter pool of pools_matrix, g C m-2 s-1 per ground area. Required boundary input; finite, non-negative and shaped like the pools. No relic Functor writes it (supplied as forcing)."
kind: forcing
dimension:
  udunits: "g C m-2 s-1"
  cf_standard_name: null
support:
  spatial_kind: grid_cell
  area_basis: ground_area
  temporal_basis: instantaneous
  vertical_basis: none
  shape:
    dimensions: [cell]
owner: null
aliases: []
incrementable: false
accumulates: null
references:
  - "Parton, W.J. et al. (1987). Analysis of factors controlling soil organic matter levels in Great Plains grasslands. Soil Sci. Soc. Am. J. 51, 1173-1179"
numerics:
  # Positive into the pool; the reader rejects negative inputs.
  lower_bound: 0.0
  upper_bound: null
  atol: 1.0e-12
  rtol: 1.0e-9
writers:
  increments: []
  tendencies: []
flux_contract:
  allowed_in: []
  allowed_out: []
  budget_check:
    guardian: null
    tolerance:
      atol: 1.0e-10
      rtol: 1.0e-8
provenance:
  source_file: "relic/scientific/pedosphere/carbon_pools/pools_matrix.py"
  runtime_role: "fast_som_carbon_input_forcing"
  runtime_writer: null
  note: "Reader: PoolsMatrix boundary input (BOUNDARY_INPUT_KEYS; metadata input_variables; a missing value raises KeyError; 'Pool boundary inputs must be non-negative'; used as the fast pool input rate, g C m-2 s-1). No RELIC Functor writes fast_som_input."
