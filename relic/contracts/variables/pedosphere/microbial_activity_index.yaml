  runtime_writer: null
  note: "Reader: MethaneProductionFunctor (metadata input_variables; a missing value raises; finite, within [0, 1]; A multiplies P_cal directly). The index and its limit 1 follow the DNDC95 reference code; no journal article defines it. No RELIC Functor writes microbial_activity_index."
