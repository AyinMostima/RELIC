  udunits: "1"
  cf_standard_name: null
support:
  spatial_kind: grid_cell
  area_basis: null
  temporal_basis: instantaneous
  vertical_basis: none
  shape:
    dimensions: [cell]
owner: null
aliases: []
incrementable: false
accumulates: null
references:
  - "DNDC95 reference source code: Dndc_main.cpp (line 973 limits the microbial activity index to 1) and Dndc_CH4.cpp (the index multiplies methanogenesis)"
numerics:
  # Activity fraction; the reader rejects values outside [0, 1].
  lower_bound: 0.0
  upper_bound: 1.0
  atol: 1.0e-12
  rtol: 1.0e-9
