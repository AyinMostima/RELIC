variable: microbial_activity_index
title: "Microbial Activity Index"
description: "Microbial activity index A of methanogenesis: an activity fraction in [0, 1] that multiplies the calibrated methane production directly (P_cal = Rh r f_T f_Eh A in methane_production; no normalisation). Required; finite, within [0, 1]. No relic Functor writes it (supplied as forcing)."
