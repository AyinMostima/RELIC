variable: soil_o2_concentration
title: "Soil Oxygen Concentration"
description: "Soil oxygen concentration per water volume in mol m-3 (the water-volume basis of CLM4.5 Technical Note Eq. 19.1), limiting methanotrophy in methane_oxidation through O2 / (K_O2 + O2) with K_O2 = 0.02 mol m-3 (pedosphere.methane.oxidation.half_saturation_o2; Riley et al. 2011, Table 1). Required; finite and non-negative. No relic Functor writes it (supplied as forcing)."
