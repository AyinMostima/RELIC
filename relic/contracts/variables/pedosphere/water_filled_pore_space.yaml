  note: "No RELIC Functor writes water_filled_pore_space. Readers: MethaneOxidationFunctor, which requires it in (0, 1] (phi * WFPS is the water volume per soil volume of C_CH4 = M / (M_C z phi WFPS), CLM4.5 Technical Note Eq. 19.1), MethaneTransportFunctor, pedosphere_methane_scale (the gating weight), NitrificationProcess, which requires it in [0, 1] for the oxygen limitation f_O2 = max((1 - WFPS)/(1 - WFPS_opt), f_O2_min) above WFPS_opt (Linn and Doran 1984), and DenitrificationProcess, which requires it in [0, 1] for the anaerobic factor f_anoxic = max(clip((WFPS - WFPS_thr)/w, 0, 1), f_min) (DAYCENT WFPS basis, Del Grosso et al. 2000)."
