description: "Schema for LevelSpec/RegridSpec scaling plan inputs."
required_top_level:
  - schema_version
  - levels
  - regrids
level_fields:
  name:
    type: string
    required: true
  time_step:
    type: number
  spatial_resolution:
    type: string
  metadata:
    type: dict
regrid_fields:
  source:
    type: string
    required: true
  target:
    type: string
    required: true
  method:
    type: string
  time_ratio:
    type: integer
  space_mapping:
    type: string
  metadata:
    type: dict
