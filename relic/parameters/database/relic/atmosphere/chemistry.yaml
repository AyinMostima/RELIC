schema_version: 2.0.0
tier: relic
namespace: atmosphere.chemistry
description: Atmospheric box chemistry and NASA7 standard-state thermodynamic parameters
metadata:
  version: 1.1.0
  units_standard: SI with cm3/molecule/s for rate constants
  last_updated: '2026-09-13'
parameters:
  atmosphere.chemistry.chemistry_temperature_q10:
    value: 1.5
    default: 1.5
    units: dimensionless
    bounds:
    - 1.0
    - 3.0
    description: 'Multiplier of the maximum NO2 photolysis frequency of the Trebs et al. (2009) relation, J_max = (1 + alpha) B1^2 / (4 |B2|), in the positive diagonal mobility of the level-3 structural Hodge audit of the open mechanism, star_rxn = diag(J_max Q10); it does not enter any production rate.'
    provenance:
      source: relic_convention
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-27T00:00:00Z'
      notes: 'MA-21 follow-up F3: no source gives a bulk chemistry Q10; the former reference, Atkinson et al. (2004), evaluates individual rate coefficients and states none. Role: positive scale of the audit-only Hodge mobility (ChemistryFunctor.build_hodge_contract).'
    references:
    - RELIC convention value (scale of the audit Hodge mobility; no literature value)
    dtype: float64
    category: empirical_parameter
    tags:
    - chemistry
    - temperature
    requires_grad: false
    dimension: dimensionless
