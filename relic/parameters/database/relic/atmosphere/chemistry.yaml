  atmosphere.chemistry.k_isoprene_no3_298:
    value: 6.963486e-13
    default: 6.963486e-13
    units: cm3 molecule-1 s-1
    bounds:
    - 4.39e-13
    - 1.11e-12
    description: 'Isoprene + NO3 -> products (MCM v3.3.1 NO3 + C5H8 = NISOPO2) rate coefficient at the Arrhenius reference temperature T_ref = 298.15 K, evaluated from the MCM v3.3.1 expression 3.15e-12 exp(-450/T) cm3 molecule-1 s-1; the nighttime isoprene oxidant term of the chemical lifetime diagnostic.'
    provenance:
      source: literature
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-10-18T00:00:00Z'
      notes: 'CR-A-03 decision (window A parameter owner, 2026-10-18): MCM v3.3.1 expression kept as the primary set with the existing IUPAC 2006 / MCM v3.3.1 isoprene + OH and isoprene + O3 rates. MCM tabulates no k298 and no reliability; k_298 = 3.15e-12 exp(-450/298.15) = 6.963486e-13 cm3 molecule-1 s-1 is computed from the Arrhenius form, so k(298.15 K) reproduces the MCM expression exactly. The IUPAC 2006 tabulated k298 = 7.0e-13 at 298 K is 0.5 % higher. Bounds are the IUPAC 2006 reliability Delta log k = +-0.2 at 298 K around k_298 (4.394e-13 to 1.1036e-12, rounded outward). Sensitivity value: IUPAC 2015 datasheet NO3_VOC8, 2.95e-12 exp(-450/T) (k298 = 6.5e-13 at 298 K, Delta log k = +-0.15, Delta(E/R) = +-200 K, 250-390 K); with the same E/R the two expressions differ by Delta log10 k = log10(3.15/2.95) = 0.0285 at every temperature, inside both reliabilities. Primary-source quotes: BVOCsdata paper_results/shared/scientific_source_qualification/20261018_cr_a03_sources_01/source_quotes.json.'
    references:
    - 'MCM v3.3.1 (Master Chemical Mechanism, http://mcm.york.ac.uk; Jenkin et al. 2015, Atmos. Chem. Phys. 15, 11433-11459, doi:10.5194/acp-15-11433-2015, supplement file MCM_C5H8_subset.fac line 112): NO3 + C5H8 = NISOPO2, 3.15e-12 exp(-450/T)'
    - 'Atkinson et al. (2006) Evaluated kinetic and photochemical data for atmospheric chemistry: Volume II, Atmos. Chem. Phys. 6, 3625-4055, doi:10.5194/acp-6-3625-2006; datasheet II.A3.69: k = 7.0e-13 cm3 molecule-1 s-1 at 298 K, Delta log k = +-0.2; k = 3.15e-12 exp(-450/T) over 250-390 K'
    - 'IUPAC Task Group on Atmospheric Chemical Kinetic Data, datasheet NO3_VOC8 (last evaluated July 2015, https://iupac-aeris.ipsl.fr/datasheets/pdf/NO3_VOC8.pdf): k = 6.5e-13 cm3 molecule-1 s-1 at 298 K, Delta log k = +-0.15; k = 2.95e-12 exp(-450/T) over 250-390 K (sensitivity value, not the default)'
    dtype: float64
    category: numerical_parameter
    tags: []
    requires_grad: false
    dimension: second_order_rate_constant
