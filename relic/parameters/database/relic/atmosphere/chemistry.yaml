  atmosphere.chemistry.k_ro2_no_298:
    value: 9.0e-12
    default: 9.0e-12
    units: cm3 molecule-1 s-1
    dtype: float64
    bounds:
    - 4.5e-12
    - 1.8e-11
    category: physical_parameter
    description: 'Organic peroxy radical + NO rate coefficient at the Arrhenius reference temperature (RO2 + NO -> RO + NO2, MCM v3.3.1 generic KRO2NO = 2.7e-12 exp(360/T) cm3 molecule-1 s-1, k298 = 9.0e-12 cm3 molecule-1 s-1); governs the high-NOx propagation branch of isoprene-derived peroxy radicals.'
    references:
    - 'Jenkin, M.E., Young, J.C. and Rickard, A.R. (2015) The MCM v3.3.1 degradation scheme for isoprene, Atmos. Chem. Phys. 15, 11433-11459, doi:10.5194/acp-15-11433-2015; generic peroxy radical rate coefficient KRO2NO = 2.7e-12 exp(360/T) cm3 molecule-1 s-1, k298 = 9.0e-12 cm3 molecule-1 s-1'
    - 'Atkinson, R. et al. (2006) Evaluated kinetic and photochemical data for atmospheric chemistry: Volume II - gas phase reactions of organic species, Atmos. Chem. Phys. 6, 3625-4055, doi:10.5194/acp-6-3625-2006 (IUPAC datasheet II.A2.10 / peroxy + NO kinetics)'
    - 'Saunders, S.M., Jenkin, M.E., Derwent, R.G. and Pilling, M.J. (2003) Protocol for the development of the Master Chemical Mechanism, MCM v3 (Part A), Atmos. Chem. Phys. 3, 161-180, doi:10.5194/acp-3-161-2003'
    tags:
    - bvoc
    - isoprene
    - ro2
    - nox
    requires_grad: false
    dimension: second_order_rate_constant
    provenance:
      source: literature
      schema_version: 2.0.0
