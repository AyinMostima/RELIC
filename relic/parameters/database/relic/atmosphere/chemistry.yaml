    - 'MCM v3.3.1 (Master Chemical Mechanism, http://mcm.york.ac.uk; Jenkin et al. 2015, Atmos. Chem. Phys. 15, 11433-11459, doi:10.5194/acp-15-11433-2015): CH4 + OH, 1.85e-12 exp(-1690/T)'
    uncertainty: 831.4
    dtype: float64
