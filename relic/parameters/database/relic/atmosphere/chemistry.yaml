    references:
    - 'MCM v3.3.1 (Master Chemical Mechanism, http://mcm.york.ac.uk; Jenkin et al. 2015, Atmos. Chem. Phys. 15, 11433-11459, doi:10.5194/acp-15-11433-2015, supplement file MCM_C5H8_subset.fac line 112): NO3 + C5H8 = NISOPO2, 3.15e-12 exp(-450/T)'
    - 'Atkinson et al. (2006) Evaluated kinetic and photochemical data for atmospheric chemistry: Volume II, Atmos. Chem. Phys. 6, 3625-4055, doi:10.5194/acp-6-3625-2006; datasheet II.A3.69: k = 3.15e-12 exp(-450/T) over 250-390 K, E/R = 450 K, Delta(E/R) = +-200 K'
    - 'IUPAC Task Group on Atmospheric Chemical Kinetic Data, datasheet NO3_VOC8 (last evaluated July 2015, https://iupac-aeris.ipsl.fr/datasheets/pdf/NO3_VOC8.pdf): k = 2.95e-12 exp(-450/T) over 250-390 K, Delta(E/R) = +-200 K (sensitivity value, not the default)'
