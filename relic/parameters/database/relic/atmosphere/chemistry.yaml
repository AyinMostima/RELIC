      last_modified: '2026-10-15T00:00:00Z'
      notes: 'MCM v3.3.1 KRO2NO = 2.7e-12 exp(360/T) cm3 molecule-1 s-1 evaluated at 298.15 K gives 9.03e-12 cm3 molecule-1 s-1 (tabulated k298 = 9.0e-12 cm3 molecule-1 s-1).'
