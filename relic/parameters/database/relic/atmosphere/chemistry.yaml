  atmosphere.chemistry.k_no_o3_298:
    value: 1.8e-14
    default: 1.8e-14
    units: cm3 molecule-1 s-1
    bounds:
    - 1.4e-14
    - 2.0e-14
    description: 'NO + O3 -> NO2 + O2 rate coefficient at the Arrhenius reference temperature (IUPAC preferred k298).'
    provenance:
      source: literature
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-27T00:00:00Z'
      notes: 'IUPAC I.A3.54 gives k298 = 1.8e-14 from the 298 K data and the Arrhenius fit 1.4e-12 exp(-1310/T) (1.73e-14 at 298 K) from a separate least-squares analysis over 195-308 K; the 4.1 percent difference is inside the stated reliability Delta log k(298) = +-0.08 (factor 1.20). The *_298 value is the IUPAC preferred rate coefficient at 298 K used as f(T_ref); with Ea = (E/R) R the kernel is the IUPAC Arrhenius expression scaled by k298 / (A exp(-(E/R)/298)), the anchoring from which IUPAC propagates its reliability, Delta log k(T) = Delta log k(298) + 0.4343 Delta(E/R) |1/T - 1/298|.'
    references:
    - 'Atkinson et al. (2004) Evaluated kinetic and photochemical data for atmospheric chemistry: Volume I, Atmos. Chem. Phys. 4, 1461-1738, doi:10.5194/acp-4-1461-2004; datasheet I.A3.54: k = 1.8e-14 cm3 molecule-1 s-1 at 298 K, Delta log k = +-0.08; k = 1.4e-12 exp(-1310/T) over 195-308 K'
    - 'MCM v3.3.1 (Master Chemical Mechanism, http://mcm.york.ac.uk; Jenkin et al. 2015, Atmos. Chem. Phys. 15, 11433-11459, doi:10.5194/acp-15-11433-2015): NO + O3 = NO2, 1.4e-12 exp(-1310/T)'
    uncertainty: 0.1
    doi: 10.5194/acp-4-1461-2004
    dtype: float64
    category: numerical_parameter
    tags: []
    requires_grad: false
    dimension: second_order_rate_constant
  atmosphere.chemistry.k_no_o3_activation_energy:
    value: 10891.9
    default: 10891.9
    units: J mol-1
    bounds:
    - 9229.1
    - 12554.8
    description: 'Activation energy Ea = (E/R) R of NO + O3 in f(T) = f(T_ref) exp(Ea/R (1/T_ref - 1/T)), T_ref = 298.15 K; E/R = 1310 K (IUPAC I.A3.54, MCM v3.3.1); positive: the rate increases with temperature. Bounds are the IUPAC reliability E/R +- 200 K.'
    provenance:
      source: literature
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-27T00:00:00Z'
      notes: 'Ea = 1310 K x 8.314462618 J mol-1 K-1 = 10891.9 J mol-1 (was 10900.0, the rounded 10.9 kJ mol-1). The *_298 value is the IUPAC preferred rate coefficient at 298 K used as f(T_ref); with Ea = (E/R) R the kernel is the IUPAC Arrhenius expression scaled by k298 / (A exp(-(E/R)/298)), the anchoring from which IUPAC propagates its reliability, Delta log k(T) = Delta log k(298) + 0.4343 Delta(E/R) |1/T - 1/298|.'
    references:
    - 'Atkinson et al. (2004) Evaluated kinetic and photochemical data for atmospheric chemistry: Volume I, Atmos. Chem. Phys. 4, 1461-1738, doi:10.5194/acp-4-1461-2004; datasheet I.A3.54: k = 1.4e-12 exp(-1310/T), Delta(E/R) = +-200 K'
    - 'MCM v3.3.1 (Master Chemical Mechanism, http://mcm.york.ac.uk; Jenkin et al. 2015, Atmos. Chem. Phys. 15, 11433-11459, doi:10.5194/acp-15-11433-2015): NO + O3 = NO2, 1.4e-12 exp(-1310/T)'
    uncertainty: 1662.9
    dtype: float64
    category: numerical_parameter
    tags: []
    requires_grad: false
    dimension: energy_per_amount
