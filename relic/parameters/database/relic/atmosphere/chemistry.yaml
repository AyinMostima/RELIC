  atmosphere.chemistry.k_oh_no2_298:
    value: 1.15e-11
    default: 1.15e-11
    units: cm3 molecule-1 s-1
    bounds:
    - 1.0e-11
    - 1.2e-11
    description: 'OH + NO2 (+M) -> HNO3 rate coefficient at 1 atm and T_ref = 298.15 K: the IUPAC I.A3.43 fall-off k = k0 kinf/(k0 + kinf) Fc^(1/(1 + (log10(k0/kinf)/N)^2)), N = 0.75 - 1.27 log10 Fc, evaluated at [N2] = p/(kB T) = 2.46e19 molecule cm-3.'
    provenance:
      source: literature
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-27T00:00:00Z'
      notes: 'MA-21 follow-up F3: the former value 1.1e-11 cited Mollner et al. (2010), whose measured HONO2 channel is 9.2e-12 in air at 760 Torr (20 percent lower); the value matches the IUPAC (2004) fall-off, which gives 1.154e-11 at 1 atm and 298.15 K (k0 = 8.28e-11, kinf = 4.1e-11, F = 0.421), now stored to three figures (was 1.1e-11). Reliability: Delta log k0 = +-0.1 at 298 K.'
    references:
    - 'Atkinson et al. (2004) Evaluated kinetic and photochemical data for atmospheric chemistry: Volume I, Atmos. Chem. Phys. 4, 1461-1738, doi:10.5194/acp-4-1461-2004; datasheet I.A3.43: k0 = 3.3e-30 (T/300)^-3.0 [N2], kinf = 4.1e-11 cm3 molecule-1 s-1, Fc = 0.4'
    - 'Mollner et al. (2010) Rate of gas phase association of hydroxyl radical and nitrogen dioxide, Science 330, 646-649, doi:10.1126/science.1193030: HONO2 channel 9.2e-12 (+-0.4e-12) cm3 molecule-1 s-1 in air at 760 Torr, 25 degC'
    uncertainty: 0.1
    note: Termination reaction, pressure-dependent; the fall-off is evaluated once at 1 atm, 298.15 K
    dtype: float64
    category: numerical_parameter
    tags: []
    requires_grad: false
    dimension: second_order_rate_constant
  atmosphere.chemistry.k_oh_no2_activation_energy:
    value: 0.0
    default: 0.0
    units: J mol-1
    bounds:
    - -.inf
    - .inf
    description: 'Activation energy of OH + NO2 (+M) -> HNO3 in f(T) = f(T_ref) exp(Ea/R (1/T_ref - 1/T)), T_ref = 298.15 K. Convention Ea = 0: the termolecular falloff of IUPAC I.A3.43 is not implemented and k_oh_no2_298 is held at its 1 atm, 298.15 K value. The Arrhenius form admits either sign of Ea, so the interval is unbounded.'
    provenance:
      source: relic_convention
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-27T00:00:00Z'
      notes: 'Role: temperature-independent approximation of a pressure-dependent termolecular rate. The IUPAC I.A3.43 falloff at 1 atm gives 1.35e-11 (273.15 K), 1.15e-11 (298.15 K) and 1.05e-11 (313.15 K), an effective E/R of about -558 K between 288 and 308 K; the falloff value is 17.7 percent above the constant 1.15e-11 at 273 K and 8.6 percent below it at 313 K. Implementing the Troe falloff is outside round 54.1.'
    references:
    - 'Atkinson et al. (2004) Evaluated kinetic and photochemical data for atmospheric chemistry: Volume I, Atmos. Chem. Phys. 4, 1461-1738, doi:10.5194/acp-4-1461-2004; datasheet I.A3.43: k0 = 3.3e-30 (T/300)^-3.0 [N2], k_inf = 4.1e-11 cm3 molecule-1 s-1, Fc = 0.4'
    dtype: float64
    category: numerical_parameter
    tags:
    - oh
    - temperature
    requires_grad: false
    dimension: energy_per_amount
  atmosphere.chemistry.j_no2_irradiance_linear_coefficient:
    value: 1.47e-05
    default: 1.47e-05
    units: W-1 m2 s-1
    dtype: float64
    bounds:
    - 1.44e-05
    - 1.5e-05
    category: empirical_parameter
    description: 'NO2 photolysis frequency from the solar global irradiance G (shortwave_down): linear coefficient B1 = (1.47 +- 0.03) e-5 W-1 m2 s-1 of J_NO2 = (1 + alpha) (B1 G + B2 G^2). G already carries the solar geometry and the cloud attenuation. The concave polynomial rises to its vertex G_v = B1 / (2 |B2|) = 1519 W m-2; at and above G_v the vertex value is held (monotone extension beyond the fitted curvature). Bounds are the stated 1-sigma fit errors.'
    references:
    - 'Trebs, I., Bohn, B., Ammann, C., Rummel, U., Blumthaler, M., Konigstedt, R., Meixner, F.X., Fan, S. and Andreae, M.O. (2009) Relationship between the NO2 photolysis frequency and the solar global irradiance, Atmos. Meas. Tech. 2, 725-739, doi:10.5194/amt-2-725-2009; Eq. (1)-(2), abstract and Sect. 5: B1 = (1.47 +- 0.03) x 10-5 W-1 m2 s-1, B2 = (-4.84 +- 0.31) x 10-9 W-2 m4 s-1'
    tags:
    - photolysis
    - no2
    - irradiance
    requires_grad: false
    dimension: irradiance_response_coefficient
    provenance:
      source: literature
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-27T00:00:00Z'
      notes: 'Eq. (1)-(2) of Trebs et al. (2009): J_NO2 = (1 + alpha) (B1 G + B2 G^2), G the solar global irradiance (shortwave_down); weighted fit to 10 W m-2 bins of half-hourly data of seven sites below 800 m a.s.l. (N = 4815, SZA 0-90 deg, cloudy and clear, G up to about 1000 W m-2); residual +-6e-4 s-1 (2 sigma), relative deviation above 40 percent for G < 100 W m-2, 10-40 percent for 100-500 W m-2 and below 10 percent above 500 W m-2; not valid in high mountains, above snow or ice and over sandy or dry soil. Replaces J0 (SW/SW_ref) cos(chi) (j_no2_reference 8e-3 s-1 at SW_ref = 800 W m-2), which counted the solar geometry twice because SW already contains cos(chi). At G = 800 W m-2 and alpha = 0.03 the relation gives 8.92e-3 s-1 (Warneck and Williams 2012 Table 6.7: 8.8e-3 s-1, overhead sun, albedo 0.03).'
  atmosphere.chemistry.j_no2_irradiance_quadratic_coefficient:
    value: -4.84e-09
    default: -4.84e-09
    units: W-2 m4 s-1
    dtype: float64
    bounds:
    - -5.15e-09
    - -4.53e-09
    category: empirical_parameter
    description: 'NO2 photolysis frequency from the solar global irradiance G (shortwave_down): quadratic coefficient B2 = (-4.84 +- 0.31) e-9 W-2 m4 s-1 of J_NO2 = (1 + alpha) (B1 G + B2 G^2). G already carries the solar geometry and the cloud attenuation. The concave polynomial rises to its vertex G_v = B1 / (2 |B2|) = 1519 W m-2; at and above G_v the vertex value is held (monotone extension beyond the fitted curvature). Bounds are the stated 1-sigma fit errors.'
    references:
    - 'Trebs, I., Bohn, B., Ammann, C., Rummel, U., Blumthaler, M., Konigstedt, R., Meixner, F.X., Fan, S. and Andreae, M.O. (2009) Relationship between the NO2 photolysis frequency and the solar global irradiance, Atmos. Meas. Tech. 2, 725-739, doi:10.5194/amt-2-725-2009; Eq. (1)-(2), abstract and Sect. 5: B1 = (1.47 +- 0.03) x 10-5 W-1 m2 s-1, B2 = (-4.84 +- 0.31) x 10-9 W-2 m4 s-1'
    tags:
    - photolysis
    - no2
    - irradiance
    requires_grad: false
    dimension: irradiance_quadratic_response_coefficient
    provenance:
      source: literature
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-27T00:00:00Z'
      notes: 'Eq. (1)-(2) of Trebs et al. (2009): J_NO2 = (1 + alpha) (B1 G + B2 G^2), G the solar global irradiance (shortwave_down); weighted fit to 10 W m-2 bins of half-hourly data of seven sites below 800 m a.s.l. (N = 4815, SZA 0-90 deg, cloudy and clear, G up to about 1000 W m-2); residual +-6e-4 s-1 (2 sigma), relative deviation above 40 percent for G < 100 W m-2, 10-40 percent for 100-500 W m-2 and below 10 percent above 500 W m-2; not valid in high mountains, above snow or ice and over sandy or dry soil. Replaces J0 (SW/SW_ref) cos(chi) (j_no2_reference 8e-3 s-1 at SW_ref = 800 W m-2), which counted the solar geometry twice because SW already contains cos(chi). At G = 800 W m-2 and alpha = 0.03 the relation gives 8.92e-3 s-1 (Warneck and Williams 2012 Table 6.7: 8.8e-3 s-1, overhead sun, albedo 0.03).'
  atmosphere.chemistry.uv_a_surface_albedo:
    value: 0.03
    default: 0.03
    units: dimensionless
    dtype: float64
    bounds:
    - 0.0
    - 0.2
    category: empirical_parameter
    description: 'Site UV-A surface albedo alpha of J_NO2 = (1 + alpha) (B1 G + B2 G^2) (Trebs et al. 2009 Eq. 2); 0.03 is typical of grassland and vegetation (2-3 percent in the UV-A). The relation is not to be used for alpha > 0.2 (snow, ice, sand), which is the upper bound.'
    references:
    - 'Trebs, I., Bohn, B., Ammann, C., Rummel, U., Blumthaler, M., Konigstedt, R., Meixner, F.X., Fan, S. and Andreae, M.O. (2009) Relationship between the NO2 photolysis frequency and the solar global irradiance, Atmos. Meas. Tech. 2, 725-739, doi:10.5194/amt-2-725-2009; Sect. 4.6 and Table 1: UV-A surface albedo of vegetation about 2-3 percent, grassland 0.03 (Feister and Grewe 1995); the function should not be used for alpha > 0.2'
    - 'Warneck, P. and Williams, J. (2012) The Atmospheric Chemist''s Companion, Springer, doi:10.1007/978-94-007-2275-0; Table 6.7: ground-level photolysis frequencies for overhead sun and surface albedo 0.03 (Jacobson 2005)'
    tags:
    - photolysis
    - albedo
    requires_grad: false
    dimension: dimensionless
    provenance:
      source: literature
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-27T00:00:00Z'
      notes: 'Trebs et al. (2009) state that the (1 + alpha) factor is not exactly justified because albedo is defined for irradiance; for their sites below 800 m the albedo effect lies within the fit uncertainty.'
  atmosphere.chemistry.photolysis_temperature_mode:
    value: 'none'
    default: 'none'
    units: dimensionless
    dtype: string
    bounds: null
    allowed_values:
    - 'none'
    - 'spectral_quantum_yield'
    category: configuration_flag
    description: 'Air-temperature dependence of the photolysis frequencies J_NO2 and J(O1D). none (default): both are independent of air temperature; the NO2 quantum yield is 1.00 at 300-398 nm at 248 and 298 K and the NO2 cross-section temperature dependence is minimal (Warneck and Williams 2012 Tables 6.13a/b). spectral_quantum_yield: J_X(T) = J_X(T_ref) R_X(T), R_X(T) = sum_lambda sigma_X(lambda,T) phi_X(lambda,T) F(lambda) / sum_lambda sigma_X(lambda,T_ref) phi_X(lambda,T_ref) F(lambda), with the tables and the reference surface spectrum of atmosphere.chemistry.photolysis.*.'
    references:
    - 'Warneck, P. and Williams, J. (2012) The Atmospheric Chemist''s Companion, Springer, doi:10.1007/978-94-007-2275-0; Table 6.13a (NO2 cross sections, temperature dependence minimal) and Table 6.13b (NO2 quantum yields at 298 and 248 K, Troe 2000)'
    - 'Warneck, P. and Williams, J. (2012) The Atmospheric Chemist''s Companion, Springer, doi:10.1007/978-94-007-2275-0; Tables 6.11a-c (O3 cross sections at two temperatures; O(1D) quantum yields, Matsumi et al. 2002)'
    tags:
    - photolysis
    - temperature
    - configuration_flag
    requires_grad: false
    dimension: dimensionless
    provenance:
      source: literature
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-27T00:00:00Z'
      notes: 'Replaces the empirical Q10 factor photolysis_temperature_q10 (1.5, no literature value; it implied a factor 7.6 between 248 and 298 K). Spectral factors on the reference spectrum: R_NO2(248 K) = 0.971, R_O1D(223 K) = 0.737.'
