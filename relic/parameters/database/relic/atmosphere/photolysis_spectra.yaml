    - 'Warneck, P. and Williams, J. (2012) The Atmospheric Chemist''s Companion: Numerical Data for Use in the Atmospheric Sciences, Springer, Dordrecht, doi:10.1007/978-94-007-2275-0; Table 6.2: irradiances in 1e12 photon cm-2 s-1 nm-1, Woods et al. (1996) J. Geophys. Res. 101, 9541-9569'
    - 'Warneck, P. and Williams, J. (2012) The Atmospheric Chemist''s Companion: Numerical Data for Use in the Atmospheric Sciences, Springer, Dordrecht, doi:10.1007/978-94-007-2275-0; Table 6.4a: irradiances in 1e12 photon cm-2 s-1 nm-1, Neckel and Labs (1984) Solar Phys. 90, 205-258'
