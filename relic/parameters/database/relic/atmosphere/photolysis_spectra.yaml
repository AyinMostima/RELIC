  atmosphere.chemistry.photolysis.matsumi_temperature_min:
    value: 200.0
    default: 200.0
    units: 'K'
    dtype: 'float64'
    bounds:
    - 200.0
    - 200.0
    category: 'reference_parameter'
    description: 'Lower temperature of the evaluated range of the Matsumi et al. (2002) O(1D) quantum-yield expression; below it the expression is evaluated at this temperature (nearest evaluated temperature held).'
    references:
    - 'Matsumi, Y. et al. (2002) Quantum yields for production of O(1D) in the ultraviolet photolysis of ozone: Recommendation based on evaluation of laboratory data, J. Geophys. Res. 107(D3), 4024, doi:10.1029/2001JD000510: fitting expression for 306-328 nm and 200-300 K; recommended values 0.90 for 290-306 nm and 0.08 for 328-350 nm'
    - 'Warneck, P. and Williams, J. (2012) The Atmospheric Chemist''s Companion: Numerical Data for Use in the Atmospheric Sciences, Springer, Dordrecht, doi:10.1007/978-94-007-2275-0; Table 6.11c and text: Matsumi et al. (2002) formula and constants; phi(O1D) = 0.90 for 220-305 nm and 0.08 for 330-370 nm, independent of temperature'
    tags:
    - 'photolysis'
    - 'ozone'
    - 'temperature'
    requires_grad: false
    dimension: 'temperature'
    provenance:
      source: 'literature'
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-27T00:00:00Z'
      notes: 'Matsumi et al. (2002) evaluated the expression for 200-300 K (abstract). The cross-section and NO2 yield tables hold their own lowest tabulated temperature (248 K NO2 yields, 218-226 K O3 cross sections) in the same way, the practice of TUV (WRF module_xsections o3xs: no extrapolation in temperature).'
