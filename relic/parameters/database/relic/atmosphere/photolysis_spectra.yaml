      last_modified: '2026-09-27T00:00:00Z'
      notes: 'Printed values (unit 1e12 photon cm-2 s-1 nm-1) multiplied by 1e15 to give photon cm-2 s-1 um-1 (1e12 per printed unit times 1000 nm per um). Table 6.2 is used wherever it has data (to 409.5 nm); Table 6.4a supplies 410.5-417.5 nm. Over the 330.5-409.5 nm overlap the two tables differ by 2.3 percent in the integral.'
