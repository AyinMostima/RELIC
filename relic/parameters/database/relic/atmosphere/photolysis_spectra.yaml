  atmosphere.chemistry.photolysis.reference_ozone_column:
    value: 8.0603e+18
    default: 8.0603e+18
    units: 'molecule cm-2'
    dtype: 'float64'
    bounds:
    - 2.6868e+18
    - 1.3434e+19
    category: 'reference_parameter'
    description: 'Vertical ozone column of the reference slant path: 300 Dobson units (1 DU = 2.6868e16 molecule cm-2, a 0.01 mm layer of pure ozone at 273.15 K and 101325 Pa).'
    references:
    - 'WMO definition of the Dobson unit: 0.01 mm of pure ozone at standard temperature and pressure (Loschmidt constant 2.6868e25 m-3, CODATA 2018)'
    - 'Seinfeld, J.H. and Pandis, S.N. (2016) Atmospheric Chemistry and Physics, 3rd ed., Wiley, ch. 5: global mean total ozone column about 300 DU'
    tags:
    - 'photolysis'
    - 'ozone'
    - 'radiative_transfer'
    requires_grad: false
    dimension: 'amount_areal_density'
    provenance:
      source: 'literature'
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-27T00:00:00Z'
      notes: '300 DU x 2.68678e16 molecule cm-2 DU-1 = 8.0603e18 molecule cm-2. The column cross section is the lower-temperature column of the O3 table (218-226 K), the stratospheric range that holds most of the column. The slant path uses the actual cosine of the solar zenith angle of each call (direct beam).'
