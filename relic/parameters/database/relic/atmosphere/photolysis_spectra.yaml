    category: 'reference_parameter'
    description: 'Extraterrestrial solar photon flux averaged over each 1-nm interval of solar_flux_wavelength (Table 6.2, Woods et al. 1996 UARS/ATLAS 2, for 289.5-409.5 nm; Table 6.4a, Neckel and Labs 1984, for 410.5-417.5 nm), per micrometre of wavelength.'
