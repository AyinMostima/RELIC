  atmosphere.radiation.field_bounds.generic_min_radiation:
    value: -100.0
    default: -100.0
    units: W m-2
    dtype: float32
    bounds:
    - -300.0
    - 0.0
    category: numerical_parameter
    description: Lower projection bound R_min of RadiationField; forward and get_value_at clamp the field to [R_min, R_max], route the clipped part to diagnostics.radiation_field.clipping_residual and use R_max - R_min as the Hodge metric
    references:
    - Campbell & Norman (1998). Environmental Biophysics
    tags:
    - field
    - bounds
    - generic
    dimension: energy_flux
    requires_grad: false
    provenance:
      source: model_configuration
      schema_version: 2.0.0
      created_by: radiation_parameter_migration
      last_modified: '2026-01-27T00:00:00Z'
  atmosphere.radiation.field_bounds.generic_max_radiation:
    value: 1200.0
    default: 1200.0
    units: W m-2
    dtype: float32
    bounds:
    - 800.0
    - 1500.0
