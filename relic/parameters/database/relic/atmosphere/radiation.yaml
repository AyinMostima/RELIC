parameters:
  atmosphere.radiation.atmospheric_transmittance:
    value: 0.75
    default: 0.75
    units: dimensionless
    dtype: float32
    bounds:
    - 0.6
    - 0.85
    category: atmospheric_parameter
    description: Clear-sky atmospheric transmittance for shortwave radiation
    references:
    - Sellers (1985) Int. J. Remote Sensing 6, 1335-1372
    tags:
    - atmospheric
    - shortwave
    dimension: dimensionless
    requires_grad: true
    provenance:
      source: literature
      schema_version: 2.0.0
      created_by: parameter_consolidation
      last_modified: '2025-10-09T00:00:00Z'
  atmosphere.radiation.cloud_attenuation_factor:
    value: 0.8
    default: 0.8
    units: dimensionless
    dtype: float32
    bounds:
    - 0.2
    - 1.0
    category: atmospheric_parameter
    description: Cloud attenuation strength in SW_down = SW_clear * (1 - cloud_fraction * factor)
    references:
    - Sellers (1985) Int. J. Remote Sensing 6, 1335-1372
    tags:
    - cloud
    - shortwave
    dimension: dimensionless
    requires_grad: true
    provenance:
      source: literature
      schema_version: 2.0.0
      created_by: parameter_consolidation
      last_modified: '2025-10-09T00:00:00Z'
  atmosphere.radiation.brutsaert_coefficient:
    value: 1.24
    default: 1.24
    units: dimensionless
    dtype: float32
    bounds:
    - 1.0
    - 1.5
    category: empirical_parameter
    description: Brutsaert equation coefficient for longwave emissivity estimation
    references:
    - Brutsaert (1975) doi:10.1029/WR011i005p00742
    - Peng et al. (2025) Atmos. Meas. Tech. 18, 2877-2905
