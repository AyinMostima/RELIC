    requires_grad: true
    provenance:
      source: literature
      schema_version: 2.0.0
      created_by: parameter_consolidation
      last_modified: '2025-10-09T00:00:00Z'
  atmosphere.radiation.brutsaert_exponent:
    value: 0.142857
    default: 0.142857
    units: dimensionless
    dtype: float32
    bounds:
    - 0.1
    - 0.2
    category: empirical_parameter
    description: Brutsaert equation exponent (1/7) for vapor pressure effect on emissivity; vapor pressure input uses hPa in the canonical form
    references:
    - Brutsaert (1975) doi:10.1029/WR011i005p00742
    - Peng et al. (2025) Atmos. Meas. Tech. 18, 2877-2905
