schema_version: 2.0.0
tier: relic
namespace: biosphere.bvoc
description: Unified BVOC emission parameters with CF-1.8 standard units
metadata:
  created_by: RELIC Parameter System
  last_modified: '2026-01-07T14:20:26Z'
  schema_url: https://github.com/relic/parameter-schema/v2.0.0
  version: 1.0.0
functor_metadata:
  spatial_scale: grid_cell
  variable_kind: flux
  input_variables:
  - air_temperature
  - ppfd
  - leaf_area_index
  - atmospheric_co2_ppm
  - net_photosynthesis
  output_variables:
  - isoprene_emission
  - monoterpenes_emission
  - sesquiterpenes_emission
  - ovocs_emission
  - total_bvoc_emission
  - bvoc_carbon_allocation_flux
  - diagnostics.bvoc.megan.environmental_stress_factor
  - diagnostics.bvoc.megan.photosynthesis_carbon_floor_residual
  - diagnostics.bvoc.megan.co2_inhibition_factor
  - diagnostics.bvoc.megan.isoprene.gamma_temperature
  - diagnostics.bvoc.megan.monoterpenes.gamma_temperature
  - diagnostics.bvoc.megan.sesquiterpenes.gamma_temperature
  - diagnostics.bvoc.megan.ovocs.gamma_temperature
  - diagnostics.bvoc.megan.isoprene.gamma_light
  - diagnostics.bvoc.megan.monoterpenes.gamma_light
  - diagnostics.bvoc.megan.sesquiterpenes.gamma_light
  - diagnostics.bvoc.megan.ovocs.gamma_light
  conservation_laws:
  - carbon_boundary
  references:
  - Guenther et al. (2012). Geosci. Model Dev. 5, 1471-1492.
  - Sindelarova et al. (2022). ESSD 14, 251-270.
parameters:
  biosphere.bvoc.t_standard:
    value: 303.15
    default: 303.15
    units: K
    dtype: float32
    bounds:
    - 298.15
    - 308.15
    category: model_parameter
    description: 'Standard temperature T_s of the light-independent Eq. (11) response exp(beta (T - T_s)); 303.15 K (30 degC) is paired with the reference temperature of the RELIC dry-mass emission factors (basal emission rates normalized to 30 degC; standard air temperature 303 K of the MEGAN canopy factors). Guenther et al. (2012) use T_s = 297 K together with the MEGAN2.1 area-based Table 2 emission factors; the two pairs must not be mixed.'
    references:
    - 'Duhl et al. (2008) Biogeosciences 5, 761-777, doi:10.5194/bg-5-761-2008, Sect. 2.1, Eq. (1) (basal emission rates in ug gDW-1 h-1 normalized to a standard temperature, usually 30 degC)'
    - 'Guenther et al. (2006) Atmos. Chem. Phys. 6, 3181-3210, doi:10.5194/acp-6-3181-2006, Sect. 2.1 (standard air temperature 303 K)'
    - 'Guenther et al. (2012) Geosci. Model Dev. 5, 1471-1492, doi:10.5194/gmd-5-1471-2012, Eqs. (9)-(11) (T_s = 297 K with the area-based Table 2 emission factors)'
    tags:
    - reference_temperature
    - megan_parameter
    requires_grad: false
    provenance:
      source: megan_v2.1_model
      schema_version: 2.0.0
      created_by: RELIC Parameter Fix P3-2
      last_modified: '2025-10-09T00:00:00Z'
      literature_check: 'verified with rounding: Guenther et al. (2006) Sect. 2.1 defines the MEGAN canopy standard air temperature as 303 K and Duhl et al. (2008) Sect. 2.1 normalizes basal emission rates usually to 30 degC (stored as 303.15 K); Guenther et al. (2012) Eqs. (9)-(11) use T_s = 297 K for the MEGAN2.1 emission factors'
    dimension: temperature
