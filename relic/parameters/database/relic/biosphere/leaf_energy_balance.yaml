schema_version: 2.0.0
tier: relic
namespace: biosphere.leaf_energy_balance
description: Parameters of the big-leaf energy balance (LeafEnergyBalance) that are read only with energy_balance_form radiative_canopy_share (and free_convection beljaars)
metadata:
  created_by: RELIC Parameter System
  last_modified: '2026-11-06T20:42:26Z'
  schema_url: https://github.com/relic/parameter-schema/v2.0.0
  version: 1.0.0
parameters:
  biosphere.leaf_energy_balance.minimum_wind_speed:
    # The default equals hydrosphere.numerical.minimum_wind_speed (0.1 m s-1), so the
    # radiative_canopy_share form reproduces the wind handling of the shared FAO-56 Eq. 4
    # conductance unless a design raises it. FAO-56 Chapter 3 ("Missing wind speed data",
    # after Table 4; https://www.fao.org/4/x0490e/x0490e07.htm, read 2026-11-06) states that
    # the 2 m wind u2 "should be limited to about u2 >= 0.5 m/s" in the ETo equation, to
    # account for boundary-layer instability and buoyancy in calm air; a design may set
    # 0.5 m s-1 on that basis (the FAO-56 limit is stated for 2 m, not for other heights).
    # Read only by LeafEnergyBalance; Penman-Monteith and every other reader keep
    # hydrosphere.numerical.minimum_wind_speed.
    value: 0.1
    default: 0.1
    units: m s-1
    dtype: float32
    bounds:
    - 0.01
    - 1.0
    category: numerical_stability
    description: Lower bound of the wind speed in the aerodynamic conductance of the leaf energy balance (radiative_canopy_share form only)
    references:
    - Allen et al. (1998) FAO Irrigation and Drainage Paper 56, Chapter 3, Missing wind speed data (u2 >= 0.5 m/s in the ETo equation)
    - Allen et al. (1998) FAO Irrigation and Drainage Paper 56, Eq. 4 (aerodynamic resistance)
    tags:
    - wind_speed
    - numerical_stability
    - aerodynamic_resistance
    - leaf_energy_balance
    dimension: velocity
    requires_grad: false
    provenance:
      source: literature_synthesis
      schema_version: 2.0.0
      created_by: RELIC leaf energy balance radiative form
      last_modified: '2026-11-06T20:42:26Z'
  biosphere.leaf_energy_balance.convective_velocity_coefficient:
    # CTSM Technical Note (CLM5), "Momentum, Sensible Heat, and Latent Heat Fluxes",
    # Eqs. 2.5.24, 2.5.28 and 2.5.29: V_a = sqrt(u_atm^2 + v_atm^2 + U_c^2), U_c = beta w*
    # (zeta < 0, else 0), w* = (-g u* theta_v* z_i / theta_v)^(1/3), "z_i = 1000 is the
    # convective boundary layer height (m), and beta = 1"; read 2026-11-06 from
    # https://escomp.github.io/CTSM/tech_note/Fluxes/CLM50_Tech_Note_Fluxes.html.
    # Read only by LeafEnergyBalance with free_convection "beljaars".
    value: 1.0
    default: 1.0
    units: dimensionless
    dtype: float32
    bounds:
    - 0.0
    - 2.0
    category: physical_parameter
    description: Coefficient beta of the convective (free-convection) velocity U_c = beta w* added to the wind of the stability-corrected aerodynamic conductance of the leaf energy balance
    references:
    - CTSM Technical Note (CLM5.0), Momentum, Sensible Heat, and Latent Heat Fluxes, Eqs. 2.5.24, 2.5.28 and 2.5.29 (beta = 1)
    tags:
    - free_convection
    - leaf_energy_balance
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: literature_synthesis
      schema_version: 2.0.0
      created_by: RELIC leaf energy balance free convection
      last_modified: '2026-11-06T22:17:36Z'
  biosphere.leaf_energy_balance.convective_boundary_layer_height:
    # Same source and equation (Eq. 2.5.29): z_i = 1000 m.
    value: 1000.0
    default: 1000.0
    units: m
    dtype: float32
    bounds:
    - 100.0
    - 5000.0
    category: physical_parameter
    description: Convective boundary-layer height z_i of the convective velocity scale w* of the leaf energy balance
    references:
    - CTSM Technical Note (CLM5.0), Momentum, Sensible Heat, and Latent Heat Fluxes, Eq. 2.5.29 (z_i = 1000 m)
    tags:
    - free_convection
    - leaf_energy_balance
    dimension: length
    requires_grad: false
    provenance:
      source: literature_synthesis
      schema_version: 2.0.0
      created_by: RELIC leaf energy balance free convection
      last_modified: '2026-11-06T22:17:36Z'
