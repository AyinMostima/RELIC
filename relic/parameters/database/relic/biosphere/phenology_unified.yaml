notes: 'This parameter file contains all physical and biological constants used by the

  PhenologyFunctor to avoid hardcoded values. Parameters are organized by:

  - LAI: Leaf Area Index bounds and response characteristics

  - Coupling: Interaction factors with other biological processes

  - Carbon: Carbon allocation and cycling parameters

  - Time: Temporal conversion constants

  - Static: Static phenology model parameters

  - GDD: Growing Degree Days phenology model parameters

  - GSI: Growing Season Index phenology model parameters

  - Crop: Crop-specific phenology parameters

  - Turnover: Leaf turnover and senescence parameters

  - Stress: Environmental stress parameters

  - Computational: Numerical and computational parameters

  - Defaults: Default values for missing data

  - Common: Common configuration parameters

  - Morphology: Plant morphological parameters

  - Configuration: Model configuration flags

  - Activity: Growth activity level parameters

  - Allocation: Biomass allocation parameters

  - Validation: Numerical validation parameters


  All parameters include proper units, bounds, and literature references.

  Learnable parameters have requires_grad=true for optimization.'
