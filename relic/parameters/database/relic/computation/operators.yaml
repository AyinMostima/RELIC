    description: 'Boundary closure of the Laplacian operators laplacian.finite_difference_1d/2d/3d, checked by OperatorBase against these allowed_values and applied by functional.compute_laplacian_1d and compute_second_derivative_1d (zero, extrapolate and periodic closures). Changed on 2026-09-23 from [zero, periodic, dirichlet, neumann]: dirichlet and neumann were rejected by the kernel and the implemented extrapolate closure was missing.'
