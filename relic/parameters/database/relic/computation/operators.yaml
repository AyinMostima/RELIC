    units: dimensionless
    dtype: string
    category: boundary_parameter
    description: 'Boundary closure of the divergence operators divergence.finite_volume_2d/3d, checked by OperatorBase against these allowed_values; FiniteVolumeDivergence2D/3D evaluate functional.compute_divergence_2d/3d, whose component derivatives use the compute_gradient_1d closures zero, extrapolate and periodic. Changed on 2026-09-23 from [zero, periodic, dirichlet, neumann]: dirichlet and neumann were rejected by the kernel and the implemented extrapolate closure was missing.'
    references:
    - LeVeque, R.J. (2007). Finite Difference Methods for ODEs and PDEs.
    tags:
    - divergence
    - boundary
    dimension: dimensionless
    requires_grad: false
