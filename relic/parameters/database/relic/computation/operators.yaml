  computation.operators.transport.splitting_method:
    value: symmetric
    default: symmetric
    units: dimensionless
    dtype: string
    category: numerical_parameter
    description: 'Operator splitting of the AdvectionDiffusionOperator (functional.advance_advection_diffusion), checked by OperatorBase against these allowed_values: sequential is Lie splitting (advection, then diffusion), symmetric is Strang splitting (half diffusion, advection, half diffusion), combined is one unsplit explicit Euler step of the summed rates and requires euler time integration. Changed on 2026-09-23 from [symmetric, sequential, none]: none was never implemented, and combined (used by AtmosphericAdvectionDiffusionFunctor) was missing.'
    references:
    - Strang, G. (1968). On the construction and comparison of difference schemes.
    tags:
    - transport
    - splitting
    dimension: dimensionless
    requires_grad: false
    allowed_values:
    - sequential
    - symmetric
    - combined
    provenance:
      source: computation.operators.transport
      schema_version: 2.0.0
      last_modified: '2026-09-23T00:00:00Z'
    bounds:
    - -10000000000.0
    - 10000000000.0
  computation.operators.transport.advection_scheme:
    value: upwind
    default: upwind
    units: dimensionless
    dtype: string
    category: numerical_parameter
    description: 'Advection flux scheme of the AdvectionDiffusionOperator (functional.apply_advection), checked by OperatorBase against these allowed_values: upwind (first order), lax_wendroff (second order, fully discrete), superbee and van_leer (flux limited, fully discrete; lax_wendroff, superbee and van_leer require euler time integration), central (requires an implicit time integration method). Changed on 2026-09-23 from [upwind, lax_wendroff, fromm]: fromm was never implemented, and the implemented superbee, van_leer and central schemes were missing.'
    references:
    - LeVeque, R.J. (2007). Finite Volume Methods for Hyperbolic Problems.
    tags:
    - transport
    - advection
    dimension: dimensionless
    requires_grad: false
    allowed_values:
    - upwind
    - lax_wendroff
    - superbee
    - van_leer
    - central
    provenance:
      source: computation.operators.transport
      schema_version: 2.0.0
      last_modified: '2026-09-23T00:00:00Z'
    bounds:
    - -10000000000.0
    - 10000000000.0
  computation.operators.transport.boundary_method:
    value: zero
    default: zero
    units: dimensionless
    dtype: string
    category: boundary_parameter
    description: 'Boundary treatment of the DiffusionOperator and AdvectionDiffusionOperator (functional.apply_diffusion and apply_advection), checked by OperatorBase against these allowed_values. Diffusion: zero, neumann and open are zero-flux closures, extrapolate uses a linear ghost, periodic wraps, dirichlet requires an explicit boundary state. Advection: zero uses a zero ghost state, neumann a zero-gradient ghost, extrapolate a linear ghost, periodic wraps, dirichlet and open require an explicit inflow boundary state. Changed on 2026-09-23 from [zero, periodic, extrapolate]: dirichlet, neumann and open are implemented by both kernels.'
    references:
    - Crank, J. (1975). The Mathematics of Diffusion.
    tags:
    - transport
    - boundary
    dimension: dimensionless
    requires_grad: false
    allowed_values:
    - zero
    - extrapolate
    - periodic
    - dirichlet
    - neumann
    - open
    provenance:
      source: computation.operators.transport
      schema_version: 2.0.0
      last_modified: '2026-09-23T00:00:00Z'
    bounds:
    - -10000000000.0
    - 10000000000.0
  computation.operators.transport.advection.boundary_method:
    value: extrapolate
    default: extrapolate
    units: dimensionless
    dtype: string
    category: boundary_parameter
    description: 'Boundary treatment of the pure AdvectionOperator (functional.apply_advection), checked by OperatorBase against these allowed_values; the value extrapolate (linear ghost extrapolation) is the value in effect before strict parameter lookup. zero uses a zero ghost state, neumann a zero-gradient ghost, periodic wraps, dirichlet and open require an explicit inflow boundary state. computation.operators.transport.boundary_method applies to the diffusion and advection-diffusion operators. Changed on 2026-09-23 from [zero, periodic, extrapolate]: dirichlet, neumann and open are implemented by the kernel.'
    references:
    - LeVeque, R.J. (2002). Finite Volume Methods for Hyperbolic Problems.
    tags:
    - transport
    - advection
    - boundary
    dimension: dimensionless
    requires_grad: false
    allowed_values:
    - zero
    - extrapolate
    - periodic
    - dirichlet
    - neumann
    - open
    provenance:
      source: computation.operators.transport
      schema_version: 2.0.0
      last_modified: '2026-09-23T00:00:00Z'
    bounds:
    - -10000000000.0
    - 10000000000.0
