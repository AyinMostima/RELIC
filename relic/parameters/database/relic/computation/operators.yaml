  computation.operators.gradient.boundary_method:
    value: zero
    default: zero
    units: dimensionless
    dtype: string
    category: boundary_parameter
    description: 'Boundary closure of the gradient operators gradient.central_difference_1d/2d/3d, checked by OperatorBase against these allowed_values and applied by functional.compute_gradient_1d: zero sets the boundary derivative to zero, extrapolate uses one-sided first differences, periodic wraps the stencil. Changed on 2026-09-23 from [zero, periodic, dirichlet, neumann]: the gradient kernel never implemented dirichlet or neumann (rejected at apply), and the implemented extrapolate closure was missing.'
    references:
    - LeVeque, R.J. (2007). Finite Difference Methods for ODEs and PDEs.
    tags:
    - boundary
    - gradient
    dimension: dimensionless
    requires_grad: false
    allowed_values:
    - zero
    - extrapolate
    - periodic
    provenance:
      source: computation.operators.gradient
      schema_version: 2.0.0
      last_modified: '2026-09-23T00:00:00Z'
    bounds:
    - -10000000000.0
    - 10000000000.0
