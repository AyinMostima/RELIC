    dtype: float32
    bounds:
    - 0.0
    - 10.0
    category: numerical_parameter
    description: Maximum allowed CFL number for transport operators
    references:
    - Courant, R. et al. (1928). On the partial difference equations of mathematical physics.
    tags:
    - transport
    - stability
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: computation.operators.diagnostics
      schema_version: 2.0.0
  computation.operators.transport.scheme:
    value: upwind
    default: upwind
    units: dimensionless
    dtype: string
    category: numerical_parameter
    description: 'Advection flux scheme of the pure AdvectionOperator (functional.apply_advection), checked by OperatorBase against these allowed_values: upwind, lax_wendroff, superbee, van_leer and central, with the same time-integration requirements as computation.operators.transport.advection_scheme; the AdvectionOperator steps with its time_integration_method (transport.numerical.time_integration_method or the config key) and rejects at construction a pair that cannot step (central with euler, a fully discrete scheme with an implicit method). Changed on 2026-09-23 from [upwind, lax_wendroff, superbee]: the implemented van_leer and central schemes were missing.'
    references:
    - LeVeque, R.J. (2007). Finite Difference Methods for ODEs and PDEs.
    tags:
    - transport
    - advection
    dimension: dimensionless
    requires_grad: false
    allowed_values:
    - upwind
    - lax_wendroff
    - superbee
    - van_leer
    - central
    provenance:
      source: computation.operators.transport
      schema_version: 2.0.0
      last_modified: '2026-09-23T00:00:00Z'
    bounds:
    - -10000000000.0
    - 10000000000.0
  computation.operators.diagnostics.max_stability_allowed:
    value: 0.5
    default: 0.5
    units: dimensionless
    dtype: float32
    bounds:
    - 0.0
    - 5000.0
    category: numerical_parameter
    description: 'Maximum diffusion stability number sigma = D dt sum_i 1/dx_i^2 that the StabilityChecker diagnostics operator accepts without warning (it warns above computation.operators.diagnostics.warn_threshold times this limit); 0.5 is the stability limit of explicit forward-time centred-space diffusion. The bounds still allow a larger configured value for implicit or coarse-step diagnostics. Changed from 3000.0 to 0.5 on 2026-09-23: the only runtime caller, AtmosphericAdvectionDiffusionFunctor, checks an explicit scheme and rejects steps above transport.numerical.cfl_diffusion_max = 0.5, and functional.compute_diffusion_stability documents sigma <= 0.5 for explicit schemes.'
    references:
    - Strikwerda, J.C. (2004). Finite Difference Schemes and PDEs.
    - LeVeque, R.J. (2007). Finite Difference Methods for ODEs and PDEs.
    - Crank, J. (1975). The Mathematics of Diffusion, 2nd ed.
    tags:
    - diagnostics
    - stability
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: computation.operators.diagnostics
      schema_version: 2.0.0
      last_modified: '2026-09-23T00:00:00Z'
  computation.operators.diagnostics.strict_mode:
    value: false
    default: false
    units: dimensionless
    dtype: bool
    bounds: null
    category: numerical_parameter
    description: 'Blocking policy of the ConservationChecker diagnostics operator: true raises ValueError when the relative transport mass-conservation error exceeds computation.operators.diagnostics.tolerance, false only reports (and warns on) the error (boolean flag)'
    references:
    - 'LeVeque, R.J. (2007). Finite Difference Methods for Ordinary and Partial Differential Equations, SIAM'
    tags:
    - diagnostics
    - conservation
    - error_handling
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: computation.operators.diagnostics
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-23T00:00:00Z'
  computation.operators.diagnostics.tolerance:
    value: 1.0e-06
    default: 1.0e-06
    units: dimensionless
    dtype: float64
    bounds:
    - 1.0e-12
    - 1.0e-03
    category: numerical_parameter
    description: 'Relative tolerance of the transport mass-conservation check error = |Delta M - dt integral(S dV)| / (|M_old| + 1e-12): the default of functional.check_conservation when no explicit tolerance is passed and the ParameterManager value requested by the ConservationChecker diagnostics operator (dimensionless fraction of the old mass)'
    references:
    - 'Byun, D.W. & Ching, J.K.S. (1999). Science Algorithms of the EPA Models-3 CMAQ Modeling System, EPA/600/R-99/030, ch. 7 (numerical transport algorithms)'
    - 'LeVeque, R.J. (2007). Finite Difference Methods for Ordinary and Partial Differential Equations, SIAM'
    tags:
    - diagnostics
    - conservation
    - transport
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: computation.operators.diagnostics
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-23T00:00:00Z'
  computation.operators.diagnostics.warn_threshold:
    value: 0.9
    default: 0.9
    units: dimensionless
    dtype: float32
    bounds:
    - 0.0
    - 1.0
    category: numerical_parameter
    description: Warning threshold as a fraction of the maximum diagnostic limit.
    references:
    - LeVeque, R.J. (2002). Finite Volume Methods for Hyperbolic Problems.
    tags:
    - diagnostics
    - stability
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: computation.operators.diagnostics
      schema_version: 2.0.0
  computation.operators.diagnostics.max_cfl_allowed:
    value: 1.0
    default: 1.0
    units: dimensionless
    dtype: float32
    bounds:
    - 0.0
    - 10.0
    category: numerical_parameter
    description: Maximum allowed Courant number |u| dt / dx of the CFLCalculator diagnostics operator; a larger CFL number raises, and computation.operators.diagnostics.warn_threshold times this limit warns
    references:
    - Courant, R., Friedrichs, K. and Lewy, H. (1928). Math. Ann. 100:32-74.
    - LeVeque, R.J. (2002). Finite Volume Methods for Hyperbolic Problems.
    tags:
    - diagnostics
    - stability
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: computation.operators.diagnostics
      schema_version: 2.0.0
  computation.operators.diagnostics.method:
    value: clip
    default: clip
    units: dimensionless
    dtype: string
    category: numerical_parameter
    description: Method of the NonNegativeConstraint operator; clip raises values below computation.operators.diagnostics.small_value to it, zero clamps at transport.numerical.non_negative_min_value
    references:
    - LeVeque, R.J. (2002). Finite Volume Methods for Hyperbolic Problems.
    tags:
    - diagnostics
    - positivity
    dimension: dimensionless
    requires_grad: false
    allowed_values:
    - clip
    - zero
    provenance:
      source: computation.operators.diagnostics
      schema_version: 2.0.0
    bounds:
    - -10000000000.0
    - 10000000000.0
  computation.operators.diagnostics.small_value:
    value: 1.0e-12
    default: 1.0e-12
    units: dimensionless
    dtype: float64
    bounds:
    - 0.0
    - 1.0e-06
    category: numerical_parameter
    description: 'Strictly positive floor of the ''clip'' method of apply_non_negative_constraint (relic/computation/operators/functional.py), read only by the NonNegativeConstraint diagnostics operator (relic/computation/operators/diagnostics.py) when computation.operators.diagnostics.method is ''clip'': values below it are raised to it, in the units of the constrained field. It differs from transport.numerical.non_negative_min_value, the non-negativity bound of the ''zero'' method: clip keeps a field strictly positive (a model choice for fields that later enter logarithms or divisions), zero only removes negative values.'
    references:
    - LeVeque, R.J. (2002). Finite Volume Methods for Hyperbolic Problems.
    tags:
    - diagnostics
    - positivity
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: computation.operators.diagnostics
      schema_version: 2.0.0
