  computation.solvers.implicit_midpoint.max_iterations:
    value: 100
    default: 100
    units: dimensionless
    dtype: int32
    bounds:
    - 1
    - 10000
    category: numerical_parameter
    description: 'Maximum fixed-point iterations of ImplicitMidpointSolver, y <- y_n + dt f((y_n + y)/2, t_n + dt/2); the map contracts with q = (dt/2) L (L the Lipschitz constant of f), so about ln(tol)/ln(q) iterations are needed, and exhaustion returns SolverStatus.MAX_ITERATIONS. Declared on 2026-09-23 so the solver namespace owns the value like the other registered solvers; the value is the one in effect before, when the solver fell through to relic.physical.constants.numerical.max_iterations_default. Distinct from transport.numerical.implicit_midpoint_max_iter and transport.numerical.implicit_midpoint_tolerance: the transport kernels (functional._integrate_rate_system) always pass those explicitly for their implicit midpoint and Crank-Nicolson steps, so this entry only serves callers that configure nothing (for example transactional_implicit_midpoint_step with an empty solver_config and solve_ode_system).'
    references:
    - Hairer, E., Lubich, C. & Wanner, G. (2006). Geometric Numerical Integration, 2nd ed. Springer.
    - Hairer, E. & Wanner, G. (1996). Solving Ordinary Differential Equations II.
    tags:
    - implicit
    - solver
    - convergence
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: computation.solvers.implicit_midpoint
      schema_version: 2.0.0
      last_modified: '2026-09-23T00:00:00Z'
  computation.solvers.implicit_midpoint.rtol:
    value: 1.0e-06
    default: 1.0e-06
    units: dimensionless
    dtype: float32
    bounds:
    - 0.0
    - 9.999999999999999e-05
    category: numerical_parameter
    description: 'Relative tolerance of the ImplicitMidpointSolver successive-iterate criterion ||y_new - y_prev||_inf < max(atol, rtol ||y_new||_inf). Declared on 2026-09-23 so the solver namespace owns the value like the other registered solvers; the value is the one in effect before, when the solver fell through to relic.physical.constants.numerical.tolerance_relative. Distinct from transport.numerical.implicit_midpoint_max_iter and transport.numerical.implicit_midpoint_tolerance: the transport kernels (functional._integrate_rate_system) always pass those explicitly for their implicit midpoint and Crank-Nicolson steps, so this entry only serves callers that configure nothing (for example transactional_implicit_midpoint_step with an empty solver_config and solve_ode_system).'
    references:
    - Hairer, E., Lubich, C. & Wanner, G. (2006). Geometric Numerical Integration, 2nd ed. Springer.
    - Hairer, E. & Wanner, G. (1996). Solving Ordinary Differential Equations II.
    tags:
    - implicit
    - solver
    - tolerance
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: computation.solvers.implicit_midpoint
      schema_version: 2.0.0
      last_modified: '2026-09-23T00:00:00Z'
  computation.solvers.implicit_midpoint.atol:
    value: 1.0e-08
    default: 1.0e-08
    units: dimensionless
    dtype: float32
    bounds:
    - 0.0
    - 1.0000000000000001e-07
    category: numerical_parameter
    description: 'Absolute tolerance of the ImplicitMidpointSolver successive-iterate criterion ||y_new - y_prev||_inf < max(atol, rtol ||y_new||_inf), in the units of the state (dimensionless for the registry default). Declared on 2026-09-23 so the solver namespace owns the value like the other registered solvers; the value is the one in effect before, when the solver fell through to relic.physical.constants.numerical.tolerance_absolute. Distinct from transport.numerical.implicit_midpoint_max_iter and transport.numerical.implicit_midpoint_tolerance: the transport kernels (functional._integrate_rate_system) always pass those explicitly for their implicit midpoint and Crank-Nicolson steps, so this entry only serves callers that configure nothing (for example transactional_implicit_midpoint_step with an empty solver_config and solve_ode_system).'
    references:
    - Hairer, E., Lubich, C. & Wanner, G. (2006). Geometric Numerical Integration, 2nd ed. Springer.
    - Hairer, E. & Wanner, G. (1996). Solving Ordinary Differential Equations II.
    tags:
    - implicit
    - solver
    - tolerance
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: computation.solvers.implicit_midpoint
      schema_version: 2.0.0
