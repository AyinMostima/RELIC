  computation.solvers.hybrid_events.transversality_tolerance:
    value: 1.0e-12
    default: 1.0e-12
    units: dimensionless
    dtype: float64
    bounds:
    - 1.0e-300
    - 1.0e-03
    category: numerical_parameter
    description: 'Default absolute threshold of relic.computation.solvers.hybrid_events below which a guard crossing is
      treated as grazing and refused (the event-time sensitivity and the saltation matrix divide by this quantity and are
      undefined at a tangential crossing). It is compared with |g_start - g_end| in locate_guard_crossing (guard units) and
      with |g_x f_minus + g_t| in event_time_sensitivity and saltation_matrix (guard units per second), always in the
      caller''s units; a caller whose guard is not of order one passes transversality_tol explicitly. The transversality
      condition itself follows Hiskens and Pai (2000); the value 1e-12, about 4.5e3 float64 machine epsilons for an order-one
      guard, is a RELIC convention value.'
    references:
    - Hiskens, I.A. & Pai, M.A. (2000). Trajectory sensitivity analysis of hybrid systems. IEEE Trans. Circuits Syst. I 47,
      204-220 (transversality condition of the saltation matrix)
    - Shampine, L.F. & Thompson, S. (2000). Event location for ordinary differential equations. Comput. Math. Appl. 39,
      43-54
    - RELIC convention value (no literature value for the threshold; documented as an operational choice)
    tags:
    - hybrid_events
    - tolerance
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: relic_convention
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-26T00:00:00Z'
