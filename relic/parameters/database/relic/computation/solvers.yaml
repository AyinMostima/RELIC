  computation.solvers.crank_nicolson.theta:
    value: 0.5
    default: 0.5
    units: dimensionless
    dtype: float32
    bounds:
    - 0.0
    - 1.0
    category: numerical_parameter
    description: 'Dimensionless weight of the new-time slope in the theta-method y(n+1) = y(n) + dt*[theta*f(y(n+1)) + (1 - theta)*f(y(n))]; theta = 0.5 is Crank-Nicolson (second order), theta = 1 is Backward Euler'
    references:
    - Crank, J. & Nicolson, P. (1947). Proceedings of the Cambridge Philosophical Society.
    tags:
    - implicit
