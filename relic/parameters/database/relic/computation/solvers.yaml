  computation.solvers.thomas.check_stability:
    value: true
    default: true
    units: dimensionless
    dtype: bool
    category: diagnostic_parameter
    description: Compute the Varah bound on cond_inf(A) (check_matrix_conditioning) for every 1-D tridiagonal solve and
      record it in the result metadata (condition_number, is_well_conditioned); the solver keeps no state from a solve.
      The pivot test is always on and does not depend on this flag;
      a numerically singular pivot raises (the Thomas algorithm does not pivot, Press et al. 1992 Sect. 2.4), and there is
      no pivot regularization.
    references:
    - Varah, J.M. (1975). A lower bound for the smallest singular value of a matrix. Linear Algebra Appl. 11, 3-5.
    - Press, W.H. et al. (1992). Numerical Recipes in C, 2nd ed., Sect. 2.4 (tridag has no pivoting; use a pivoting band
      solver when it fails).
    tags:
    - linear_solver
    - stability
    - diagnostics
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: computation.solvers.thomas
      schema_version: 2.0.0
      last_modified: '2026-09-26T00:00:00Z'
    bounds:
    - 0.0
    - 100
  computation.solvers.thomas.report_condition:
    value: false
    default: false
    units: dimensionless
    dtype: bool
    category: diagnostic_parameter
    description: Report estimated condition numbers for tridiagonal solves
    references:
    - Trefethen, L.N. & Bau, D. (1997). Numerical Linear Algebra.
    tags:
    - linear_solver
    - diagnostics
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: computation.solvers.thomas
      schema_version: 2.0.0
    bounds:
