schema_version: 2.0.0
tier: relic
namespace: coupling.scales.biosphere_atmosphere
description: Parameters for biosphere-atmosphere coupling processes
metadata:
  version: 1.0.0
  stomatal_model_contract:
    status: parameter_contract_only_no_production_medlyn_functor
    formulation: modern_medlyn_positive_assimilation_with_declared_ctsm_style_closures
    positive_assimilation: 'g_s = g0 + r_wc * (1 + g1 / sqrt(D_eff_kPa)) * A_leaf / C_surface_ppm'
    nonpositive_assimilation: explicit_residual_g0_without_replacing_the_input_An
    dark_condition: leaf_ppfd_nonpositive
    dark_conductance: explicit_residual_g0
    vpd_regularization: max_declared_leaf_surface_VPD_and_vpd_min_pa
    atmospheric_input_substitution: explicit_conditional_leaf_surface_equals_canopy_air_assumption
    support: representative_leaf_area_not_ground_area_assimilation
    input_domain: 'Finite A_leaf and leaf PPFD; finite declared leaf-surface VPD; C_surface > 0. Raw An is preserved; darkness and nonpositive assimilation select a disclosed residual branch. The VPD floor is an implementation choice, including at nonpositive VPD, not a condensation model.'
    output_units: mol_H2O_m-2_leaf_s-1
    h2o_co2_diffusivity_constant: relic.physical.constants.conversions.h2o_co2_diffusivity_ratio
    branch_diagnostics: [dark_residual, nonpositive_assimilation_residual, vpd_floor_active]
    full_ctsm_equivalence: false
    ctsm_maximum_resistance_implemented: false
    notes: 'No claim of unmodified Medlyn across a full day, full CTSM hydraulic/leaf-boundary coupling, or interpretation of the unread 2012 correction. g0=0.01 and g1=4.0 are retained generic priors, not fitted nighttime data or the P3 comparator g1=4.45.'
    implementation_reference: https://github.com/ESCOMP/CTSM/blob/7d1bc988a5a67660d2988c57a0bf195173c31017/src/biogeophys/PhotosynthesisMod.F90
parameters:
  coupling.scales.biosphere_atmosphere.model_type:
    value: medlyn
    default: medlyn
    units: dimensionless
    dtype: string
    bounds: null
    allowed_values:
    - ball_berry
    - leuning
    - medlyn
    category: model_option
    description: Stomatal conductance model family
    references:
    - Medlyn et al. (2011)
    tags:
    - stomatal_conductance
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: literature_synthesis
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2025-10-19T00:00:00Z'
  coupling.scales.biosphere_atmosphere.g0:
    value: 0.01
    default: 0.01
    units: mol m-2 s-1
    dtype: float32
    bounds:
    - 0.0
    - 0.1
    category: process_parameter
    description: 'Generic residual leaf conductance prior for the explicitly declared dark/nonpositive-assimilation branch; retained value is not a measured nighttime calibration or a claim of the CTSM intercept value.'
    references:
    - Ball et al. (1987)
    - 'CTSM PhotosynthesisMod.F90 at 7d1bc988a5a67660d2988c57a0bf195173c31017, lines 1856-1870 and 1927-1934: separate dark and negative-assimilation conductance treatment; its maximum-resistance cap is not adopted here.'
    tags:
    - stomatal_conductance
    dimension: molar_flux
    requires_grad: false
    provenance:
      source: retained_generic_residual_prior_with_explicit_ctsm_style_branch_contract
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-10-15T00:00:00Z'
  coupling.scales.biosphere_atmosphere.g1:
    value: 4.0
    default: 4.0
    units: kPa^0.5
    dtype: float32
    bounds:
    - 0.0
    - 20.0
    category: process_parameter
    description: 'Generic Medlyn slope prior multiplying inverse square root leaf-surface VPD in kPa. Value 4.0 is retained; it is not the dimensionless Ball-Berry PFT g1 or the independent P3 comparator value 4.45.'
    references:
    - 'Medlyn et al. (2011), Global Change Biology 17, 2134-2144, doi:10.1111/j.1365-2486.2010.02375.x; modern implemented equation verified against CTSM technical note Eq. 2.9.1.'
    - 'CTSM Photosynthesis technical note, Eq. 2.9.1: D_s in kPa, requiring g1 in kPa^0.5; https://escomp.github.io/CTSM/tech_note/Photosynthesis/CLM50_Tech_Note_Photosynthesis.html'
    tags:
    - stomatal_conductance
    dimension: pressure^0.5
    requires_grad: false
    provenance:
      source: retained_generic_prior_with_corrected_medlyn_dimension
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-10-15T00:00:00Z'
