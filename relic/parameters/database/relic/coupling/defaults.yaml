  coupling.scales.defaults.roughness_blending_height:
    value: 10.0
    default: 10.0
    units: m
    dtype: float64
    bounds:
    - 1.0
    - 10.0
    category: physical_parameter
    description: Reference (blending) height z_r at which sub-grid drag coefficients are summed
      linearly to form the effective roughness length z0_eff = z_r exp(-(sum_j f_j / ln(z_r/z0_j)^2)^(-1/2));
      must lie in the surface layer above every aggregated roughness length.
    references:
    - Byun, D.W., Pleim, J.E., Tang, R.T. and Bourgeois, A. (1999). Chapter 12, Meteorology-Chemistry
      Interface Processor (MCIP) for Models-3 Community Multiscale Air Quality (CMAQ) Modeling System.
      EPA/600/R-99/030, Eqs. 12-37' and 12-48 (z_r = 10 m in MCIP; z0_eff insensitive to z_r in 1-10 m).
    tags:
    - roughness
    - hierarchical_aggregation
    dimension: length
    requires_grad: false
    provenance:
      source: CMAQ Science Documentation EPA/600/R-99/030 chapter 12 (MCIP z_r = 10 m)
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-23T00:00:00Z'
