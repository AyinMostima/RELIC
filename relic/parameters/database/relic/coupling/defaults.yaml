  coupling.scales.defaults.conservation_tolerance:
    value: 1.0e-08
    default: 1.0e-08
    units: dimensionless
    dtype: float64
    bounds:
    - 1.0e-14
    - 0.0001
    category: validation_parameter
    description: Relative ledger tolerance of the scale-coupling Functors outside the ScaleManager facade (SpatialAggregation, ConservativeRemap, the support_aggregation graph-edge adapter, ScaleCouplingFunctor.check_conservation) and the one default tolerance of every spatial regridder built without an explicit tolerance, read by SpatialRegridderBase whether the regridder is built directly or by SpatialRegridderFactory, AutoRegridder, SpatialScaling or RegridOperator; the ScaleManager facade passes coupling.scales.defaults.precision.<mode>.tolerance of the call's mode instead
    references:
    - Jones, P.W. (1999)
    - O'Neill, R.V. et al. (1986)
    tags:
    - conservation
    - scale_coupling
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: model_default
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-24T00:00:00Z'
