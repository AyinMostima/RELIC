  coupling.scales.defaults.epsilon:
    value: 1.0e-15
    default: 1.0e-15
    units: dimensionless
    dtype: float32
    bounds:
    - 1.0e-16
    - 1.0e-12
    category: numerical_threshold
    description: Relative numerical threshold of the scale operators; a bilinear bracket of
      HierarchicalAggregator counts as one node when |x1 - x0| <= epsilon * max(|x0|, |x1|), and a
      BilinearRegridder target coincides with a node when d <= epsilon * max(|p_t|, |p_i|).
    references:
    - Numerical Recipes (stability guidelines)
    tags:
    - numerical_stability
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: numerical_requirement
      schema_version: 2.0.0
      created_by: Yuchong Long
