    value:
      numerator_state: carbon_input
      denominator_state: water_input
      scale_factor: 86400000.0
      aggregation_method: mean
      notes: Converts carbon flux (kg m-2 s-1) and water depth flux (m s-1) into kg C per kg H2O
    default: null
    units: dimensionless
    dtype: object
    bounds:
