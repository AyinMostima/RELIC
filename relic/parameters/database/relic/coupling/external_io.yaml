schema_version: 2.0.0
tier: relic
namespace: coupling.external.io
description: Quality control and caching defaults for external adapter I/O handlers.
metadata:
  version: 1.0.0
parameters:
  coupling.external.io.missing_data_warning_threshold:
    value: 0.1
    default: 0.1
    units: dimensionless
    dtype: float32
    bounds:
    - 0.0
    - 1.0
    category: quality_control
    description: Missing data fraction threshold that triggers warnings during external data reads (IOHandler) and above which the external data validator reports a field as a WARNING (Validator._validate_data_completeness).
    references:
    - NetCDF Best Practices (Unidata)
    tags:
    - io
    - quality
    - external
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: model_default
      schema_version: 2.0.0
      created_by: relic
      last_modified: '2025-11-28T00:00:00Z'
      notes: External IO policy defaults; adjust per deployment
  coupling.external.io.validate_checksums:
    value: true
    default: true
    units: dimensionless
    dtype: bool
    bounds:
    - false
    - true
    category: quality_control
    description: Whether checksum verification is enabled when reading external datasets.
    references:
    - RELIC coupling IO policy 2025-12-02
    tags:
    - io
    - quality
    - external
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: model_default
      schema_version: 2.0.0
      created_by: relic
      last_modified: '2025-11-28T00:00:00Z'
      notes: External IO policy defaults; adjust per deployment
  coupling.external.io.cache_size_mb:
    value: 128
    default: 128
    units: dimensionless
    dtype: int32
    bounds:
    - 16
    - 4096
    category: performance_parameter
    description: Metadata cache size (MiB) for external I/O handlers.
    references:
    - RELIC coupling IO policy 2025-12-02
    tags:
    - io
    - cache
    - external
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: model_default
      schema_version: 2.0.0
      created_by: relic
      last_modified: '2025-11-28T00:00:00Z'
      notes: External IO policy defaults; adjust per deployment
  coupling.external.io.enable_cache:
    value: true
    default: true
    units: dimensionless
    dtype: bool
    bounds:
    - false
    - true
    category: performance_parameter
    description: Enable metadata caching when reading external datasets.
    references:
    - RELIC coupling IO policy 2025-12-02
