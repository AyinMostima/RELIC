        semantics: flux
        update_mode: derived
        references:
        - 'CF standard name table (runoff_flux: the liquid water which drains from land, surface runoff plus subsurface drainage, kg m-2 s-1; non-negative)'
        - 'Valid range (the one declaration; coupling.scales.*.variables repeat it): lower 0; upper 0.52 kg m-2 s-1, a convention equal to the precipitation_flux upper bound (the WMO greatest 1-min rainfall): runoff drains the water input of rain and snowmelt over the same interval'
        bounds:
        - 0.0
        - 0.52
        provenance:
          source: cf_standard
          schema_version: 1.0.0
          created_by: Yuchong Long
          last_modified: '2026-09-26T00:00:00Z'
      net_radiation:
        standard_name: surface_net_downward_radiative_flux
        long_name: Net Radiation at Surface
        units: W m-2
        valid_min: -400.0
        valid_max: 2200.0
        typical_min: 0.0
        typical_max: 800.0
        category: ATMOSPHERIC_FLUX
        dimension: extensive
        spatial_basis: area_density
        semantics: flux
        update_mode: derived
        references:
        - 'CF standard name table (surface_net_downward_radiative_flux: net radiation, positive downward into the surface, W m-2)'
        - 'Valid range (the one declaration; coupling.scales.*.variables repeat it): upper 2200 W m-2, derived from the observed extreme: R_n = (1 - alpha) S_down + L_net <= S_down for a surface albedo alpha >= 0 and a non-positive net longwave radiation L_net under the clear or broken skies of such irradiance, and the greatest measured surface global horizontal shortwave irradiance is S_down = 2177 W m-2 (60 s resolution, Chajnantor Plateau, 24 January 2017; Cordero et al. (2023) Bull. Amer. Meteor. Soc. 104(6):E1206-E1221, doi:10.1175/BAMS-D-22-0215.1), rounded up; lower -400 W m-2, a convention for the nocturnal net longwave loss'
        provenance:
          source: cf_standard
          schema_version: 1.0.0
          created_by: Yuchong Long
          last_modified: '2026-09-26T00:00:00Z'
        bounds:
        - -400.0
        - 2200.0
