      shortwave_down:
        standard_name: surface_downwelling_shortwave_flux_in_air
        long_name: Surface Downwelling Shortwave Radiation
        units: W m-2
        valid_min: 0.0
        valid_max: 2200.0
        typical_min: 0.0
        typical_max: 1000.0
        category: ATMOSPHERIC_FLUX
        dimension: extensive
        spatial_basis: area_density
        semantics: flux
        update_mode: derived
        references:
        - 'CF standard name table (surface_downwelling_shortwave_flux_in_air: direct plus diffuse solar radiation incident on the surface, global radiation, positive downward, W m-2)'
        - 'Valid range (the one declaration): lower 0 (downwelling irradiance is non-negative); upper 2200 W m-2, the greatest measured surface global horizontal shortwave irradiance 2177 W m-2 (60 s resolution, Chajnantor Plateau, 24 January 2017, cloud enhancement; Cordero et al. (2023) Bull. Amer. Meteor. Soc. 104(6):E1206-E1221, doi:10.1175/BAMS-D-22-0215.1) rounded up; the same value bounds net_radiation'
        bounds:
        - 0.0
        - 2200.0
        provenance:
          source: cf_standard
          schema_version: 1.0.0
          created_by: Yuchong Long
          last_modified: '2026-09-26T00:00:00Z'
          derived_bound: 'Upper 2200 W m-2 = the observed extreme 2177 W m-2 rounded up; net_radiation R_n = (1 - alpha) S_down + L_net <= S_down shares this upper bound'
          observational_support: 'Cordero et al. (2023) BAMS 104(6):E1206-E1221: 2177 W m-2 global horizontal irradiance at Chajnantor, 60 s pyranometer (SMP21) record, the highest of their table of surface records'
      longwave_down:
        standard_name: surface_downwelling_longwave_flux_in_air
        long_name: Surface Downwelling Longwave Radiation
        units: W m-2
        valid_min: 0.0
        valid_max: 700.0
        typical_min: 0.0
        typical_max: 600.0
        category: ATMOSPHERIC_FLUX
        dimension: extensive
        spatial_basis: area_density
        semantics: flux
        update_mode: derived
        references:
        - 'CF standard name table (surface_downwelling_longwave_flux_in_air: longwave radiation from above incident on the surface, positive downward, W m-2)'
        - 'Valid range (the one declaration): lower 0 (downwelling irradiance is non-negative); upper 700 W m-2, derived from the Stefan-Boltzmann law: L_down = eps_a sigma T_a^4 <= sigma T_max^4 for an atmospheric emissivity eps_a <= 1 and emitting air no warmer than the greatest measured air temperature T_max = 56.7 degC = 329.85 K (WMO World Weather and Climate Extremes Archive, Furnace Creek, California, 10 July 1913), i.e. 671 W m-2 with sigma = relic.physical.constants.universal.stefan_boltzmann_constant, rounded up'
        bounds:
        - 0.0
        - 700.0
        provenance:
          source: cf_standard
          schema_version: 1.0.0
          created_by: Yuchong Long
          last_modified: '2026-09-26T00:00:00Z'
          derived_bound: 'Upper 700 W m-2 = sigma T_max^4 = 5.670374419e-8 W m-2 K-4 x (329.85 K)^4 = 671 W m-2, rounded up (emissivity at most 1)'
          observational_support: 'T_max: WMO World Weather and Climate Extremes Archive highest air temperature 56.7 degC (Records of Weather and Climate Extremes table as of 30 January 2024)'
      latent_heat_flux:
        standard_name: surface_upward_latent_heat_flux
        long_name: Surface Upward Latent Heat Flux
        units: W m-2
        valid_min: -245.0
        valid_max: 1470.0
        typical_min: 0.0
        typical_max: 300.0
        category: SURFACE_FLUX
        dimension: extensive
        spatial_basis: area_density
        semantics: flux
        update_mode: derived
        references:
        - CF standard name table (surface_upward_latent_heat_flux; positive upward, dew and condensation negative)
        - 'Valid range: lambda times the evapotranspiration_flux range [-1.0e-4, 6.0e-4] kg m-2 s-1 with lambda = 2.45e6 J kg-1 (physical constant water.latent_heat_vaporization; FAO-56); the evapotranspiration_flux entry cites the bounds'
        bounds:
        - -245.0
        - 1470.0
        provenance:
          source: cf_standard
          schema_version: 1.0.0
          created_by: Yuchong Long
          last_modified: '2026-09-26T00:00:00Z'
      sensible_heat_flux:
        standard_name: surface_upward_sensible_heat_flux
        long_name: Surface Upward Sensible Heat Flux
        units: W m-2
        valid_min: -200.0
        valid_max: 1000.0
        typical_min: -50.0
        typical_max: 300.0
        category: SURFACE_FLUX
        dimension: extensive
        spatial_basis: area_density
        semantics: flux
        update_mode: derived
        references:
        - 'CF standard name table (surface_upward_sensible_heat_flux: positive upward, from the surface into the air; negative under stable stratification, W m-2)'
        - 'Valid range (the one declaration; coupling.scales.*.variables repeat it): [-200, 1000] W m-2, a convention (no primary-source extreme is adopted): the upper bound lies below the net radiation bound 2200 W m-2 that supplies the turbulent fluxes, and the lower bound admits downward fluxes of stable, warm-advective conditions'
        bounds:
