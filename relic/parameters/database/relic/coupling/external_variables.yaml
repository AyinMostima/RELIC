      precipitation_flux:
        standard_name: precipitation_flux
        long_name: Precipitation Mass Flux
        units: kg m-2 s-1
        valid_min: 0.0
        valid_max: 0.52
        typical_min: 0.0
        typical_max: 0.001
        category: ATMOSPHERIC_FLUX
        dimension: extensive
        spatial_basis: area_density
        semantics: flux
        update_mode: derived
        references:
        - 'CF standard name table (precipitation_flux: liquid plus solid precipitation reaching the surface, kg m-2 s-1; non-negative)'
        - 'Valid range (the one declaration; coupling.scales.*.variables repeat it): lower 0 (a precipitation flux is non-negative); upper 0.52 kg m-2 s-1 = 31.2 mm in 1 min, the greatest 1-min rainfall of the WMO World Weather and Climate Extremes Archive (Unionville, Maryland, USA, 4 July 1956; WMO Records of Weather and Climate Extremes table as of 30 January 2024). A mean over any interval of 1 min or longer cannot exceed it; the greatest 60-min rainfall, 305 mm (Holt, Missouri, USA, 22 June 1947), is 0.085 kg m-2 s-1'
        provenance:
          source: cf_standard
          schema_version: 1.0.0
          created_by: Yuchong Long
          last_modified: '2026-09-26T00:00:00Z'
        bounds:
        - 0.0
        - 0.52
      runoff_flux:
        standard_name: runoff_flux
        long_name: Runoff Flux
        units: kg m-2 s-1
