      evapotranspiration_flux:
        standard_name: water_evapotranspiration_flux
        long_name: Evapotranspiration Water Mass Flux
        units: kg m-2 s-1
        valid_min: -1.0e-4
        valid_max: 6.0e-4
        typical_min: 0.0
        typical_max: 0.0001
        category: SURFACE_FLUX
        dimension: extensive
        spatial_basis: area_density
        semantics: flux
        update_mode: derived
        references:
        - 'CF standard name table (water_evapotranspiration_flux: all water vapour fluxes into the atmosphere from the surface, liquid evaporation, sublimation and transpiration; kg m-2 s-1; condensation and dew are negative)'
        - 'Valid range (the one declaration; coupling.scales.*.variables repeat it): upper 6.0e-4 kg m-2 s-1 = 2.16 mm h-1 = 1470 W m-2 of latent heat (lambda = 2.45e6 J kg-1, physical constant water.latent_heat_vaporization), about 1.08 times the total solar irradiance 1361 W m-2 (Kopp and Lean (2011) Geophys. Res. Lett. 38, L01706) to admit advective enhancement over the radiative energy supply; lower -1.0e-4 kg m-2 s-1 = -0.36 mm h-1, about five times the radiative-cooling limit of dew deposition (theoretical limit about 0.7 L m-2 per day, Zamir, Drechsler and Howell (2019) arXiv:1909.10937; dew energy balance Monteith (1957) Q. J. R. Meteorol. Soc. 83(357), doi:10.1002/qj.49708335706)'
        - 'Observational support of the upper bound (not its basis): Tolk, J.A., Evett, S.R. and Howell, T.A. (2006) Advection influences on evapotranspiration of alfalfa in a semiarid climate. Agron. J. 98(6):1646-1654, doi:10.2134/agronj2006.0031: weighing-lysimeter alfalfa ET at Bushland, Texas averaged 11.3 mm d-1 on 13 advective days and exceeded 15 mm d-1 on 3 days'
        - Liang et al. (1994) J. Geophys. Res. 99(D7):14415-14428 (VIC total evapotranspiration OUT_EVAP)
        - Neitsch et al. (2011) SWAT Theoretical Documentation Version 2009, section 2:2 (actual evapotranspiration ET)
        bounds:
        - -1.0e-4
        - 6.0e-4
        provenance:
          source: cf_standard
          schema_version: 1.0.0
          created_by: Yuchong Long
          last_modified: '2026-09-26T00:00:00Z'
          derived_bound: 'Energy upper limit: 6.0e-4 kg m-2 s-1 = 1470 W m-2 / lambda (lambda = 2.45e6 J kg-1), about 1.08 times the total solar irradiance 1361 W m-2 of Kopp and Lean (2011); the dew lower limit -1.0e-4 kg m-2 s-1 is about five times the radiative-cooling limit of dew deposition (Zamir, Drechsler and Howell 2019)'
          observational_support: 'Tolk et al. (2006) Agron. J. 98(6):1646-1654: advective alfalfa ET averaged 11.3 mm d-1 on 13 days and exceeded 15 mm d-1 on 3 days, below the energy upper limit of 51.8 mm d-1 (2.16 mm h-1 sustained over 24 h)'
