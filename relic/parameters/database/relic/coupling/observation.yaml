  coupling.observation.hcho_steady_state_column.marais2012_standard.low_nox_slope:
    value: 1.34e-12
    default: 1.34e-12
    units: s cm2 molecule-1
    dtype: float64
    bounds:
      - 9.8e-13
      - 1.7e-12
    category: model_parameter
    description: "Slope m of S = m Omega_NO2 + c for Omega_NO2 <= 1e15 molecule cm-2; HCHO column-emission sensitivity S of Omega_HCHO = S E_ISOP + B, standard GEOS-Chem isoprene oxidation scheme (primary); printed 1340 +- 120 s per 1e15 molecule cm-2; bounds are the value +- 3 standard deviations"
    references:
      - "Marais, E. A., Jacob, D. J., Kurosu, T. P., Chance, K., Murphy, J. G., Reeves, C., Mills, G., Casadio, S., Millet, D. B., Barkley, M. P., Paulot, F. and Mao, J. (2012) Isoprene emissions in Africa inferred from OMI observations of formaldehyde columns, Atmos. Chem. Phys. 12, 6219-6235, doi:10.5194/acp-12-6219-2012; p. 6229, Sect. 4.2 and Fig. 9 inset (reduced-major-axis fit, jackknife standard deviations, 2 x 2.5 degree gridsquare-months over Africa in 2006 at 12:00-15:00 LT)"
      - "Marais, E. A., Jacob, D. J., Kurosu, T. P., Chance, K., Murphy, J. G., Reeves, C., Mills, G., Casadio, S., Millet, D. B., Barkley, M. P., Paulot, F. and Mao, J. (2012) Isoprene emissions in Africa inferred from OMI observations of formaldehyde columns, Atmos. Chem. Phys. 12, 6219-6235, doi:10.5194/acp-12-6219-2012; p. 6225, Eq. (2) and text: E_ISOP in atoms C cm-2 s-1, so S is a per-carbon sensitivity"
    tags:
      - observation
      - hcho_column
      - satellite
      - marais2012_standard
    dimension: time_per_areal_amount
    requires_grad: false
    provenance:
      source: literature
      schema_version: 2.0.0
      created_by: RELIC CR-A-03 HCHO operator (lane A1e)
      last_modified: '2026-10-18T00:00:00Z'
