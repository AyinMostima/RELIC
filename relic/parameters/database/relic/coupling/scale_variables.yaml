      sensible_heat_flux: &id021
        variable_type: extensive
        spatial_basis: area_density
        semantics: flux
        update_mode: derived
        units: W m-2
        description: Sensible heat energy flux
        references:
        - CF standard name surface_upward_sensible_heat_flux (signed, positive upward)
        - Valid range of coupling.external.variables.variable_definitions.sensible_heat_flux (cited there)
        bounds:
        - -200.0
        - 1000.0
        provenance:
          source: cf_standard
          schema_version: 1.0.0
          created_by: Yuchong Long
          last_modified: '2026-09-26T00:00:00Z'
