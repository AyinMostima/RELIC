        - CF standard name runoff_flux (non-negative)
        - Valid range of coupling.external.variables.variable_definitions.runoff_flux (cited there)
        bounds:
        - 0.0
        - 0.52
        provenance:
          source: cf_standard
          schema_version: 1.0.0
          created_by: Yuchong Long
          last_modified: '2026-09-26T00:00:00Z'
          notes: CF runoff flux metadata
      evapotranspiration_flux: &id018
        variable_type: extensive
        spatial_basis: area_density
        semantics: flux
        update_mode: derived
        units: kg m-2 s-1
        description: Total evapotranspiration mass flux
        references:
        - CF standard name water_evapotranspiration_flux (signed, condensation negative)
        - Valid range of coupling.external.variables.variable_definitions.evapotranspiration_flux (cited there)
        bounds:
        - -1.0e-4
        - 6.0e-4
        provenance:
          source: cf_standard
          schema_version: 1.0.0
          created_by: Yuchong Long
          last_modified: '2025-12-05T00:00:00Z'
          notes: CF evapotranspiration metadata
      transpiration_rate: &id019
        variable_type: extensive
        spatial_basis: area_density
        semantics: flux
        update_mode: derived
        units: kg m-2 s-1
        description: Plant transpiration rate
        references:
        - RELIC coupling audit 2025-12-01
        bounds:
        - 0.0
        - 0.001
        provenance:
          source: coupling_variable_bounds
          schema_version: 1.0.0
          created_by: Yuchong Long
          last_modified: '2025-12-05T00:00:00Z'
          notes: Bounds aligned with coupling.variable_bounds
      latent_heat_flux: &id020
        variable_type: extensive
        spatial_basis: area_density
        semantics: flux
        update_mode: derived
        units: W m-2
        description: Latent heat energy flux
        references:
        - CF standard name surface_upward_latent_heat_flux (signed, condensation negative)
        - Valid range of coupling.external.variables.variable_definitions.latent_heat_flux (cited there)
