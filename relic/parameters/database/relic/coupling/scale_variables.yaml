        bounds:
        - -0.02
        - 0.02
        provenance:
          source: cf_standard
          schema_version: 1.0.0
          created_by: Yuchong Long
          last_modified: '2025-12-05T00:00:00Z'
          notes: Generic nitrogen flux envelope
      ecosystem_respiration: &id040
        variable_type: extensive
        spatial_basis: area_density
        semantics: flux
        update_mode: derived
        units: kg C m-2 s-1
        description: Total ecosystem respiration flux
        references:
        - CF Conventions 1.8
        - Lloyd and Taylor 1994
        bounds:
        - 0.0
        - 0.05
        provenance:
          source: literature
          schema_version: 1.0.0
          created_by: Yuchong Long
          last_modified: '2025-12-05T00:00:00Z'
          notes: Respiration ranges from flux tower syntheses
      stomatal_conductance: &id041
        variable_type: intensive
        semantics: diagnostic
        update_mode: replace
        units: mol m-2 s-1
        description: Leaf-level stomatal conductance to water vapour, supplied as forcing or by the exclusive tutorial proxy or conditional Medlyn provider; readers ozone_stress and oxygen_18 use the same leaf-area unit
        references:
        - Ball, J.T., Woodrow, I.E. and Berry, J.A. (1987) stomatal conductance model (leaf conductance in mol m-2 s-1)
        - 'Medlyn et al. (2011), doi:10.1111/j.1365-2486.2010.02375.x; CTSM technical note Eq. 2.9.1: the implemented conditional law has no upper conductance cap. Its VPD floor and residual branches are declared in docs/source/theory/photosynthesis.md.'
        - 'Murray et al. (2019), Front. Plant Sci. 10:558: observed species maxima are not a universal bound. The former 2.0 empirical guard must not silently truncate a selected process law.'
        bounds:
        - 0.0
        - .inf
        provenance:
          source: literature
          schema_version: 1.0.0
          created_by: Yuchong Long
          last_modified: '2026-10-15T00:00:00Z'
          notes: Nonnegative conductance; former empirical upper guard removed to match the state contract. Values above 2 are numerically admissible, not observationally validated. The tutorial proxy retains its own declared maximum.
      canopy_conductance: &id042
        variable_type: intensive
        semantics: diagnostic
        update_mode: replace
        units: m s-1
        description: Bulk canopy conductance
        references:
        - Jarvis, P.G. (1976) Phil. Trans. R. Soc. Lond. B 273:593-610 (canopy conductance)
        - 'Valid range (the one declaration; the SCM contract clips only at the lower bound 0): [0, 0.05] m s-1, a convention: the maximum surface (canopy) conductance for evaporation averages 20 mm s-1 for natural vegetation and 33 mm s-1 for crops (Kelliher, Leuning, Raupach and Schulze (1995) Agric. For. Meteorol. 73(1-2):1-16); the upper bound is 1.5 times the crop mean'
        bounds:
        - 0.0
        - 0.05
        provenance:
          source: literature
          schema_version: 1.0.0
          created_by: Yuchong Long
          last_modified: '2026-09-26T00:00:00Z'
          notes: Canopy conductance observational envelope
      vapor_pressure_deficit: &id043
        variable_type: intensive
        semantics: state
        update_mode: replace
        units: Pa
        description: Vapor pressure deficit
        references:
        - CF Conventions 1.8
        bounds:
        - 0.0
        - 7000.0
        provenance:
          source: cf_standard
          schema_version: 1.0.0
          created_by: Yuchong Long
          last_modified: '2025-12-05T00:00:00Z'
          notes: Humidity deficit bounds for ecosystem models
      soil_carbon: &id044
        variable_type: extensive
        spatial_basis: area_density
        semantics: state
        update_mode: replace
        units: kg C m-2
        description: Soil carbon stock
        references:
        - CF Conventions 1.8
        - IPCC 2019 Refinement
        bounds:
        - 0.0
        - 50000.0
        provenance:
          source: literature
          schema_version: 1.0.0
          created_by: Yuchong Long
