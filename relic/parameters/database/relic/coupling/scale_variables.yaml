          notes: 'RELIC-specific leaf (tissue) temperature; no CF standard name (CF canopy_temperature
            is the bulk canopy temperature, not declared equal here)'
      leaf_area_index: &id029
        variable_type: intensive
        semantics: state
        update_mode: replace
        units: m2 m-2
        description: One-sided leaf area per ground area
        references:
        - CF Conventions 1.8
        - Myneni et al. 2002
        bounds:
        - 0.0
        - 15.0
        provenance:
          source: cf_standard
          schema_version: 1.0.0
          created_by: Yuchong Long
          last_modified: '2025-12-05T00:00:00Z'
          notes: CF LAI metadata with observational bounds
      gross_primary_productivity: &id030
        variable_type: extensive
        spatial_basis: area_density
        semantics: flux
        update_mode: derived
        units: kg C m-2 s-1
        description: Gross primary productivity of carbon
        references:
        - CF Conventions 1.8
        - Farquhar et al. 1980
        bounds:
        - 0.0
        - 0.05
        provenance:
          source: literature
          schema_version: 1.0.0
          created_by: Yuchong Long
          last_modified: '2025-12-05T00:00:00Z'
          notes: Based on ecosystem GPP ranges in flux tower studies
      net_primary_productivity: &id031
        variable_type: extensive
        spatial_basis: area_density
        semantics: flux
        update_mode: derived
        units: kg C m-2 s-1
        description: Net primary productivity of carbon
        references:
        - 'CF standard name net_primary_productivity_of_biomass_expressed_as_carbon: the excess of gross primary production over autotrophic respiration, signed (negative when respiration exceeds uptake, for example at night)'
        - 'Valid range (the one declaration; the SCM contract declares no clipping bounds): [-1.0e-6, 1.0e-6] kg C m-2 s-1, a convention: NPP <= GPP, and the peak hourly GPP of irrigated maize, 3.2 mg CO2 m-2 s-1 = 8.7e-7 kg C m-2 s-1 (Suyker, Verma, Burba and Arkebauer (2005) Agric. For. Meteorol. 131(3-4):180-190), lies below the upper bound; the lower bound mirrors it for the nocturnal NPP = -R_a'
        bounds:
        - -1.0e-6
        - 1.0e-6
        provenance:
          source: literature
          schema_version: 1.0.0
          created_by: Yuchong Long
          last_modified: '2026-09-26T00:00:00Z'
          notes: Signed NPP = GPP - R_a (relic.scientific.biosphere.respiration.autotrophic_respiration)
      net_assimilation_rate: &id033
        variable_type: extensive
        spatial_basis: area_density
        semantics: flux
        update_mode: derived
        units: kg C m-2 s-1
        description: Leaf-to-canopy net CO2 assimilation mass flux used in coupling
        references:
        - Ball et al. 1987
        - Medlyn et al. 2011
        bounds:
        - 0.0
        - 0.05
        provenance:
          source: literature
          schema_version: 1.0.0
          created_by: Yuchong Long
          last_modified: '2025-12-09T00:00:00Z'
          notes: Mass-based assimilation for coupling; requires explicit unit conversion to umol when needed
      gross_photosynthesis: &id034
        variable_type: extensive
        spatial_basis: area_density
        semantics: flux
        update_mode: derived
        units: umol CO2 m-2 s-1
        description: Canopy-integrated gross photosynthesis per ground area before respiration
        references:
        - Farquhar et al. 1980
        - Ball et al. 1987
        bounds:
        - 0.0
        - 500.0
        provenance:
          source: literature
          schema_version: 1.0.0
          created_by: Yuchong Long
          last_modified: '2025-12-09T00:00:00Z'
          notes: Photosynthetic flux in molar units for stomatal coupling
      net_photosynthesis: &id035
        variable_type: extensive
        spatial_basis: area_density
        semantics: flux
        update_mode: derived
        units: umol CO2 m-2 s-1
        description: Canopy-integrated net photosynthesis per ground area
        references:
        - Farquhar et al. 1980
        - Leuning 1995
        bounds:
        - -50.0
        - 500.0
        provenance:
          source: literature
          schema_version: 1.0.0
          created_by: Yuchong Long
          last_modified: '2025-12-09T00:00:00Z'
          notes: Molar assimilation used directly by stomatal conductance models
      gpp: &id037
        variable_type: extensive
        spatial_basis: area_density
        semantics: flux
        update_mode: derived
        units: umol m-2 s-1
        description: Leaf-level gross primary productivity alias (molar units)
        references:
        - Farquhar et al. 1980
        - Ball et al. 1987
        bounds:
        - 0.0
        - 800.0
        provenance:
          source: literature
