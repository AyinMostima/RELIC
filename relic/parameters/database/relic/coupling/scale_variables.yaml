schema_version: 2.0.0
tier: relic
namespace: coupling.scales
description: Default variable metadata for scale coupling (used when scale-specific mappings are not provided).
metadata:
  version: 1.0.0
  created: '2025-11-30T00:00:00Z'
  created_by: Yuchong Long
  last_modified: '2025-11-30T00:00:00Z'
  notes: 'Provides default variable metadata (units and variable_type) for all scales.

    Scale-specific overrides can be added under coupling.scales.<scale>.variables.

    '
parameters:
  coupling.scales.defaults.variables:
    value:
      air_temperature: &id001
        variable_type: intensive
        semantics: state
        update_mode: replace
        units: K
        description: Near-surface air temperature
        references:
        - CF Conventions 1.8
        bounds:
        - 180.0
        - 330.0
        provenance:
          source: cf_standard
          schema_version: 1.0.0
          created_by: Yuchong Long
          last_modified: '2025-12-05T00:00:00Z'
          notes: CF-compliant temperature metadata for scale coupling
      relative_humidity: &id002
        variable_type: intensive
        semantics: state
        update_mode: replace
        units: '1'
        description: Relative humidity
        references:
        - CF Conventions 1.8
        bounds:
        - 0.0
        - 1.0
        provenance:
          source: cf_standard
          schema_version: 1.0.0
          created_by: Yuchong Long
          last_modified: '2025-12-05T00:00:00Z'
          notes: CF humidity metadata for scale coupling
      co2_concentration: &id003
        variable_type: intensive
        semantics: state
        update_mode: replace
        units: ppm
        description: Atmospheric CO2 concentration
        references:
        - Global Carbon Project 2024
        bounds:
        - 180.0
        - 800.0
        provenance:
          source: literature
          schema_version: 1.0.0
          created_by: Yuchong Long
          last_modified: '2025-12-05T00:00:00Z'
          notes: CO2 mixing ratio bounds for coupling defaults
      aerodynamic_resistance: &id004
        variable_type: intensive
        semantics: state
        update_mode: replace
        units: s m-1
        description: Aerodynamic resistance
        references:
        - RELIC coupling audit 2025-12-02
        bounds:
        - 10.0
        - 200.0
        provenance:
          source: relic_internal
          schema_version: 1.0.0
          created_by: Yuchong Long
          last_modified: '2025-12-05T00:00:00Z'
          notes: Coupling default for canopy-atmosphere exchange
      precipitation_flux: &id005
        variable_type: extensive
        spatial_basis: area_density
        semantics: flux
        update_mode: derived
        units: kg m-2 s-1
        description: Precipitation mass flux
        references:
        - CF standard name precipitation_flux (non-negative)
        - Valid range of coupling.external.variables.variable_definitions.precipitation_flux (cited there)
        bounds:
        - 0.0
        - 0.52
        provenance:
          source: cf_standard
          schema_version: 1.0.0
          created_by: Yuchong Long
          last_modified: '2026-09-26T00:00:00Z'
          notes: CF precipitation flux guidance
      soil_moisture: &id006
        variable_type: intensive
        semantics: state
        update_mode: replace
        units: m3 m-3
        description: Volumetric soil water content
        references:
        - 'Valid range (the one declaration; the SCM contract declares no clipping bounds): [0, 1] m3 m-3, the range of a volume fraction by definition (the physical upper limit is the porosity of the layer, below 1)'
        bounds:
        - 0.0
        - 1.0
        provenance:
          source: cf_standard
          schema_version: 1.0.0
          created_by: Yuchong Long
          last_modified: '2026-09-26T00:00:00Z'
          notes: Volumetric soil moisture metadata for coupling
      soil_temperature: &id007
        variable_type: intensive
        semantics: state
        update_mode: replace
        units: K
        description: Soil temperature
        references:
        - CF Conventions 1.8
        bounds:
        - 180.0
        - 340.0
        provenance:
          source: cf_standard
          schema_version: 1.0.0
          created_by: Yuchong Long
          last_modified: '2025-12-05T00:00:00Z'
          notes: CF soil temperature metadata
      soil_moisture_profile: &id008
        variable_type: intensive
        semantics: state
        update_mode: replace
        units: m3 m-3
        description: Soil moisture profile by layer
        references:
        - RELIC coupling audit 2025-12-01
        bounds:
        - 0.0
        - 1.0
        provenance:
          source: relic_internal
          schema_version: 1.0.0
          created_by: Yuchong Long
          last_modified: '2025-12-05T00:00:00Z'
          notes: Layered soil moisture for root uptake coupling
      soil_matric_potential: &id009
        variable_type: intensive
        semantics: state
        update_mode: replace
        units: Pa
        description: Soil matric potential
        references:
        - RELIC coupling audit 2025-12-01
        bounds: null
        provenance:
          source: relic_internal
          schema_version: 1.0.0
          created_by: Yuchong Long
          last_modified: '2025-12-05T00:00:00Z'
          notes: Matric potential driver for soil-vegetation coupling
      soil_depth_layers: &id010
        variable_type: intensive
        semantics: parameter
        update_mode: immutable
        units: m
        description: Soil layer-bottom depths z_1 < ... < z_n below the surface (top at 0), one per soil layer; the layer thickness is Delta z_i = z_i - z_(i-1) with z_0 = 0, as read by SoilVegetationCoupling and the soil_vegetation water check
        references:
        - RELIC coupling audit 2025-12-01
        bounds: null
        provenance:
          source: relic_internal
          schema_version: 1.0.0
          created_by: Yuchong Long
          last_modified: '2025-12-05T00:00:00Z'
          notes: Layer geometry for root uptake calculations; n positive, strictly increasing bottom depths (not thicknesses, not n + 1 boundaries)
      root_density_profile: &id011
        variable_type: intensive
        semantics: parameter
        update_mode: immutable
        units: kg m-3
        description: Root density profile by layer
        references:
        - RELIC coupling audit 2025-12-01
        bounds: null
        provenance:
          source: relic_internal
          schema_version: 1.0.0
          created_by: Yuchong Long
          last_modified: '2025-12-05T00:00:00Z'
          notes: Optional root distribution driver
      root_uptake_profile: &id012
        variable_type: extensive
        spatial_basis: area_density
        semantics: flux
        update_mode: derived
        units: kg m-3 s-1
        description: Root water uptake rate by layer
        references:
        - RELIC coupling audit 2025-12-01
        bounds:
        - 0.0
        - 0.01
        provenance:
          source: coupling_variable_bounds
          schema_version: 1.0.0
          created_by: Yuchong Long
          last_modified: '2025-12-05T00:00:00Z'
          notes: Bounds aligned with coupling.variable_bounds
      effective_transpiration: &id013
