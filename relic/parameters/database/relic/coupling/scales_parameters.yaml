schema_version: 2.0.0
tier: relic
namespace: coupling.scales
description: Unified parameters for multi-scale coupling operations in RELIC framework
metadata:
  version: 1.1.0
  created: '2025-10-10T00:00:00Z'
  created_by: Yuchong Long
  last_modified: '2025-10-10T00:00:00Z'
  source: RELIC scale coupling framework
parameters:
  coupling.scales.temporal.preserve_peaks:
    value: false
    default: false
    units: dimensionless
    dtype: bool
    allowed_values:
    - false
    - true
    bounds: null
    category: temporal_flag
    description: Whether to preserve peak values in temporal aggregation
    references:
    - 'CF Conventions 1.8: Cell methods for temporal aggregation'
    tags:
    - temporal
    - aggregation
    - peaks
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: RELIC framework
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2025-10-10T00:00:00Z'
  coupling.scales.temporal.coverage_threshold:
    value: 0.8
    default: 0.8
    units: dimensionless
    dtype: float32
    bounds:
    - 0.5
    - 1.0
    category: quality_control
    description: Minimum valid temporal coverage fraction for a period or series to be accepted. TemporalAggregator returns NaN for targets whose valid coverage is below it; QualityController (QualityConfig.coverage_threshold) flags series whose coverage is below it.
    references:
    - WMO Guide to Climatological Practices (2018). Coverage recommendations for climatological means.
    tags:
    - temporal
    - aggregation
    - quality_control
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: RELIC framework
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2025-11-15T00:00:00Z'
  coupling.scales.temporal.disaggregation.allow_negative:
    value: false
    default: false
    units: dimensionless
    dtype: bool
    bounds:
    - false
    - true
    category: physical_constraint
    description: Whether disaggregation is allowed to produce negative values
    references:
    - Hydrological downscaling guidelines
    tags:
    - temporal
    - disaggregation
    - constraint
    dimension: dimensionless
    requires_grad: false
    provenance:
