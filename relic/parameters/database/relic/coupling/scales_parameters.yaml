  coupling.scales.spatial.extrapolation_tolerance:
    value: 1.0e-06
    default: 1.0e-06
    units: dimensionless
    dtype: float32
    bounds:
    - 0.0
    - 1.0
    category: numerical_threshold
    description: Fraction of grid spacing tolerated when treating target points as interior
    references:
    - ESMF regridding tolerance guidance
    tags:
    - spatial
    - numerical_stability
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: relic.coupling.scales
      schema_version: 2.0.0
      created_by: relic
      last_modified: '2025-12-05T00:00:00Z'
  coupling.scales.spatial.boundary_handling_mode:
    value: constant
    default: constant
    units: dimensionless
    dtype: string
    allowed_values:
    - constant
    - nearest
    category: configuration
    description: Default boundary handling of the bilinear and nearest-neighbour regridders.
      constant covers a target only inside the source support (bilinear) or within the search
      radius (nearest); nearest extends the edge values (bilinear) or gives every target its
      nearest source node (nearest). Uncovered targets are missing (NaN) and counted in the
      regridder coverage report; no fill value exists.
    references:
    - ESMF Regridding documentation
    tags:
    - spatial
    - configuration
    - boundary_condition
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: relic.coupling.scales
      schema_version: 2.0.0
      created_by: relic
      last_modified: '2025-12-05T00:00:00Z'
    bounds:
    - -10000000000.0
    - 10000000000.0
  coupling.scales.spatial.regular_search_radius_cell_diagonals:
    value: 2.0
    default: 2.0
    units: dimensionless
    dtype: float32
    bounds:
    - 0.0
    - 1000000.0
    category: spatial_configuration
    description: Search radius of NearestNeighborRegridder with boundary_mode constant on a
      regular source grid, in source cell diagonals (r = q sqrt(dx^2 + dy^2) with the largest node
      spacings dx, dy); a target farther than r from every source node is uncovered (NaN, counted in
      the coverage report). Irregular grids use coupling.scales.spatial.irregular.max_search_radius.
    references:
    - ESMF Reference Manual, unmapped destination points of a neighbour search
    - Shepard, D. (1968). A two-dimensional interpolation function for irregularly-spaced data
    tags:
    - spatial
    - regular
    - boundary_condition
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: relic.coupling.scales
      schema_version: 2.0.0
      created_by: relic
      last_modified: '2026-09-26T00:00:00Z'
  coupling.scales.spatial.enforce_conservation:
    value: true
    default: true
    units: dimensionless
    dtype: bool
    bounds:
    - false
    - true
    category: conservation_flag
    description: Default toggle for spatial regridders to enforce conservation checks
    references:
