  coupling.scales.spatial.irregular.max_search_radius:
    value: 1.0
    default: 1.0
    units: dimensionless
    dtype: float32
    bounds:
    - 0.0
    - 1000000.0
    category: spatial_configuration
    description: Neighbour search radius on irregular grids as a multiple of the typical source
      spacing (the median distance from a source node to its nearest other node); used by
      BilinearRegridder and NearestNeighborRegridder, so the result does not depend on the coordinate
      unit
