  coupling.scales.spatial.aggregation_strategy:
    value: area_weighted
    default: area_weighted
    units: dimensionless
    dtype: string
    allowed_values:
    - area_weighted
    - mean
    - area_weighted_mean
    - sum
    - total
    - area_weighted_sum
    - conservative
    bounds: null
    category: aggregation_parameter
    description: 'SpatialAggregation whole-support law selector: area_weighted applies the law of each declared spatial_basis (intensive and area_density area-weighted mean, cell_total sum, categorical area-weighted mode); mean and area_weighted_mean name the intensive and area-density law, sum, total and area_weighted_sum the cell-total law, conservative the law of every basis except categorical; a selector that conflicts with a variable basis raises'
    references:
    - 'RHESSys theory: Hierarchical spatial aggregation'
    tags:
    - spatial
    - aggregation
    - strategy
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: RELIC framework
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-24T00:00:00Z'
  coupling.scales.spatial.weighting_type:
    value: area
    default: area
    units: dimensionless
    dtype: string
    allowed_values:
    - area
    bounds: null
    category: weighting_parameter
    description: 'Measure of the SpatialAggregation weights: area (cell areas or another area measure; CF cell_methods area: mean, area: sum, area: mode). The declared spatial_basis selects the law; an area density conserves its amount only with area weights, and intensive and categorical fields given no weights take equal weights. No mass-, volume- or separate uniform-weighted law exists (the hierarchical mass_weighted and volume_weighted strategies are area-weighted means).'
    references:
    - 'RHESSys theory: Hierarchical spatial aggregation'
    tags:
    - spatial
    - weighting
    - aggregation
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: RELIC framework
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-24T00:00:00Z'
  coupling.scales.spatial.preserve_totals:
    value: true
    default: true
    units: dimensionless
    dtype: bool
    allowed_values:
    - false
    - true
    bounds: null
    category: conservation_flag
    description: Whether SpatialAggregation raises when the ledger residual of an amount variable exceeds coupling.scales.defaults.conservation_tolerance (otherwise the residual is reported); the result is never rescaled
    references:
    - Jones, P.W. (1999). Conservative remapping schemes for climate models
    tags:
    - spatial
    - conservation
    - flag
    dimension: dimensionless
    requires_grad: false
    provenance:
