    units: dimensionless
    dtype: bool
    bounds:
    - false
    - true
    category: physical_constraint
    description: Apply physical constraints (non-negativity, bounds) during disaggregation
    references:
    - Hydrological downscaling numerical stability
    tags:
    - temporal
    - disaggregation
    - constraint
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: RELIC framework
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2025-12-02T00:00:00Z'
  coupling.scales.temporal.disaggregation.time_dim:
    value: 0
    default: 0
    units: dimensionless
    dtype: int32
    bounds:
    - 0
    - 3
    category: configuration
    description: Time dimension index used during temporal disaggregation
    references:
    - PyTorch tensor dimension conventions
    tags:
    - temporal
    - disaggregation
    - configuration
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: RELIC framework
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2025-12-02T00:00:00Z'
  coupling.scales.temporal.quality_control.max_gap_length:
    value: 7
    default: 7
    units: dimensionless
    dtype: int32
    bounds:
    - 0
    - 1000
    category: quality_control
    description: Maximum number of consecutive missing time samples that GapFiller fills; longer gaps are left missing and logged. Counted in samples of the supplied series, not in days. The upper bound is a sanity guard, not a physical limit.
    references:
    - WMO Guide to Climatological Practices, WMO-No. 100 (2018), Chapter 3 (estimation of missing data)
    - WMO Guidelines on the Calculation of Climate Normals, WMO-No. 1203 (2017), rules limiting consecutive missing values
    tags:
    - temporal
    - quality_control
    - gap_filling
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: Former Python default QualityConfig.max_gap_length in relic/coupling/scales/temporal/quality_control.py; not derived from a WMO rule
      schema_version: 2.0.0
      created_by: MA-21 temporal repair
      last_modified: '2026-09-23T00:00:00Z'
  coupling.scales.temporal.quality_control.gap_filling_method:
    value: linear
    default: linear
    units: dimensionless
    dtype: string
    allowed_values:
    - linear
    - nearest
    - climatological
    - none
    bounds: null
    category: quality_control
    description: Gap filling method used by GapFiller (QualityController). Only implemented methods are allowed; seasonal and spline are rejected by QualityConfig.
    references:
    - WMO Guide to Climatological Practices, WMO-No. 100 (2018), Chapter 3 (estimation of missing data)
    tags:
    - temporal
    - quality_control
    - gap_filling
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: Former Python default QualityConfig.gap_filling_method in relic/coupling/scales/temporal/quality_control.py
      schema_version: 2.0.0
      created_by: MA-21 temporal repair
      last_modified: '2026-09-23T00:00:00Z'
  coupling.scales.temporal.quality_control.outlier_method:
    value: zscore
    default: zscore
    units: dimensionless
    dtype: string
    allowed_values:
    - zscore
    - modified_zscore
    - iqr
    - none
    bounds: null
    category: quality_control
    description: Outlier detection method used by OutlierDetector (QualityController). Only implemented methods are allowed; isolation_forest is rejected by QualityConfig.
    references:
    - Iglewicz, B. and Hoaglin, D. C. (1993). How to Detect and Handle Outliers. ASQC Quality Press.
    - Tukey, J. W. (1977). Exploratory Data Analysis. Addison-Wesley (IQR fences).
    tags:
    - temporal
    - quality_control
    - outlier
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: Former Python default QualityConfig.outlier_method in relic/coupling/scales/temporal/quality_control.py
      schema_version: 2.0.0
      created_by: MA-21 temporal repair
      last_modified: '2026-09-23T00:00:00Z'
  coupling.scales.temporal.quality_control.outlier_threshold:
    value: 3.0
    default: 3.0
    units: dimensionless
    dtype: float32
    bounds:
    - 1.0
    - 10.0
    category: quality_control
    description: Absolute score above which OutlierDetector flags a value, applied to the z-score |x - mean| / std or to the modified z-score 0.6745 |x - median| / MAD. Not used by the IQR method. Iglewicz and Hoaglin (1993) recommend 3.5 for the modified z-score; 3.0 is the retained RELIC setting.
    references:
    - Iglewicz, B. and Hoaglin, D. C. (1993). How to Detect and Handle Outliers. ASQC Quality Press.
    tags:
    - temporal
    - quality_control
    - outlier
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: Former Python default QualityConfig.outlier_threshold in relic/coupling/scales/temporal/quality_control.py
      schema_version: 2.0.0
      created_by: MA-21 temporal repair
      last_modified: '2026-09-23T00:00:00Z'
  coupling.scales.temporal.quality_control.outlier_min_valid_samples:
    value: 10
    default: 10
    units: dimensionless
    dtype: int32
    bounds:
    - 2
    - 100000
    category: quality_control
    description: Minimum number of finite samples a series needs before OutlierDetector evaluates it; shorter series report no outliers. With the z-score method the largest attainable score is (n - 1) / sqrt(n) (Shiffler 1988), so n must exceed 10 for a score above 3.0.
    references:
    - Shiffler, R. E. (1988). Maximum Z scores and outliers. The American Statistician, 42(1), 79-80.
    - Iglewicz, B. and Hoaglin, D. C. (1993). How to Detect and Handle Outliers. ASQC Quality Press.
    tags:
    - temporal
    - quality_control
    - outlier
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: Former Python literal (10) in OutlierDetector.detect_outliers, relic/coupling/scales/temporal/quality_control.py; RELIC convention
      schema_version: 2.0.0
      created_by: MA-21 temporal repair
      last_modified: '2026-09-23T00:00:00Z'
  coupling.scales.temporal.quality_control.iqr_fence_factor:
    value: 1.5
    default: 1.5
    units: dimensionless
    dtype: float32
    bounds:
    - 0.5
    - 10.0
    category: quality_control
    description: Multiplier k of the interquartile range for the IQR outlier fences Q1 - k IQR and Q3 + k IQR used by OutlierDetector.
    references:
    - Tukey, J. W. (1977). Exploratory Data Analysis. Addison-Wesley (inner fences with k = 1.5).
    tags:
    - temporal
    - quality_control
    - outlier
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: Former Python literal (1.5) in OutlierDetector._iqr_outliers, relic/coupling/scales/temporal/quality_control.py
      schema_version: 2.0.0
      created_by: MA-21 temporal repair
      last_modified: '2026-09-23T00:00:00Z'
  coupling.scales.temporal.quality_control.grade_excellent_min_fraction:
    value: 0.95
    default: 0.95
    units: dimensionless
    dtype: float32
    bounds:
    - 0.0
    - 1.0
    category: quality_control
    description: Lower bound of the valid (or unflagged) sample fraction for QualityLevel.EXCELLENT. Grade cutoffs must satisfy 0 < poor < acceptable < good < excellent <= 1.
    references:
    - RELIC temporal quality-control grading convention (docs/source/theory/time_scaling.md, Section 5.2); no external standard prescribes these cutoffs.
    tags:
    - temporal
    - quality_control
    - grade
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: Former Python literal (0.95) in CoverageEvaluator._determine_quality_level and QualityController.assess_quality
      schema_version: 2.0.0
      created_by: MA-21 temporal repair
      last_modified: '2026-09-23T00:00:00Z'
  coupling.scales.temporal.quality_control.grade_excellent_max_gap_length:
    value: 1
    default: 1
    units: dimensionless
    dtype: int32
    bounds:
    - 0
    - 1000
    category: quality_control
    description: Longest run of consecutive missing samples still allowed for QualityLevel.EXCELLENT in coverage evaluation; must not exceed max_gap_length (the GOOD limit).
    references:
    - RELIC temporal quality-control grading convention (docs/source/theory/time_scaling.md, Section 5.2); no external standard prescribes these cutoffs.
