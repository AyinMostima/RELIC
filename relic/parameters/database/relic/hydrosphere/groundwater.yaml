notes: 'Groundwater storage dynamics following RHESSys methodology with exponential

  porosity decay profile n(z) = n0 * exp(-z/p). Water table depth is tracked

  explicitly using the analytic inverse of the exponential integral

  for storage change, without a second iterative formula. Compatible with TOPMODEL framework for distributed

  hydrological modeling and variable source area hydrology.

  '
