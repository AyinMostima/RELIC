  hydrosphere.numerical.temperature_bounds:
    value:
    - 273.15
    - 323.15
    default: null
    units: K
    dtype: list
    bounds:
    - - 183.15
      - 273.15
    - - 323.15
      - 373.15
    category: physical_bounds
    description: 'Admitted near-surface air temperature for hydrosphere calculations [min, max]. The default
      keeps 273.15 K as minimum because the default sub-freezing phase of the evapotranspiration laws is liquid.
      A run with sub_freezing_phase ice may set the minimum down to 183.15 K (range widened on 2026-11-05 from
      223.15 K for global daily runs, terrestrial record low -89.2 degC): the Tetens form over ice deviates
      from Goff-Gratch by -1.6 percent at 233.15 K, -4.7 percent at 213.15 K and -7.2 percent at 203.15 K,
      where the saturation vapour pressure is below 0.3 Pa.'
    references:
    - WMO Guide to Meteorological Instruments
    - WMO Archive of Weather and Climate Extremes
    - Murray (1967), J. Appl. Meteor. 6, 203-204; Goff and Gratch (1946)
    tags:
    - temperature
    - physical_bounds
    - environmental_limits
    dimension: temperature
    requires_grad: false
    provenance:
      source: meteorological_standards
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2024-08-25T00:00:00Z'
