  hydrosphere.physical.soil_heat_flux_ratio_daytime:
    value: 0.1
    default: 0.1
    units: dimensionless
    dtype: float32
    bounds:
    - 0.04
    - 0.15
    category: model_parameter
    description: Ratio G/Rn of the hourly (or shorter) soil heat flux during daylight, Rn > 0 (FAO-56 Eq. 45; the ASCE-EWRI tall reference uses 0.04)
    references:
    - Allen, R.G. et al. (1998). Crop evapotranspiration. FAO Irrigation and Drainage Paper 56, Eqs. 45-46
    - ASCE-EWRI (2005). The ASCE Standardized Reference Evapotranspiration Equation, Table 1
    tags:
    - soil_energy
    - empirical_parameter
    - calibratable
    dimension: dimensionless
    requires_grad: true
    provenance:
      source: fao_56_standard
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-24T00:00:00Z'
  hydrosphere.physical.soil_heat_flux_hourly_max_step:
    value: 3600.0
    default: 3600.0
    units: s
    dtype: float32
    bounds:
    - 3600.0
    - 3600.0
    category: numerical_constraint
    description: Longest step for which the FAO-56 hourly soil heat flux fractions G = 0.1 Rn (daylight)
      and G = 0.5 Rn (night) are defined; a longer step lies outside the hourly formulation
    references:
    - Allen, R.G. et al. (1998). Crop evapotranspiration. FAO Irrigation and Drainage Paper 56, Eqs. 45-46
      (hourly or shorter periods) and Eq. 42 (day-long periods)
    tags:
    - soil_energy
    - validity_domain
    dimension: time
    requires_grad: false
    provenance:
      source: fao_56_standard
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-24T00:00:00Z'
  hydrosphere.physical.soil_heat_flux_ratio_nighttime:
    value: 0.5
    default: 0.5
    units: dimensionless
    dtype: float32
    bounds:
    - 0.2
    - 0.6
    category: model_parameter
    description: Ratio G/Rn of the hourly (or shorter) soil heat flux during nighttime, Rn <= 0 (FAO-56 Eq. 46; the ASCE-EWRI tall reference uses 0.2)
    references:
    - Allen, R.G. et al. (1998). Crop evapotranspiration. FAO Irrigation and Drainage Paper 56, Eqs. 45-46
    - ASCE-EWRI (2005). The ASCE Standardized Reference Evapotranspiration Equation, Table 1
    tags:
    - soil_energy
    - empirical_parameter
    - calibratable
    dimension: dimensionless
    requires_grad: true
    provenance:
      source: fao_56_standard
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-24T00:00:00Z'
  hydrosphere.physical.heat_to_momentum_roughness_ratio:
    value: 0.1
    default: 0.1
    units: dimensionless
    dtype: float32
    bounds:
    - 0.05
    - 0.2
    category: model_parameter
    description: Ratio of roughness length for heat to momentum (z0h/z0m)
    references:
    - Brutsaert (1982) Evaporation into the Atmosphere
    - Garratt (1992) The Atmospheric Boundary Layer
    tags:
    - aerodynamic
    - roughness
    - heat_transfer
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: boundary_layer_theory
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2025-10-09T00:00:00Z'
  hydrosphere.physical.reference_surface_resistance:
    value: 70.0
    default: 70.0
    units: s m-1
    dtype: float32
    bounds:
    - 50.0
    - 100.0
    category: model_parameter
    description: Surface resistance for reference grass (FAO-56 reference ET)
    references:
    - Allen et al. (1998) FAO-56
    - Monteith (1981) Quart. J. Roy. Meteorol. Soc. 107:1-27
    tags:
    - reference_condition
    - grass_parameter
    - evapotranspiration
    dimension: resistance
    requires_grad: false
    provenance:
      source: fao_56_standard
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2025-10-09T00:00:00Z'
  hydrosphere.physical.field_capacity_fraction:
    value: 0.7
    default: 0.7
    units: dimensionless
    dtype: float32
    bounds:
    - 0.5
    - 0.9
    category: model_parameter
    description: Field capacity as fraction of saturated water content (typical for loam)
    references:
    - Brady & Weil (2008) The Nature and Properties of Soils, 14th ed
    - Saxton & Rawls (2006) Soil Sci. Soc. Am. J. 70:1569-1578
    tags:
