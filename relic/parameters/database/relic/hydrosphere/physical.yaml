    - soil_specific
    dimension: dimensionless
    requires_grad: true
    provenance:
      source: soil_physics_literature
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2025-10-09T00:00:00Z'
  hydrosphere.physical.wilting_point_fraction:
    value: 1.5
    default: 1.5
    units: dimensionless
    dtype: float32
    bounds:
    - 1.2
    - 2.0
    category: model_parameter
    description: Wilting point as multiplier of residual water content (typical for loam)
    references:
    - Brady & Weil (2008) The Nature and Properties of Soils, 14th ed
    - Saxton & Rawls (2006) Soil Sci. Soc. Am. J. 70:1569-1578
    tags:
    - soil_property
    - water_retention
    - soil_specific
    dimension: dimensionless
    requires_grad: true
    provenance:
      source: soil_physics_literature
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2025-10-09T00:00:00Z'
  hydrosphere.physical.atmospheric_pressure_min:
    value: 44000.0
    default: 44000.0
    units: Pa
    dtype: float32
    bounds:
    - 30000.0
    - 110000.0
    category: model_parameter
    description: 'Minimum plausible surface atmospheric pressure used to guard hydrosphere flux calculations:
      US Standard Atmosphere 1976 pressure at 6,500 m, above the highest vascular plants (about 6,150 m,
      Himalaya). Lowered from 70,000 Pa on 2026-11-05 for vegetated plateaus (Tibet, Andes); the psychrometric
      constant gamma = c_p p / (epsilon L) holds at any pressure.'
    references:
    - US Standard Atmosphere 1976
    tags:
    - pressure
    - boundary_layer
    - hydrosphere
    dimension: pressure
    requires_grad: false
    provenance:
      source: atmospheric_climatology
      schema_version: 2.0.0
      created_by: RELIC Parameter System
      last_modified: '2025-03-01T00:00:00Z'
  hydrosphere.physical.atmospheric_pressure_max:
    value: 110000.0
    default: 110000.0
    units: Pa
    dtype: float32
    bounds:
    - 80000.0
    - 120000.0
    category: model_parameter
    description: 'Maximum plausible surface atmospheric pressure used to guard hydrosphere flux calculations:
      above the Dead Sea shore (-430 m, about 106.5 kPa) under a strong anticyclone. Raised from 106,000 Pa on
      2026-11-05.'
    references:
    - US Standard Atmosphere 1976
    tags:
    - pressure
    - boundary_layer
    - hydrosphere
    dimension: pressure
    requires_grad: false
    provenance:
      source: atmospheric_climatology
      schema_version: 2.0.0
      created_by: RELIC Parameter System
      last_modified: '2025-03-01T00:00:00Z'

