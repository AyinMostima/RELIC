parameters:
  hydrosphere.physical.viscosity_temperature_factor:
    value: 0.02
    default: 0.02
    units: K-1
    dtype: float32
    bounds:
    - 0.01
    - 0.03
    category: model_parameter
    description: Linearized sensitivity of liquid water viscosity to temperature for unsaturated flow corrections
    references:
    - Korson, L. et al. (1969) Journal of Physical Chemistry 73:34-39
    - Decharme, B. et al. (2011) Journal of Hydrometeorology 12:153-172
    tags:
    - viscosity
    - temperature_response
    - hydrological_modeling
    dimension: inverse_temperature
    requires_grad: false
    provenance:
      source: water_viscosity_literature
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2025-11-18T00:00:00Z'
  hydrosphere.physical.vpd_alpha_baseline:
    value: 1.0
    default: 1.0
    units: dimensionless
    dtype: float32
    bounds:
    - 0.6
    - 1.3
    category: empirical_parameter
    description: Baseline scaling factor for Priestley-Taylor alpha reduction as a function of vapor pressure deficit
    references:
    - Katerji & Rana (2011) Agric. For. Meteorol. 151:428-440
    tags:
    - vapor_pressure_deficit
    - stress_response
    dimension: dimensionless
    requires_grad: true
    provenance:
      source: evapotranspiration_stress_response
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2025-10-09T00:00:00Z'
  hydrosphere.physical.vpd_alpha_sensitivity:
    value: 0.1
    default: 0.1
    units: kPa-1
    dtype: float32
    bounds:
    - 0.02
    - 0.3
    category: empirical_parameter
    description: Sensitivity of Priestley-Taylor alpha to vapor pressure deficit above the threshold
    references:
    - Katerji & Rana (2011) Agric. For. Meteorol. 151:428-440
    - Fisher et al. (2008) Water Resour. Res. 44:W00H14
    tags:
    - vapor_pressure_deficit
    - calibratable
    dimension: inverse_pressure
    requires_grad: true
    provenance:
      source: evapotranspiration_stress_response
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2025-10-09T00:00:00Z'
  hydrosphere.physical.vpd_alpha_threshold:
    value: 1.0
    default: 1.0
    units: kPa
    dtype: float32
    bounds:
    - 0.3
    - 2.0
    category: empirical_parameter
    description: Vapor pressure deficit threshold beyond which Priestley-Taylor alpha is reduced
    references:
    - Gentine et al. (2016) Nature 529:400-403
    - Katerji & Rana (2011) Agric. For. Meteorol. 151:428-440
    tags:
    - vapor_pressure_deficit
    - stress_threshold
    dimension: pressure
    requires_grad: true
    provenance:
      source: evapotranspiration_stress_response
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2025-10-09T00:00:00Z'
  hydrosphere.physical.maximum_lai_factor:
    value: 6.0
    default: 6.0
    units: m2 m-2
    dtype: float32
    bounds:
    - 1.0
    - 10.0
    category: vegetation_descriptor
    description: Representative upper bound on LAI used for interception diagnostics and capacity checks
    references:
    - Gash (1979) J. Hydrol. 47:15-27
    - Wang et al. (2007) Agric. For. Meteorol. 143:122-138
    tags:
    - canopy
    - interception
    - diagnostic
    dimension: area_ratio
    requires_grad: false
    provenance:
      source: canopy_interception_references
      schema_version: 2.0.0
      created_by: relic
      last_modified: '2025-03-06T00:00:00Z'
  hydrosphere.physical.moderate_lai_factor:
    value: 3.0
    default: 3.0
    units: m2 m-2
    dtype: float32
    bounds:
    - 1.0
    - 6.0
    category: vegetation_descriptor
    description: Representative LAI used when scaling interception capacity for mixed evergreen stands
    references:
    - Rutter et al. (1971) J. Appl. Ecol. 8:667-688
    - Gash (1979) Q. J. R. Meteorol. Soc. 105:43-55
    tags:
    - canopy
    - interception
    - lai_scaling
    dimension: area_ratio
    requires_grad: false
    provenance:
      source: canopy_interception_references
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2025-11-09T00:00:00Z'
