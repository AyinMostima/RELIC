  hydrosphere.runoff.surface_water_input_source:
    value: precipitation_flux
    default: precipitation_flux
    units: dimensionless
    dtype: string
    allowed_values:
    - precipitation_flux
    - rain_flux_plus_snow_melt_flux
    bounds:
    category: model_configuration
    description: Declared surface water input of SurfaceRunoff. precipitation_flux reads the total precipitation (no snowpack Functor); rain_flux_plus_snow_melt_flux reads the rain reaching the ground plus the snowmelt of the snowpack partition and declares the snowpack Functor (SCM owner of both fluxes) as a required dependency. Exactly one representation is read; an instance config key of the same name overrides this value.
    references:
    - E3SM ELM SnowHydrologyMod, column without snow layers (qflx_top_soil = qflx_rain_grnd + qflx_snomelt)
    - Oleson et al. (2013) Technical Description of version 4.5 of the Community Land Model (CLM), NCAR Technical Note NCAR/TN-503+STR
    - Neitsch et al. (2011) Soil and Water Assessment Tool Theoretical Documentation Version 2009, Texas Water Resources Institute Technical Report No. 406
    - Anderson (1976) NOAA Technical Report NWS 19
    tags:
    - model_structure
    - configuration
    - snowpack_coupling
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: model_configuration
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-24T00:00:00Z'
