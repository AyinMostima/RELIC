    units: K
    dtype: float32
    bounds:
    - 1000.0
    - 10000.0
    category: model_parameter
    description: BATS grain growth temperature factor b in r1 = exp(b (1/T_ref - 1/T)); the exponent carries no additional dimensionless multiplier (D55)
