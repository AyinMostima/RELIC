parameters:
  hydrosphere.snow.hodge_reference_surface_albedo:
    value: 0.5
    default: 0.5
    units: dimensionless
    dtype: float32
    bounds:
    - 0.1
    - 0.9
    category: reference_constant
    description: Reference aged-snow albedo alpha_ref of the static absorption Hodge contract of SnowAlbedo, star_alpha = diag(max(1 - alpha_ref, epsilon)) (build_hodge_contract); a structural reference state, never a runtime albedo and never substituted for surface_albedo
    references:
    - Warren, S.G. (1982). Optical properties of snow. Reviews of Geophysics 20, 67-89 (aged snow albedo)
    - van der Schaft, A.J. and Maschke, B.M. (1995). The Hamiltonian formulation of energy conserving physical systems with external ports. AEU 49, 362-371
    tags:
    - hodge_reference
    - structural_reference
    - surface_property
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: snow_physics_literature
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-26T00:00:00Z'
      notes: Renamed from hydrosphere.snow.surface_albedo_default on 2026-09-26. Its only reader is SnowAlbedo.build_hodge_contract; SnowAlbedo.get_value_at no longer returns it in place of the committed surface_albedo.
