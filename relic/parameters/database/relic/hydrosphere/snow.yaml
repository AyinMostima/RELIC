    - Dickinson et al. (1993) BATS Version 1e NCAR Tech Note NCAR/TN-387+STR
    - Yang et al. (1997) J. Climate 10:353-373, BATS snow submodel validation
    - RHESSys snowpack_daily_F.c reference implementation, r1 = exp(5000*(1/273.16 - 1/T))
    tags:
    - BATS
    - grain_growth
    - temperature_response
    dimension: temperature
    requires_grad: false
    provenance:
