      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2025-12-31T00:00:00Z'
  hydrosphere.soil_moisture.water_input_source:
    value: precipitation_flux
    default: precipitation_flux
    units: dimensionless
    dtype: string
    allowed_values:
    - precipitation_flux
    - rain_flux_plus_snow_melt_flux
    bounds:
    category: model_configuration
    description: Declared water input of the bucket soil store. precipitation_flux reads the total precipitation (no snowpack Functor upstream); rain_flux_plus_snow_melt_flux reads the rain reaching the ground plus the snowmelt of the snowpack partition and declares the snowpack Functor (SCM owner of both fluxes) as a lagged provider whose committed outflow the bucket consumes. Exactly one representation is read; an instance config key of the same name overrides this value.
    references:
    - E3SM ELM SnowHydrologyMod, column without snow layers (qflx_top_soil = qflx_rain_grnd + qflx_snomelt)
    - Oleson et al. (2013) Technical Description of version 4.5 of the Community Land Model (CLM), NCAR Technical Note NCAR/TN-503+STR
    - Manabe (1969) Mon. Wea. Rev. 97:739-774
    - Anderson (1976) NOAA Technical Report NWS 19
    tags:
    - bucket_model
    - model_structure
    - configuration
    - snowpack_coupling
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: model_configuration
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-10-17T00:00:00Z'
