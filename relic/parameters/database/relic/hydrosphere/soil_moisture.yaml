  hydrosphere.soil_moisture.drainage_factor:
    value: 1.0
    default: 1.0
    units: dimensionless
    dtype: float32
    bounds:
    - 0.0
    - 1.0
    category: model_parameter
    description: Free-drainage factor f_d of the bucket gravity-drainage law, K_eff = f_d K_sat in D = K_eff (theta/theta_sat)^b above field capacity; a process-law parameter read every call (the value 1 applies K_sat unscaled)
    references:
    - Manabe (1969) Mon. Wea. Rev. 97:739-774
    tags:
    - bucket_model
    - drainage
    - scaling
    dimension: dimensionless
    requires_grad: false
    provenance:
