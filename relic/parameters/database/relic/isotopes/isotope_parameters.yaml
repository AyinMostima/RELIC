  isotopes.fractionation.carbon.c4_pep_net_fractionation:
    value: -5.7
    default: -5.7
    units: dimensionless
    dtype: float32
    bounds:
    - -8.7
    - -4.2
    category: fractionation_parameter
    description: 'C4 net discrimination b4 (per mil) of the fixation of gaseous CO2, in equilibrium with HCO3-, by PEP carboxylase: b4 = e_s + e_b + b_p (Farquhar et al. 1989, Eq. 9 and Table 1), -5.7 per mil at 25 degC (Farquhar 1983). Negative because 13C concentrates in HCO3- at equilibrium. RELIC uses the 25 degC value; the bounds span b4(T) = -9483/(273 + T) + 23.89 + 2.2 (T in degC; Mook et al. 1974 equilibrium plus the PEP carboxylase fractionation, von Caemmerer et al. 2014) from 0 to 40 degC.'
    references:
    - 'Farquhar, G.D., Ehleringer, J.R. and Hubick, K.T. (1989). Carbon isotope discrimination and photosynthesis. Annu. Rev. Plant Physiol. Plant Mol. Biol. 40, 503-537.'
    - 'Farquhar, G.D. (1983). On the nature of carbon isotope discrimination in C4 species. Aust. J. Plant Physiol. 10, 205-226.'
    - 'von Caemmerer, S., Ghannoum, O., Pengelly, J.J.L. and Cousins, A.B. (2014). Carbon isotope discrimination as a tool to explore C4 photosynthesis. J. Exp. Bot. 65, 3459-3470.'
    tags:
    - carbon
    - fractionation
    - c4
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: literature
      schema_version: 2.0.0
      created_by: relic
      last_modified: '2026-09-27T00:00:00Z'
      literature_check: 'verified: Farquhar et al. (1989) Table 1 lists b4 = -5.7 per mil (Farquhar 1983) for gaseous CO2 in equilibrium with HCO3- at 25 degC; the former +5.7 had the wrong sign'
  isotopes.fractionation.carbon.c4_rubisco_fractionation:
    value: 30.0
    default: 30.0
    units: dimensionless
    dtype: float32
    bounds:
    - 29.0
    - 30.0
    category: fractionation_parameter
    description: 'Rubisco discrimination b3 (per mil) against CO2 in the C4 bundle sheath, the b3 of the C4 law of Farquhar et al. (1989), Eq. (10); Table 1 gives 30 per mil (pH 8, Roeske and O''Leary 1984) and 29 per mil (Guy et al.). Distinct from the net C3 value b (carboxylation_fractionation, 27 per mil) of the C3 law.'
    references:
    - 'Farquhar, G.D., Ehleringer, J.R. and Hubick, K.T. (1989). Carbon isotope discrimination and photosynthesis. Annu. Rev. Plant Physiol. Plant Mol. Biol. 40, 503-537.'
    - 'Roeske, C.A. and O''Leary, M.H. (1984). Carbon isotope effects on the enzyme-catalyzed carboxylation of ribulose bisphosphate. Biochemistry 23, 6275-6284.'
    tags:
    - carbon
    - fractionation
    - c4
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: literature
      schema_version: 2.0.0
      created_by: relic
      last_modified: '2026-09-27T00:00:00Z'
      literature_check: 'verified: Farquhar et al. (1989) Table 1 and Eq. (10) use b3 = 30 per mil; with b4 = -5.7 and a = 4.4 the factor b4 + b3 phi - a vanishes at phi = 0.34 as stated there'
  isotopes.fractionation.carbon.c4_bundle_sheath_leakiness:
    value: 0.2
    default: 0.2
    units: dimensionless
    dtype: float32
    bounds:
    - 0.08
    - 0.5
    category: fractionation_parameter
    description: 'C4 bundle-sheath leakiness phi [1]: the proportion of the carbon fixed by PEP carboxylation that subsequently leaks out of the bundle sheath (Farquhar et al. 1989, Eq. 10). Measured value: about 0.2 in several C4 species of different decarboxylation types under a range of conditions (Henderson et al. 1992, as reviewed by von Caemmerer et al. 2014). The bounds are the measured range summarised by Kromdijk et al. (2014), Table 1: 0.08 (radiolabelling, monocots) to 0.50 (very low light, Bellasio and Griffiths 2013). With phi = 0.2 the photosynthetic discrimination is Delta = 2.4-2.8 per mil at ci/ca = 0.5-0.4; dry-matter values include post-photosynthetic fractionation and are not directly comparable. Henderson et al. (1992) estimated phi with a model that carries the leakage fractionation s = 1.8 per mil, which Eq. (10) lacks; at ci/ca = 0.4 the term -s phi ci/ca is about -0.14 per mil.'
    references:
    - 'Farquhar, G.D., Ehleringer, J.R. and Hubick, K.T. (1989). Carbon isotope discrimination and photosynthesis. Annu. Rev. Plant Physiol. Plant Mol. Biol. 40, 503-537.'
    - 'Henderson, S.A., von Caemmerer, S. and Farquhar, G.D. (1992). Short-term measurements of carbon isotope discrimination in several C4 species. Aust. J. Plant Physiol. 19, 263-285.'
    - 'von Caemmerer, S., Ghannoum, O., Pengelly, J.J.L. and Cousins, A.B. (2014). Carbon isotope discrimination as a tool to explore C4 photosynthesis. J. Exp. Bot. 65, 3459-3470.'
    - 'Kromdijk, J., Ubierna, N., Cousins, A.B. and Griffiths, H. (2014). Bundle-sheath leakiness in C4 photosynthesis: a careful balancing act between CO2 concentration and assimilation. J. Exp. Bot. 65, 3443-3457.'
    tags:
    - carbon
    - fractionation
    - c4
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: literature
      schema_version: 2.0.0
      created_by: relic
      last_modified: '2026-09-27T00:00:00Z'
      literature_check: 'verified: von Caemmerer et al. (2014) quote phi of about 0.2 (Henderson et al. 1992); Kromdijk et al. (2014) Table 1 lists 0.08-0.14 (radiolabelling, monocots) to 0.20-0.50 (Bellasio and Griffiths 2013, PAR 500 to 30)'
