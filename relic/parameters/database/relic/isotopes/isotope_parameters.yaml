    category: fractionation_parameter
    description: Net C3 carboxylation discrimination b (per mil) of the C3 law epsilon = a + (b - a) ci/ca (net C3 fixation with respect to p_i, Farquhar et al. 1989 Table 1); the C4 law uses the Rubisco b3 (c4_rubisco_fractionation).
