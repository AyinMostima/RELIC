parameters:
  isotopes.temperature.min:
    value: 200.0
    default: 200.0
    units: K
    dtype: float32
    bounds:
    - 183.95
    - 200.0
    category: physical_parameter
    description: 'Lower end of the temperature domain of the isotope fractionation laws: a
      temperature below it is clamped to it with a warning, and one more than 50 K below
      it raises (IsotopeFractionationCalculator.validate_temperature). It is an absolute
      temperature, so the declared bounds are its only constraint: the lower bound is
      the lowest recorded near-surface air temperature, -89.2 degC = 183.95 K (Vostok,
      Antarctica, 21 July 1983; WMO archive of weather and climate extremes), which keeps
      it strictly positive and within the environmental domain; the upper bound is the
      lowest admissible isotopes.temperature.max (200 K), so that min <= max. The former
      bounds [0, 1000] K admitted absolute zero and a minimum above the maximum.'
    references:
    - Physical constraint for biological and chemical reactions
    - 'WMO World Weather and Climate Extremes Archive: lowest temperature, -89.2 degC,
      Vostok, Antarctica, 21 July 1983'
    tags:
    - validation
    - temperature
    dimension: temperature
    requires_grad: false
    provenance:
      source: constraint
      schema_version: 2.0.0
      created_by: relic
      last_modified: '2025-10-17T00:00:00Z'
