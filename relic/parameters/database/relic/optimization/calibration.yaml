    - calibration
    - adaptive
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: relic_convention
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-26T00:00:00Z'
  optimization.calibration.adaptive.learning_rate_decrease_factor:
    value: 0.8
    default: 0.8
    units: dimensionless
    dtype: float64
    bounds:
    - 0.0
    - 1.0
    category: numerical_parameter
    description: Multiplicative learning-rate factor suggested by AdaptiveCallback when the relative improvement is below
      optimization.calibration.adaptive.learning_rate_decrease_rate. RELIC convention value, not a literature value.
    references:
