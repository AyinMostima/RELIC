  pedosphere.denitrification.anaerobic_transition_width:
    value: 0.3
    units: dimensionless
    dtype: float32
    bounds:
    - 0.1
    - 0.5
    category: biological_parameter
    description: 'Width w, in water-filled pore space, of the linear rise of the denitrification anaerobic factor from WFPS_thr to WFPS_thr + w (0.6 to 0.9 with the defaults), f_anoxic = max(clip((WFPS - WFPS_thr)/w, 0, 1), f_min).'
    references:
    - RELIC convention value (width of the linear WFPS ramp; no literature value)
    tags:
    - anaerobic
    - transition
    - width
    dimension: dimensionless
    requires_grad: true
    provenance:
      source: relic_convention
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-27T00:00:00Z'
      notes: 'MA-21 follow-up F2: a linear stand-in for the saturating DAYCENT WFPS function (Del Grosso et al. 2000), which reaches its plateau near saturation; no source gives the width. The former reference "Gradual anaerobic transition" was a placeholder. Role: WFPS span of the anaerobic ramp.'
  pedosphere.denitrification.minimum_anaerobic_factor:
