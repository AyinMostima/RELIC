  pedosphere.denitrification.min_rate_threshold:
    value: 1.0e-12
    units: dimensionless
    dtype: float32
    bounds:
    - 0.0
    - .inf
    category: numerical_parameter
    description: 'Lower bound of the denitrification temperature factor f_T = clip(Q10^((T - T_ref)/10),
      lower, upper) with Q10 = q10_denitrification and T_ref = reference_temperature. With the default
      Q10 = 2.2 and T_ref = 293.15 K the raw factor reaches 1e-12 only 350 K below T_ref, so the bound
      never binds at a physical soil temperature; it keeps f_T strictly positive. A floor of the
      temperature response factor cannot be negative; its upper limit is max_rate_factor, a relation
      between parameters that bounds cannot express, so the upper bound is open (inf).'
    references:
    - RELIC convention value (temperature factor lower bound; no literature value)
    tags:
    - rate
    - minimum
    - precision
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: relic_convention
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-27T00:00:00Z'
      notes: 'Round 54.2: the only reader, DenitrificationProcess, clamps the dimensionless Q10
        temperature factor with it (torch.clamp(f_T, min=min_rate_threshold, max=max_rate_factor)), so
        the former units g N m-2 s-1 and dimension mass_flux misdeclared it. No source gives the bound;
        the former reference "Numerical precision" was a placeholder. Role: positivity floor of f_T.'
