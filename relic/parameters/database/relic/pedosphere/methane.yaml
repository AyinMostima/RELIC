  pedosphere.methane.production.calibrated.eh_full_activity:
    value: -200.0
    units: mV
    dtype: float32
    bounds:
    - -200.0
    - -200.0
    category: environmental_response
    description: Redox potential at and below which the calibrated methane production redox factor is 1
    references:
    - Zhu et al. (2014) doi:10.5194/gmd-7-981-2014
    - Zhang et al. (2002) doi:10.1029/2001GB001838
    tags:
    - calibrated_branch
    - redox
    dimension: electric_potential
    requires_grad: false
    provenance:
      source: literature
      schema_version: 2.0.0
      created_by: relic
      last_modified: '2026-09-26T00:00:00Z'
      literature_check: 'Zhu et al. (2014) Sect. 2.2.1, generalized from Zhang et al.
        (2002) after Fiedler and Sommer (2000) and Segers (1998): the methanogenesis redox
        factor is 1 below -200 mV, diminishes linearly from 1 to 0 between -200 and -100 mV,
        and is 0 above -100 mV.'
