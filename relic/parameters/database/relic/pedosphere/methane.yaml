schema_version: 2.0.0
tier: relic
namespace: pedosphere.methane
description: Wetland methane process parameters (iMAPLE laws with RELIC calibrated branches)
metadata:
  created_by: RELIC Methane Integration
  last_modified: '2026-06-01T00:00:00Z'
  schema_url: https://github.com/relic/parameter-schema/v2.0.0
  notes: Parameters support methane production, oxidation, transport, conservation, and scale gating with consistent SI units.
  version: 1.0.0
parameters:
  pedosphere.methane.production.release_ratio:
    value: 0.2
    units: dimensionless
    dtype: float32
    bounds:
    - 0.1
    - 0.5
    category: biological_parameter
    description: Ratio of methane to carbon dioxide released during heterotrophic respiration
    references:
    - Wania et al. (2010) doi:10.5194/gmd-3-565-2010
    - Zhu et al. (2014) doi:10.5194/gmd-7-981-2014
    - Yue et al. (2024) doi:10.5194/gmd-17-4621-2024
    - iMAPLE v1 source, LSM/src/model/iMAPLE/ch4flux_wetland.f (Yue et al. 2024 code release, doi:10.6084/m9.figshare.23593578.v1), module ch4flux_com parameter r
    tags:
    - methanogenesis
    - learnable
    dimension: dimensionless
    requires_grad: true
    provenance:
      source: literature
      schema_version: 2.0.0
      created_by: relic
      last_modified: '2026-09-27T00:00:00Z'
      literature_check: 'Yue et al. (2024) Eq. 34 (P = Rh r f_Ts f_pH f_wetland) names r
        after Wania et al. (2010) without printing a value (checked in the GMD article);
        the iMAPLE v1 code released with the paper sets r = 0.2 (ch4flux_wetland.f,
        comment: range 0.1 to 0.4), so the value of the published model is used.
        Consistency: Wania et al. (2010) fit CH4/CO2 as an adjustable parameter
        (sensitivity range 0.1-0.4, Table 4; all-site fit 0.1 and site fits 0.1-0.3,
        Table 7); Zhu et al. (2014) calibrate r over 0.1-0.7 (mean 0.23, Table 3).'
  pedosphere.methane.production.q10:
    value: 3.0
    units: dimensionless
    dtype: float32
    bounds:
    - 2.0
    - 5.0
    category: biological_parameter
    description: 'Q10 of methane production at the base temperature T_base, r_b of Q10(Ts) = clip(r_b Q_b^((Ts - T_base)/10), Q10_min, Q10_max) (Yue et al. 2024 Eq. 39); the base Q10 3.0 of Zhu et al. (2014).'
    references:
    - 'Zhu et al. (2014) doi:10.5194/gmd-7-981-2014'
    - 'Zhang et al. (2002) doi:10.1029/2001GB001838'
    - 'Yue et al. (2024) doi:10.5194/gmd-17-4621-2024'
    tags:
    - temperature_response
    - learnable
    dimension: dimensionless
    requires_grad: true
    provenance:
      source: literature
      schema_version: 2.0.0
      created_by: relic
      last_modified: '2026-09-27T00:00:00Z'
      literature_check: 'Zhu et al. (2014) Eqs. 3-5 use a base Q10 of 3.0 after Zhang et al. (2002) (site calibration 1.6-4.5, mean 2.48, Table 3). Yue et al. (2024) Eq. 39 writes Q10 = r_b * Q_b^((Ts - T_base)/10) with r_b = 3.0, Q_b = 1.33 and T_base = 25 C, so this key is r_b, the Q10 at T_base (MA-21 item 50.1: Eq. 39 is implemented). The former Zhang et al. (2002) DOI 10.1046/j.1354-1013.2002.00484.x belonged to an unrelated article. Reuse of the shared f_T in the calibrated branch is a RELIC convention.'
  pedosphere.methane.production.q10_temperature_sensitivity:
    value: 1.33
    units: dimensionless
    dtype: float32
    bounds:
    - 1.0
    - .inf
    category: temperature_response
    description: 'Q_b of Yue et al. (2024) Eq. 39, the factor by which the methane production Q10 rises per 10 K above T_base. Q_b >= 1 keeps Q10 non-decreasing with temperature; no upper limit is fixed (inf).'
    references:
    - 'Yue et al. (2024) doi:10.5194/gmd-17-4621-2024'
    - 'Paudel et al. (2016) doi:10.1088/1748-9326/11/3/034020'
    - 'iMAPLE v1 source, LSM/src/model/iMAPLE/ch4flux_wetland.f (Yue et al. 2024 code release, doi:10.6084/m9.figshare.23593578.v1), function Q10fn_pro and subroutine CH4prod'
    tags:
    - temperature_response
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: literature
      schema_version: 2.0.0
      created_by: relic
      last_modified: '2026-09-27T00:00:00Z'
      literature_check: 'Yue et al. (2024) Eq. 39: Q_b = 1.33 for production (after Zhu et al. 2014 and Paudel et al. 2016; the value equals the CLM4.5 q10ch4). The released iMAPLE code uses Q10pro_par = 1.33 (its header comment swaps the production and oxidation Q10 ranges).'
  pedosphere.methane.production.q10_base_temperature:
    value: 298.15
    units: K
    dtype: float32
    bounds:
    - 0.0
    - .inf
    category: temperature_response
    description: 'T_base of Yue et al. (2024) Eq. 39, the soil temperature at which the methane production Q10 equals r_b (25 C). An absolute temperature in K cannot be negative; the lower bound is 0 K.'
    references:
    - 'Yue et al. (2024) doi:10.5194/gmd-17-4621-2024'
    - 'iMAPLE v1 source, LSM/src/model/iMAPLE/ch4flux_wetland.f (Yue et al. 2024 code release, doi:10.6084/m9.figshare.23593578.v1), function Q10fn_pro and subroutine CH4prod'
    tags:
    - temperature_response
    dimension: temperature
    requires_grad: false
    provenance:
      source: literature
      schema_version: 2.0.0
      created_by: relic
      last_modified: '2026-09-27T00:00:00Z'
      literature_check: 'Yue et al. (2024) state T_base = 25 C for production, and the released iMAPLE code uses Tbase_pro = 25.0; the code comment names the CLM4.5 value 22 C (q10ch4base = 295 K), which neither the paper nor the code applies. The oxidation T_base of Eq. 39 (12 C) is not used: RELIC oxidation follows Riley et al. (2011) Eq. 7 (round 51.2).'
  pedosphere.methane.production.q10_min:
    value: 1.7
    units: dimensionless
    dtype: float32
    bounds:
    - 1.0
    - .inf
    category: temperature_response
    description: 'Lower clip Q10_min of the temperature-dependent methane production Q10; it must exceed 1 (ln(Q10) > 0 in the Zhu et al. 2014 exponent), which the functor checks at construction.'
    references:
    - 'Zhu et al. (2014) doi:10.5194/gmd-7-981-2014'
    - 'Dunfield et al. (1993) Soil Biol. Biochem. 25, 321-326, doi:10.1016/0038-0717(93)90130-4 (production Q10 5.3-16)'
    - 'Valentine et al. (1994) J. Geophys. Res. 99(D1), 1563-1571, doi:10.1029/93JD00391'
    - 'iMAPLE v1 source, LSM/src/model/iMAPLE/ch4flux_wetland.f (Yue et al. 2024 code release, doi:10.6084/m9.figshare.23593578.v1), function Q10fn_pro and subroutine CH4prod'
    tags:
    - temperature_response
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: literature
      schema_version: 2.0.0
      created_by: relic
      last_modified: '2026-09-27T00:00:00Z'
      literature_check: 'Zhu et al. (2014) Sect. 2.3 and Table 2: observed methane production Q10 values range from 1.7 to 16 (Dunfield et al. 1993; Valentine et al. 1994). The released iMAPLE code clips Q10fn_pro to [1.7, 16.0] in CH4prod; Yue et al. (2024) do not print the clip. With r_b = 3.0, Q_b = 1.33 and T_base = 25 C the lower clip binds below 5.1 C and keeps f_T increasing on [0, 25] C.'
  pedosphere.methane.production.q10_max:
    value: 16.0
    units: dimensionless
    dtype: float32
    bounds:
    - 1.0
    - .inf
    category: temperature_response
    description: 'Upper clip Q10_max of the temperature-dependent methane production Q10 (must exceed q10_min, checked at construction).'
    references:
    - 'Zhu et al. (2014) doi:10.5194/gmd-7-981-2014'
    - 'Dunfield et al. (1993) Soil Biol. Biochem. 25, 321-326, doi:10.1016/0038-0717(93)90130-4 (production Q10 5.3-16)'
    - 'Valentine et al. (1994) J. Geophys. Res. 99(D1), 1563-1571, doi:10.1029/93JD00391'
    - 'iMAPLE v1 source, LSM/src/model/iMAPLE/ch4flux_wetland.f (Yue et al. 2024 code release, doi:10.6084/m9.figshare.23593578.v1), function Q10fn_pro and subroutine CH4prod'
    tags:
    - temperature_response
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: literature
      schema_version: 2.0.0
      created_by: relic
      last_modified: '2026-09-27T00:00:00Z'
      literature_check: 'Zhu et al. (2014) Sect. 2.3 and Table 2: observed methane production Q10 values range from 1.7 to 16 (Dunfield et al. 1993; Valentine et al. 1994); the released iMAPLE code clips Q10fn_pro at 16.0. With the default parameters Q10 reaches 5.31 at 45 C, so the upper clip does not bind.'
