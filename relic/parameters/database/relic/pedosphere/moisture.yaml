schema_version: 2.0.0
tier: relic
namespace: pedosphere.moisture
description: Soil moisture retention parameters for pedosphere transport and stress modules
metadata:
  version: "1.0.0"
  created_by: Yuchong Long
  last_modified: '2025-11-18T00:00:00Z'
  schema_url: https://github.com/relic/parameter-schema/v2.0.0
  notes: Defaults derived from Saxton & Rawls (2006) loam pedotransfer relationships
parameters:
  pedosphere.moisture.field_capacity:
    value: 0.30
    units: "m3 m-3"
    dtype: float32
    bounds:
    - 0.20
    - 0.45
    category: hydraulic_property
    description: Volumetric water content at field capacity (theta_fc) for representative loam
    references:
    - Saxton & Rawls (2006) Soil Science Society of America Journal 70:1569-1578
    - Hillel (1998) Environmental Soil Physics
    tags:
    - soil_moisture
    - hydraulic_retention
    dimension: volume_fraction
    requires_grad: false
    provenance:
      source: pedosphere_hydraulics_refactor
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2025-11-18T00:00:00Z'
  pedosphere.moisture.wilting_point:
    value: 0.15
    units: "m3 m-3"
    dtype: float32
    bounds:
    - 0.05
    - 0.25
    category: hydraulic_property
    description: Permanent wilting point (theta_wp) for the same soil texture class
    references:
    - Clapp & Hornberger (1978) Water Resources Research 14:601-604
    - Saxton & Rawls (2006) Soil Science Society of America Journal 70:1569-1578
    tags:
    - soil_moisture
    - hydraulic_retention
    dimension: volume_fraction
    requires_grad: false
    provenance:
      source: pedosphere_hydraulics_refactor
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2025-11-18T00:00:00Z'

