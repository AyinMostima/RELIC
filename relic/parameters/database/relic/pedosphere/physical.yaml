    - 0.35
    - 0.7
    category: environmental_response
    description: 'Water-filled pore space WFPS_opt at which aerobic microbial activity, and with it nitrification, peaks; above it oxygen limits nitrification, f_O2 = max((1 - WFPS)/(1 - WFPS_opt), pedosphere.nitrification.minimum_oxygen_factor), and below it f_O2 = 1. Linn and Doran (1984) found the maximum at 60 percent WFPS with a decline above it through reduced aeration. The bounds are the Bateman and Baggs (2005) range: nitrification is the main N2O source at 35-60 percent WFPS and denitrification produced all N2O at 70 percent.'
    references:
    - 'Linn, D.M. and Doran, J.W. (1984) Effect of water-filled pore space on carbon dioxide and nitrous oxide production in tilled and nontilled soils, Soil Sci. Soc. Am. J. 48, 1267-1272, doi:10.2136/sssaj1984.03615995004800060013x'
    - 'Bateman, E.J. and Baggs, E.M. (2005) Contributions of nitrification and denitrification to N2O emissions from soils at different water-filled pore space, Biol. Fertil. Soils 41, 379-388, doi:10.1007/s00374-005-0858-3'
    tags:
    - learnable
    - WFPS
    - nitrification
    dimension: dimensionless
    requires_grad: true
    provenance:
      source: literature
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-27T00:00:00Z'
      notes: 'Round 53.1: the single WFPS threshold of the nitrification oxygen limitation (value 0.3 -> 0.6). The former references Stark and Firestone (1995) doi:10.1016/0038-0717(94)00192-6 and Davidson et al. (2000) doi:10.1046/j.1365-2486.2000.00327.x did not resolve. The linear decline to zero at saturation is a RELIC convention; the DAYCENT water function of Parton et al. (1996) is not implemented.'
