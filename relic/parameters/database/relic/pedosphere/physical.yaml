  pedosphere.physical.wfps_denitrification_threshold:
    value: 0.6
    units: dimensionless
    dtype: float32
    bounds:
    - 0.5
    - 0.8
    category: environmental_response
    description: 'Water-filled pore space WFPS_thr above which the denitrification anaerobic factor rises, f_anoxic = max(clip((WFPS - WFPS_thr)/w, 0, 1), f_min) with w = pedosphere.denitrification.anaerobic_transition_width and f_min = pedosphere.denitrification.minimum_anaerobic_factor. Linn and Doran (1984) found aerobic microbial activity maximal at 60 percent WFPS and declining above it through reduced aeration; DAYCENT (Del Grosso et al. 2000) drives denitrification with WFPS. Bounds: nitrification is the main N2O source up to 60 percent and denitrification produced all N2O at 70 percent WFPS (Bateman and Baggs 2005); 0.8 keeps the ramp inside the unit interval.'
    references:
    - 'Linn, D.M. and Doran, J.W. (1984) Effect of water-filled pore space on carbon dioxide and nitrous oxide production in tilled and nontilled soils, Soil Sci. Soc. Am. J. 48, 1267-1272, doi:10.2136/sssaj1984.03615995004800060013x'
    - 'Del Grosso, S.J., Parton, W.J., Mosier, A.R., Ojima, D.S., Kulmala, A.E. and Phongpan, S. (2000) General model for N2O and N2 gas emissions from soils due to dentrification, Global Biogeochem. Cycles 14, 1045-1060, doi:10.1029/1999GB001225'
    - 'Bateman, E.J. and Baggs, E.M. (2005) Contributions of nitrification and denitrification to N2O emissions from soils at different water-filled pore space, Biol. Fertil. Soils 41, 379-388, doi:10.1007/s00374-005-0858-3'
    tags:
    - WFPS
    - denitrification
    requires_grad: false
    provenance:
      source: literature
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-27T00:00:00Z'
      notes: 'MA-21 follow-up F2: the one threshold of the denitrification anaerobic factor (replaces pedosphere.denitrification.anaerobic_threshold, 0.6 m3 m-3 on the volumetric-moisture basis, whose transition width was already on the WFPS basis). The former reference was [NEEDS_CITATION]. The linear ramp is a RELIC convention; the DAYCENT arctangent WFPS function of Del Grosso et al. (2000) is not implemented.'
    dimension: dimensionless
  pedosphere.physical.wfps_nitrification_optimum:
    value: 0.6
    units: dimensionless
    dtype: float32
