schema_version: 2.0.0
tier: relic
namespace: pedosphere.transport
description: Transport process parameters for solute advection-diffusion and gas diffusion in pedosphere
metadata:
  created_by: RELIC Parameter System
  last_modified: '2025-10-06T00:00:00Z'
  schema_url: https://github.com/relic/parameter-schema/v2.0.0
  notes: Parameters for soil solute transport (nitrate, dissolved organic carbon) and gas transport (CO2, N2O), including
    distribution coefficients, diffusivities, dispersivities, numerical scheme settings, and boundary conditions. Some gas
    properties reference physical.yaml for consistency.
  version: 1.0.0
parameters:
  pedosphere.transport.nitrate_distribution_coefficient:
    value: 0.1
    units: L kg-1
    dtype: float32
    bounds:
    - 0.0
    - 1.0
    category: solute_transport_parameter
    description: Distribution coefficient (Kd) for nitrate sorption on soil particles, very mobile anion with minimal sorption
    references:
    - Jury & Horton (2004) Soil Physics 6th edition
    - van Genuchten & Wierenga (1986) doi:10.2136/sssaj1986.03615995005000050013x
    tags:
    - learnable
    - nitrate
    - sorption
    - NO3
    dimension: distribution_coefficient
    requires_grad: true
    provenance:
      source: Solute transport literature
      schema_version: 2.0.0
      created_by: RELIC Parameter System
      last_modified: '2025-10-06T00:00:00Z'
  pedosphere.transport.nitrate_diffusivity_water:
