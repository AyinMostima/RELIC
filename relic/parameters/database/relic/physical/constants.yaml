    - 'Leung, F., Williams, K., Sitch, S. et al. (2020). Calibrating soybean parameters in JULES 5.0 from the US-Ne2/3 FLUXNET sites and the SoyFACE-O3 experiment. Geosci. Model Dev. 13, 6201-6213, Eq. (5). doi:10.5194/gmd-13-6201-2020'
