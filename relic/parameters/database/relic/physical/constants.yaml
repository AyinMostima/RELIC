    - 1.67
    provenance:
      source: literature
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-26T00:00:00Z'
      literature_check: 'verified: Leung et al. (2020), Geosci. Model Dev. 13, 6201-6213, Eq. (5) (publisher page): F_O3 = [O3] / (R_a + k_O3 / g_l) with [O3] the O3 molar concentration at reference level (nmol m-3), R_a the combined aerodynamic and boundary-layer resistance (s m-1), g_l the leaf conductance for H2O (m s-1) and k_O3 = 1.67 the ratio of the leaf resistance for O3 to the leaf resistance for water vapour, as specified in Sitch et al. (2007); Sitch et al. (2007) record verified through Crossref (DOI 10.1038/nature06059)'
