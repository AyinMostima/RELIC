  stochastic.weather.temperature.dt:
    value: 1.0
    default: 1.0
    units: day
    dtype: float32
    bounds:
    - 0.001
    - 1.0
    category: numerical_parameter
    description: Time step of the Ornstein-Uhlenbeck temperature recursion of relic.stochastic.weather_generator
      (exact discretization). The coupled WeatherGenerator advances temperature and the daily Markov-Gamma
      precipitation chain on the same step index and therefore requires one day.
    references:
    - Gardiner, C. (2009). Stochastic Methods, 4th ed., Springer (exact Ornstein-Uhlenbeck transition).
    - Richardson, C.W. (1981). Stochastic simulation of daily precipitation, temperature, and solar radiation.
      Water Resour. Res., 17, 182-190 (daily generation step).
    tags:
    - weather
    - temperature
    - ou_process
    dimension: time
    requires_grad: false
    provenance:
      source: relic_convention
      schema_version: 2.0.0
      created_by: relic
      last_modified: '2026-09-26T00:00:00Z'
  stochastic.weather.temperature.wet_day_temperature_offset:
    value: 0.0
    default: 0.0
    units: K
    dtype: float32
    bounds:
    - -15.0
    - 15.0
    category: meteorological_parameter
    description: Additive temperature offset on wet days of the coupled WeatherGenerator, T = T_OU + offset * S
      with S the wet/dry state; mean_temp is then the dry-day mean. Conditioning the daily temperature on the
      precipitation state follows WGEN (Richardson 1981), which uses separate wet-day and dry-day means. The
      value 0 declares no conditioning (the site-specific wet-dry difference must be calibrated).
    references:
    - Richardson, C.W. (1981). Stochastic simulation of daily precipitation, temperature, and solar radiation.
      Water Resour. Res., 17, 182-190.
    - Richardson, C.W. & Wright, D.A. (1984). WGEN: A model for generating daily weather variables. USDA ARS-8.
    tags:
    - weather
    - temperature
    - precipitation_conditioning
    dimension: temperature
    requires_grad: false
    provenance:
      source: literature
      schema_version: 2.0.0
      created_by: relic
      last_modified: '2026-09-26T00:00:00Z'
  stochastic.weather.precipitation.initial_state:
    value: false
    default: false
    units: dimensionless
    dtype: bool
    bounds:
    - 0
    - 1
    category: model_parameter
    description: Wet/dry state of the Markov-Gamma precipitation chain before the first generated day (false =
      dry, true = wet).
    references:
    - Wilks, D.S. (2011). Statistical Methods in the Atmospheric Sciences, 3rd ed., Sect. 9.2.
    tags:
    - weather
    - precipitation
    - markov
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: relic_convention
      schema_version: 2.0.0
      created_by: relic
      last_modified: '2026-09-26T00:00:00Z'
  stochastic.weather.precipitation.wet_day_threshold:
    value: 1.0e-08
    default: 1.0e-08
    units: kg m-2 s-1
    dtype: float64
    bounds:
    - 0.0
    - 0.0001
    category: numerical_parameter
    description: Precipitation flux above which an observation counts as a wet day in the Markov-Gamma
      log-probability (about 0.00086 mm day-1). It separates the generator's exact dry-day zeros from Gamma
      amounts; it is a numerical trace threshold, not a climatological wet-day definition (WGEN uses
      0.25 mm day-1 for station records), which must be set for observed series.
    references:
    - Richardson, C.W. & Wright, D.A. (1984). WGEN: A model for generating daily weather variables. USDA ARS-8.
    - Wilks, D.S. (2011). Statistical Methods in the Atmospheric Sciences, 3rd ed., Sect. 9.2.
    tags:
    - weather
    - precipitation
    - threshold
    dimension: mass_flux
    requires_grad: false
    provenance:
      source: relic_numerical_choice
      schema_version: 2.0.0
      created_by: relic
      last_modified: '2026-09-26T00:00:00Z'
