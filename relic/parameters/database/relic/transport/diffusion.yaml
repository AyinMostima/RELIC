    - diffusion
    - grid_spacing
    dimension: length
    requires_grad: false
    provenance:
      source: RELIC transport module
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2025-10-19T00:00:00Z'
  transport.diffusion.acp_manufactured_vertical_grid_spacing:
    value: 10.0
