schema_version: 2.0.0
tier: relic
namespace: transport.diffusion
description: Diffusion coefficients and numerical controls for transport modules
metadata:
  created_by: RELIC Parameter System
  last_modified: '2026-01-07T14:20:26Z'
  schema_url: https://github.com/relic/parameter-schema/v2.0.0
  version: 1.0.0
functor_metadata:
  spatial_scale: grid_cell
  variable_kind: state
  input_variables:
    - tracer_concentration
    - source_term
    - tracer_concentration_boundary_state
  output_variables:
    - tracer_concentration
    - tracer_concentration_diffusive_boundary_flux
    - diagnostics.diffusion_stability
    - diagnostics.conservation_error
  conservation_laws:
    - mass
  references:
    - Crank (1975)
    - Bird et al. (2007)
    - LeVeque (2007)
parameters:
  transport.diffusion.diffusivity:
    value: 1.0e-05
    default: 1.0e-05
    units: m2 s-1
    dtype: float32
    bounds:
    - 1.0e-12
    - 0.01
    category: transport_property
    description: Default molecular diffusion coefficient used when species-specific data are unavailable
    references:
    - Typical molecular diffusion in air at 25 degC
    tags:
    - diffusion
    - default
    dimension: diffusivity
    requires_grad: false
    provenance:
      source: RELIC transport module
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2025-10-19T00:00:00Z'
  transport.diffusion.acp_manufactured_constant_eddy_diffusivity:
    value: 1.0
    default: 1.0
    units: m2 s-1
    dtype: float32
    bounds:
    - 0.001
    - 10.0
    category: transport_parameter
    description: Constant eddy diffusivity used only by the bounded ACP one-dimensional manufactured transport benchmark
    references:
    - Crank (1975) The Mathematics of Diffusion
    - LeVeque (2007) Finite Difference Methods for Ordinary and Partial Differential Equations
    - Stull (1988) An Introduction to Boundary Layer Meteorology
    tags:
    - diffusion
    - constant_eddy_diffusivity
    - manufactured_solution
    - acp_profile
    dimension: diffusivity
    requires_grad: false
    provenance:
      source: RELIC ACP manufactured benchmark design
      schema_version: 2.0.0
      created_by: RELIC Three Papers G5
      last_modified: '2026-07-30T00:00:00Z'
  transport.diffusion.grid_spacing:
    value: 1.0
    default: 1.0
    units: m
    dtype: float32
    bounds:
    - 1.0e-06
    - 1000.0
    category: discretization_parameter
    description: Default computational grid spacing for diffusion-only discretizations
    references:
    - Spatial discretization requirement for finite-difference diffusion solvers
