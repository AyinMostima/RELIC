    - 1.0e-06
    category: numerical_tolerance
    description: 'Fixed-point convergence tolerance for implicit midpoint and Crank-Nicolson transport stepping, passed by the transport kernel as both rtol and atol of the successive-iterate criterion. Distinct from computation.solvers.implicit_midpoint.rtol/atol and computation.solvers.crank_nicolson.rtol/atol, the solvers own defaults for callers that pass no configuration.'
    references:
