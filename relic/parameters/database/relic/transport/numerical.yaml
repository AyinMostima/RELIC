  transport.numerical.implicit_midpoint_max_iter:
    value: 50
    default: 50
    units: dimensionless
    dtype: int32
    bounds:
    - 1
    - 100
    category: numerical_parameter
    description: 'Maximum fixed-point (Picard) iterations of the implicit midpoint and Crank-Nicolson transport steps (functional._integrate_rate_system); exhausting it raises RuntimeError and never returns an unconverged state. The map y <- y_n + dt f((y_n + y)/2) (theta = 1/2 for Crank-Nicolson) contracts with q = (dt/2) L, L being the infinity-norm Lipschitz constant of the semi-discrete rate, so about ln(tol)/ln(q) iterations reach the increment tolerance transport.numerical.implicit_midpoint_tolerance (1e-10). L = |u|/dx for central advection, 2|u|/dx for upwind and 4K/dx^2 for diffusion give q = C/2, C and 2 sigma (C = |u| dt/dx, sigma = K dt/dx^2). 50 covers q <= 0.6: central advection over the whole documented range C <= transport.numerical.cfl_advection_max = 1, upwind up to C = 0.6 and diffusion up to sigma = 0.3 (probe of 2026-09-23, 64-cell periodic step profile, both methods: at most 30 iterations for central at C = 1, 41 for upwind at C = 0.6 and for diffusion at sigma = 0.3). At q >= 1 (upwind at C = 1, diffusion at sigma = transport.numerical.cfl_diffusion_max = 0.5) the iteration cannot converge for any limit and the step raises; reduce dt. Changed from 4 on 2026-09-23: 4 converged only for q up to about 0.01 (for example central advection failed at C = 0.1, which needs 8 iterations); converged steps are unchanged because the iteration returns its first converged iterate. Distinct from computation.solvers.implicit_midpoint.max_iterations and computation.solvers.crank_nicolson.max_iterations, the solvers own defaults for callers that pass no configuration; the transport kernel always passes this value.'
    references:
    - Hairer et al. (2006) Geometric Numerical Integration
    - Hairer, E. and Wanner, G. (1996) Solving Ordinary Differential Equations II, 2nd ed., Springer, Sec. IV.8 (fixed-point iteration of implicit Runge-Kutta equations)
    tags:
    - implicit_midpoint
    - iteration_limit
    - transport_operator
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: RELIC transport module
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-23T00:00:00Z'
  transport.numerical.implicit_midpoint_tolerance:
