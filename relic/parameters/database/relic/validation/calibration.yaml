schema_version: 2.0.0
tier: relic
namespace: validation.calibration
description: Thresholds of the calibration result validator (relic.parameters.calibration.validator) for convergence,
  parameter bounds, goodness of fit and parameter uncertainty
metadata:
  version: 1.0.0
  created_by: relic
parameters:
  validation.calibration.convergence.min_iterations:
    value: 10
    default: 10
    units: dimensionless
    dtype: int32
    bounds:
    - 1
    - 10000000
    category: validation_parameter
    description: ConvergenceValidationRule warns when a calibration ran fewer iterations than this count. RELIC convention
      value, not a literature value.
    references:
    - RELIC convention value (no literature value; documented as an operational choice)
    tags:
    - validation
    - calibration
    - convergence
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: relic_convention
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-26T00:00:00Z'
  validation.calibration.convergence.max_stagnation_ratio:
    value: 0.5
    default: 0.5
    units: dimensionless
    dtype: float64
    bounds:
    - 0.0
    - 1.0
    category: validation_parameter
    description: ConvergenceValidationRule warns about stagnation when the constant tail of the convergence history exceeds
      this fraction of all iterations. RELIC convention value, not a literature value.
    references:
    - RELIC convention value (no literature value; documented as an operational choice)
    tags:
    - validation
    - calibration
    - convergence
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: relic_convention
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-26T00:00:00Z'
  validation.calibration.convergence.min_total_improvement:
    value: 1.0e-06
    default: 1.0e-06
    units: dimensionless
    dtype: float64
    bounds:
    - 0.0
    - .inf
    category: validation_parameter
    description: ConvergenceValidationRule warns when the objective improved by less than this amount between the first and
      the last entry of the convergence history (L_0 - L_last < threshold). The threshold carries the units of the
      calibration objective function; RELIC convention value, not a literature value.
    references:
    - RELIC convention value (no literature value; documented as an operational choice)
    tags:
    - validation
    - calibration
    - convergence
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: relic_convention
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-26T00:00:00Z'
  validation.calibration.bounds.tolerance:
    value: 1.0e-10
    default: 1.0e-10
    units: dimensionless
    dtype: float64
    bounds:
    - 0.0
    - 1.0
    category: validation_parameter
    description: Absolute numerical tolerance of ParameterBoundsValidationRule for bound violations and for reporting an
      optimized value that sits on a bound, in the units of each calibrated parameter. RELIC convention value, not a
      literature value.
    references:
    - RELIC convention value (no literature value; documented as an operational choice)
    tags:
    - validation
    - calibration
    - bounds
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: relic_convention
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-26T00:00:00Z'
  validation.calibration.statistical.min_r_squared:
    value: 0.5
    default: 0.5
    units: dimensionless
    dtype: float64
    bounds:
    - 0.0
    - 1.0
    category: validation_parameter
    description: 'StatisticalValidationRule accepts the coefficient of determination only when R2 > 0.5. R2 is the square of
      Pearson''s correlation coefficient r between simulated and observed values (range 0 to 1); Moriasi et al. (2007,
      p. 887) state that typically values greater than 0.5 are considered acceptable (citing Santhi et al. 2001 and Van Liew
      et al. 2003). Applicability: watershed model evaluation for continuous long-term simulation at a monthly time step;
      the guidelines are to be adjusted for daily time steps, single events and project scope (p. 891).'
    references:
    - Moriasi, D.N., Arnold, J.G., Van Liew, M.W., Bingner, R.L., Harmel, R.D. & Veith, T.L. (2007). Model evaluation
      guidelines for systematic quantification of accuracy in watershed simulations. Trans. ASABE 50(3), 885-900, p. 887
    tags:
    - validation
    - calibration
    - goodness_of_fit
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: literature
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-26T00:00:00Z'
  validation.calibration.statistical.min_nash_sutcliffe:
    value: 0.5
    default: 0.5
    units: dimensionless
    dtype: float64
    bounds:
    - -.inf
    - 1.0
    category: validation_parameter
    description: 'StatisticalValidationRule accepts the Nash-Sutcliffe efficiency only when NSE > 0.50, the lower bound of
      the "satisfactory" rating of Moriasi et al. (2007, Table 4 and p. 885/891). Applicability: continuous long-term
      watershed simulation at a monthly time step; Moriasi et al. recommend the stricter "good" and "very good" ratings for
      manual calibration and ask for adjustment at daily time steps (p. 891).'
    references:
    - Moriasi, D.N., Arnold, J.G., Van Liew, M.W., Bingner, R.L., Harmel, R.D. & Veith, T.L. (2007). Model evaluation
      guidelines for systematic quantification of accuracy in watershed simulations. Trans. ASABE 50(3), 885-900, Table 4
    tags:
    - validation
    - calibration
    - goodness_of_fit
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: literature
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-26T00:00:00Z'
  validation.calibration.statistical.max_abs_percent_bias.streamflow:
    value: 25.0
    default: 25.0
    units: '%'
    dtype: float64
    bounds:
    - 0.0
    - 1000.0
    category: validation_parameter
    description: 'StatisticalValidationRule accepts the percent bias of a streamflow variable only when |PBIAS| < 25 %, the
      bound of the "satisfactory" rating of Moriasi et al. (2007, Table 4) for streamflow at a monthly time step and
      measured data of typical uncertainty.'
