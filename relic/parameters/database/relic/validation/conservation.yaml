    value: 1.0e-06
    default: 1.0e-06
    units: dimensionless
    dtype: float32
    bounds:
    - 1.0e-08
    - 0.0001
    category: validation_parameter
    description: Relative closure tolerance of the phosphorus budget checks of the validation rules and
      coupling contracts; a budget closes when max_i |r_i| / sum_k |t_k,i| <= this value, r the
      budget residual and t_k its terms in one unit (dimensionless); a budget with a missing
      term is not evaluable
