  validation.conservation.stoichiometry.np_ratio_range:
    value:
    - 10.0
    - 20.0
    default: null
    units: dimensionless
    dtype: list
    bounds:
    - - 5.0
      - 16.0
    - - 16.0
      - 40.0
    category: validation_parameter
    description: Plausible range [low, high] of the N:P ratio of the summed nitrogen and phosphorus output fluxes checked by check_cnp_stoichiometry_impl; it contains the Redfield N:P of 16
    references:
    - Redfield, A.C. (1934). On the proportions of organic derivatives in sea water and their relation to the composition of plankton (N:P = 16 lies within the range)
    - Model plausibility limit; no literature value was found in the codeliteraturedatabase (queried 2026-09-24)
    tags:
    - conservation
    - plausibility
    - stoichiometry
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: model_plausibility_limit
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-24T00:00:00Z'
