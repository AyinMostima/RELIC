  validation.conservation.plausibility.gross_primary_productivity_max:
    value: 1.0e-03
    default: 1.0e-03
    units: g C m-2 s-1
    dtype: float64
    bounds:
    - 5.0e-04
    - 2.0e-03
    category: validation_parameter
    description: Upper plausibility limit of the instantaneous gross primary productivity checked by the carbon mass conservation rule (1e-3 g C m-2 s-1 is about 83 umol CO2 m-2 s-1); a larger value raises a warning, not a budget failure
    references:
    - Model plausibility limit; no literature value was found in the codeliteraturedatabase (queried 2026-09-24)
    tags:
    - conservation
    - plausibility
    - carbon
    dimension: mass_flux
    requires_grad: false
    provenance:
      source: model_plausibility_limit
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-24T00:00:00Z'
      notes: Replaces the literal 1e-3 of validate_carbon_mass_conservation
  validation.conservation.plausibility.net_radiation_abs_max:
    value: 1000.0
    default: 1000.0
    units: W m-2
    dtype: float64
    bounds:
    - 800.0
    - 1400.0
    category: validation_parameter
    description: Upper plausibility limit of the magnitude of the surface net radiation checked by the energy balance rule; a larger magnitude raises a warning, not a budget failure
    references:
    - Model plausibility limit; no literature value was found in the codeliteraturedatabase (queried 2026-09-24)
    tags:
    - conservation
    - plausibility
    - energy_balance
    dimension: energy_flux
    requires_grad: false
    provenance:
      source: model_plausibility_limit
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-24T00:00:00Z'
      notes: Replaces the literal 1000 of validate_energy_balance_conservation
  validation.conservation.plausibility.latent_heat_flux_min:
    value: -50.0
    default: -50.0
    units: W m-2
    dtype: float64
    bounds:
    - -200.0
    - -10.0
    category: validation_parameter
    description: Lower plausibility limit of the latent heat flux (positive away from the surface) checked by the energy balance rule; a more negative, downward (condensation) flux raises a warning, not a budget failure
    references:
    - Model plausibility limit; no literature value was found in the codeliteraturedatabase (queried 2026-09-24)
    tags:
    - conservation
    - plausibility
    - energy_balance
    dimension: energy_flux
    requires_grad: false
    provenance:
      source: model_plausibility_limit
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-24T00:00:00Z'
      notes: Replaces the literal -50 of validate_energy_balance_conservation
  validation.conservation.plausibility.bowen_ratio_abs_max:
    value: 10.0
    default: 10.0
    units: dimensionless
    dtype: float64
    bounds:
    - 2.0
    - 50.0
    category: validation_parameter
    description: Upper plausibility limit of the magnitude of the Bowen ratio H/LE checked by the energy balance rule as |H| > limit * |LE| (no division; a sensible heat flux without latent heat is an infinite ratio); exceeding it raises a warning, not a budget failure
    references:
    - Peixoto, J.P. and Oort, A.H. (1992). Physics of Climate, AIP, chapter 10 (definition of the Bowen ratio)
    - Model plausibility limit; no literature value was found in the codeliteraturedatabase (queried 2026-09-24)
    tags:
    - conservation
    - plausibility
    - energy_balance
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: model_plausibility_limit
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-24T00:00:00Z'
      notes: Replaces the literal 10 and the division guard 1e-6 of validate_energy_balance_conservation
  validation.conservation.stoichiometry.ratio_tolerance:
    value: 0.2
    default: 0.2
    units: dimensionless
    dtype: float64
    bounds:
    - 0.0
    - 0.9
    category: validation_parameter
    description: Relative widening of the plausible C:N, C:P and N:P ranges of check_cnp_stoichiometry_impl; a ratio outside [low * (1 - tol), high * (1 + tol)] raises a warning
    references:
    - Model plausibility limit; no literature value was found in the codeliteraturedatabase (queried 2026-09-24)
    tags:
    - conservation
    - plausibility
    - stoichiometry
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: model_plausibility_limit
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-24T00:00:00Z'
      notes: Replaces the stoich_tolerance and tolerance arguments (default 0.2) of the CNP checks
