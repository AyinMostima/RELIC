  validation.conservation.carbon_conservation_tolerance:
    value: 1.0e-06
    default: 1.0e-06
    units: dimensionless
    dtype: float32
    bounds:
    - 1.0e-08
    - 0.0001
    category: validation_parameter
    description: Relative closure tolerance of the carbon budget checks of the validation rules,
      the coupling contracts and the G3 compile witnesses; a budget closes when max_i |r_i| /
      sum_k |t_k,i| <= this value, r the budget residual and t_k its terms in one unit
      (dimensionless); a budget with a missing term is not evaluable
    references:
    - LeVeque, R.J. (1992). Numerical Methods for Conservation Laws. Birkhauser
    - Higham, N.J. (2002). Accuracy and Stability of Numerical Algorithms, 2nd ed., SIAM, section 4.2
    tags:
    - conservation
    - carbon_cycle
    - validation
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: numerical_stability_requirement
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-09-24T00:00:00Z'
