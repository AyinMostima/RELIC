parameters:
  validation.dec_complex.cochain_residual_tolerance:
    value: 0.0
    default: 0.0
    units: dimensionless
    dtype: float64
    bounds:
    - 0.0
    - 0.001
    category: validation_parameter
    description: Largest admitted absolute entry of the composed coboundary operator D_{k+1} D_k in the cochain_complex_check
      and the dec_complex_structure rule, used when the check payload does not state tol or dec_tol. The coboundary
      operators are signed integer incidence matrices, whose composition is exactly zero (d o d = 0), so the check is exact.
    references:
    - Hirani, A.N. (2003). Discrete Exterior Calculus. PhD thesis, California Institute of Technology
    - Desbrun, M., Hirani, A.N., Leok, M. & Marsden, J.E. (2005). Discrete Exterior Calculus. arXiv:math/0508341
    tags:
    - validation
    - dec
    - cochain
    - structural
    dimension: dimensionless
    requires_grad: false
