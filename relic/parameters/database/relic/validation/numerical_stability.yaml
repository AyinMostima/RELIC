schema_version: 2.0.0
tier: relic
namespace: validation.numerical_stability
description: Global numerical stability thresholds shared across scientific functors
metadata:
  created_by: RELIC Parameter System
  last_modified: '2026-01-07T14:20:26Z'
  schema_url: https://github.com/relic/parameter-schema/v2.0.0
