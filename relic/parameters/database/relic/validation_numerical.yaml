  validation.numerical.state_variable_bounds:
    # No entry: daylength, the former only entry, has an SCM contract (MA-21 12.2d),
    # which replaces this declaration in the initial-state schema.
    value: {}
    default: null
    units: dimensionless
    dtype: dict
    bounds: null
    category: computational
    description: Process-specific initial-state bounds declared per state variable. Each entry names the state variable, its units and the ParameterManager keys of its lower and upper bound, read in those units by the RELICSimulator initial-state schema (relic/core/simulator/state_init.py). It applies to variables without an SCM contract and must not repeat bounds declared by the variable's SSOT catalog entry. Variables declared nowhere are unbounded; no range is inferred from a variable name.
    references:
    - RELIC architecture_overview.md section 4.4 (state_init initial-state schema and bounds)
    - Campbell, G.S. and Norman, J.M. (1998) An Introduction to Environmental Biophysics (daylength 0-24 h)
