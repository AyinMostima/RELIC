  validation.numerical.response.q10:
    value: 2.0
    default: 2.0
    units: dimensionless
    dtype: float32
    bounds:
    - 0.0
    - .inf
    category: computational
    description: 'Default Q10 temperature response coefficient for generic processes. Q10 is a ratio of rates at temperatures 10 K apart and cannot be negative (values below 1 describe a rate that decreases with temperature); no physical upper limit is fixed, so the upper bound is open (inf).'
    references:
    - van't Hoff (1898)
    - Lloyd and Taylor (1994)
    tags:
    - temperature_response
    - q10
    - default
    dimension: dimensionless
    requires_grad: false
    provenance:
      source: response_defaults
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-01-20T00:00:00Z'
  validation.numerical.response.activation_energy:
    value: 65000.0
    default: 65000.0
    units: J mol-1
    dtype: float32
    bounds:
    - -.inf
    - .inf
    category: computational
    description: 'Default activation energy for Arrhenius temperature response. An apparent activation energy is negative for a rate that decreases with temperature, so no one-sided physical bound applies and the interval is unbounded (-inf, inf).'
    references:
    - Arrhenius (1889)
    - Lloyd and Taylor (1994)
    tags:
    - temperature_response
    - arrhenius
    - default
    dimension: energy_per_amount
    requires_grad: false
    provenance:
      source: response_defaults
      schema_version: 2.0.0
      created_by: Yuchong Long
      last_modified: '2026-01-20T00:00:00Z'
