ml_surrogates:
  soil_moisture:
    architecture:
      type: resnet
      hidden_dim: 64
      n_blocks: 3
      activation: relu
      dropout_rate: 0.05
    training:
      optimizer: adam
      learning_rate: 0.0008
      batch_size: 32
      epochs: 220
      loss_function: huber
      early_stopping_patience: 20
      validation_split: 0.2
      shuffle_training: false
    uncertainty:
      method: dropout_mc
      mc_samples: 30
  water_stress:
